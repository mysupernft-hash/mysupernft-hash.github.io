<style>

.card{

  display:flex;
  justify-content:space-between;

}

  margin-top:10px;

  background:#001a00;
  color:#00ff66;
  border-radius:8px;
  text-align:center;
  animation:glow 1.5s infinite alternate;
}

@keyframes glow{
  from{box-shadow:0 0 5px #00ff66;}
  to{box-shadow:0 0 20px #00ff66;}
}

.empty{text-align:center;margin-top:40px;}

/* 🔐 AUTH */
onAuthStateChanged(auth,(user)=>{

if(!user){
window.location.href="login.html";
return;
}

/* 🔥 REALTIME DATA */
onSnapshot(doc(db,"users",user.uid),(snap)=>{

if(!snap.exists()){
container.innerHTML="<div class='empty'>User not found</div>";
return;
}

const data = snap.data();
const purchased = data.purchasedNFTs || [];

if(purchased.length===0){
container.innerHTML="<div class='empty'>No NFTs purchased</div>";
return;
}

container.innerHTML="";

/* 🔥 PERFECT MATCH SYSTEM */
purchased.forEach((id)=>{

const index = Number(id); // 🔥 fix
const nft = NFTS[index];

if(!nft) return;

container.innerHTML += `
<div class="card">
<img src="${nft.img}">
<div class="row"><span>Price</span><span>$${nft.price}</span></div>
<div class="row"><span>Daily</span><span>$${nft.p}</span></div>
<div class="row"><span>Yearly</span><span>$${(nft.p*365).toFixed(2)}</span></div>
<div class="mining-status">🟢 Mining Active</div>
</div>
`;

});
