<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Investments | SuperNFT</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f0f0f;
  color:#FFD700;
}

header{
  background:#1a1a1a;
  padding:15px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
}

.container{
  padding:15px;
}

.nft-card{
  background:#1a1a1a;
  border-radius:12px;
  padding:15px;
  margin-bottom:15px;
  border:1px solid #FFD700;
}

.nft-img{
  width:100%;
  border-radius:10px;
}

.row{
  display:flex;
  justify-content:space-between;
  margin-top:8px;
}

.empty{
  text-align:center;
  margin-top:50px;
  opacity:0.7;
}
</style>
</head>
<body>

<header>📁 My Investments</header>

<div class="container" id="investments"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain:"supernft-5b952.firebaseapp.com",
  projectId:"supernft-5b952"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

onAuthStateChanged(auth, async(user)=>{

  if(!user){
    window.location.href="login.html";
    return;
  }

  const userRef = doc(db,"users",user.uid);
  const snap = await getDoc(userRef);

  if(!snap.exists()) return;

  const data = snap.data();
  const nfts = data.nfts || [];

  const container = document.getElementById("investments");

  if(nfts.length === 0){
    container.innerHTML = "<div class='empty'>No NFTs Purchased Yet</div>";
    return;
  }

  nfts.forEach(nft => {

    container.innerHTML += `
      <div class="nft-card">
        <img src="${nft.image}" class="nft-img">
        <div class="row">
          <span>Category</span>
          <span>${nft.category}</span>
        </div>
        <div class="row">
          <span>Price</span>
          <span>$${nft.price}</span>
        </div>
        <div class="row">
          <span>Daily Income</span>
          <span>$${nft.dailyIncome}</span>
        </div>
        <div class="row">
          <span>Purchased</span>
          <span>${new Date(nft.purchaseDate.seconds * 1000).toLocaleDateString()}</span>
        </div>
      </div>
    `;
  });

});

</script>

</body>
</html>
