<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Investments | SuperNFT</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#0b0b0b;
  color:#FFD700;
}

/* Header */
header{
  background:#111;
  padding:16px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
  border-bottom:1px solid #222;
}

/* Container */
.container{
  padding:20px;
}

/* Card */
.card{
  background:#141414;
  border-radius:14px;
  padding:15px;
  margin-bottom:20px;
  box-shadow:0 0 15px rgba(255,215,0,0.08);
  cursor:default;              /* ✅ no click */
}

/* Image */
.card img{
  width:100%;
  border-radius:12px;
  margin-bottom:12px;
  pointer-events:none;         /* ✅ image click disabled */
}

/* Text */
.card h3{
  margin:6px 0;
  font-size:18px;
}

.card p{
  margin:4px 0;
  font-size:14px;
  color:#d4af37;
}

/* Badge */
.badge{
  display:inline-block;
  margin-top:10px;
  padding:6px 14px;
  border-radius:20px;
  background:#FFD700;
  color:#000;
  font-size:12px;
  font-weight:bold;
}

/* Empty */
.empty{
  text-align:center;
  margin-top:70px;
  color:#777;
}

/* Back button */
.back{
  display:block;
  text-align:center;
  margin:30px 0 10px;
  color:#FFD700;
  text-decoration:none;
  font-size:15px;
}
</style>
</head>

<body>

<header>💼 My Investments</header>

<div class="container" id="investmentList">
  <div class="empty">Loading investments...</div>
</div>

<!-- ✅ ONLY working navigation -->
<a href="dashboard.html" class="back">⬅ Back to Dashboard</a>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore,
  collection,
  query,
  orderBy,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* Firebase Config */
const firebaseConfig = {
  apiKey: "AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain: "supernft-5b952.firebaseapp.com",
  projectId: "supernft-5b952"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const list = document.getElementById("investmentList");

/* Auth Check */
onAuthStateChanged(auth, async (user) => {
  if(!user){
    window.location.replace("login.html");
    return;
  }

  try{
    const q = query(
      collection(db, "users", user.uid, "investments"),
      orderBy("purchasedAt", "desc")
    );

    const snap = await getDocs(q);
    list.innerHTML = "";

    if(snap.empty){
      list.innerHTML = `<div class="empty">No investments yet</div>`;
      return;
    }

    snap.forEach(doc => {
      const d = doc.data();
      const date = d.purchasedAt
        ? d.purchasedAt.toDate().toLocaleDateString()
        : "";

      list.innerHTML += `
        <div class="card">
          <img src="${d.image}">
          <h3>${d.name}</h3>
          <p>💰 Price: $${d.price}</p>
          <p>📅 Purchased: ${date}</p>
          <span class="badge">ACTIVE</span>
        </div>
      `;
    });

  }catch(err){
    console.error(err);
    list.innerHTML = `<div class="empty">Failed to load investments</div>`;
  }
});
</script>

</body>
</html>
