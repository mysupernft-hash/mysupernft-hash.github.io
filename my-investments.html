<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>My Investments | SuperNFT</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f0f0f;
  color:#FFD700;
}

header{
  background:#1a1a1a;
  padding:15px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
}

.container{
  padding:15px;
}

.card{
  background:#1a1a1a;
  border-radius:12px;
  padding:15px;
  margin-bottom:15px;
}

.nft-img{
  width:100%;
  border-radius:10px;
  margin-bottom:10px;
}

.row{
  display:flex;
  justify-content:space-between;
  margin:5px 0;
}

.status-active{
  color:#00ff88;
}

.status-expired{
  color:#ff4444;
}

.empty{
  text-align:center;
  margin-top:50px;
  opacity:0.6;
}
</style>
</head>
<body>

<header>📁 My Investments</header>

<div class="container" id="investmentsContainer">
Loading...
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
authDomain:"supernft-5b952.firebaseapp.com",
projectId:"supernft-5b952"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

onAuthStateChanged(auth, async(user)=>{

if(!user){
location.href="login.html";
return;
}

const container=document.getElementById("investmentsContainer");
container.innerHTML="Loading...";

const snap=await getDoc(doc(db,"users",user.uid));

if(!snap.exists()){
container.innerHTML="No data found.";
return;
}

const data=snap.data();
const nfts=data.nfts||[];

if(nfts.length===0){
container.innerHTML="<div class='empty'>No Investments Yet</div>";
return;
}

container.innerHTML="";

nfts.forEach(nft=>{

const purchaseDate=new Date(nft.purchaseDate.seconds*1000);
const now=new Date();
const diffDays=Math.floor((now-purchaseDate)/(1000*60*60*24));
const remaining=nft.validDays-diffDays;
const isActive=remaining>0;

const totalEarned=(diffDays*nft.daily).toFixed(2);

container.innerHTML+=`
<div class="card">
  <img src="${nft.img}" class="nft-img">
  <div class="row"><span>Price</span><span>$${nft.price}</span></div>
  <div class="row"><span>Daily Income</span><span>$${nft.daily}</span></div>
  <div class="row"><span>Purchase Date</span><span>${purchaseDate.toDateString()}</span></div>
  <div class="row"><span>Remaining Days</span><span>${remaining>0?remaining:0}</span></div>
  <div class="row"><span>Status</span><span class="${isActive?'status-active':'status-expired'}">${isActive?'Active':'Expired'}</span></div>
  <div class="row"><span>Total Earned</span><span>$${totalEarned}</span></div>
</div>
`;

});

});

</script>
</body>
</html>
