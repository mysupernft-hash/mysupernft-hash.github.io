<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Investments | SuperNFT</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#000;
  color:#FFD700;
}

header{
  padding:18px;
  background:#1a1a1a;
  text-align:center;
  font-size:20px;
  border-bottom:2px solid #FFD700;
}

.container{
  padding:15px;
}

.card{
  background:#111;
  padding:12px;
  border-radius:12px;
  margin-bottom:15px;
  border:1px solid #FFD700;
}

.card img{
  width:100%;
  border-radius:10px;
}

.row{
  display:flex;
  justify-content:space-between;
  margin-top:8px;
  font-size:14px;
}

.empty{
  text-align:center;
  margin-top:40px;
  font-size:16px;
}
</style>
</head>
<body>

<header>📁 My Investments</header>

<div class="container" id="investmentContainer">
  <div class="empty">Loading...</div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain:"supernft-5b952.firebaseapp.com",
  projectId:"supernft-5b952"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* SAME NFT ARRAY */
const NFTS=[
{price:10,p:0.2,img:"images/IMG_0458.png"},
{price:15,p:0.3,img:"images/IMG_0459.png"},
{price:20,p:0.4,img:"images/IMG_0460.png"},
{price:25,p:0.5,img:"images/IMG_0461.png"},
{price:30,p:0.6,img:"images/IMG_0462.png"},
{price:35,p:0.7,img:"images/IMG_0463.png"},
{price:40,p:0.8,img:"images/IMG_0464.png"},
{price:45,p:0.9,img:"images/IMG_0465.png"},
{price:50,p:1,img:"images/IMG_0466.png"},
{price:55,p:1.3,img:"images/IMG_0467.png"},
{price:60,p:1.5,img:"images/IMG_0468.png"},
{price:65,p:1.63,img:"images/IMG_0469.png"},
{price:70,p:1.75,img:"images/IMG_0470.png"},
{price:75,p:1.88,img:"images/IMG_0471.png"},
{price:80,p:2,img:"images/IMG_0472.png"},
{price:90,p:2.25,img:"images/IMG_0473.png"},
{price:100,p:2.5,img:"images/IMG_0474.png"},
{price:150,p:5,img:"images/IMG_0475.png"},
{price:200,p:6.6,img:"images/IMG_0476.png"},
{price:250,p:8.25,img:"images/IMG_0477.png"},
{price:300,p:10,img:"images/IMG_0478.png"},
{price:350,p:11.6,img:"images/IMG_0479.png"},
{price:400,p:13.3,img:"images/IMG_0480.png"},
{price:450,p:15,img:"images/IMG_0481.png"},
{price:499,p:25,img:"images/IMG_0482.png"},
{price:599,p:30,img:"images/IMG_0483.png"},
{price:699,p:40,img:"images/IMG_0497.png"},
{price:799,p:30,img:"images/IMG_0498.png"},
{price:899,p:45,img:"images/IMG_0499.png"},
{price:999,p:100,img:"images/IMG_0503.png"}
];

const container = document.getElementById("investmentContainer");

onAuthStateChanged(auth, async(user)=>{

  if(!user){
    window.location.href="login.html";
    return;
  }

  const userRef = doc(db,"users",user.uid);
  const snap = await getDoc(userRef);

  if(!snap.exists()){
    container.innerHTML = `<div class="empty">User data not found</div>`;
    return;
  }

  const data = snap.data();
  const purchased = data.purchasedNFTs || [];

  if(purchased.length === 0){
    container.innerHTML = `<div class="empty">You have not purchased any NFT yet.</div>`;
    return;
  }

  container.innerHTML = "";

  purchased.forEach(id => {

    const nft = NFTS[id];
    if(!nft) return;

    container.innerHTML += `
      <div class="card">
        <img src="${nft.img}">
        <div class="row">
          <span>Price</span>
          <span>$${nft.price}</span>
        </div>
        <div class="row">
          <span>Daily Income</span>
          <span>$${nft.p}</span>
        </div>
        <div class="row">
          <span>Yearly Income</span>
          <span>$${(nft.p*365).toFixed(2)}</span>
        </div>
      </div>
    `;
  });

});

</script>

</body>
</html>
