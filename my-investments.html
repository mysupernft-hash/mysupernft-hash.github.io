<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Investments | SuperNFT</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0f0f0f;
  color:#FFD700;
}

/* Sticky Header */
header{
  position:sticky;
  top:0;
  background:#1a1a1a;
  padding:15px;
  text-align:center;
  font-size:18px;
  font-weight:bold;
  z-index:1000;
  border-bottom:1px solid #272727;
}

.container{
  padding:15px;
}

/* Summary Card */
.summary{
  background:#1a1a1a;
  padding:15px;
  border-radius:14px;
  margin-bottom:15px;
  box-shadow:0 0 15px rgba(255,215,0,0.1);
}

.summary div{
  display:flex;
  justify-content:space-between;
  margin:8px 0;
  font-size:14px;
}

.summary span{
  font-weight:bold;
  font-size:16px;
}

/* NFT Cards */
.nft-card{
  background:#1a1a1a;
  padding:12px;
  border-radius:14px;
  margin-bottom:12px;
  display:flex;
  gap:12px;
  align-items:center;
  box-shadow:0 0 12px rgba(255,215,0,0.05);
  transition:0.3s;
}

.nft-card:active{
  transform:scale(0.98);
}

.nft-card img{
  width:80px;
  height:80px;
  object-fit:cover;
  border-radius:12px;
  border:2px solid #FFD700;
}

.nft-info{
  flex:1;
  font-size:14px;
}

.nft-info div{
  margin:4px 0;
}

/* Empty State */
.empty{
  text-align:center;
  margin-top:40px;
  opacity:0.6;
  font-size:14px;
}

/* Mobile Improvements */
@media(max-width:480px){

  header{
    font-size:16px;
  }

  .summary span{
    font-size:15px;
  }

  .nft-card img{
    width:70px;
    height:70px;
  }

}
</style>
</head>
<body>

<header>📁 My Investments</header>

<div class="container">

<div class="summary">
  <div>💰 Total Invested <span>$<span id="totalInvested">0</span></span></div>
  <div>📈 Total Daily Income <span>$<span id="totalDaily">0</span></span></div>
  <div>🧩 Total NFTs <span><span id="totalNFTs">0</span></span></div>
</div>

<div id="investmentList"></div>

<div class="empty" id="emptyMsg" style="display:none;">
  No NFTs purchased yet.
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
authDomain:"supernft-5b952.firebaseapp.com",
projectId:"supernft-5b952"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

/* Same NFT list */
const NFTS=[
{price:10,p:0.2,img:"images/IMG_0458.png"},
{price:15,p:0.3,img:"images/IMG_0459.png"},
{price:20,p:0.4,img:"images/IMG_0460.png"},
{price:25,p:0.5,img:"images/IMG_0461.png"},
{price:30,p:0.6,img:"images/IMG_0462.png"},
{price:35,p:0.7,img:"images/IMG_0463.png"},
{price:40,p:0.8,img:"images/IMG_0464.png"},
{price:45,p:0.9,img:"images/IMG_0465.png"},
{price:50,p:1,img:"images/IMG_0466.png"},
{price:55,p:1.3,img:"images/IMG_0467.png"},
{price:60,p:1.5,img:"images/IMG_0468.png"},
{price:65,p:1.63,img:"images/IMG_0469.png"},
{price:70,p:1.75,img:"images/IMG_0470.png"},
{price:75,p:1.88,img:"images/IMG_0471.png"},
{price:80,p:2,img:"images/IMG_0472.png"},
{price:90,p:2.25,img:"images/IMG_0473.png"},
{price:100,p:2.5,img:"images/IMG_0474.png"},
{price:150,p:5,img:"images/IMG_0475.png"},
{price:200,p:6.6,img:"images/IMG_0476.png"},
{price:250,p:8.25,img:"images/IMG_0477.png"},
{price:300,p:10,img:"images/IMG_0478.png"},
{price:350,p:11.6,img:"images/IMG_0479.png"},
{price:400,p:13.3,img:"images/IMG_0480.png"},
{price:450,p:15,img:"images/IMG_0481.png"},
{price:499,p:25,img:"images/IMG_0482.png"},
{price:599,p:30,img:"images/IMG_0483.png"},
{price:699,p:40,img:"images/IMG_0497.png"},
{price:799,p:30,img:"images/IMG_0498.png"},
{price:899,p:45,img:"images/IMG_0499.png"},
{price:999,p:100,img:"images/IMG_0503.png"}
];

onAuthStateChanged(auth, async(user)=>{

if(!user){
  window.location.href="login.html";
  return;
}

const userRef=doc(db,"users",user.uid);
const snap=await getDoc(userRef);

if(!snap.exists()) return;

const data=snap.data();
const userNFTs=data.purchasedNFTs || [];

const list=document.getElementById("investmentList");

if(userNFTs.length===0){
  document.getElementById("emptyMsg").style.display="block";
  return;
}

let totalInvested=0;
let totalDaily=0;

userNFTs.forEach(id=>{

  const nft=NFTS[id];
  if(!nft) return;

  totalInvested+=nft.price;
  totalDaily+=nft.p;

  list.innerHTML+=`
    <div class="nft-card">
      <img src="${nft.img}">
      <div class="nft-info">
        <div>💰 Price: $${nft.price}</div>
        <div>📈 Daily: $${nft.p}</div>
        <div>⏳ Validity: 365 Days</div>
      </div>
    </div>
  `;
});

document.getElementById("totalInvested").innerText=totalInvested;
document.getElementById("totalDaily").innerText=totalDaily.toFixed(2);
document.getElementById("totalNFTs").innerText=userNFTs.length;

});

</script>

</body>
</html>
