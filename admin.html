<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SuperNFT Direct Admin Panel</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
body{
  background:#0d0d0d;
  color:#FFD700;
  font-family:Arial;
  padding:20px;
}
h2{
  text-align:center;
}
table{
  width:100%;
  border-collapse:collapse;
  margin-top:20px;
}
th,td{
  border:1px solid #333;
  padding:8px;
  text-align:center;
}
th{
  background:#111;
}
input,select{
  width:80px;
  padding:4px;
}
button{
  padding:6px 10px;
  background:#FFD700;
  border:none;
  cursor:pointer;
  font-weight:bold;
}
button:hover{
  background:#e6c200;
}
</style>
</head>

<body>

<h2>🔥 SuperNFT Admin Dashboard</h2>

<table>
<thead>
<tr>
<th>Email</th>
<th>Wallet</th>
<th>Daily</th>
<th>Referral</th>
<th>Level</th>
<th>Banned</th>
<th>Save</th>
</tr>
</thead>
<tbody id="users"></tbody>
</table>

<script>

firebase.initializeApp({
  apiKey: "AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain: "supernft-5b952.firebaseapp.com",
  projectId: "supernft-5b952"
});

const db = firebase.firestore();

/* 🔥 DIRECT LOAD USERS – NO AUTH CHECK */
loadUsers();

function loadUsers(){

  db.collection("users").get().then(snapshot => {

    let html="";

    snapshot.forEach(doc => {

      const u = doc.data();

      html += `
      <tr>
        <td>${u.email || ""}</td>

        <td>
          <input id="w_${doc.id}" value="${u.walletBalance || 0}">
        </td>

        <td>
          <input id="d_${doc.id}" value="${u.dailyIncome || 0}">
        </td>

        <td>
          <input id="r_${doc.id}" value="${u.referralEarnings || 0}">
        </td>

        <td>
          <input id="l_${doc.id}" value="${u.level || 0}">
        </td>

        <td>
          <select id="ban_${doc.id}">
            <option value="false" ${u.banned ? "" : "selected"}>No</option>
            <option value="true" ${u.banned ? "selected" : ""}>Yes</option>
          </select>
        </td>

        <td>
          <button onclick="saveUser('${doc.id}')">Save</button>
        </td>
      </tr>
      `;
    });

    document.getElementById("users").innerHTML = html;

  }).catch(error=>{
    alert("Firestore Permission Error: " + error.message);
  });
}

/* 💾 SAVE USER */
function saveUser(uid){

  db.collection("users").doc(uid).update({

    walletBalance: Number(document.getElementById("w_"+uid).value),
    dailyIncome: Number(document.getElementById("d_"+uid).value),
    referralEarnings: Number(document.getElementById("r_"+uid).value),
    level: Number(document.getElementById("l_"+uid).value),
    banned: document.getElementById("ban_"+uid).value === "true"

  }).then(()=>{
    alert("✅ User Updated Successfully");
  }).catch(error=>{
    alert("Update Failed: " + error.message);
  });

}

</script>

</body>
</html>
