<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SuperNFT Admin Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
body{
  margin:0;
  background:#0f0f0f;
  color:#FFD700;
  font-family:Arial;
}

header{
  background:#1a1a1a;
  padding:15px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
}

.container{
  padding:10px;
}

.user-card{
  background:#1a1a1a;
  padding:12px;
  border-radius:10px;
  margin-bottom:12px;
}

.row{
  display:flex;
  justify-content:space-between;
  margin-bottom:8px;
  font-size:14px;
}

input,select{
  width:100%;
  padding:6px;
  margin-top:4px;
  border-radius:6px;
  border:none;
}

button{
  width:100%;
  padding:8px;
  margin-top:6px;
  border:none;
  border-radius:6px;
  font-weight:bold;
  cursor:pointer;
}

.save-btn{
  background:#FFD700;
  color:#000;
}

.logout-btn{
  background:#272727;
  color:#FFD700;
  margin-bottom:10px;
}
</style>
</head>

<body>

<header>🔥 SuperNFT Admin Panel</header>

<div class="container">

<button class="logout-btn" onclick="logout()">Logout</button>

<div id="usersContainer"></div>

</div>

<script>

firebase.initializeApp({
  apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain:"supernft-5b952.firebaseapp.com",
  projectId:"supernft-5b952"
});

const auth = firebase.auth();
const db   = firebase.firestore();

auth.onAuthStateChanged(user => {

  if(!user){
    window.location.href="admin-login.html";
    return;
  }

  loadUsers();
});

function loadUsers(){

  db.collection("users").get().then(snapshot => {

    let html = "";

    snapshot.forEach(doc => {

      const u = doc.data();

      html += `
      <div class="user-card">

        <div class="row">
          <strong>Email:</strong> ${u.email || ""}
        </div>

        <div>
          Wallet
          <input id="wallet_${doc.id}" value="${u.walletBalance || 0}">
        </div>

        <div>
          Daily Income
          <input id="daily_${doc.id}" value="${u.dailyIncome || 0}">
        </div>

        <div>
          Referral Earnings
          <input id="ref_${doc.id}" value="${u.referralEarnings || 0}">
        </div>

        <div>
          Level
          <input id="level_${doc.id}" value="${u.level || 0}">
        </div>

        <div>
          Banned
          <select id="ban_${doc.id}">
            <option value="false" ${u.banned ? "" : "selected"}>No</option>
            <option value="true" ${u.banned ? "selected" : ""}>Yes</option>
          </select>
        </div>

        <button class="save-btn" onclick="saveUser('${doc.id}')">
          Save Changes
        </button>

      </div>
      `;

    });

    document.getElementById("usersContainer").innerHTML = html;

  });
}

function saveUser(uid){

  db.collection("users").doc(uid).update({

    walletBalance: Number(document.getElementById("wallet_"+uid).value),
    dailyIncome: Number(document.getElementById("daily_"+uid).value),
    referralEarnings: Number(document.getElementById("ref_"+uid).value),
    level: Number(document.getElementById("level_"+uid).value),
    banned: document.getElementById("ban_"+uid).value === "true"

  }).then(()=>{
    alert("✅ User Updated Successfully");
  });
}

function logout(){
  auth.signOut().then(()=>{
    window.location.href="admin-login.html";
  });
}

</script>

</body>
</html>
