<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SuperNFT Admin Dashboard</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#0f0f0f;
  color:#FFD700;
}

header{
  background:#1a1a1a;
  padding:15px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
}

.container{
  padding:15px;
}

.card{
  background:#1a1a1a;
  padding:15px;
  border-radius:12px;
  margin-bottom:15px;
}

.row{
  display:flex;
  justify-content:space-between;
  margin-top:8px;
}

button{
  padding:6px 12px;
  border:none;
  border-radius:6px;
  font-weight:bold;
  cursor:pointer;
}

.approve{
  background:#00c853;
  color:white;
}

.reject{
  background:#d50000;
  color:white;
}
</style>
</head>

<body>

<header>⚙️ SuperNFT Admin Dashboard</header>

<div class="container">

<div class="card">
  <div class="row">
    <div>Total Users</div>
    <div id="totalUsers">0</div>
  </div>
</div>

<div class="card">
  <div class="row">
    <div>Pending Withdraws</div>
    <div id="pendingCount">0</div>
  </div>
</div>

<div class="card">
  <h3>💸 Withdraw Requests</h3>
  <div id="withdrawList">Loading...</div>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, collection, getDocs,
  doc, updateDoc, query, where
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain:"supernft-5b952.firebaseapp.com",
  projectId:"supernft-5b952"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

onAuthStateChanged(auth, async(user)=>{

  if(!user){
    alert("Login Required");
    location.href="login.html";
    return;
  }

  const userSnap = await getDocs(
    query(collection(db,"users"), where("email","==",user.email))
  );

  if(userSnap.empty){
    alert("Access Denied");
    location.href="dashboard.html";
    return;
  }

  const userData = userSnap.docs[0].data();

  if(!userData.isAdmin){
    alert("Admin Access Only");
    location.href="dashboard.html";
    return;
  }

  loadDashboard();
});

async function loadDashboard(){

  // TOTAL USERS
  const usersSnap = await getDocs(collection(db,"users"));
  document.getElementById("totalUsers").innerText = usersSnap.size;

  // PENDING WITHDRAW
  const withdrawQuery = query(
    collection(db,"withdrawRequests"),
    where("status","==","pending")
  );

  const withdrawSnap = await getDocs(withdrawQuery);

  document.getElementById("pendingCount").innerText = withdrawSnap.size;

  const list = document.getElementById("withdrawList");
  list.innerHTML = "";

  if(withdrawSnap.empty){
    list.innerHTML = "No pending requests";
    return;
  }

  withdrawSnap.forEach(docSnap=>{
    const data = docSnap.data();
    const div = document.createElement("div");
    div.style.marginBottom="10px";

    div.innerHTML = `
      <div>Email: ${data.email}</div>
      <div>Amount: $${data.amount}</div>
      <button class="approve" onclick="approve('${docSnap.id}')">Approve</button>
      <button class="reject" onclick="reject('${docSnap.id}')">Reject</button>
      <hr>
    `;

    list.appendChild(div);
  });
}

window.approve = async function(id){
  await updateDoc(doc(db,"withdrawRequests",id),{
    status:"approved"
  });
  alert("Approved");
  location.reload();
}

window.reject = async function(id){
  await updateDoc(doc(db,"withdrawRequests",id),{
    status:"rejected"
  });
  alert("Rejected");
  location.reload();
}

</script>

</body>
</html>
