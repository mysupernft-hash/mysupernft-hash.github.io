<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SuperNFT Admin Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f0f0f;
  color:#FFD700;
  padding:15px;
}

h2{
  text-align:center;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:20px;
}

th,td{
  border:1px solid #333;
  padding:8px;
  text-align:center;
  font-size:12px;
}

th{
  background:#1a1a1a;
}

input{
  width:70px;
}

button{
  padding:5px 8px;
  background:#FFD700;
  border:none;
  cursor:pointer;
  font-weight:bold;
}

.logout{
  float:right;
  margin-bottom:10px;
}
</style>
</head>

<body>

<button class="logout" onclick="logout()">Logout</button>
<h2>🔥 SuperNFT Admin Dashboard</h2>

<table>
<thead>
<tr>
<th>Email</th>
<th>Wallet</th>
<th>Daily</th>
<th>Referral</th>
<th>Level</th>
<th>Banned</th>
<th>Save</th>
</tr>
</thead>
<tbody id="users"></tbody>
</table>

<script>

firebase.initializeApp({
  apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain:"supernft-5b952.firebaseapp.com",
  projectId:"supernft-5b952"
});

const auth = firebase.auth();
const db = firebase.firestore();

/* 🔐 AUTH CHECK */
auth.onAuthStateChanged(user=>{
  if(!user){
    window.location.href="admin-login.html";
    return;
  }

  loadUsers();
});

/* 👥 LOAD USERS */
function loadUsers(){
  db.collection("users").get().then(snapshot=>{
    let html="";

    snapshot.forEach(doc=>{
      const u = doc.data();

      html += `
      <tr>
        <td>${u.email||""}</td>
        <td><input id="w_${doc.id}" value="${u.walletBalance||0}"></td>
        <td><input id="d_${doc.id}" value="${u.dailyIncome||0}"></td>
        <td><input id="r_${doc.id}" value="${u.referralEarnings||0}"></td>
        <td><input id="l_${doc.id}" value="${u.level||1}"></td>
        <td>
          <select id="b_${doc.id}">
            <option value="false" ${u.banned?"":"selected"}>No</option>
            <option value="true" ${u.banned?"selected":""}>Yes</option>
          </select>
        </td>
        <td><button onclick="saveUser('${doc.id}')">Save</button></td>
      </tr>
      `;
    });

    document.getElementById("users").innerHTML=html;
  });
}

/* 💾 SAVE USER */
function saveUser(uid){

  db.collection("users").doc(uid).update({
    walletBalance:Number(document.getElementById("w_"+uid).value),
    dailyIncome:Number(document.getElementById("d_"+uid).value),
    referralEarnings:Number(document.getElementById("r_"+uid).value),
    level:Number(document.getElementById("l_"+uid).value),
    banned:document.getElementById("b_"+uid).value==="true"
  })
  .then(()=>alert("✅ Updated"));
}

/* 🚪 LOGOUT */
function logout(){
  auth.signOut().then(()=>{
    window.location.href="admin-login.html";
  });
}

</script>
</body>
</html>
