<body>

<div class="card">

  <div class="card">

</div>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain:"supernft-5b952.firebaseapp.com",
  projectId:"supernft-5b952"
});

const auth=firebase.auth();
const db=firebase.firestore();

let allUsers=[];

auth.onAuthStateChanged(user=>{
  if(!user){
    location.href="admin-login.html";
    return;
  }
  loadUsers();
  loadWithdraws();
});

/* ================= USERS ================= */

function approve(id,uid,amount){

  const userRef = db.collection("users").doc(uid);
  const withdrawRef = db.collection("withdrawRequests").doc(id);

  db.runTransaction(async(transaction)=>{

    const userDoc = await transaction.get(userRef);
    if(!userDoc.exists) throw "User missing";

    const userData = userDoc.data();

    const newBal = (userData.walletBalance||0) - amount;
    if(newBal < 0) throw "Insufficient";

    // 🔥 OLD HISTORY ARRAY
    const oldHistory = userData.history || [];

    // 🔥 ADD NEW HISTORY ENTRY
    oldHistory.unshift({
      title:"Withdraw",
      amount:amount,
      message: amount+"$ received in your Binance wallet",
      createdAt: new Date()
    });

    transaction.update(userRef,{
      walletBalance:newBal,
      totalWithdraw:(userData.totalWithdraw||0)+amount,
      history: oldHistory
    });

    transaction.update(withdrawRef,{
      status:"approved"
    });

  }).then(()=>{
    alert("Withdraw Approved & History Updated");
  }).catch(err=>{
    alert("Error: "+err);
  });
}
</script>
