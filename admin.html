<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SuperNFT Admin Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0d0d0d;
  color:#FFD700;
  padding:10px;
}
h2{text-align:center}
.card{
  background:#111;
  padding:12px;
  border-radius:10px;
  margin-bottom:15px;
}
table{
  width:100%;
  border-collapse:collapse;
  font-size:11px;
}
th,td{
  border:1px solid #333;
  padding:5px;
  text-align:center;
}
input,select{
  width:70px;
  font-size:10px;
}
button{
  padding:4px 6px;
  font-size:10px;
  border:none;
  cursor:pointer;
  font-weight:bold;
}
.saveBtn{background:#FFD700;}
.deleteBtn{background:#ff4444;color:#fff;}
.pagination button{
  margin:3px;
  background:#FFD700;
}
</style>
</head>
<body>

<h2>🔥 SuperNFT Admin Panel</h2>

<div class="card">
<div style="overflow-x:auto;">
<table>
<thead>
<tr>
<th>Email</th>
<th>Wallet</th>
<th>Daily</th>
<th>Referral</th>
<th>Level</th>
<th>Deposit</th>
<th>Withdraw</th>
<th>Live</th>
<th>Verified</th>
<th>Role</th>
<th>Ban</th>
<th>Save</th>
<th>Delete</th>
</tr>
</thead>
<tbody id="users"></tbody>
</table>
</div>
</div>

<div class="pagination" id="pagination"></div>

<script>

firebase.initializeApp({
  apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain:"supernft-5b952.firebaseapp.com",
  projectId:"supernft-5b952"
});

const auth=firebase.auth();
const db=firebase.firestore();

let allUsers=[];
let currentPage=1;
const usersPerPage=10;

auth.onAuthStateChanged(user=>{
  if(!user){
    location.href="admin-login.html";
    return;
  }
  loadUsers();
});

function loadUsers(){
  db.collection("users").onSnapshot(snapshot=>{
    allUsers=[];
    snapshot.forEach(doc=>{
      allUsers.push({id:doc.id,...doc.data()});
    });
    renderPage(1);
  });
}

function renderPage(page){
  currentPage=page;

  const start=(page-1)*usersPerPage;
  const end=start+usersPerPage;
  const users=allUsers.slice(start,end);

  let html="";

  users.forEach(u=>{
    html+=`
    <tr>
      <td>${u.email||""}</td>

      <td><input id="wallet_${u.id}" value="${u.walletBalance||0}"></td>
      <td><input id="daily_${u.id}" value="${u.dailyIncome||0}"></td>
      <td><input id="ref_${u.id}" value="${u.referralEarnings||0}"></td>
      <td><input id="level_${u.id}" value="${u.level||1}"></td>
      <td><input id="deposit_${u.id}" value="${u.totalDeposit||0}"></td>
      <td><input id="withdraw_${u.id}" value="${u.totalWithdraw||0}"></td>
      <td><input id="live_${u.id}" value="${u.liveEarnings||0}"></td>

      <td>
        <select id="verified_${u.id}">
          <option value="false" ${u.verified?"":"selected"}>No</option>
          <option value="true" ${u.verified?"selected":""}>Yes</option>
        </select>
      </td>

      <td>
        <select id="role_${u.id}">
          <option value="user" ${u.role==="user"?"selected":""}>User</option>
          <option value="vip" ${u.role==="vip"?"selected":""}>VIP</option>
          <option value="admin" ${u.role==="admin"?"selected":""}>Admin</option>
        </select>
      </td>

      <td>
        <select id="ban_${u.id}">
          <option value="false" ${u.banned?"":"selected"}>No</option>
          <option value="true" ${u.banned?"selected":""}>Yes</option>
        </select>
      </td>

      <td>
        <button class="saveBtn"
        onclick="saveUser('${u.id}')">Save</button>
      </td>

      <td>
        <button class="deleteBtn"
        onclick="deleteUser('${u.id}')">X</button>
      </td>
    </tr>
    `;
  });

  document.getElementById("users").innerHTML=html;

  renderPagination();
}

function renderPagination(){
  const totalPages=Math.ceil(allUsers.length/usersPerPage);
  let html="";

  for(let i=1;i<=totalPages;i++){
    html+=`<button onclick="renderPage(${i})">${i}</button>`;
  }

  document.getElementById("pagination").innerHTML=html;
}

function saveUser(uid){

  const wallet   = Number(document.getElementById("wallet_"+uid).value)||0;
  const daily    = Number(document.getElementById("daily_"+uid).value)||0;
  const referral = Number(document.getElementById("ref_"+uid).value)||0;
  const level    = Number(document.getElementById("level_"+uid).value)||0;
  const deposit  = Number(document.getElementById("deposit_"+uid).value)||0;
  const withdraw = Number(document.getElementById("withdraw_"+uid).value)||0;
  const live     = Number(document.getElementById("live_"+uid).value)||0;

  const verified = document.getElementById("verified_"+uid).value==="true";
  const role     = document.getElementById("role_"+uid).value;
  const banned   = document.getElementById("ban_"+uid).value==="true";

  db.collection("users").doc(uid).update({
    walletBalance: wallet,
    dailyIncome: daily,
    referralEarnings: referral,
    level: level,
    totalDeposit: deposit,
    totalWithdraw: withdraw,
    liveEarnings: live,
    verified: verified,
    role: role,
    banned: banned
  }).then(()=>{
    alert("User Updated Successfully");
  }).catch(err=>{
    alert("Error: "+err.message);
  });

}

function deleteUser(uid){
  if(confirm("Delete user permanently?")){
    db.collection("users").doc(uid).delete()
    .then(()=>alert("User Deleted"))
    .catch(err=>alert(err.message));
  }
}

</script>

</body>
</html>
