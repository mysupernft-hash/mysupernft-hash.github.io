<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SuperNFT Admin</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
body{
  margin:0;
  background:#0f0f0f;
  color:#FFD700;
  font-family:Arial;
}

header{
  padding:15px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
  background:#1a1a1a;
}

.container{
  padding:10px;
}

.card{
  background:#1a1a1a;
  padding:10px;
  border-radius:10px;
  margin-bottom:10px;
}

input{
  width:70px;
}

button{
  padding:5px 10px;
  background:#FFD700;
  border:none;
  font-weight:bold;
  cursor:pointer;
}
</style>
</head>
<body>

<header>🔥 SuperNFT Admin Dashboard</header>

<div class="container" id="users"></div>

<script>

firebase.initializeApp({
  apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain:"supernft-5b952.firebaseapp.com",
  projectId:"supernft-5b952"
});

const db = firebase.firestore();

/* DIRECT LOAD USERS (NO AUTH CHECK) */

db.collection("users").get().then(snapshot=>{

  let html="";

  snapshot.forEach(doc=>{

    const u = doc.data();

    html += `
    <div class="card">
      <div>${u.email || "No Email"}</div>
      <div>
        Wallet: 
        <input id="w_${doc.id}" value="${u.walletBalance || 0}">
      </div>
      <div>
        Daily: 
        <input id="d_${doc.id}" value="${u.dailyIncome || 0}">
      </div>
      <div>
        Level: 
        <input id="l_${doc.id}" value="${u.level || 1}">
      </div>
      <button onclick="saveUser('${doc.id}')">Save</button>
    </div>
    `;

  });

  document.getElementById("users").innerHTML = html;

});

/* SAVE FUNCTION */

function saveUser(uid){

  db.collection("users").doc(uid).update({
    walletBalance:Number(document.getElementById("w_"+uid).value),
    dailyIncome:Number(document.getElementById("d_"+uid).value),
    level:Number(document.getElementById("l_"+uid).value)
  }).then(()=>{
    alert("Updated");
  });

}

</script>

</body>
</html>
