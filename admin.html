<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SuperNFT Secure Admin</title>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { 
  getAuth, 
  onAuthStateChanged, 
  signOut 
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { 
  getFirestore, 
  collection, 
  getDocs, 
  doc, 
  updateDoc, 
  getDoc 
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain:"supernft-5b952.firebaseapp.com",
  projectId:"supernft-5b952"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

let adminUID = null;

onAuthStateChanged(auth, async(user)=>{

  if(!user){
    window.location.href = "admin-login.html";
    return;
  }

  const snap = await getDoc(doc(db,"users",user.uid));

  if(!snap.exists()){
    denyAccess();
    return;
  }

  const data = snap.data();

  if(data.role !== "superadmin"){
    denyAccess();
    return;
  }

  adminUID = user.uid;
  loadUsers();
});

function denyAccess(){
  document.body.innerHTML = `
    <div style="text-align:center;margin-top:100px;color:red;font-size:18px">
      ❌ Access Denied (Not Superadmin)
    </div>
  `;
}

async function loadUsers(){

  const snapshot = await getDocs(collection(db,"users"));

  let html = "";

  snapshot.forEach(docSnap=>{

    const u = docSnap.data();

    html += `
    <div class="card">
      <h3>${u.email || "No Email"}</h3>

      <label>Wallet</label>
      <input id="w_${docSnap.id}" value="${u.walletBalance||0}">

      <label>Daily</label>
      <input id="d_${docSnap.id}" value="${u.dailyIncome||0}">

      <label>Referral</label>
      <input id="r_${docSnap.id}" value="${u.referralEarnings||0}">

      <label>Level</label>
      <input id="l_${docSnap.id}" value="${u.level||0}">

      <label>Banned</label>
      <select id="b_${docSnap.id}">
        <option value="false" ${u.banned ? "" : "selected"}>No</option>
        <option value="true" ${u.banned ? "selected" : ""}>Yes</option>
      </select>

      <button onclick="saveUser('${docSnap.id}')">Save</button>
    </div>
    `;
  });

  document.getElementById("users").innerHTML = html;
}

window.saveUser = async function(uid){

  await updateDoc(doc(db,"users",uid),{
    walletBalance: Number(document.getElementById("w_"+uid).value),
    dailyIncome: Number(document.getElementById("d_"+uid).value),
    referralEarnings: Number(document.getElementById("r_"+uid).value),
    level: Number(document.getElementById("l_"+uid).value),
    banned: document.getElementById("b_"+uid).value === "true"
  });

  alert("✅ Updated");
}

window.logout = function(){
  signOut(auth).then(()=>{
    window.location.href = "admin-login.html";
  });
}

</script>

<style>
body{
  margin:0;
  background:#0f0f0f;
  color:#FFD700;
  font-family:Arial;
}
header{
  background:#1a1a1a;
  padding:15px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
}
.container{
  padding:15px;
}
.card{
  background:#1a1a1a;
  padding:15px;
  border-radius:10px;
  margin-bottom:15px;
}
input,select{
  width:100%;
  padding:6px;
  margin-bottom:8px;
  border-radius:6px;
  border:none;
}
button{
  width:100%;
  padding:8px;
  background:#FFD700;
  border:none;
  border-radius:6px;
  font-weight:bold;
  cursor:pointer;
}
.logout{
  margin:10px;
}
</style>

</head>
<body>

<header>
  🔥 SuperNFT Secure Admin
  <button class="logout" onclick="logout()">Logout</button>
</header>

<div class="container">
  <div id="users">Loading...</div>
</div>

</body>
</html>
