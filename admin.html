<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SuperNFT Admin Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0d0d0d;
  color:#FFD700;
  padding:10px;
}

h2{
  text-align:center;
  margin-bottom:10px;
}

.search{
  width:100%;
  padding:10px;
  margin-bottom:10px;
  border:none;
  border-radius:6px;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:11px;
}

th,td{
  border:1px solid #333;
  padding:5px;
  text-align:center;
}

input{
  width:70px;
  font-size:11px;
}

button{
  padding:4px 6px;
  font-size:10px;
  border:none;
  cursor:pointer;
  font-weight:bold;
}

.saveBtn{
  background:#FFD700;
}

.deleteBtn{
  background:#ff4444;
  color:#fff;
}

@media(max-width:768px){
  table{
    font-size:9px;
  }
  input{
    width:55px;
  }
}
</style>
</head>

<body>

<h2>🔥 SuperNFT Admin Panel</h2>

<input type="text" id="search" class="search"
placeholder="Search by Email or UID">

<div style="overflow-x:auto;">
<table>
<thead>
<tr>
<th>Email / UID</th>
<th>Wallet</th>
<th>Daily</th>
<th>Referral</th>
<th>Level</th>
<th>Deposit</th>
<th>Withdraw</th>
<th>Live</th>
<th>Ban</th>
<th>Save</th>
<th>Delete</th>
</tr>
</thead>
<tbody id="users"></tbody>
</table>
</div>

<script>

firebase.initializeApp({
  apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain:"supernft-5b952.firebaseapp.com",
  projectId:"supernft-5b952"
});

const auth = firebase.auth();
const db   = firebase.firestore();

let allUsers=[];

/* AUTH CHECK */
auth.onAuthStateChanged(user=>{
  if(!user){
    location.href="admin-login.html";
    return;
  }
  loadUsers();
});

/* LOAD USERS REALTIME */
function loadUsers(){

  db.collection("users").onSnapshot(snapshot=>{

    allUsers=[];

    snapshot.forEach(doc=>{
      allUsers.push({id:doc.id,...doc.data()});
    });

    renderUsers(allUsers);

  });
}

/* RENDER USERS */
function renderUsers(users){

  let html="";

  users.forEach(u=>{

    html+=`
    <tr>

      <td>
        <div style="font-weight:bold">
          ${u.email||""}
        </div>
        <div style="color:#aaa;font-size:9px">
          ${u.id}
        </div>
      </td>

      <td><input id="w_${u.id}" value="${u.walletBalance||0}"></td>
      <td><input id="d_${u.id}" value="${u.dailyIncome||0}"></td>
      <td><input id="r_${u.id}" value="${u.referralEarnings||0}"></td>
      <td><input id="l_${u.id}" value="${u.level||1}"></td>

      <td><input id="dep_${u.id}" value="${u.totalDeposit||0}"></td>
      <td><input id="with_${u.id}" value="${u.totalWithdraw||0}"></td>
      <td><input id="live_${u.id}" value="${u.liveEarnings||0}"></td>

      <td>
        <select id="ban_${u.id}">
          <option value="false" ${u.banned?"":"selected"}>No</option>
          <option value="true" ${u.banned?"selected":""}>Yes</option>
        </select>
      </td>

      <td>
        <button class="saveBtn"
        onclick="saveUser('${u.id}')">Save</button>
      </td>

      <td>
        <button class="deleteBtn"
        onclick="deleteUser('${u.id}')">X</button>
      </td>

    </tr>
    `;
  });

  document.getElementById("users").innerHTML=html;
}

/* SAVE USER */
function saveUser(uid){

  const wallet   = Number(document.getElementById("w_"+uid).value)||0;
  const daily    = Number(document.getElementById("d_"+uid).value)||0;
  const referral = Number(document.getElementById("r_"+uid).value)||0;
  const level    = Number(document.getElementById("l_"+uid).value)||0;
  const deposit  = Number(document.getElementById("dep_"+uid).value)||0;
  const withdraw = Number(document.getElementById("with_"+uid).value)||0;
  const live     = Number(document.getElementById("live_"+uid).value)||0;
  const banned   = document.getElementById("ban_"+uid).value==="true";

  const totalIncome = referral + daily + live;

  db.collection("users").doc(uid).update({

    walletBalance: wallet,
    dailyIncome: daily,
    referralEarnings: referral,
    level: level,
    totalDeposit: deposit,
    totalWithdraw: withdraw,
    liveEarnings: live,
    totalIncome: totalIncome,
    banned: banned

  }).then(()=>{
    alert("✅ User Updated");
  });
}

/* DELETE USER */
function deleteUser(uid){

  if(confirm("Delete this user permanently?")){

    db.collection("users").doc(uid).delete()
    .then(()=>alert("User Deleted"));

  }
}

/* SEARCH */
document.getElementById("search")
.addEventListener("input",function(){

  const val=this.value.toLowerCase();

  const filtered=allUsers.filter(u=>
    (u.email||"").toLowerCase().includes(val) ||
    u.id.toLowerCase().includes(val)
  );

  renderUsers(filtered);

});
</script>

</body>
</html>
