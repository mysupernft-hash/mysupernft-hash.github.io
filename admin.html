<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard | SuperNFT</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0f172a;
  color:white;
}

header{
  background:#020617;
  padding:15px;
  text-align:center;
  font-size:22px;
  color:#38bdf8;
  font-weight:bold;
}

.container{
  padding:15px;
}

.card{
  background:#1e293b;
  padding:15px;
  border-radius:12px;
  margin-bottom:15px;
}

.row{
  display:flex;
  justify-content:space-between;
  margin:6px 0;
  font-size:14px;
}

button{
  padding:6px 12px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  font-weight:bold;
}

.approve{
  background:#22c55e;
  color:white;
}

.reject{
  background:#ef4444;
  color:white;
}

.stat{
  font-size:18px;
  font-weight:bold;
}
</style>
</head>

<body>

<header>⚙️ SuperNFT Admin Dashboard</header>

<div class="container">

  <!-- STATS -->
  <div class="card">
    <div class="row">
      <span>Total Users</span>
      <span class="stat" id="totalUsers">0</span>
    </div>
    <div class="row">
      <span>Pending Withdraws</span>
      <span class="stat" id="pendingWithdraws">0</span>
    </div>
  </div>

  <!-- WITHDRAW REQUESTS -->
  <div class="card">
    <h3>💸 Withdraw Requests</h3>
    <div id="withdrawList"></div>
  </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore,
  collection,
  getDocs,
  doc,
  updateDoc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain:"supernft-5b952.firebaseapp.com",
  projectId:"supernft-5b952"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

onAuthStateChanged(auth, async(user)=>{

  if(!user){
    location.href="login.html";
    return;
  }

  // 🔐 Check Admin Role
  const userSnap = await getDoc(doc(db,"users",user.uid));

  if(!userSnap.exists() || userSnap.data().role !== "admin"){
    alert("Access Denied ❌");
    location.href="dashboard.html";
    return;
  }

  loadStats();
  loadWithdraws();
});


async function loadStats(){

  const usersSnap = await getDocs(collection(db,"users"));
  document.getElementById("totalUsers").innerText = usersSnap.size;

  const withdrawSnap = await getDocs(collection(db,"withdrawRequests"));
  let pending = 0;
  withdrawSnap.forEach(doc=>{
    if(doc.data().status === "pending") pending++;
  });

  document.getElementById("pendingWithdraws").innerText = pending;
}


async function loadWithdraws(){

  const snap = await getDocs(collection(db,"withdrawRequests"));
  const box = document.getElementById("withdrawList");
  box.innerHTML="";

  snap.forEach(d=>{

    const data = d.data();
    if(data.status !== "pending") return;

    box.innerHTML += `
      <div class="card">
        <div class="row">
          <span>UID:</span>
          <span>${data.uid}</span>
        </div>
        <div class="row">
          <span>Amount:</span>
          <span>$${data.amount}</span>
        </div>
        <div class="row">
          <button class="approve" onclick="approve('${d.id}')">Approve</button>
          <button class="reject" onclick="reject('${d.id}')">Reject</button>
        </div>
      </div>
    `;
  });

}


window.approve = async function(id){

  await updateDoc(doc(db,"withdrawRequests",id),{
    status:"approved"
  });

  alert("Withdraw Approved ✅");
  location.reload();
}


window.reject = async function(id){

  await updateDoc(doc(db,"withdrawRequests",id),{
    status:"rejected"
  });

  alert("Withdraw Rejected ❌");
  location.reload();
}

</script>

</body>
</html>
