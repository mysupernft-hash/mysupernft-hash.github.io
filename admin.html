<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SuperNFT Admin Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

  <style>
    body {
      background: #0f0f0f;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .box {
      background: #1a1a1a;
      padding: 30px;
      width: 320px;
      border-radius: 10px;
      box-shadow: 0 0 15px #FFD70055;
      text-align: center;
    }
    h2 {
      color: #FFD700;
      margin-bottom: 20px;
    }
    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border-radius: 6px;
      border: none;
      outline: none;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #FFD700;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    .error {
      color: red;
      margin-top: 10px;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="box">
  <h2>Admin Login</h2>

  <input type="email" id="email" placeholder="Admin Email" />
  <input type="password" id="password" placeholder="Password" />

  <button onclick="adminLogin()">Login</button>

  <div class="error" id="error"></div>
</div>

<script>
  // 🔥 Firebase Config (same as your main project)
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "supernft-5b952.firebaseapp.com",
    projectId: "supernft-5b952",
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();

  async function adminLogin() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const errorBox = document.getElementById("error");
    errorBox.innerText = "";

    try {
      const cred = await auth.signInWithEmailAndPassword(email, password);

      // 🔍 Check custom claims
      const tokenResult = await cred.user.getIdTokenResult(true);

      if (tokenResult.claims.role === "admin") {
        // ✅ ADMIN VERIFIED
        window.location.href = "admin-dashboard.html";
      } else {
        // ❌ NOT ADMIN
        await auth.signOut();
        errorBox.innerText = "Access denied. Admin only.";
      }

    } catch (err) {
      errorBox.innerText = err.message;
    }
  }
</script>

</body>
</html>
