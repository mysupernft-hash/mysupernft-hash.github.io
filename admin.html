<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SuperNFT Direct Admin Login</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0d0d0d;
  color:#FFD700;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.card{
  background:#1a1a1a;
  padding:30px;
  border-radius:12px;
  width:320px;
  text-align:center;
}

input{
  width:100%;
  padding:10px;
  margin:10px 0;
  border:none;
  border-radius:6px;
}

button{
  width:100%;
  padding:12px;
  background:#FFD700;
  border:none;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#e6c200;
}

.error{
  color:red;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="card">
  <h2>🔐 Direct Admin Login</h2>

  <input type="email" id="email" placeholder="Admin Email">
  <input type="password" id="password" placeholder="Password">
  <input type="text" id="uid" placeholder="Enter UID">
  <input type="password" id="pin" placeholder="Enter Admin PIN">

  <button onclick="adminLogin()">Login</button>

  <div id="error" class="error"></div>
</div>

<script>

firebase.initializeApp({
  apiKey: "AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain: "supernft-5b952.firebaseapp.com",
  projectId: "supernft-5b952"
});

const auth = firebase.auth();

/* 🔐 HARD ADMIN CREDENTIALS */
const ADMIN_UID = "MsRwT7ZDW3XbzDgEpfJOXfS3Ejh1";
const ADMIN_PIN = "1449@MsRwT7ZDW3XbzDgEpfJOXfS3Ejh1@shiva";

function adminLogin(){

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const uidInput = document.getElementById("uid").value;
  const pinInput = document.getElementById("pin").value;

  /* 🔐 UID + PIN Check */
  if(uidInput !== ADMIN_UID){
    document.getElementById("error").innerText = "❌ Invalid UID";
    return;
  }

  if(pinInput !== ADMIN_PIN){
    document.getElementById("error").innerText = "❌ Invalid PIN";
    return;
  }

  /* 🔥 Firebase Login */
  auth.signInWithEmailAndPassword(email,password)
  .then((cred)=>{

    if(cred.user.uid === ADMIN_UID){
      window.location.href = "admin.html";
    } else {
      document.getElementById("error").innerText = "❌ Not Admin Account";
      auth.signOut();
    }

  })
  .catch(error=>{
    document.getElementById("error").innerText = error.message;
  });

}

</script>

</body>
</html>
