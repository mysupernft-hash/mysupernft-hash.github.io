<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SuperNFT Ultimate Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0d0d0d;
  color:#FFD700;
  padding:10px;
}
h2{text-align:center}

.card{
  background:#111;
  padding:12px;
  border-radius:10px;
  margin-bottom:15px;
}

.search{
  width:100%;
  padding:8px;
  margin-bottom:10px;
  border:none;
  border-radius:6px;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:11px;
}

th,td{
  border:1px solid #333;
  padding:5px;
  text-align:center;
}

button{
  padding:5px 8px;
  font-size:11px;
  border:none;
  cursor:pointer;
  font-weight:bold;
  border-radius:4px;
}

.saveBtn{background:#FFD700;color:#000;}
.deleteBtn{background:#ff4444;color:#fff;}
.approveBtn{background:#00aa00;color:#fff;}
.rejectBtn{background:#ff4444;color:#fff;}

#pagination{
  text-align:center;
  margin-top:10px;
}

#pagination button{
  margin:3px;
  background:#333;
  color:#FFD700;
}

#pagination button.active{
  background:#FFD700;
  color:#000;
}
</style>
</head>
<body>

<h2>🔥 SuperNFT Ultimate Admin Panel</h2>

<input type="text" id="search" class="search"
placeholder="Search by Email or UID">

<div class="card">
<div style="overflow-x:auto;">
<table>
<thead>
<tr>
<th>Email</th>
<th>Wallet</th>
<th>Referral</th>
<th>Level</th>
<th>Deposit</th>
<th>Withdraw</th>
<th>Total</th>
<th>Save</th>
<th>Delete</th>
</tr>
</thead>
<tbody id="users"></tbody>
</table>
</div>
<div id="pagination"></div>
</div>

<div class="card">
<h3>💸 Withdraw Requests</h3>
<div style="overflow-x:auto;">
<table>
<thead>
<tr>
<th>Email</th>
<th>Amount</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>
<tbody id="withdrawTable"></tbody>
</table>
</div>
</div>

<script>

firebase.initializeApp({
  apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain:"supernft-5b952.firebaseapp.com",
  projectId:"supernft-5b952"
});

const auth=firebase.auth();
const db=firebase.firestore();

let allUsers=[];
let currentPage=1;
const usersPerPage=10;

/* AUTH */
auth.onAuthStateChanged(user=>{
  if(!user){
    location.href="admin-login.html";
    return;
  }
  loadUsers();
  loadWithdraws();
});

/* LOAD USERS */
function loadUsers(){
  db.collection("users").onSnapshot(snapshot=>{
    allUsers=[];
    snapshot.forEach(doc=>{
      allUsers.push({id:doc.id,...doc.data()});
    });
    renderUsers(allUsers);
  });
}

/* RENDER USERS */
function renderUsers(users){

  const start=(currentPage-1)*usersPerPage;
  const end=start+usersPerPage;
  const paginated=users.slice(start,end);

  let html="";

  paginated.forEach(u=>{

    const totalIncome=
      (u.dailyIncome||0)+
      (u.referralEarnings||0)+
      (u.liveEarnings||0);

    html+=`
    <tr>
      <td>${u.email||""}</td>
      <td>${u.walletBalance||0}</td>
      <td>${u.referralEarnings||0}</td>
      <td>${u.level||1}</td>
      <td>${u.totalDeposit||0}</td>
      <td>${u.totalWithdraw||0}</td>
      <td>${totalIncome}</td>
      <td><button class="saveBtn">Save</button></td>
      <td><button class="deleteBtn"
        onclick="deleteUser('${u.id}')">X</button></td>
    </tr>
    `;
  });

  document.getElementById("users").innerHTML=html;

  renderPagination(users.length);
}

/* PAGINATION */
function renderPagination(totalUsers){

  const totalPages=Math.ceil(totalUsers/usersPerPage);

  let buttons="";

  for(let i=1;i<=totalPages;i++){
    buttons+=`
      <button class="${i===currentPage?'active':''}"
      onclick="goToPage(${i})">${i}</button>
    `;
  }

  document.getElementById("pagination").innerHTML=buttons;
}

function goToPage(page){
  currentPage=page;
  renderUsers(allUsers);
}

/* DELETE USER */
function deleteUser(uid){
  if(confirm("Delete user permanently?")){
    db.collection("users").doc(uid).delete()
    .then(()=>alert("Deleted"));
  }
}

/* SEARCH */
document.getElementById("search")
.addEventListener("input",function(){

  const val=this.value.toLowerCase();

  const filtered=allUsers.filter(u=>
    (u.email||"").toLowerCase().includes(val) ||
    u.id.toLowerCase().includes(val)
  );

  currentPage=1;
  renderUsers(filtered);
});

/* WITHDRAW */
function loadWithdraws(){
  db.collection("withdrawRequests")
  .orderBy("createdAt","desc")
  .onSnapshot(snapshot=>{

    let html="";

    snapshot.forEach(doc=>{
      const w=doc.data();

      html+=`
      <tr>
        <td>${w.email}</td>
        <td>$${w.amount}</td>
        <td>${w.status}</td>
        <td>
          ${w.status==="pending" ? `
          <button class="approveBtn"
          onclick="approve('${doc.id}','${w.uid}',${w.amount})">
          Approve</button>

          <button class="rejectBtn"
          onclick="reject('${doc.id}')">
          Reject</button>
          ` : "Done"}
        </td>
      </tr>
      `;
    });

    document.getElementById("withdrawTable").innerHTML=html;
  });
}

function approve(id,uid,amount){
  db.collection("withdrawRequests").doc(id)
  .update({status:"approved"})
  .then(()=>alert("Approved"));
}

function reject(id){
  db.collection("withdrawRequests").doc(id)
  .update({status:"rejected"});
}

</script>
</body>
</html>
