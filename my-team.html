<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Team | SuperNFT</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0f0f0f;
  color:#FFD700;
}

header{
  background:#1a1a1a;
  padding:15px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
}

.container{
  padding:15px;
  max-width:700px;
  margin:auto;
}

.card{
  background:#1a1a1a;
  padding:15px;
  border-radius:12px;
  margin-bottom:15px;
}

.center{text-align:center;}
.big{font-size:20px;font-weight:bold;}

.grid-2{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.small-card{
  background:#111;
  padding:12px;
  border-radius:10px;
  text-align:center;
  font-size:14px;
}

.small-card span{
  display:block;
  font-size:18px;
  margin-top:5px;
  font-weight:bold;
}

.vip-box{
  background:linear-gradient(135deg,#1a1a1a,#111);
  border:1px solid #FFD700;
  padding:15px;
  border-radius:12px;
  margin-top:10px;
}

.progress-bar{
  background:#222;
  height:8px;
  border-radius:10px;
  margin-top:10px;
  overflow:hidden;
}

.progress-fill{
  height:100%;
  width:0%;
  background:#FFD700;
  transition:0.6s;
}

.leader-item{
  display:flex;
  justify-content:space-between;
  padding:8px 0;
  border-bottom:1px solid #333;
}

.crown{color:gold;font-weight:bold;}

.footer{
  text-align:center;
  margin-top:20px;
  opacity:0.6;
  font-size:13px;
}
</style>
</head>
<body>

<header>👥 My Team</header>

<div class="container">

<!-- USER INFO -->
<div class="card center">
  <div id="userEmail">Loading...</div>
  <div style="font-size:13px;">UID: <span id="uid">---</span></div>

  <div class="vip-box">
    <div>💎 VIP Level</div>
    <div class="big" id="vipLevel">VIP 0</div>
    <div style="font-size:12px;">Next Level At <span id="nextTarget">5</span> Members</div>
    <div class="progress-bar">
      <div class="progress-fill" id="vipProgress"></div>
    </div>
  </div>
</div>

<!-- WALLET -->
<div class="card">
  Wallet Balance
  <div class="big">$<span id="wallet">0</span></div>
</div>

<!-- INCOME -->
<div class="card">
  <div class="grid-2">
    <div class="small-card">
      Daily Income
      <span>$<span id="daily">0</span></span>
    </div>
    <div class="small-card">
      Total Income
      <span>$<span id="totalIncome">0</span></span>
    </div>
  </div>
</div>

<!-- TEAM STATS -->
<div class="card">
  <div class="grid-2">
    <div class="small-card">
      Team Members
      <span id="teamCount">0</span>
    </div>
    <div class="small-card">
      Referral Earnings
      <span>$<span id="teamReward">0</span></span>
    </div>
  </div>
</div>

<!-- LEADERBOARD -->
<div class="card">
  <div style="margin-bottom:10px;font-weight:bold;">🏆 Leaderboard</div>
  <div id="leaderboard">Loading...</div>
</div>

<div class="footer">
SuperNFT Community Panel 💎
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, collection, getDocs, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
authDomain:"supernft-5b952.firebaseapp.com",
projectId:"supernft-5b952"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

onAuthStateChanged(auth, async(user)=>{

if(!user){
location.href="login.html";
return;
}

document.getElementById("userEmail").innerText=user.email;
document.getElementById("uid").innerText=user.uid;

const userRef=doc(db,"users",user.uid);
const snap=await getDoc(userRef);

if(!snap.exists()) return;

const data=snap.data();

document.getElementById("wallet").innerText=data.walletBalance||0;
document.getElementById("daily").innerText=data.dailyIncome||0;
document.getElementById("totalIncome").innerText=data.liveEarnings||0;
document.getElementById("teamReward").innerText=data.referralEarnings||0;

/* TEAM COUNT */
const refCol=collection(db,"users",user.uid,"referrals");
const refSnap=await getDocs(refCol);
let teamSize=refSnap.size;
document.getElementById("teamCount").innerText=teamSize;

/* VIP SYSTEM */
let vipLevel=0;
let nextTarget=5;

if(teamSize>=50){vipLevel=3;nextTarget="MAX";}
else if(teamSize>=20){vipLevel=2;nextTarget=50;}
else if(teamSize>=5){vipLevel=1;nextTarget=20;}

document.getElementById("vipLevel").innerText="VIP "+vipLevel;
document.getElementById("nextTarget").innerText=nextTarget;

let percent=0;
if(nextTarget!=="MAX"){
percent=(teamSize/nextTarget)*100;
}
document.getElementById("vipProgress").style.width=percent+"%";

/* LEADERBOARD TOP 3 */
const q=query(collection(db,"users"),orderBy("referralEarnings","desc"),limit(3));
const topSnap=await getDocs(q);

let lb="";
let rank=1;

topSnap.forEach(docSnap=>{
let d=docSnap.data();
let crown=rank<=3?" 👑":"";
lb+=`
<div class="leader-item">
<div>#${rank}${crown}</div>
<div>${d.email||"User"}</div>
<div>$${d.referralEarnings||0}</div>
</div>
`;
rank++;
});

document.getElementById("leaderboard").innerHTML=lb||"No data";

});

</script>

</body>
</html>
