<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Team | SuperNFT</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#0f0f0f;
  color:#FFD700;
}
header{
  background:#1a1a1a;
  padding:15px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
}
.container{
  padding:20px;
  max-width:700px;
  margin:auto;
}
.card{
  background:#1a1a1a;
  border-radius:12px;
  padding:15px;
  margin-bottom:15px;
}
.big{
  font-size:24px;
  font-weight:bold;
}
.leaderboard-item{
  padding:10px;
  border-bottom:1px solid #272727;
}
.leaderboard-item:last-child{
  border-bottom:none;
}
.rank{
  font-weight:bold;
  color:#fff;
}
.back{
  display:block;
  text-align:center;
  margin-top:20px;
  padding:12px;
  background:#272727;
  border-radius:8px;
  color:#FFD700;
  text-decoration:none;
}
</style>
</head>
<body>

<header>🏆 Team Leaderboard</header>

<div class="container">

  <div class="card">
    <div>Your Referral Code</div>
    <div class="big" id="userReferralCode">Loading...</div>
  </div>

  <div class="card">
    <div>Total Team Members</div>
    <div class="big" id="totalTeam">0</div>
  </div>

  <div class="card">
    <div>Total Team Earnings</div>
    <div class="big">$<span id="totalEarnings">0</span></div>
  </div>

  <div class="card">
    <div class="big">Team Members</div>
    <div id="teamList">Loading team...</div>
  </div>

  <a href="dashboard.html" class="back">⬅ Back to Dashboard</a>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, doc, getDoc,
  collection, getDocs
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain:"supernft-5b952.firebaseapp.com",
  projectId:"supernft-5b952"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

onAuthStateChanged(auth, async (user)=>{

  if(!user){
    window.location.href="login.html";
    return;
  }

  try{

    const userRef=doc(db,"users",user.uid);
    const snap=await getDoc(userRef);

    if(!snap.exists()){
      document.getElementById("teamList").innerHTML="User not found.";
      return;
    }

    const data=snap.data();

    const referralCode=data.referralCode || "---";
    const referralCount=data.referralCount || 0;
    const referralEarnings=data.referralEarnings || 0;

    document.getElementById("userReferralCode").innerText=referralCode;
    document.getElementById("totalTeam").innerText=referralCount;
    document.getElementById("totalEarnings").innerText=referralEarnings;

    // 🔥 Load team from subcollection
    const refCol=collection(db,"users",user.uid,"referrals");
    const refSnap=await getDocs(refCol);

    const teamList=document.getElementById("teamList");
    teamList.innerHTML="";

    if(refSnap.empty){
      teamList.innerHTML="No team members yet.";
      return;
    }

    let rank=1;

    refSnap.forEach(docSnap=>{

      const r=docSnap.data();
      const email=r.email || "User";
      const reward=r.reward || 0;

      let date="Pending";
      if(r.joinedAt && r.joinedAt.toDate){
        date=r.joinedAt.toDate().toLocaleString();
      }

      teamList.innerHTML+=`
        <div class="leaderboard-item">
          <div class="rank">#${rank}</div>
          <div>${email}</div>
          <div style="font-size:12px;color:#bbb;">
            Reward: $${reward} | Joined: ${date}
          </div>
        </div>
      `;

      rank++;

    });

  }catch(error){
    console.error("TEAM LOAD ERROR:",error);
    document.getElementById("teamList").innerHTML="Error loading team.";
  }

});

</script>

</body>
</html>
