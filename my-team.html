<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Team | SuperNFT</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0f0f0f;
  color:#FFD700;
}
header{
  background:#1a1a1a;
  padding:15px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
}
.container{
  padding:15px;
}
.card{
  background:#1a1a1a;
  padding:15px;
  border-radius:12px;
  margin-bottom:15px;
}
.row{
  display:flex;
  justify-content:space-between;
  margin-top:10px;
}
.big{
  font-size:20px;
  font-weight:bold;
}
.center{text-align:center;}
.grid-2{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}
.grid-3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}
.small-card{
  background:#111;
  padding:12px;
  border-radius:10px;
  text-align:center;
  font-size:14px;
}
.small-card span{
  display:block;
  font-size:18px;
  margin-top:5px;
  font-weight:bold;
}
.section-title{
  margin:15px 0 8px;
  font-size:16px;
  font-weight:bold;
}
.footer{
  margin-top:20px;
  text-align:center;
  font-size:13px;
  opacity:0.7;
}
a{text-decoration:none;color:#FFD700;}
</style>
</head>

<body>

<header>👥 My Team</header>

<div class="container">

<!-- USER INFO -->
<div class="card center">
  <div id="userEmail">Loading...</div>
  <div style="margin-top:5px;font-size:13px;">
    UID: <span id="uid">---</span>
  </div>
</div>

<!-- WALLET -->
<div class="card">
  <div class="row">
    <div>Wallet Balance</div>
    <div class="big">$<span id="wallet">0</span></div>
  </div>
</div>

<!-- INCOME -->
<div class="card">
  <div class="section-title">Income</div>
  <div class="grid-2">
    <div class="small-card">
      Daily Income
      <span>$<span id="daily">0</span></span>
    </div>
    <div class="small-card">
      Total Income
      <span>$<span id="totalIncome">0</span></span>
    </div>
  </div>
</div>

<!-- 5 LEVEL MLM -->
<div class="card">
  <div class="section-title">5 Level MLM Structure</div>
  <div class="grid-3">
    <div class="small-card">Level 1 (20%)<span id="l1">0</span></div>
    <div class="small-card">Level 2 (15%)<span id="l2">0</span></div>
    <div class="small-card">Level 3 (10%)<span id="l3">0</span></div>
    <div class="small-card">Level 4 (7.5%)<span id="l4">0</span></div>
    <div class="small-card">Level 5 (5%)<span id="l5">0</span></div>
    <div class="small-card">Total Team<span id="teamCount">0</span></div>
  </div>
</div>

<!-- MY LEVEL -->
<div class="card">
  <div class="section-title">My Level</div>
  <div class="grid-2">
    <div class="small-card">
      Level
      <span id="level">0</span>
    </div>
    <div class="small-card">
      Points
      <span id="points">0</span>
    </div>
  </div>
</div>

<div class="footer">
SuperNFT Community Panel
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
authDomain:"supernft-5b952.firebaseapp.com",
projectId:"supernft-5b952"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

onAuthStateChanged(auth, async(user)=>{

if(!user){
location.href="login.html";
return;
}

document.getElementById("userEmail").innerText=user.email;
document.getElementById("uid").innerText=user.uid;

const userRef=doc(db,"users",user.uid);
const snap=await getDoc(userRef);
if(!snap.exists()) return;

const data=snap.data();

document.getElementById("wallet").innerText=data.walletBalance||0;
document.getElementById("daily").innerText=data.dailyIncome||0;
document.getElementById("totalIncome").innerText=data.liveEarnings||0;

/* 🔥 5 LEVEL MLM SYSTEM */

let levelCounts = [0,0,0,0,0];

async function getLevelMembers(referralCode, level){

  if(level >= 5) return;

  const q = query(
    collection(db,"users"),
    where("referredBy","==", referralCode)
  );

  const snapshot = await getDocs(q);

  levelCounts[level] += snapshot.size;

  for(const docSnap of snapshot.docs){
    const child = docSnap.data();
    await getLevelMembers(child.referralCode, level+1);
  }
}

await getLevelMembers(data.referralCode, 0);

document.getElementById("l1").innerText = levelCounts[0];
document.getElementById("l2").innerText = levelCounts[1];
document.getElementById("l3").innerText = levelCounts[2];
document.getElementById("l4").innerText = levelCounts[3];
document.getElementById("l5").innerText = levelCounts[4];

const totalTeam = levelCounts.reduce((a,b)=>a+b,0);
document.getElementById("teamCount").innerText = totalTeam;

/* 🔥 AUTO LEVEL SYSTEM */
let level=0;
let points=(totalTeam*10)+(data.referralEarnings||0);

if(totalTeam>=50 && data.referralEarnings>=500){level=4;}
else if(totalTeam>=20 && data.referralEarnings>=200){level=3;}
else if(totalTeam>=10 && data.referralEarnings>=100){level=2;}
else if(totalTeam>=5){level=1;}
else{level=0;}

document.getElementById("level").innerText=level;
document.getElementById("points").innerText=points;

});

</script>

</body>
</html>
