<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Team | SuperNFT</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0f0f0f;
  color:#FFD700;
}
header{
  background:#1a1a1a;
  padding:15px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
}
.container{padding:15px;}
.card{
  background:#1a1a1a;
  padding:15px;
  border-radius:12px;
  margin-bottom:15px;
}
.small-card{
  background:#111;
  padding:12px;
  border-radius:10px;
  text-align:center;
  font-size:14px;
}
.small-card span{
  display:block;
  font-size:18px;
  margin-top:5px;
  font-weight:bold;
}
.grid-3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}
.section-title{
  margin:15px 0 8px;
  font-size:16px;
  font-weight:bold;
}
.level-box{
  background:#000;
  padding:10px;
  margin-top:10px;
  border-radius:8px;
}
</style>
</head>

<body>

<header>👥 My Team</header>

<div class="container">

<div class="card" style="text-align:center">
  <div id="userName">Loading...</div>
  <div style="font-size:13px;margin-top:5px;">
    UID: <span id="uid">---</span>
  </div>
</div>

<div class="card">
  <div class="section-title">Team Stats</div>
  <div class="grid-3">
    <div class="small-card">
      Level 1
      <span id="l1">0</span>
    </div>
    <div class="small-card">
      Level 2
      <span id="l2">0</span>
    </div>
    <div class="small-card">
      Level 3
      <span id="l3">0</span>
    </div>
  </div>
</div>

<div class="card">
  <div class="section-title">Commission Earnings</div>

  <div class="level-box">
    L1 (20%) → $<span id="c1">0</span>
  </div>

  <div class="level-box">
    L2 (15%) → $<span id="c2">0</span>
  </div>

  <div class="level-box">
    L3 (10%) → $<span id="c3">0</span>
  </div>

  <div class="level-box">
    Total → $<span id="totalCommission">0</span>
  </div>

</div>

<div class="card">
  <div class="section-title">Commission History</div>
  <div id="history">Loading...</div>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
authDomain:"supernft-5b952.firebaseapp.com",
projectId:"supernft-5b952"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

/* 🔐 LOGIN REQUIRED */
onAuthStateChanged(auth, async(user)=>{

if(!user){
  setTimeout(()=>{
    window.location.href="login.html";
  },500);
  return;
}

document.getElementById("uid").innerText=user.uid;

const userRef=doc(db,"users",user.uid);
const snap=await getDoc(userRef);

if(!snap.exists()) return;

const data=snap.data();

/* 🔥 SHOW NAME NOT EMAIL */
document.getElementById("userName").innerText=
  data.name || user.displayName || user.email.split("@")[0];

/* ======================
   🔥 LEVEL 1 USERS
====================== */

const l1Query=query(
  collection(db,"users"),
  where("referredByUid","==",user.uid)
);

const l1Snap=await getDocs(l1Query);
let l1Count=l1Snap.size;
document.getElementById("l1").innerText=l1Count;

let l2Count=0;
let l3Count=0;

let commission1=0;
let commission2=0;
let commission3=0;

/* 🔥 LEVEL 2 & 3 */
for(const l1Doc of l1Snap.docs){

  const l1Id=l1Doc.id;
  const l1Data=l1Doc.data();

  commission1 += (l1Data.totalDeposit||0)*0.20;

  const l2Query=query(
    collection(db,"users"),
    where("referredByUid","==",l1Id)
  );

  const l2Snap=await getDocs(l2Query);
  l2Count+=l2Snap.size;

  for(const l2Doc of l2Snap.docs){

    const l2Id=l2Doc.id;
    const l2Data=l2Doc.data();

    commission2 += (l2Data.totalDeposit||0)*0.15;

    const l3Query=query(
      collection(db,"users"),
      where("referredByUid","==",l2Id)
    );

    const l3Snap=await getDocs(l3Query);
    l3Count+=l3Snap.size;

    for(const l3Doc of l3Snap.docs){
      const l3Data=l3Doc.data();
      commission3 += (l3Data.totalDeposit||0)*0.10;
    }

  }
}

document.getElementById("l2").innerText=l2Count;
document.getElementById("l3").innerText=l3Count;

document.getElementById("c1").innerText=commission1.toFixed(2);
document.getElementById("c2").innerText=commission2.toFixed(2);
document.getElementById("c3").innerText=commission3.toFixed(2);

const total=commission1+commission2+commission3;
document.getElementById("totalCommission").innerText=total.toFixed(2);

/* ======================
   🔥 HISTORY TRACKING
====================== */

let historyHTML="";

if(l1Count===0 && l2Count===0){
  historyHTML="No commission yet";
}else{
  historyHTML+=`<div>L1 Members: ${l1Count}</div>`;
  historyHTML+=`<div>L2 Members: ${l2Count}</div>`;
  historyHTML+=`<div>L3 Members: ${l3Count}</div>`;
  historyHTML+=`<div>Total Earned: $${total.toFixed(2)}</div>`;
}

document.getElementById("history").innerHTML=historyHTML;

});

</script>

</body>
</html>
