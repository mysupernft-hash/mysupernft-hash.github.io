<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Team | SuperNFT</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>

body{
  margin:0;
  font-family:Arial;
  background:#0f0f0f;
  color:#FFD700;
}

header{
  background:#1a1a1a;
  padding:18px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
  letter-spacing:1px;
}

.container{
  padding:15px;
  max-width:500px;
  margin:auto;
}

.card{
  background:#1a1a1a;
  padding:18px;
  border-radius:14px;
  margin-bottom:18px;
  box-shadow:0 0 10px rgba(0,0,0,0.4);
}

.user-name{
  font-size:18px;
  font-weight:bold;
}

.uid{
  font-size:12px;
  color:#aaa;
  margin-top:4px;
  word-break:break-all;
}

.section-title{
  font-size:16px;
  margin-bottom:12px;
  font-weight:bold;
}

.grid-3{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
}

.small-card{
  background:#111;
  padding:14px 10px;
  border-radius:12px;
  text-align:center;
  font-size:13px;
}

.small-card span{
  display:block;
  font-size:18px;
  font-weight:bold;
  margin-top:6px;
}

.big{
  font-size:22px;
  font-weight:bold;
  text-align:center;
  margin-top:10px;
}

/* 📱 Extra Mobile Optimization */
@media(max-width:400px){
  .grid-3{
    grid-template-columns:1fr;
  }
}

</style>
</head>
<body>

<header>👥 My Team</header>

<div class="container">

<!-- USER INFO -->
<div class="card">
  <div class="user-name" id="userName">Shiva</div>
  <div class="uid">UID: <span id="uid">---</span></div>
</div>

<!-- LEVEL STRUCTURE -->
<div class="card">
  <div class="section-title">Level Structure</div>
  <div class="grid-3">
    <div class="small-card">L1 (20%)<span id="l1">1</span></div>
    <div class="small-card">L2 (15%)<span id="l2">0</span></div>
    <div class="small-card">L3 (10%)<span id="l3">0</span></div>
  </div>
</div>

<!-- LEVEL COMMISSION -->
<div class="card">
  <div class="section-title">Level Wise Commission</div>
  <div class="grid-3">
    <div class="small-card">L1 Earned<span>$<span id="l1Earn">70.00</span></span></div>
    <div class="small-card">L2 Earned<span>$<span id="l2Earn">0.00</span></span></div>
    <div class="small-card">L3 Earned<span>$<span id="l3Earn">0.00</span></span></div>
  </div>
</div>

<!-- TOTAL -->
<div class="card">
  <div class="section-title">Total Referral Earnings</div>
  <div class="big">$<span id="totalEarn">70.00</span></div>
</div>

</div>

</body>
</html>
