<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Team | SuperNFT</title>

<style>
body{margin:0;font-family:Arial;background:#0f0f0f;color:#FFD700;}
header{background:#1a1a1a;padding:15px;text-align:center;font-size:20px;font-weight:bold;}
.container{padding:15px;}
.card{background:#1a1a1a;padding:15px;border-radius:12px;margin-bottom:15px;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.small-card{background:#111;padding:12px;border-radius:10px;text-align:center;font-size:13px;}
.small-card span{display:block;font-size:18px;font-weight:bold;margin-top:5px;}
.big{font-size:22px;font-weight:bold;text-align:center;}
</style>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>

<body>

<header>👥 My Team</header>

<div class="container">

<div class="card">
<div id="userName">Loading...</div>
<div style="font-size:12px;">UID: <span id="uid">---</span></div>
</div>

<div class="card">
<h3>Level Structure</h3>
<div class="grid-3">
<div class="small-card">L1 (20%)<span id="l1">0</span></div>
<div class="small-card">L2 (15%)<span id="l2">0</span></div>
<div class="small-card">L3 (10%)<span id="l3">0</span></div>
</div>
</div>

<div class="card">
<h3>Level Wise Commission Earned</h3>
<div class="grid-3">
<div class="small-card">L1 Earned<span>$<span id="l1Earn">0</span></span></div>
<div class="small-card">L2 Earned<span>$<span id="l2Earn">0</span></span></div>
<div class="small-card">L3 Earned<span>$<span id="l3Earn">0</span></span></div>
</div>
</div>

<div class="card">
<h3>Total Referral Earnings</h3>
<div class="big">$<span id="totalEarn">0</span></div>
</div>

</div>

<script>

firebase.initializeApp({
apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
authDomain:"supernft-5b952.firebaseapp.com",
projectId:"supernft-5b952"
});

const auth = firebase.auth();
const db = firebase.firestore();

auth.onAuthStateChanged(async user=>{

if(!user){
location.href="login.html";
return;
}

document.getElementById("uid").innerText=user.uid;

const userDoc = await db.collection("users").doc(user.uid).get();
if(!userDoc.exists) return;

const data = userDoc.data();
document.getElementById("userName").innerText=data.name || user.email;

/* ================= LEVEL COUNTS ================= */

let level1 = [];
let level2 = [];
let level3 = [];

// Level 1
const l1Snap = await db.collection("users")
.where("referredByUid","==",user.uid)
.get();

l1Snap.forEach(d=>level1.push(d.id));
document.getElementById("l1").innerText=level1.length;

// Level 2
for(const uid of level1){
const snap = await db.collection("users")
.where("referredByUid","==",uid)
.get();
snap.forEach(d=>level2.push(d.id));
}
document.getElementById("l2").innerText=level2.length;

// Level 3
for(const uid of level2){
const snap = await db.collection("users")
.where("referredByUid","==",uid)
.get();
snap.forEach(d=>level3.push(d.id));
}
document.getElementById("l3").innerText=level3.length;

/* ================= COMMISSION CALC ================= */

let l1Earn=0;
let l2Earn=0;
let l3Earn=0;

const history = data.commissionHistory || [];

history.forEach(h=>{
if(h.level==1) l1Earn += Number(h.amount||0);
if(h.level==2) l2Earn += Number(h.amount||0);
if(h.level==3) l3Earn += Number(h.amount||0);
});

document.getElementById("l1Earn").innerText=l1Earn.toFixed(2);
document.getElementById("l2Earn").innerText=l2Earn.toFixed(2);
document.getElementById("l3Earn").innerText=l3Earn.toFixed(2);

document.getElementById("totalEarn").innerText=
(l1Earn+l2Earn+l3Earn).toFixed(2);

});

</script>

</body>
</html>
