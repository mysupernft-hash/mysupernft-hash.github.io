<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Team | SuperNFT</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0f0f0f;
  color:#FFD700;
}
header{
  background:#1a1a1a;
  padding:15px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
}
.container{padding:15px;}
.card{
  background:#1a1a1a;
  padding:15px;
  border-radius:12px;
  margin-bottom:15px;
}
.row{
  display:flex;
  justify-content:space-between;
  margin-top:8px;
}
.big{
  font-size:20px;
  font-weight:bold;
}
.grid-3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}
.small-card{
  background:#111;
  padding:12px;
  border-radius:10px;
  text-align:center;
  font-size:13px;
}
.small-card span{
  display:block;
  font-size:16px;
  font-weight:bold;
  margin-top:5px;
}
.history-box{
  background:#111;
  padding:10px;
  border-radius:8px;
  margin-top:8px;
  font-size:12px;
}
</style>
</head>

<body>

<header>👥 My Team</header>

<div class="container">

<!-- USER INFO -->
<div class="card">
<div id="userName">Loading...</div>
<div style="font-size:12px;">UID: <span id="uid">---</span></div>
</div>

<!-- WALLET -->
<div class="card">
<div class="row">
<div>Wallet Balance</div>
<div class="big">$<span id="wallet">0</span></div>
</div>
</div>

<!-- LEVEL COUNTS -->
<div class="card">
<h3>Level Structure</h3>
<div class="grid-3">
<div class="small-card">L1 (20%)<span id="l1">0</span></div>
<div class="small-card">L2 (15%)<span id="l2">0</span></div>
<div class="small-card">L3 (10%)<span id="l3">0</span></div>
</div>
</div>

<!-- LEVEL USERS DISPLAY -->
<div id="levelUsers"></div>

<!-- COMMISSION -->
<div class="card">
<h3>Total Referral Earnings</h3>
<div class="big">$<span id="referralEarnings">0</span></div>
</div>

<!-- COMMISSION HISTORY -->
<div class="card">
<h3>Commission History</h3>
<div id="commissionHistory">Loading...</div>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
authDomain:"supernft-5b952.firebaseapp.com",
projectId:"supernft-5b952"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

onAuthStateChanged(auth, async(user)=>{

if(!user){
location.href="login.html";
return;
}

document.getElementById("uid").innerText=user.uid;

const userRef=doc(db,"users",user.uid);
const snap=await getDoc(userRef);
if(!snap.exists()) return;

const data=snap.data();

document.getElementById("userName").innerText=data.name || user.email;
document.getElementById("wallet").innerText=data.walletBalance||0;
document.getElementById("referralEarnings").innerText=data.referralEarnings||0;

let levelUsersHTML="";

/* ========= LEVEL 1 ========= */

const q1=query(collection(db,"users"),where("referredByUid","==",user.uid));
const snap1=await getDocs(q1);

document.getElementById("l1").innerText=snap1.size;

levelUsersHTML+=`<div class="card"><h3>Level 1 Users</h3>`;

snap1.forEach(doc1=>{
const u=doc1.data();
levelUsersHTML+=`
<div class="history-box">
<b>${u.name || "No Name"}</b><br>
${u.email || ""}<br>
Deposit: $${u.totalDeposit || 0}
</div>
`;
});

levelUsersHTML+=`</div>`;

/* ========= LEVEL 2 ========= */

let level2Count=0;
let level2HTML=`<div class="card"><h3>Level 2 Users</h3>`;

for(const doc1 of snap1.docs){

const q2=query(collection(db,"users"),where("referredByUid","==",doc1.id));
const snap2=await getDocs(q2);

level2Count+=snap2.size;

snap2.forEach(doc2=>{
const u2=doc2.data();
level2HTML+=`
<div class="history-box">
<b>${u2.name || "No Name"}</b><br>
${u2.email || ""}<br>
Deposit: $${u2.totalDeposit || 0}
</div>
`;
});
}

level2HTML+=`</div>`;
document.getElementById("l2").innerText=level2Count;

/* ========= LEVEL 3 ========= */

let level3Count=0;
let level3HTML=`<div class="card"><h3>Level 3 Users</h3>`;

for(const doc1 of snap1.docs){

const q2=query(collection(db,"users"),where("referredByUid","==",doc1.id));
const snap2=await getDocs(q2);

for(const doc2 of snap2.docs){

const q3=query(collection(db,"users"),where("referredByUid","==",doc2.id));
const snap3=await getDocs(q3);

level3Count+=snap3.size;

snap3.forEach(doc3=>{
const u3=doc3.data();
level3HTML+=`
<div class="history-box">
<b>${u3.name || "No Name"}</b><br>
${u3.email || ""}<br>
Deposit: $${u3.totalDeposit || 0}
</div>
`;
});
}
}

level3HTML+=`</div>`;
document.getElementById("l3").innerText=level3Count;

/* ADD ALL TO PAGE */
document.getElementById("levelUsers").innerHTML =
levelUsersHTML + level2HTML + level3HTML;

/* ========= COMMISSION HISTORY ========= */

const historyContainer=document.getElementById("commissionHistory");
const history=data.commissionHistory||[];

if(history.length===0){
historyContainer.innerHTML="No commission yet.";
}else{
let html="";
history.slice().reverse().forEach(h=>{
html+=`
<div class="history-box">
Level ${h.level} → $${h.amount}<br>
Deposit: $${h.depositAmount}
</div>
`;
});
historyContainer.innerHTML=html;
}

});

</script>

</body>
</html>
