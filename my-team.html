<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Team | SuperNFT</title>

<style>
body{margin:0;font-family:Arial;background:#0f0f0f;color:#FFD700;}
header{background:#1a1a1a;padding:15px;text-align:center;font-size:20px;font-weight:bold;}
.container{padding:15px;}
.card{background:#1a1a1a;padding:15px;border-radius:12px;margin-bottom:15px;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.small-card{background:#111;padding:12px;border-radius:10px;text-align:center;font-size:13px;}
.small-card span{display:block;font-size:18px;font-weight:bold;margin-top:5px;}
.big{font-size:22px;font-weight:bold;text-align:center;}
</style>
</head>

<body>

<header>👥 My Team</header>

<div class="container">

<div class="card">
<div id="userName">Loading...</div>
<div style="font-size:12px;">UID: <span id="uid">---</span></div>
</div>

<div class="card">
<h3>Level Structure</h3>
<div class="grid-3">
<div class="small-card">L1 (20%)<span id="l1">0</span></div>
<div class="small-card">L2 (15%)<span id="l2">0</span></div>
<div class="small-card">L3 (10%)<span id="l3">0</span></div>
</div>
</div>

<div class="card">
<h3>Level Wise Commission Earned</h3>
<div class="grid-3">
<div class="small-card">L1 Earned<span>$<span id="l1Earn">0.00</span></span></div>
<div class="small-card">L2 Earned<span>$<span id="l2Earn">0.00</span></span></div>
<div class="small-card">L3 Earned<span>$<span id="l3Earn">0.00</span></span></div>
</div>
</div>

<div class="card">
<h3>Total Referral Earnings</h3>
<div class="big">$<span id="totalEarn">0.00</span></div>
</div>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>

firebase.initializeApp({
  apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain:"supernft-5b952.firebaseapp.com",
  projectId:"supernft-5b952"
});

const auth = firebase.auth();
const db = firebase.firestore();

auth.onAuthStateChanged(async user => {

if(!user){
  location.href="login.html";
  return;
}

document.getElementById("uid").innerText = user.uid;

const userDoc = await db.collection("users").doc(user.uid).get();
if(!userDoc.exists) return;

const data = userDoc.data();
document.getElementById("userName").innerText = data.name || user.email;

/* =====================
   LEVEL STRUCTURE
===================== */

let level1Docs = await db.collection("users")
.where("referredByUid","==",user.uid)
.get();

document.getElementById("l1").innerText = level1Docs.size;

let l2Count = 0;
let l3Count = 0;

for(const doc1 of level1Docs.docs){

  const level2 = await db.collection("users")
  .where("referredByUid","==",doc1.id)
  .get();

  l2Count += level2.size;

  for(const doc2 of level2.docs){

    const level3 = await db.collection("users")
    .where("referredByUid","==",doc2.id)
    .get();

    l3Count += level3.size;
  }
}

document.getElementById("l2").innerText = l2Count;
document.getElementById("l3").innerText = l3Count;

/* =====================
   LEVEL COMMISSION
===================== */

let l1Earn=0;
let l2Earn=0;
let l3Earn=0;

const history = data.commissionHistory || [];

history.forEach(h=>{
  if(Number(h.level)===1) l1Earn += Number(h.amount||0);
  if(Number(h.level)===2) l2Earn += Number(h.amount||0);
  if(Number(h.level)===3) l3Earn += Number(h.amount||0);
});

document.getElementById("l1Earn").innerText = l1Earn.toFixed(2);
document.getElementById("l2Earn").innerText = l2Earn.toFixed(2);
document.getElementById("l3Earn").innerText = l3Earn.toFixed(2);

/* =====================
   TOTAL REFERRAL EARNINGS
===================== */

document.getElementById("totalEarn").innerText =
Number(data.referralEarnings || 0).toFixed(2);

});

</script>

</body>
</html>
