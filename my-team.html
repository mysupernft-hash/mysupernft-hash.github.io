<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Team | SuperNFT</title>

<style>
body{margin:0;font-family:Arial;background:#0f0f0f;color:#FFD700;}
header{background:#1a1a1a;padding:15px;text-align:center;font-size:20px;font-weight:bold;}
.container{padding:15px;}
.card{background:#1a1a1a;padding:15px;border-radius:12px;margin-bottom:15px;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.small-card{background:#111;padding:12px;border-radius:10px;text-align:center;font-size:13px;}
.small-card span{display:block;font-size:18px;font-weight:bold;margin-top:5px;}
.big{font-size:20px;font-weight:bold;}
</style>
</head>

<body>

<header>👥 My Team</header>

<div class="container">

<!-- USER -->
<div class="card">
<div id="userName">Loading...</div>
<div style="font-size:12px;">UID: <span id="uid">---</span></div>
</div>

<!-- LEVEL COUNTS -->
<div class="card">
<h3>Level Structure</h3>
<div class="grid-3">
<div class="small-card">L1 (20%)<span id="l1">0</span></div>
<div class="small-card">L2 (15%)<span id="l2">0</span></div>
<div class="small-card">L3 (10%)<span id="l3">0</span></div>
</div>
</div>

<!-- LEVEL COMMISSION -->
<div class="card">
<h3>Level Wise Commission Earned</h3>
<div class="grid-3">
<div class="small-card">L1 Earned<span>$<span id="l1Earn">0</span></span></div>
<div class="small-card">L2 Earned<span>$<span id="l2Earn">0</span></span></div>
<div class="small-card">L3 Earned<span>$<span id="l3Earn">0</span></span></div>
</div>
</div>

<!-- TOTAL -->
<div class="card">
<h3>Total Referral Earnings</h3>
<div class="big">$<span id="totalEarn">0</span></div>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
authDomain:"supernft-5b952.firebaseapp.com",
projectId:"supernft-5b952"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

onAuthStateChanged(auth, async(user)=>{

if(!user){
location.href="login.html";
return;
}

document.getElementById("uid").innerText=user.uid;

const userRef=doc(db,"users",user.uid);
const snap=await getDoc(userRef);
if(!snap.exists()) return;

const data=snap.data();

document.getElementById("userName").innerText=data.name || user.email;

/* =====================
   🔥 LEVEL COUNTS
===================== */

const q1=query(collection(db,"users"),where("referredByUid","==",user.uid));
const snap1=await getDocs(q1);
document.getElementById("l1").innerText=snap1.size;

let level2Count=0;
let level3Count=0;

for(const doc1 of snap1.docs){
  const q2=query(collection(db,"users"),where("referredByUid","==",doc1.id));
  const snap2=await getDocs(q2);
  level2Count+=snap2.size;

  for(const doc2 of snap2.docs){
    const q3=query(collection(db,"users"),where("referredByUid","==",doc2.id));
    const snap3=await getDocs(q3);
    level3Count+=snap3.size;
  }
}

document.getElementById("l2").innerText=level2Count;
document.getElementById("l3").innerText=level3Count;

/* =====================
   🔥 LEVEL COMMISSION CALC
===================== */

const history = data.commissionHistory || [];

let l1Earn=0;
let l2Earn=0;
let l3Earn=0;

history.forEach(h=>{
  if(h.level===1) l1Earn += h.amount;
  if(h.level===2) l2Earn += h.amount;
  if(h.level===3) l3Earn += h.amount;
});

document.getElementById("l1Earn").innerText=l1Earn.toFixed(2);
document.getElementById("l2Earn").innerText=l2Earn.toFixed(2);
document.getElementById("l3Earn").innerText=l3Earn.toFixed(2);

document.getElementById("totalEarn").innerText=
(l1Earn + l2Earn + l3Earn).toFixed(2);

});

</script>

</body>
</html>
