<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MLM Pro | SuperNFT</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f0f0f;
  color:#FFD700;
}
header{
  background:#1a1a1a;
  padding:15px;
  text-align:center;
  font-size:20px;
}
.container{padding:15px;}

.card{
  background:#1a1a1a;
  padding:15px;
  border-radius:12px;
  margin-bottom:15px;
}

.tree{
  text-align:center;
}

.node{
  display:inline-block;
  background:#111;
  padding:10px 15px;
  border-radius:10px;
  margin:10px;
  border:1px solid #FFD700;
  font-size:13px;
  min-width:120px;
}

.level-title{
  margin-top:15px;
  font-weight:bold;
}

.stat-box{
  background:#111;
  padding:12px;
  border-radius:10px;
  text-align:center;
  margin-bottom:10px;
}
.big{font-size:18px;font-weight:bold;}
</style>
</head>
<body>

<header>🌳 MLM PRO SYSTEM</header>

<div class="container">

<div class="card">
<div class="stat-box">
Total Network: <span class="big" id="totalNetwork">0</span>
</div>
<div class="stat-box">
Total Commission: $<span class="big" id="totalCommission">0</span>
</div>
</div>

<div class="card tree">
<div class="level-title">YOU</div>
<div class="node" id="youNode">Loading...</div>

<div class="level-title">Level 1 (20%)</div>
<div id="level1"></div>

<div class="level-title">Level 2 (15%)</div>
<div id="level2"></div>

<div class="level-title">Level 3 (10%)</div>
<div id="level3"></div>
</div>

<div class="card">
<h3>💰 Commission History</h3>
<div id="commissionHistory">Loading...</div>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
apiKey:"YOUR_KEY",
authDomain:"YOUR_DOMAIN",
projectId:"YOUR_PROJECT"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

onAuthStateChanged(auth, async(user)=>{

if(!user){ location.href="login.html"; return; }

const userRef=doc(db,"users",user.uid);
const snap=await getDoc(userRef);
if(!snap.exists()) return;

const data=snap.data();

document.getElementById("youNode").innerHTML=
`<b>${data.name}</b><br>$${data.totalDeposit||0}`;

let totalNetwork=0;
let totalCommission=0;

async function loadLevel(parentUid, levelContainer, percent){

const refCol=collection(db,"users",parentUid,"referrals");
const refSnap=await getDocs(refCol);

let html="";

for(const docSnap of refSnap.docs){

const childUid=docSnap.id;
const childRef=doc(db,"users",childUid);
const childSnap=await getDoc(childRef);

if(!childSnap.exists()) continue;

const child=childSnap.data();

totalNetwork++;

const commission=(child.totalDeposit||0)*percent/100;
totalCommission+=commission;

html+=`
<div class="node">
<b>${child.name||"No Name"}</b><br>
Deposit: $${child.totalDeposit||0}<br>
Commission: $${commission.toFixed(2)}
</div>
`;

}

levelContainer.innerHTML=html;
}

await loadLevel(user.uid,document.getElementById("level1"),20);

const level1Refs=await getDocs(collection(db,"users",user.uid,"referrals"));
for(const l1 of level1Refs.docs){
await loadLevel(l1.id,document.getElementById("level2"),15);

const level2Refs=await getDocs(collection(db,"users",l1.id,"referrals"));
for(const l2 of level2Refs.docs){
await loadLevel(l2.id,document.getElementById("level3"),10);
}
}

document.getElementById("totalNetwork").innerText=totalNetwork;
document.getElementById("totalCommission").innerText=totalCommission.toFixed(2);

/* Commission History */
const history=data.commissionHistory||[];
let h="";
if(history.length===0){
h="No Commission Yet";
}else{
history.slice().reverse().forEach(c=>{
h+=`<div>$${c.amount} from ${c.from} (L${c.level})</div>`;
});
}
document.getElementById("commissionHistory").innerHTML=h;

});

</script>

</body>
</html>
