<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Team | SuperNFT</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0f0f0f;
  color:#FFD700;
}

header{
  background:#1a1a1a;
  padding:15px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
}

.container{
  padding:15px;
}

.card{
  background:#1a1a1a;
  padding:15px;
  border-radius:12px;
  margin-bottom:15px;
}

.row{
  display:flex;
  justify-content:space-between;
  margin-top:10px;
}

.big{
  font-size:20px;
  font-weight:bold;
}

.center{
  text-align:center;
}

.grid-2{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.grid-3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.small-card{
  background:#111;
  padding:12px;
  border-radius:10px;
  text-align:center;
  font-size:14px;
}

.small-card span{
  display:block;
  font-size:18px;
  margin-top:5px;
  font-weight:bold;
}

.section-title{
  margin:15px 0 8px;
  font-size:16px;
  font-weight:bold;
}

.footer{
  margin-top:20px;
  text-align:center;
  font-size:13px;
  opacity:0.7;
}
</style>
</head>

<body>

<header>👥 My Team</header>

<div class="container">

<!-- USER INFO -->
<div class="card center">
  <div id="userEmail">Loading...</div>
  <div style="margin-top:5px;font-size:13px;">
    UID: <span id="uid">---</span>
  </div>
</div>

<!-- WALLET -->
<div class="card">
  <div class="row">
    <div>Wallet Balance</div>
    <div class="big">$<span id="wallet">0</span></div>
  </div>
</div>

<!-- INCOME -->
<div class="card">
  <div class="section-title">Income</div>
  <div class="grid-2">
    <div class="small-card">
      Daily Income
      <span>$<span id="daily">0</span></span>
    </div>
    <div class="small-card">
      Total Income
      <span>$<span id="totalIncome">0</span></span>
    </div>
  </div>
</div>

<!-- 🔥 MY TEAM -->
<div class="card">
  <div class="section-title">My Team</div>
  <div class="grid-3">
    <div class="small-card">
      Valid Members
      <span id="teamCount">0</span>
    </div>
    <div class="small-card">
      Community Rewards
      <span id="teamReward">0</span>
    </div>
    <div class="small-card">
      Community Orders
      <span id="teamOrders">0</span>
    </div>
  </div>
</div>

<!-- 💎 MY LEVEL -->
<div class="card">
  <div class="section-title">My Level</div>
  <div class="center">
    <div>Level <span id="level">0</span></div>
    <div style="margin-top:8px;">
      <span id="points">0</span> Points
    </div>
  </div>
</div>

<!-- 📦 MY ORDERS -->
<div class="card">
  <div class="section-title">My Orders</div>
  <div class="grid-2">
    <div class="small-card">
      Orders
      <span id="orders">0</span>
    </div>
    <div class="small-card">
      Processing
      <span id="processing">0</span>
    </div>
  </div>
</div>

<div class="footer">
SuperNFT Community Panel
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
authDomain:"supernft-5b952.firebaseapp.com",
projectId:"supernft-5b952"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

onAuthStateChanged(auth, async(user)=>{

if(!user){
location.href="login.html";
return;
}

document.getElementById("userEmail").innerText=user.email;
document.getElementById("uid").innerText=user.uid;

const userRef=doc(db,"users",user.uid);
const snap=await getDoc(userRef);

if(!snap.exists()) return;

const data=snap.data();

document.getElementById("wallet").innerText=data.walletBalance||0;
document.getElementById("daily").innerText=data.dailyIncome||0;
document.getElementById("totalIncome").innerText=data.liveEarnings||0;
document.getElementById("teamReward").innerText=data.referralEarnings||0;

// 🔥 TEAM COUNT
const refCol=collection(db,"users",user.uid,"referrals");
const refSnap=await getDocs(refCol);
let teamSize = refSnap.size;

document.getElementById("teamCount").innerText=teamSize;

// 💎 LEVEL SYSTEM
let level = 0;
let points = (teamSize * 10) + (data.referralEarnings || 0);

if(teamSize >= 50 && data.referralEarnings >= 500){
  level = 4;
}
else if(teamSize >= 20 && data.referralEarnings >= 200){
  level = 3;
}
else if(teamSize >= 10 && data.referralEarnings >= 100){
  level = 2;
}
else if(teamSize >= 5){
  level = 1;
}
else{
  level = 0;
}

document.getElementById("level").innerText = level;
document.getElementById("points").innerText = points;

});

</script>

</body>
</html>
