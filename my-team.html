<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Team | SuperNFT</title>

<style>
body{margin:0;font-family:Arial;background:#0f0f0f;color:#FFD700;}
header{background:#1a1a1a;padding:15px;text-align:center;font-size:20px;font-weight:bold;}
.container{padding:15px;}
.card{background:#1a1a1a;padding:15px;border-radius:12px;margin-bottom:15px;}
.member{background:#111;padding:8px;margin-bottom:8px;border-radius:8px;font-size:13px;}
.member span{display:block;color:#aaa;font-size:12px;}
button{background:#FFD700;border:none;padding:8px 12px;border-radius:6px;font-weight:bold;cursor:pointer;margin-top:10px;}
.section-title{font-weight:bold;margin-bottom:10px;}
</style>
</head>

<body>

<header>👥 My Team</header>

<div class="container">

<div class="card">
<div class="section-title">Level 1 Members (20%)</div>
<div id="l1List"></div>
<button onclick="loadMore('l1')">Load More</button>
</div>

<div class="card">
<div class="section-title">Level 2 Members (15%)</div>
<div id="l2List"></div>
<button onclick="loadMore('l2')">Load More</button>
</div>

<div class="card">
<div class="section-title">Level 3 Members (10%)</div>
<div id="l3List"></div>
<button onclick="loadMore('l3')">Load More</button>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, query, where, getDocs, limit, startAfter } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
authDomain:"supernft-5b952.firebaseapp.com",
projectId:"supernft-5b952"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

let currentUser;
let lastDoc = { l1:null, l2:null, l3:null };

onAuthStateChanged(auth, async(user)=>{

if(!user){
  window.location.href="login.html";
  return;
}

currentUser=user;

await loadLevel1();

});

/* ================= LEVEL 1 ================= */

async function loadLevel1(){

let q;

if(!lastDoc.l1){
  q=query(
    collection(db,"users"),
    where("referredByUid","==",currentUser.uid),
    limit(10)
  );
}else{
  q=query(
    collection(db,"users"),
    where("referredByUid","==",currentUser.uid),
    startAfter(lastDoc.l1),
    limit(10)
  );
}

const snap=await getDocs(q);

if(snap.empty) return;

lastDoc.l1=snap.docs[snap.docs.length-1];

snap.forEach(doc=>{
  const d=doc.data();
  document.getElementById("l1List").innerHTML+=`
  <div class="member">
    ${d.name || "No Name"}
    <span>${d.email}</span>
  </div>`;
});

}

/* ================= LEVEL 2 ================= */

async function loadLevel2(){

if(!lastDoc.l2){
  document.getElementById("l2List").innerHTML="";
}

const l1Query=query(
  collection(db,"users"),
  where("referredByUid","==",currentUser.uid)
);

const l1Snap=await getDocs(l1Query);

let l1Ids=l1Snap.docs.map(d=>d.id);

let count=0;

for(const id of l1Ids){

  const q=query(
    collection(db,"users"),
    where("referredByUid","==",id),
    limit(10)
  );

  const snap=await getDocs(q);

  snap.forEach(doc=>{
    if(count<10){
      const d=doc.data();
      document.getElementById("l2List").innerHTML+=`
      <div class="member">
        ${d.name || "No Name"}
        <span>${d.email}</span>
      </div>`;
      count++;
    }
  });
}

}

/* ================= LEVEL 3 ================= */

async function loadLevel3(){

const l1Query=query(
  collection(db,"users"),
  where("referredByUid","==",currentUser.uid)
);

const l1Snap=await getDocs(l1Query);

let count=0;

for(const l1Doc of l1Snap.docs){

  const l2Query=query(
    collection(db,"users"),
    where("referredByUid","==",l1Doc.id)
  );

  const l2Snap=await getDocs(l2Query);

  for(const l2Doc of l2Snap.docs){

    const l3Query=query(
      collection(db,"users"),
      where("referredByUid","==",l2Doc.id),
      limit(10)
    );

    const l3Snap=await getDocs(l3Query);

    l3Snap.forEach(doc=>{
      if(count<10){
        const d=doc.data();
        document.getElementById("l3List").innerHTML+=`
        <div class="member">
          ${d.name || "No Name"}
          <span>${d.email}</span>
        </div>`;
        count++;
      }
    });

  }
}

}

/* LOAD MORE BUTTON */

window.loadMore = function(level){

if(level==="l1") loadLevel1();
if(level==="l2") loadLevel2();
if(level==="l3") loadLevel3();

};

</script>

</body>
</html>
