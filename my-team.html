<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Team | SuperNFT</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f0f0f;
  color:#FFD700;
}

header{
  background:#1a1a1a;
  padding:15px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
}

.container{
  padding:15px;
}

.card{
  background:#1a1a1a;
  padding:15px;
  border-radius:12px;
  margin-bottom:15px;
}

.row{
  display:flex;
  justify-content:space-between;
  margin-top:8px;
  font-size:14px;
}

.big{
  font-size:18px;
  font-weight:bold;
  text-align:right;
}
</style>
</head>

<body>

<header>👥 My Team</header>

<div class="container">

<!-- USER INFO -->
<div class="card">
<div id="userName" style="font-size:18px;font-weight:bold;">Loading...</div>
<div style="font-size:12px;margin-top:5px;">
UID: <span id="uid">---</span>
</div>
</div>

<!-- LEVEL STRUCTURE -->
<div class="card">
<h3>Level Structure</h3>

<div class="row">
<div>L1 (20%)</div>
<div id="l1">0</div>
</div>

<div class="row">
<div>L2 (15%)</div>
<div id="l2">0</div>
</div>

<div class="row">
<div>L3 (10%)</div>
<div id="l3">0</div>
</div>

</div>

<!-- LEVEL COMMISSION -->
<div class="card">
<h3>Level Wise Commission Earned</h3>

<div class="row">
<div>L1 Earned</div>
<div>$<span id="l1Earn">0.00</span></div>
</div>

<div class="row">
<div>L2 Earned</div>
<div>$<span id="l2Earn">0.00</span></div>
</div>

<div class="row">
<div>L3 Earned</div>
<div>$<span id="l3Earn">0.00</span></div>
</div>

</div>

<!-- TOTAL -->
<div class="card">
<h3>Total Referral Earnings</h3>
<div class="big">$<span id="totalEarn">0.00</span></div>
</div>

</div>

<script>

firebase.initializeApp({
apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
authDomain:"supernft-5b952.firebaseapp.com",
projectId:"supernft-5b952"
});

const auth = firebase.auth();
const db = firebase.firestore();

auth.onAuthStateChanged(async user=>{

if(!user){
location.href="login.html";
return;
}

document.getElementById("uid").innerText=user.uid;

const userDoc = await db.collection("users").doc(user.uid).get();
if(!userDoc.exists) return;

const data = userDoc.data();

document.getElementById("userName").innerText =
data.name || user.email;

/* ===== LEVEL STRUCTURE ===== */

let level1=[];
let level2=[];
let level3=[];

// Level 1
const l1Snap = await db.collection("users")
.where("referredByUid","==",user.uid).get();

level1 = l1Snap.docs;
document.getElementById("l1").innerText = level1.length;

// Level 2
for(const d1 of level1){
const l2Snap = await db.collection("users")
.where("referredByUid","==",d1.id).get();
level2.push(...l2Snap.docs);
}
document.getElementById("l2").innerText = level2.length;

// Level 3
for(const d2 of level2){
const l3Snap = await db.collection("users")
.where("referredByUid","==",d2.id).get();
level3.push(...l3Snap.docs);
}
document.getElementById("l3").innerText = level3.length;

/* ===== LEVEL COMMISSION ===== */

let l1Earn=0;
let l2Earn=0;
let l3Earn=0;

if(data.commissionHistory && data.commissionHistory.length>0){

data.commissionHistory.forEach(h=>{
if(Number(h.level)===1) l1Earn+=Number(h.amount||0);
if(Number(h.level)===2) l2Earn+=Number(h.amount||0);
if(Number(h.level)===3) l3Earn+=Number(h.amount||0);
});

}else{
l1Earn = Number(data.referralEarnings||0);
}

document.getElementById("l1Earn").innerText=l1Earn.toFixed(2);
document.getElementById("l2Earn").innerText=l2Earn.toFixed(2);
document.getElementById("l3Earn").innerText=l3Earn.toFixed(2);

document.getElementById("totalEarn").innerText=
Number(data.referralEarnings||0).toFixed(2);

});

</script>

</body>
</html>
