<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Deposit | SuperNFT</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f0f0f;
  color:#FFD700;
  padding:20px;
}
.card{
  background:#1a1a1a;
  padding:15px;
  border-radius:10px;
  margin-bottom:15px;
}
input{
  width:100%;
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:6px;
  background:#272727;
  color:#FFD700;
}
button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:6px;
  background:#FFD700;
  color:#000;
  font-weight:bold;
  cursor:pointer;
}
button:hover{background:#e0c200;}
</style>
</head>

<body>

<h2>💰 Deposit</h2>

<div class="card">
  <input type="number" id="depositAmount" placeholder="Enter Amount">
  <button onclick="makeDeposit()">Deposit Now</button>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { 
  getFirestore, 
  doc, 
  getDoc, 
  updateDoc 
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain:"supernft-5b952.firebaseapp.com",
  projectId:"supernft-5b952"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

let currentUser;

/* =============================
   LOGIN CHECK
============================= */
onAuthStateChanged(auth,(user)=>{
  if(!user){
    window.location.href="login.html";
    return;
  }
  currentUser=user;
});

/* =============================
   LEVEL 3 COMMISSION SYSTEM
============================= */
async function distributeCommission(userId, depositAmount){

  const percentages = {
    1: 0.20,
    2: 0.15,
    3: 0.10
  };

  let currentUid = userId;

  for(let level=1; level<=3; level++){

    const userSnap = await getDoc(doc(db,"users",currentUid));
    if(!userSnap.exists()) break;

    const parentUid = userSnap.data().referredByUid;
    if(!parentUid) break;

    const parentRef = doc(db,"users",parentUid);
    const parentSnap = await getDoc(parentRef);
    if(!parentSnap.exists()) break;

    const parentData = parentSnap.data();

    const commission = depositAmount * percentages[level];

    const newHistory = parentData.commissionHistory || [];

    newHistory.push({
      level: level,
      amount: commission,
      depositAmount: depositAmount,
      from: userId,
      createdAt: new Date()
    });

    await updateDoc(parentRef,{
      walletBalance: (parentData.walletBalance || 0) + commission,
      referralEarnings: (parentData.referralEarnings || 0) + commission,
      commissionHistory: newHistory
    });

    currentUid = parentUid;
  }
}

/* =============================
   DEPOSIT FUNCTION
============================= */

window.makeDeposit = async function(){

  const amount = Number(document.getElementById("depositAmount").value);

  if(!amount || amount<=0){
    alert("Enter valid amount");
    return;
  }

  const userRef = doc(db,"users",currentUser.uid);
  const snap = await getDoc(userRef);

  if(!snap.exists()){
    alert("User not found");
    return;
  }

  const data = snap.data();

  const updatedDeposit = (data.totalDeposit || 0) + amount;
  const updatedWallet = (data.walletBalance || 0) + amount;

  await updateDoc(userRef,{
    totalDeposit: updatedDeposit,
    walletBalance: updatedWallet
  });

  await distributeCommission(currentUser.uid, amount);

  alert("Deposit successful & MLM commission distributed!");

  location.reload();
}

</script>

</body>
</html>
