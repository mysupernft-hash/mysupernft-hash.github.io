<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SuperNFT Advanced Wallet</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#0f0f0f;
  color:#FFD700;
}

header{
  background:#1a1a1a;
  padding:15px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
}

.container{
  padding:15px;
}

.card{
  background:#1a1a1a;
  padding:15px;
  border-radius:12px;
  margin-bottom:15px;
}

.balance{
  font-size:28px;
  font-weight:bold;
}

.row{
  display:flex;
  justify-content:space-between;
  margin-top:8px;
  font-size:14px;
}

.grid-2{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.small{
  background:#111;
  padding:12px;
  border-radius:10px;
  text-align:center;
}

.small span{
  display:block;
  font-size:18px;
  margin-top:5px;
  font-weight:bold;
}

button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

.primary{
  background:#FFD700;
  color:#000;
}

.secondary{
  background:#272727;
  color:#FFD700;
}

.progress{
  background:#111;
  height:10px;
  border-radius:10px;
  margin-top:10px;
  overflow:hidden;
}

.progress-bar{
  height:100%;
  background:#FFD700;
  width:0%;
}

.transaction{
  font-size:13px;
  border-bottom:1px solid #222;
  padding:6px 0;
}
</style>
</head>
<body>

<header>💳 SuperNFT Wallet</header>

<div class="container">

<div class="card">
  <div>Wallet Balance</div>
  <div class="balance">$<span id="balance">0</span></div>
  <div style="font-size:13px;margin-top:5px;">
    ⚡ Live Earnings: $<span id="liveEarnings">0.000000</span>
  </div>
</div>

<div class="card">
  <div class="grid-2">
    <div class="small">Total Deposit<span id="deposit">0</span></div>
    <div class="small">Total Withdraw<span id="withdraw">0</span></div>
    <div class="small">NFT Income<span id="nftIncome">0</span></div>
    <div class="small">Referral Earnings<span id="referral">0</span></div>
    <div class="small">Team Commission<span id="team">0</span></div>
    <div class="small">Total Income<span id="totalIncome">0</span></div>
  </div>
</div>

<div class="card">
  <div>🏆 VIP Level: <span id="vipLevel">0</span></div>
  <div>💰 Commission: <span id="vipPercent">5</span>%</div>
  <div class="progress">
    <div class="progress-bar" id="vipProgress"></div>
  </div>
  <div style="font-size:12px;margin-top:5px;">
    Next Level Progress: <span id="vipText">0%</span>
  </div>
</div>

<div class="card">
  <canvas id="earnChart"></canvas>
</div>

<div class="card">
  <div style="font-weight:bold;margin-bottom:10px;">📜 Transaction History</div>
  <div id="transactions"></div>
</div>

<div class="card">
  <button class="primary" onclick="deposit()">Deposit</button>
  <button class="secondary" onclick="withdrawRequest()">Withdraw</button>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, doc, onSnapshot,
  collection, getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain:"supernft-5b952.firebaseapp.com",
  projectId:"supernft-5b952"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

let liveInterval;

onAuthStateChanged(auth, (user)=>{
  if(!user){ location.href="login.html"; return; }

  const userRef = doc(db,"users",user.uid);

  // 🔥 REALTIME LISTENER
  onSnapshot(userRef,(snap)=>{
    if(!snap.exists()) return;

    const data = snap.data();

    document.getElementById("balance").innerText =
      (data.walletBalance || 0).toFixed(2);

    document.getElementById("deposit").innerText =
      (data.totalDeposit || 0);

    document.getElementById("withdraw").innerText =
      (data.totalWithdraw || 0);

    document.getElementById("nftIncome").innerText =
      (data.dailyIncome || 0);

    document.getElementById("referral").innerText =
      (data.referralEarnings || 0);

    document.getElementById("team").innerText =
      (data.teamCommission || 0);

    document.getElementById("totalIncome").innerText =
      (data.totalIncome || 0);

    document.getElementById("vipLevel").innerText =
      (data.vipLevel || 0);

    let progress = data.vipProgress || 0;
    document.getElementById("vipProgress").style.width = progress+"%";
    document.getElementById("vipText").innerText = progress+"%";

    startLiveMining(data);
  });

  loadTransactions(user.uid);
  loadChart();
});

function startLiveMining(data){

  if(liveInterval) clearInterval(liveInterval);

  let live = data.liveEarnings || 0;
  let rate = (data.dailyIncome || 0)/86400;

  document.getElementById("liveEarnings")
    .innerText = live.toFixed(6);

  liveInterval = setInterval(()=>{
    live += rate;
    document.getElementById("liveEarnings")
      .innerText = live.toFixed(6);
  },1000);
}

async function loadTransactions(uid){
  const snap = await getDocs(collection(db,"users",uid,"transactions"));
  const box = document.getElementById("transactions");
  box.innerHTML="";
  snap.forEach(doc=>{
    const d = doc.data();
    box.innerHTML += `
      <div class="transaction">
        ${d.type} - $${d.amount}
      </div>`;
  });
}

function loadChart(){
  new Chart(document.getElementById("earnChart"),{
    type:"line",
    data:{
      labels:["Mon","Tue","Wed","Thu","Fri","Sat","Sun"],
      datasets:[{
        label:"7 Day Earnings",
        data:[5,8,6,10,12,9,15],
        borderColor:"#FFD700",
        fill:false
      }]
    }
  });
}

window.deposit = function(){
  window.location.href = "deposit.html";
}

window.withdrawRequest = function(){
  window.location.href = "withdraw.html";
}

</script>
</body>
</html>
