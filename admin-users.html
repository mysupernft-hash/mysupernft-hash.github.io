<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin User Details</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0d0d0d;
  color:#FFD700;
  padding:15px;
}

h2{
  text-align:center;
  margin-bottom:20px;
}

.card{
  background:#111;
  padding:15px;
  border-radius:10px;
  margin-bottom:15px;
}

.row{
  display:flex;
  justify-content:space-between;
  margin-bottom:10px;
  font-size:14px;
  flex-wrap:wrap;
}

input{
  padding:5px;
  width:120px;
}

button{
  padding:8px 12px;
  border:none;
  font-weight:bold;
  cursor:pointer;
  border-radius:6px;
  margin-top:10px;
}

.primary{
  background:#FFD700;
  color:#000;
}

.danger{
  background:#ff4444;
  color:white;
}

.back{
  background:#333;
  color:#FFD700;
}
</style>
</head>

<body>

<h2>👤 User Details</h2>

<div id="content">Loading...</div>

<script>

firebase.initializeApp({
  apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain:"supernft-5b952.firebaseapp.com",
  projectId:"supernft-5b952"
});

const auth = firebase.auth();
const db   = firebase.firestore();

const params = new URLSearchParams(window.location.search);
const uid = params.get("uid");

let userRef;

auth.onAuthStateChanged(async user => {

  if(!user){
    document.getElementById("content").innerHTML="❌ Not logged in";
    return;
  }

  if(!uid){
    document.getElementById("content").innerHTML="❌ No UID found in URL";
    return;
  }

  userRef = db.collection("users").doc(uid);
  const snap = await userRef.get();

  if(!snap.exists){
    document.getElementById("content").innerHTML="❌ User not found";
    return;
  }

  const u = snap.data();

  renderUser(u);
});


function renderUser(u){

  let html = `
  <div class="card">
    <div class="row"><b>Email</b><span>${u.email||""}</span></div>
    <div class="row"><b>UID</b><span>${uid}</span></div>
    <div class="row">
      <b>Wallet</b>
      <input id="wallet" value="${u.walletBalance||0}">
    </div>
    <div class="row">
      <b>Daily Income</b>
      <input id="daily" value="${u.dailyIncome||0}">
    </div>
    <div class="row">
      <b>Live Earnings</b>
      <input id="live" value="${u.liveEarnings||0}">
    </div>
    <div class="row">
      <b>Referral</b>
      <input id="ref" value="${u.referralEarnings||0}">
    </div>
    <div class="row">
      <b>Total Deposit</b>
      <input id="deposit" value="${u.totalDeposit||0}">
    </div>
    <div class="row">
      <b>Total Withdraw</b>
      <input id="withdraw" value="${u.totalWithdraw||0}">
    </div>
    <div class="row">
      <b>Level</b>
      <input id="level" value="${u.level||0}">
    </div>
    <div class="row">
      <b>Banned</b>
      <input type="checkbox" id="banned" ${u.banned?"checked":""}>
    </div>

    <button class="primary" onclick="saveUser()">💾 Save Changes</button>
    <button class="danger" onclick="deleteUser()">🗑 Delete User</button>
    <button class="back" onclick="back()">⬅ Back</button>
  </div>
  `;

  document.getElementById("content").innerHTML = html;
}


async function saveUser(){

  await userRef.update({
    walletBalance:Number(document.getElementById("wallet").value),
    dailyIncome:Number(document.getElementById("daily").value),
    liveEarnings:Number(document.getElementById("live").value),
    referralEarnings:Number(document.getElementById("ref").value),
    totalDeposit:Number(document.getElementById("deposit").value),
    totalWithdraw:Number(document.getElementById("withdraw").value),
    level:Number(document.getElementById("level").value),
    banned:document.getElementById("banned").checked
  });

  alert("✅ User Updated Successfully");
}


async function deleteUser(){

  if(!confirm("Are you sure you want to delete this user?")) return;

  await userRef.delete();

  alert("User Deleted");
  window.location.href="admin.html";
}


function back(){
  window.location.href="admin.html";
}

</script>

</body>
</html>
