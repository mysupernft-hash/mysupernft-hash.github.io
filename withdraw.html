<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultra Withdraw | SuperNFT</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f0f0f;
  color:#FFD700;
}
header{
  background:#1a1a1a;
  padding:15px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
}
.container{
  padding:20px;
}
.card{
  background:#1a1a1a;
  border-radius:12px;
  padding:20px;
  margin-bottom:15px;
}
.balance{
  font-size:28px;
  font-weight:bold;
}
input{
  width:100%;
  padding:12px;
  border:none;
  border-radius:8px;
  background:#272727;
  color:#FFD700;
  margin-top:10px;
}
button{
  width:100%;
  padding:12px;
  margin-top:12px;
  border:none;
  border-radius:8px;
  background:#FFD700;
  color:#000;
  font-weight:bold;
  cursor:pointer;
}
button:hover{
  background:#e6c200;
}
button.cancel{
  background:#ff4444;
  color:#fff;
}
.status{
  margin-top:12px;
  font-size:14px;
}
.history-card{
  background:#111;
  padding:12px;
  border-radius:10px;
  margin-top:10px;
}
.pending{color:orange}
.processing{color:#00ccff}
.approved{color:#00ff00}
.rejected{color:red}
.success-msg{
  margin-top:8px;
  color:#00ff00;
  font-size:13px;
}
.reject-msg{
  margin-top:8px;
  color:red;
  font-size:13px;
}
.modal{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.7);
  display:none;
  align-items:center;
  justify-content:center;
}
.modal-box{
  background:#1a1a1a;
  padding:20px;
  border-radius:12px;
  width:90%;
  max-width:350px;
}
</style>
</head>

<body>

<header>💸 Ultra Withdraw</header>

<div class="container">

<div class="card">
  <div>Available Balance</div>
  <div class="balance">$<span id="walletBalance">0.00</span></div>
</div>

<div class="card">
  <div>Withdraw Amount</div>
  <input type="number" id="amount" placeholder="Enter amount">

  <button onclick="openSummary()">Withdraw</button>
  <div class="status" id="status"></div>
</div>

<div class="card">
  <h3>Withdraw History</h3>
  <div id="history"></div>
</div>

<a href="dashboard.html" style="color:#FFD700;">⬅ Back</a>

</div>

<!-- SUMMARY MODAL -->
<div class="modal" id="summaryModal">
  <div class="modal-box">
    <h3>Confirm Withdraw</h3>
    <div id="summaryText"></div>

    <input type="password" id="pinInput" placeholder="Enter Withdraw PIN">

    <button onclick="confirmWithdraw()">Confirm</button>
    <button onclick="closeModal()" class="cancel">Cancel</button>
  </div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, doc, getDoc, updateDoc,
  collection, addDoc, serverTimestamp,
  onSnapshot, query, where, orderBy, deleteDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
  apiKey:"YOUR_API_KEY",
  authDomain:"supernft-5b952.firebaseapp.com",
  projectId:"supernft-5b952"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

let currentUser=null;
let walletAmount=0;
let hasPending=false;
let withdrawAmount=0;

/* AUTH */
onAuthStateChanged(auth, async(user)=>{
  if(!user){
    location.href="login.html";
    return;
  }

  currentUser=user;

  const userRef=doc(db,"users",user.uid);

  onSnapshot(userRef,(snap)=>{
    if(!snap.exists()) return;
    walletAmount=snap.data().walletBalance||0;
    document.getElementById("walletBalance").innerText=
      walletAmount.toFixed(2);
  });

  loadHistory();
});

/* OPEN SUMMARY */
window.openSummary=function(){

  const amount=Number(document.getElementById("amount").value);
  const status=document.getElementById("status");

  if(hasPending){
    status.innerText="You already have pending withdraw.";
    return;
  }

  if(!amount||amount<10){
    status.innerText="Minimum withdraw $10";
    return;
  }

  if(amount>walletAmount){
    status.innerText="Insufficient balance";
    return;
  }

  withdrawAmount=amount;

  document.getElementById("summaryText").innerHTML=`
    Amount: $${amount}<br>
    Fee: $0<br>
    You Receive: $${amount}
  `;

  document.getElementById("summaryModal").style.display="flex";
};

/* CLOSE MODAL */
window.closeModal=function(){
  document.getElementById("summaryModal").style.display="none";
};

/* CONFIRM WITHDRAW */
window.confirmWithdraw=async function(){

  const pin=document.getElementById("pinInput").value;

  const userRef=doc(db,"users",currentUser.uid);
  const snap=await getDoc(userRef);
  const data=snap.data();

  if(data.settings?.withdrawPIN !== pin){
    alert("Wrong PIN");
    return;
  }

  await addDoc(collection(db,"withdrawRequests"),{
    uid:currentUser.uid,
    email:currentUser.email,
    amount:withdrawAmount,
    status:"pending",
    createdAt:serverTimestamp()
  });

  document.getElementById("summaryModal").style.display="none";
  document.getElementById("amount").value="";
  document.getElementById("pinInput").value="";
};

/* LOAD HISTORY */
function loadHistory(){

  const q=query(
    collection(db,"withdrawRequests"),
    where("uid","==",currentUser.uid),
    orderBy("createdAt","desc")
  );

  onSnapshot(q,(snapshot)=>{

    let html="";
    hasPending=false;

    snapshot.forEach(doc=>{

      const w=doc.data();
      let statusClass=w.status;
      let message="";
      let cancelBtn="";

      if(w.status==="approved"){
        message=`<div class="success-msg">
        $${w.amount} received in your Binance wallet
        </div>`;
      }

      if(w.status==="rejected"){
        message=`<div class="reject-msg">
        ${w.reason||"Rejected by admin"}
        </div>`;
      }

      if(w.status==="pending"){
        hasPending=true;
        cancelBtn=`<button class="cancel"
        onclick="cancelWithdraw('${doc.id}')">
        Cancel</button>`;
      }

      html+=`
      <div class="history-card">
        <div>Amount: $${w.amount}</div>
        <div>Status:
          <span class="${statusClass}">
          ${w.status}
          </span>
        </div>
        ${message}
        ${cancelBtn}
      </div>
      `;
    });

    document.getElementById("history").innerHTML=
      html||"No withdraw history";

  });
}

/* CANCEL PENDING */
window.cancelWithdraw=async function(id){
  await deleteDoc(doc(db,"withdrawRequests",id));
};

</script>

</body>
</html>
