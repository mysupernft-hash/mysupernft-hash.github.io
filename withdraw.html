<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Withdraw | SuperNFT</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f0f0f;
  color:#FFD700;
}

header{
  background:#1a1a1a;
  padding:15px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
}

.container{
  padding:20px;
}

.card{
  background:#1a1a1a;
  border-radius:12px;
  padding:20px;
  margin-bottom:15px;
}

.balance{
  font-size:28px;
  font-weight:bold;
}

input{
  width:100%;
  padding:12px;
  border:none;
  border-radius:8px;
  background:#272727;
  color:#FFD700;
  margin-top:10px;
}

button{
  width:100%;
  padding:12px;
  margin-top:15px;
  border:none;
  border-radius:8px;
  background:#FFD700;
  color:#000;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#e6c200;
}

.status{
  margin-top:12px;
  font-size:14px;
}

.history-card{
  background:#111;
  padding:12px;
  border-radius:10px;
  margin-top:10px;
  border-left:4px solid #FFD700;
}

.success{
  color:#00ff00;
  font-weight:bold;
}

.back{
  display:block;
  text-align:center;
  margin-top:20px;
  padding:10px;
  background:#272727;
  border-radius:8px;
  text-decoration:none;
  color:#FFD700;
}
</style>
</head>

<body>

<header>💸 Withdraw</header>

<div class="container">

<div class="card">
  <div>Available Balance</div>
  <div class="balance">$<span id="walletBalance">0.00</span></div>
</div>

<div class="card">
  <div>Withdraw Amount</div>
  <input type="number" id="amount" placeholder="Enter amount">
  <button onclick="withdraw()">Request Withdraw</button>
  <div class="status" id="status"></div>
</div>

<div class="card">
  <h3>📜 History</h3>
  <div id="history">Loading...</div>
</div>

<a href="dashboard.html" class="back">⬅ Back to Dashboard</a>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore,
  doc,
  updateDoc,
  collection,
  addDoc,
  serverTimestamp,
  onSnapshot,
  query,
  orderBy
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain:"supernft-5b952.firebaseapp.com",
  projectId:"supernft-5b952"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

let currentUser=null;
let walletAmount=0;

/* ================= AUTH ================= */

onAuthStateChanged(auth,(user)=>{
  if(!user){
    window.location.replace("login.html");
    return;
  }

  currentUser=user;

  const userRef=doc(db,"users",user.uid);

  // 🔥 Realtime wallet sync
  onSnapshot(userRef,(snap)=>{
    if(!snap.exists()) return;
    walletAmount=snap.data().walletBalance||0;
    document.getElementById("walletBalance").innerText=
      walletAmount.toFixed(2);
  });

  loadHistory();
});

/* ================= WITHDRAW ================= */

window.withdraw=async function(){

  const status=document.getElementById("status");
  const amount=Number(document.getElementById("amount").value);

  if(!amount || amount<=0){
    status.innerText="Enter valid amount";
    return;
  }

  if(amount<10){
    status.innerText="Minimum withdraw is $10";
    return;
  }

  if(amount>walletAmount){
    status.innerText="Insufficient balance";
    return;
  }

  status.innerText="Processing...";

  try{

    const userRef=doc(db,"users",currentUser.uid);

    // 1️⃣ Deduct wallet instantly
    await updateDoc(userRef,{
      walletBalance: walletAmount - amount
    });

    // 2️⃣ Create withdraw request
    await addDoc(collection(db,"withdrawRequests"),{
      uid:currentUser.uid,
      email:currentUser.email,
      amount:amount,
      status:"pending",
      createdAt:serverTimestamp()
    });

    status.innerText="✅ Withdraw Requested Successfully";
    status.style.color="#00ff00";
    document.getElementById("amount").value="";

  }catch(err){
    console.error(err);
    status.innerText="Something went wrong.";
    status.style.color="red";
  }
};

/* ================= HISTORY (REALTIME) ================= */

function loadHistory(){

  const userRef = db.collection("users").doc(currentUser.uid);

  userRef.onSnapshot((doc)=>{

    if(!doc.exists){
      document.getElementById("history").innerHTML = "No history found";
      return;
    }

    const data = doc.data();
    const history = data.history || [];

    let html = "";

    history.forEach(h=>{

      let time = "";

      if(h.createdAt){
        const date = new Date(h.createdAt);
        time = date.toLocaleString();
      }

      html += `
      <div class="history-card">
        <div><b>${h.title}</b></div>
        <div>${time}</div>
        <div>+${h.amount}$</div>
        <div class="approved">Success</div>
        <div class="success-msg">
          ${h.message || ""}
        </div>
      </div>
      `;
    });

    document.getElementById("history").innerHTML =
      html || "No history found";

  });
}

</script>

</body>
</html>
