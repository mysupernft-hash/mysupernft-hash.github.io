<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Withdraw | SuperNFT</title>
<style>
body{margin:0;font-family:Arial;background:#0f0f0f;color:#FFD700;}
.container{padding:20px;}
.card{background:#1a1a1a;border-radius:12px;padding:20px;margin-bottom:15px;}
.history-card{background:#111;padding:12px;border-radius:10px;margin-top:10px;border-left:4px solid #FFD700;}
.success{color:#00ff00;font-weight:bold;}
.error{color:red;font-weight:bold;}
button{padding:10px;margin-top:10px;background:#FFD700;border:none;}
input{padding:10px;width:100%;margin-top:10px;background:#272727;color:#FFD700;border:none;}
</style>
</head>
<body>

<div class="container">

<div class="card">
<h3>Withdraw Amount</h3>
<input type="number" id="amount" placeholder="Enter amount">
<button id="withdrawBtn">Request Withdraw</button>
<div id="status"></div>
</div>

<div class="card">
<h3>📜 History</h3>
<div id="history">Loading...</div>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, updateDoc, collection, addDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain:"supernft-5b952.firebaseapp.com",
  projectId:"supernft-5b952"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

let currentUser=null;
let walletBalance=0;

const historyEl=document.getElementById("history");
const statusEl=document.getElementById("status");

onAuthStateChanged(auth,(user)=>{
  if(!user){
    window.location="login.html";
    return;
  }

  currentUser=user;

  // Get wallet balance
  onSnapshot(doc(db,"users",user.uid),(snap)=>{
    if(snap.exists()){
      walletBalance=snap.data().walletBalance || 0;
    }
  });

  loadHistory(user.uid);
});

/* ================= WITHDRAW ================= */

document.getElementById("withdrawBtn").addEventListener("click",async()=>{

  const amount=Number(document.getElementById("amount").value);

  if(!amount || amount<=0){
    statusEl.innerHTML="<span class='error'>Enter valid amount</span>";
    return;
  }

  if(amount>walletBalance){
    statusEl.innerHTML="<span class='error'>Insufficient balance</span>";
    return;
  }

  try{

    // Deduct wallet
    await updateDoc(doc(db,"users",currentUser.uid),{
      walletBalance: walletBalance-amount
    });

    // Create subcollection request
    await addDoc(
      collection(db,"users",currentUser.uid,"withdrawRequests"),
      {
        requestedAmount:amount,
        approvedAmount:0,
        status:"pending",
        createdAt:serverTimestamp()
      }
    );

    statusEl.innerHTML="<span class='success'>Withdraw request sent</span>";

  }catch(err){
    console.error(err);
    statusEl.innerHTML="<span class='error'>Permission or path error</span>";
  }

});

/* ================= HISTORY ================= */

function loadHistory(uid){

  const withdrawRef=collection(db,"users",uid,"withdrawRequests");

  onSnapshot(withdrawRef,(snapshot)=>{

    if(snapshot.empty){
      historyEl.innerHTML="No withdraw history";
      return;
    }

    let html="";

    snapshot.forEach(docSnap=>{
      const d=docSnap.data();

      let msg="Pending";
      let color="#FFD700";
      let amount=d.requestedAmount;

      if(d.status==="approved"){
        msg="Money received in your Binance wallet";
        color="#00ff00";
        amount=d.approvedAmount;
      }

      if(d.status==="rejected"){
        msg="Rejected";
        color="red";
      }

      html+=`
      <div class="history-card">
        <div><b>$${amount}</b></div>
        <div style="color:${color};font-weight:bold;">${msg}</div>
      </div>
      `;
    });

    historyEl.innerHTML=html;

  },(error)=>{
    console.error("History Error:",error);
    historyEl.innerHTML="<span class='error'>Permission denied</span>";
  });

}

</script>

</body>
</html>
