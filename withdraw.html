<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💸 Withdraw | SuperNFT</title>

<style>
body{margin:0;font-family:Arial;background:#0f0f0f;color:#FFD700;}
header{background:#1a1a1a;padding:15px;text-align:center;font-size:20px;font-weight:bold;}
.container{padding:20px;}
.card{background:#1a1a1a;border-radius:12px;padding:20px;margin-bottom:15px;}
.balance{font-size:28px;font-weight:bold;}
input{width:100%;padding:12px;border:none;border-radius:8px;background:#272727;color:#FFD700;margin-top:10px;}
button{width:100%;padding:12px;margin-top:15px;border:none;border-radius:8px;background:#FFD700;color:#000;font-weight:bold;cursor:pointer;}
button:hover{background:#e6c200;}
.status{margin-top:12px;font-size:14px;}
.history-card{background:#111;padding:12px;border-radius:10px;margin-top:10px;}
.pending{color:orange;}
.approved{color:#00ff00;}
.rejected{color:red;}
.success-msg{margin-top:8px;color:#00ff00;font-size:13px;}
.back{display:block;text-align:center;margin-top:20px;padding:10px;background:#272727;border-radius:8px;text-decoration:none;color:#FFD700;}
</style>
</head>
<body>

<header>💸 Withdraw</header>

<div class="container">

  <!-- AVAILABLE BALANCE -->
  <div class="card">
    <div>Available Balance</div>
    <div class="balance">$<span id="walletBalance">0.00</span></div>
  </div>

  <!-- WITHDRAW FORM -->
  <div class="card">
    <div>Withdraw Amount</div>
    <input type="number" id="amount" placeholder="Enter amount">

    <button id="withdrawBtn" onclick="withdraw()">Request Withdraw</button>
    <div class="status" id="status"></div>
  </div>

  <!-- WITHDRAW HISTORY -->
  <div class="card">
    <h3>Withdraw History</h3>
    <div id="history">Loading...</div>
  </div>

  <a href="dashboard.html" class="back">⬅ Back to Dashboard</a>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, doc, onSnapshot,
  collection, addDoc, serverTimestamp,
  query, where, orderBy
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain:"supernft-5b952.firebaseapp.com",
  projectId:"supernft-5b952"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
let walletAmount = 0;

// 👤 AUTH + REALTIME WALLET
onAuthStateChanged(auth, (user) => {
  if(!user){
    window.location.replace("login.html");
    return;
  }

  currentUser = user;

  const userRef = doc(db, "users", user.uid);
  onSnapshot(userRef, (snap) => {
    if(!snap.exists()) return;

    const data = snap.data();
    walletAmount = data.walletBalance || 0;

    document.getElementById("walletBalance").innerText =
      walletAmount.toFixed(2);
  });

  loadHistory();
});

// 💸 WITHDRAW REQUEST
window.withdraw = async function(){
  const amount = Number(document.getElementById("amount").value);
  const statusEl = document.getElementById("status");
  const btn = document.getElementById("withdrawBtn");

  statusEl.innerText = "";

  if(!amount || amount <= 0){
    statusEl.innerText = "Enter valid amount";
    return;
  }

  if(amount < 10){
    statusEl.innerText = "Minimum withdraw is $10";
    return;
  }

  if(amount > walletAmount){
    statusEl.innerText = "Insufficient balance";
    return;
  }

  btn.disabled = true;
  statusEl.innerText = "Submitting request...";

  try {
    await addDoc(collection(db,"withdrawRequests"), {
      uid: currentUser.uid,
      email: currentUser.email,
      amount: amount,
      status: "pending",
      createdAt: serverTimestamp()
    });

    statusEl.innerText = "✅ Withdraw request submitted (Waiting for Admin)";
    document.getElementById("amount").value = "";
  } catch(err) {
    statusEl.innerText = "❌ Withdraw failed.";
  }

  btn.disabled = false;
};

// 📜 REALTIME WITHDRAW HISTORY
function loadHistory(){
  const q = query(
    collection(db, "withdrawRequests"),
    where("uid","==",currentUser.uid),
    orderBy("createdAt","desc")
  );

  onSnapshot(q, (snapshot) => {

    if(snapshot.empty){
      document.getElementById("history").innerHTML=
        "No withdraw history found";
      return;
    }

    let html = "";

    snapshot.forEach(doc => {
      const w = doc.data();

      let statusClass = "";
      let msg = "";
      let time = "";

      if(w.createdAt?.seconds){
        const d = new Date(w.createdAt.seconds * 1000);
        time = d.toLocaleString();
      }

      if(w.status==="approved"){
        statusClass = "approved";
        msg = `<div class="success-msg">
          ✅ $${w.amount} received in your Binance wallet (${time})
        </div>`;
      }
      if(w.status==="pending") statusClass="pending";
      if(w.status==="rejected") statusClass="rejected";

      html += `
      <div class="history-card">
        <div><b>Amount:</b> $${w.amount}</div>
        <div><b>Date:</b> ${time}</div>
        <div><b>Status:</b> <span class="${statusClass}">${w.status}</span></div>
        ${msg}
      </div>
      `;
    });

    document.getElementById("history").innerHTML = html;
  });

}

</script>
</body>
</html>
