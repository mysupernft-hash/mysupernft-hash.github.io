<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Withdraw | SuperNFT</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f0f0f;
  color:#FFD700;
  padding:20px;
}
.card{
  background:#1a1a1a;
  padding:15px;
  border-radius:10px;
  margin-bottom:15px;
}
input{
  width:100%;
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:6px;
  background:#272727;
  color:#FFD700;
}
button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:6px;
  background:#FFD700;
  color:#000;
  font-weight:bold;
  cursor:pointer;
}
#msg{
  margin-top:10px;
  font-weight:bold;
}
.status-approved{color:#00ff00;font-weight:bold;}
.status-pending{color:orange;font-weight:bold;}
.status-rejected{color:red;font-weight:bold;}
</style>
</head>

<body>

<h2>💸 Withdraw</h2>

<div class="card">
<h3>Request Withdraw</h3>
<input type="number" id="amount" placeholder="Enter Amount (Min $10)">
<button onclick="requestWithdraw()">Submit Request</button>
<div id="msg"></div>
</div>

<div class="card">
<h3>📜 History</h3>
<div id="history">Loading...</div>
</div>

<script>

firebase.initializeApp({
  apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain:"supernft-5b952.firebaseapp.com",
  projectId:"supernft-5b952"
});

const auth = firebase.auth();
const db = firebase.firestore();

let currentUser;

/* 🔐 LOGIN REQUIRED */
auth.onAuthStateChanged(user=>{
  if(!user){
    alert("Login required");
    window.location.href="login.html";
    return;
  }
  currentUser = user;
  loadHistory();
});

/* 💰 REQUEST WITH BALANCE CHECK */
function requestWithdraw(){

  const amountInput = document.getElementById("amount");
  const msgBox = document.getElementById("msg");
  const amount = Number(amountInput.value);

  msgBox.innerText = "";
  msgBox.style.color = "red";

  if(!amount || amount <= 0){
    msgBox.innerText = "Enter valid amount";
    return;
  }

  db.collection("users").doc(currentUser.uid).get().then(doc=>{

    if(!doc.exists){
      msgBox.innerText = "User data not found";
      return;
    }

    const data = doc.data();
    const walletBalance = Number(data.walletBalance || 0);

    // 🔥 MAIN BALANCE CHECK
    if(amount > walletBalance){
      msgBox.innerText = "❌ Insufficient Balance";
      return;
    }

    let withdrawHistory = data.withdrawHistory || [];

    withdrawHistory.push({
      requestedAmount: amount,
      approvedAmount: 0,
      status: "pending",
      message: "",
      createdAt: new Date().toISOString()
    });

    db.collection("users").doc(currentUser.uid).update({
      withdrawHistory: withdrawHistory
    }).then(()=>{
      amountInput.value="";
      msgBox.style.color="lime";
      msgBox.innerText="✅ Withdraw request submitted";
    });

  }).catch(err=>{
    msgBox.innerText = "Error: " + err.message;
  });

}

/* 📜 LOAD HISTORY */
function loadHistory(){

  db.collection("users").doc(currentUser.uid).onSnapshot(doc=>{

    if(!doc.exists){
      document.getElementById("history").innerHTML="No data found.";
      return;
    }

    const data = doc.data();
    const withdrawHistory = data.withdrawHistory || [];

    if(withdrawHistory.length === 0){
      document.getElementById("history").innerHTML="No Withdraw History";
      return;
    }

    let html="";

    withdrawHistory.slice().reverse().forEach(w=>{

      let statusClass="";
      if(w.status==="approved") statusClass="status-approved";
      if(w.status==="pending") statusClass="status-pending";
      if(w.status==="rejected") statusClass="status-rejected";

      html+=`
      <div class="card">
        <div><b>Requested:</b> $${w.requestedAmount||0}</div>
        <div><b>Approved:</b> $${w.approvedAmount||0}</div>
        <div class="${statusClass}">Status: ${w.status}</div>
        <div>${w.message||""}</div>
      </div>
      `;
    });

    document.getElementById("history").innerHTML=html;

  });

}

</script>

</body>
</html>
