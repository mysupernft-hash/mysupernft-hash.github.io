<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Withdraw | SuperNFT</title>

<style>
body{margin:0;font-family:Arial;background:#0f0f0f;color:#FFD700;}
header{background:#1a1a1a;padding:15px;text-align:center;font-size:20px;font-weight:bold;}
.container{padding:20px;}
.card{background:#1a1a1a;border-radius:12px;padding:20px;margin-bottom:15px;}
.balance{font-size:28px;font-weight:bold;}
input{width:100%;padding:12px;border:none;border-radius:8px;background:#272727;color:#FFD700;margin-top:10px;}
button{width:100%;padding:12px;margin-top:15px;border:none;border-radius:8px;background:#FFD700;color:#000;font-weight:bold;cursor:pointer;}
.history-card{background:#111;padding:12px;border-radius:10px;margin-top:10px;border-left:4px solid #FFD700;}
.success{color:#00ff00;font-weight:bold;}
.error{color:red;font-weight:bold;}
</style>
</head>

<body>

<header>💸 Withdraw</header>

<div class="container">

<div class="card">
  <div>Available Balance</div>
  <div class="balance">$<span id="walletBalance">0.00</span></div>
</div>

<div class="card">
  <div>Withdraw Amount</div>
  <input type="number" id="amount" placeholder="Enter amount">
  <button id="withdrawBtn">Request Withdraw</button>
  <div id="status"></div>
</div>

<div class="card">
  <h3>📜 History</h3>
  <div id="history">Loading...</div>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, updateDoc, collection, addDoc, serverTimestamp, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain:"supernft-5b952.firebaseapp.com",
  projectId:"supernft-5b952"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

let currentUser=null;
let walletAmount=0;

const balanceEl=document.getElementById("walletBalance");
const historyEl=document.getElementById("history");
const statusEl=document.getElementById("status");
const withdrawBtn=document.getElementById("withdrawBtn");

onAuthStateChanged(auth,(user)=>{
  if(!user){
    window.location="login.html";
    return;
  }

  currentUser=user;

  const userRef=doc(db,"users",user.uid);

  onSnapshot(userRef,(snap)=>{
    if(!snap.exists()) return;
    walletAmount=snap.data().walletBalance||0;
    balanceEl.innerText=walletAmount.toFixed(2);
  });

  loadHistory(user.uid);
});

/* ================= WITHDRAW ================= */

withdrawBtn.addEventListener("click",async()=>{

  const amount=Number(document.getElementById("amount").value);

  if(!amount || amount<=0){
    statusEl.innerHTML="<span class='error'>Enter valid amount</span>";
    return;
  }

  if(amount<10){
    statusEl.innerHTML="<span class='error'>Minimum withdraw is $10</span>";
    return;
  }

  if(amount>walletAmount){
    statusEl.innerHTML="<span class='error'>Insufficient balance</span>";
    return;
  }

  try{

    withdrawBtn.disabled=true;
    statusEl.innerText="Processing...";

    // Deduct wallet
    await updateDoc(doc(db,"users",currentUser.uid),{
      walletBalance: walletAmount-amount
    });

    // Create withdraw request (subcollection)
    await addDoc(
      collection(db,"users",currentUser.uid,"withdrawRequests"),
      {
        requestedAmount:amount,
        approvedAmount:0,
        status:"pending",
        createdAt:serverTimestamp()
      }
    );

    statusEl.innerHTML="<span class='success'>Withdraw request sent to admin</span>";
    document.getElementById("amount").value="";

  }catch(err){
    console.error("Withdraw Error:",err);
    statusEl.innerHTML="<span class='error'>Error occurred</span>";
  }

  withdrawBtn.disabled=false;
});

/* ================= HISTORY ================= */

function loadHistory(uid){

  const withdrawRef = collection(db,"users",uid,"withdrawRequests");

  onSnapshot(withdrawRef,
    (snapshot)=>{

      if(snapshot.empty){
        historyEl.innerHTML="No withdraw history";
        return;
      }

      let html="";

      snapshot.forEach(docSnap=>{
        const d=docSnap.data();

        let message="Pending";
        let color="#FFD700";
        let amount=d.requestedAmount || 0;

        if(d.status==="approved"){
          message="Money received in your Binance wallet";
          color="#00ff00";
          amount=d.approvedAmount || d.requestedAmount;
        }

        if(d.status==="rejected"){
          message="Rejected";
          color="red";
        }

        html+=`
        <div class="history-card">
          <div><b>$${amount}</b></div>
          <div style="color:${color};font-weight:bold;">${message}</div>
        </div>
        `;
      });

      historyEl.innerHTML=html;

    },
    (error)=>{
      console.error("History Error:",error);
      historyEl.innerHTML="Error loading history";
    }
  );
}

</script>

</body>
</html>
