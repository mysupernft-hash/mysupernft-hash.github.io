<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Withdraw History | SuperNFT</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f0f0f;
  color:#FFD700;
  padding:20px;
}
.card{
  background:#1a1a1a;
  padding:15px;
  border-radius:10px;
  margin-bottom:10px;
}
.status-approved{color:#00ff00;font-weight:bold;}
.status-pending{color:orange;font-weight:bold;}
.status-rejected{color:red;font-weight:bold;}
</style>
</head>

<body>

<h2>💸 Withdraw History</h2>

<div id="history"></div>

<script>

firebase.initializeApp({
apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
authDomain:"supernft-5b952.firebaseapp.com",
projectId:"supernft-5b952"
});

const auth = firebase.auth();
const db = firebase.firestore();

auth.onAuthStateChanged(user=>{

if(!user){
document.getElementById("history").innerHTML="Please login first.";
return;
}

db.collection("users").doc(user.uid).onSnapshot(doc=>{

if(!doc.exists){
document.getElementById("history").innerHTML="No data found.";
return;
}

const data = doc.data();
const withdrawHistory = data.withdrawHistory || [];

if(withdrawHistory.length === 0){
document.getElementById("history").innerHTML="No Withdraw History";
return;
}

let html="";

// Latest first
withdrawHistory.slice().reverse().forEach(w=>{

let statusClass="";
if(w.status==="approved") statusClass="status-approved";
if(w.status==="pending") statusClass="status-pending";
if(w.status==="rejected") statusClass="status-rejected";

html+=`
<div class="card">
<div><b>Requested:</b> $${w.requestedAmount||0}</div>
<div><b>Approved:</b> $${w.approvedAmount||0}</div>
<div class="${statusClass}">
Status: ${w.status||"pending"}
</div>
<div>${w.message||""}</div>
</div>
`;

});

document.getElementById("history").innerHTML=html;

});

});

</script>

</body>
</html>
