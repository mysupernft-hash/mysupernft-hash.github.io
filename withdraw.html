<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Withdraw | SuperNFT</title>

<style>
body{margin:0;font-family:Arial;background:#0f0f0f;color:#FFD700;}
header{background:#1a1a1a;padding:15px;text-align:center;font-size:20px;font-weight:bold;}
.container{padding:20px;}
.card{background:#1a1a1a;border-radius:12px;padding:20px;margin-bottom:15px;}
.balance{font-size:28px;font-weight:bold;}
input{width:100%;padding:12px;border:none;border-radius:8px;background:#272727;color:#FFD700;margin-top:10px;}
button{width:100%;padding:12px;margin-top:15px;border:none;border-radius:8px;background:#FFD700;color:#000;font-weight:bold;cursor:pointer;}
.history-card{background:#111;padding:12px;border-radius:10px;margin-top:10px;border-left:4px solid #FFD700;}
.success{color:#00ff00;font-weight:bold;}
</style>
</head>
<body>

<header>💸 Withdraw</header>

<div class="container">

<div class="card">
  <div>Available Balance</div>
  <div class="balance">$<span id="walletBalance">0.00</span></div>
</div>

<div class="card">
  <div>Withdraw Amount</div>
  <input type="number" id="amount" placeholder="Enter amount">
  <button onclick="withdraw()">Request Withdraw</button>
  <div id="status"></div>
</div>

<div class="card">
  <h3>📜 History</h3>
  <div id="history">Loading...</div>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, updateDoc, collection, addDoc, serverTimestamp, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain:"supernft-5b952.firebaseapp.com",
  projectId:"supernft-5b952"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

let currentUser=null;
let walletAmount=0;

onAuthStateChanged(auth,(user)=>{
  if(!user){
    window.location="login.html";
    return;
  }

  currentUser=user;

  const userRef=doc(db,"users",user.uid);

  onSnapshot(userRef,(snap)=>{
    walletAmount=snap.data().walletBalance||0;
    document.getElementById("walletBalance").innerText=walletAmount.toFixed(2);
  });

  loadHistory(user.uid);
});

window.withdraw=async function(){

  const amount=Number(document.getElementById("amount").value);
  const status=document.getElementById("status");

  if(amount<10){
    status.innerText="Minimum withdraw is $10";
    return;
  }

  if(amount>walletAmount){
    status.innerText="Insufficient balance";
    return;
  }

  try{

    await updateDoc(doc(db,"users",currentUser.uid),{
      walletBalance: walletAmount-amount
    });

    await addDoc(
      collection(db,"users",currentUser.uid,"withdrawRequests"),
      {
        requestedAmount:amount,
        approvedAmount:0,
        status:"pending",
        createdAt:serverTimestamp()
      }
    );

    status.innerText="Withdraw request sent to admin";

  }catch(err){
    console.error(err);
    status.innerText="Error occurred";
  }
};

function loadHistory(uid){

  const q=query(
    collection(db,"users",uid,"withdrawRequests"),
    orderBy("createdAt","desc")
  );

  onSnapshot(q,(snapshot)=>{
    let html="";

    snapshot.forEach(docSnap=>{
      const d=docSnap.data();

      let message="Pending";
      let color="#FFD700";
      let amount=d.requestedAmount;

      if(d.status==="approved"){
        message="Money received in your Binance wallet";
        color="#00ff00";
        amount=d.approvedAmount;
      }

      if(d.status==="rejected"){
        message="Rejected";
        color="red";
      }

      html+=`
      <div class="history-card">
        <div><b>$${amount}</b></div>
        <div style="color:${color};font-weight:bold;">${message}</div>
      </div>
      `;
    });

    document.getElementById("history").innerHTML=html||"No history";

  });
}

</script>
</body>
</html>
