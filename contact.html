<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SuperNFT | Contact Us</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
background:#020617;
color:#e5e7eb;
font-family:Arial;
margin:0;
padding:20px;
}

h1{
color:#38bdf8;
text-align:center;
margin-bottom:20px;
}

.container{
max-width:500px;
margin:auto;
background:#0f172a;
padding:20px;
border-radius:12px;
box-shadow:0 0 20px rgba(0,0,0,0.6);
}

input,textarea,button{
width:100%;
padding:10px;
margin:8px 0;
border-radius:8px;
border:none;
font-size:14px;
}

input,textarea{
background:#020617;
color:white;
}

button{
background:#38bdf8;
color:#020617;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#0ea5e9;
}

.telegram-btn{
display:block;
text-align:center;
background:#229ED9;
color:white;
padding:12px;
border-radius:10px;
font-weight:bold;
text-decoration:none;
margin-top:12px;
}

.telegram-btn:hover{
background:#1d8ec4;
}

</style>
</head>

<body>

<div class="container">

<h1>Contact Us</h1>

<form id="contactForm">

<input type="text" name="name" placeholder="Your Name" required>

<input type="email" name="email" placeholder="Your Email" required>

<textarea name="message" rows="4" placeholder="Your Message" required></textarea>

<button type="submit">Send Message</button>

<p style="text-align:center;font-size:14px;color:#94a3b8;">
If the form does not work contact us at <b>mysuper.nft@protonmail.com</b>
</p>

</form>

<h3 style="text-align:center;margin-top:25px;">📲 SuperNFT Telegram Network</h3>

<a href="https://t.me/Supernftcrypto" target="_blank" class="telegram-btn">
📢 Join Official Channel
</a>

<a href="https://t.me/supernftofficialgroup" target="_blank" class="telegram-btn">
👥 Join Official Group
</a>

<a href="https://t.me/mysupernft" target="_blank" class="telegram-btn">
🛠 Contact Website Support
</a>

</div>

<script>

document.getElementById("contactForm").addEventListener("submit",function(e){

e.preventDefault();

const formData = new FormData(this);

fetch("https://formsubmit.co/ajax/mysuper.nft@protonmail.com",{
method:"POST",
body:formData
})
.then(response => response.json())
.then(data=>{
alert("✅ Message sent successfully!");
document.getElementById("contactForm").reset();
})
.catch(error=>{
alert("❌ Error sending message.");
});

});

</script>

</body>
</html>
