<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SuperNFT | Contact Us</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
background:#020617;
color:#e5e7eb;
font-family:Arial;
margin:0;
padding:20px;
}

h1{
color:#38bdf8;
text-align:center;
margin-bottom:20px;
}

.container{
max-width:500px;
margin:auto;
background:#0f172a;
padding:20px;
border-radius:12px;
box-shadow:0 0 20px rgba(0,0,0,0.6);
}

input,textarea,button{
width:100%;
padding:10px;
margin:8px 0;
border-radius:8px;
border:none;
font-size:14px;
}

input,textarea{
background:#020617;
color:white;
}

button{
background:#38bdf8;
color:#020617;
font-weight:bold;

button:hover{

.info{

font-size:14px;

color:white;

border-radius:10px;
font-weight:bold;
text-decoration:none;
margin-top:12px;
transition:0.3s;
}

.telegram-btn:hover{
background:#1d8ec4;
transform:scale(1.03);
}

</head>

<body>

<div class="container">
