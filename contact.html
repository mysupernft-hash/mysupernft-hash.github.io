<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SuperNFT | Contact Support</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
margin:0;
font-family:Arial;
background:#0f0f0f;
color:#FFD700;
padding:20px;
}

h1{
text-align:center;
color:#FFD700;
margin-bottom:20px;
}

.container{
max-width:500px;
margin:auto;
background:#1a1a1a;
padding:25px;
border-radius:12px;
box-shadow:0 0 20px #000;
}

input,textarea{
width:100%;
padding:12px;
margin:8px 0;
border-radius:8px;
border:none;
background:#0f0f0f;
color:#FFD700;
border:1px solid #272727;
}

textarea{
resize:none;
}

button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:8px;
background:#FFD700;
color:#000;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#e6c200;
}

p{
text-align:center;
font-size:14px;
color:#aaa;
margin-top:10px;
}

.telegram-btn{
display:block;
text-align:center;
background:#1a1a1a;
color:#FFD700;
padding:12px;
border-radius:10px;
font-weight:bold;
text-decoration:none;
margin-top:12px;
border:1px solid #FFD700;
transition:0.3s;
}

.telegram-btn:hover{
background:#FFD700;
color:#000;
box-shadow:0 0 10px #FFD700;
}

.section-title{
text-align:center;
margin-top:25px;
}

</style>
</head>

<body>

<div class="container">

<h1>Contact Support</h1>

<form id="contactForm">

<input type="text" name="name" placeholder="Your Name" required>

<input type="email" name="email" placeholder="Your Email" required>

<textarea name="message" rows="4" placeholder="Your Message" required></textarea>

<button type="submit">Send Message</button>

<p>If the form does not work contact us at <b>mysuper.nft@protonmail.com</b></p>

</form>

<h3 class="section-title">SuperNFT Telegram Network</h3>

<a href="https://t.me/Supernftcrypto" target="_blank" class="telegram-btn">
📢 Join Official Channel
</a>

<a href="https://t.me/supernftofficialgroup" target="_blank" class="telegram-btn">
👥 Join Official Group
</a>

<a href="https://t.me/mysupernft" target="_blank" class="telegram-btn">
🛠 Contact Website Support
</a>

</div>

<script>

document.getElementById("contactForm").addEventListener("submit",function(e){

e.preventDefault();

const formData = new FormData(this);

fetch("https://formsubmit.co/ajax/mysuper.nft@protonmail.com",{
method:"POST",
body:formData
})
.then(response => response.json())
.then(data=>{
alert("Message sent successfully!");
document.getElementById("contactForm").reset();
})
.catch(error=>{
alert("Error sending message");
});

});

</script>

</body>
</html>
