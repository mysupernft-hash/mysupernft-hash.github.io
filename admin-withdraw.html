<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Withdraw Panel</title>
<style>
body{background:#0f0f0f;color:#FFD700;font-family:Arial;padding:20px;}
.card{background:#1a1a1a;padding:15px;border-radius:10px;margin-bottom:10px;}
input{padding:8px;margin-top:8px;background:#272727;color:#FFD700;border:none;}
button{margin-top:8px;padding:8px;background:#FFD700;border:none;}
</style>
</head>
<body>

<h2>Withdraw Requests</h2>
<div id="requests"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collectionGroup, onSnapshot, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain:"supernft-5b952.firebaseapp.com",
  projectId:"supernft-5b952"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

onAuthStateChanged(auth,(user)=>{
  if(!user){
    window.location="login.html";
    return;
  }
  loadRequests();
});

function loadRequests(){

  const requestsDiv=document.getElementById("requests");

  const q=collectionGroup(db,"withdrawRequests");

  onSnapshot(q,(snapshot)=>{
    let html="";

    snapshot.forEach(docSnap=>{
      const d=docSnap.data();

      if(d.status==="pending"){

        html+=`
        <div class="card">
          <div>Requested: $${d.requestedAmount}</div>
          <input type="number" id="amt-${docSnap.id}" placeholder="Approved amount">
          <button onclick="approve('${docSnap.ref.path}','${docSnap.id}')">Approve</button>
          <button onclick="reject('${docSnap.ref.path}')">Reject</button>
        </div>
        `;
      }
    });

    requestsDiv.innerHTML=html;
  });
}

window.approve=async function(path,id){
  const amount=document.getElementById("amt-"+id).value;
  await updateDoc(doc(db,path),{
    status:"approved",
    approvedAmount:Number(amount)
  });
};

window.reject=async function(path){
  await updateDoc(doc(db,path),{
    status:"rejected"
  });
};

</script>
</body>
</html>
