<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SuperNFT Color Prediction Demo</title>

<style>
body{
  background:#000;
  color:#FFD700;
  font-family:Arial;
  text-align:center;
  margin:0;
}

h1{
  margin-top:30px;
}

.game-box{
  background:#111;
  margin:30px auto;
  padding:20px;
  width:90%;
  max-width:400px;
  border-radius:15px;
  box-shadow:0 0 15px #FFD700;
}

.colors button{
  padding:12px 20px;
  margin:10px;
  border:none;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

.red{background:red;color:#fff;}
.green{background:green;color:#fff;}
.blue{background:blue;color:#fff;}

#result{
  margin-top:20px;
  font-size:18px;
}

.points{
  font-size:20px;
  margin-top:15px;
}
</style>
</head>

<body>

<h1>SuperNFT Demo Color Prediction</h1>

<div class="game-box">

<div class="points">
Points: <span id="points">100</span>
</div>

<p>Select a Color:</p>

<div class="colors">
<button class="red" onclick="play('red')">Red</button>
<button class="green" onclick="play('green')">Green</button>
<button class="blue" onclick="play('blue')">Blue</button>
</div>

<div id="result"></div>

</div>

<script>
let points = 100;

function play(choice){
  if(points <= 0){
    alert("No more points!");
    return;
  }

  const colors = ["red","green","blue"];
  const random = colors[Math.floor(Math.random()*3)];

  if(choice === random){
    points += 10;
    document.getElementById("result").innerHTML = 
      "🎉 You Won! Color was " + random;
  } else {
    points -= 10;
    document.getElementById("result").innerHTML = 
      "❌ You Lost! Color was " + random;
  }

  document.getElementById("points").innerText = points;
}
</script>

</body>
</html>
