<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SuperNFT Advanced Color Prediction</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#000;
  color:#FFD700;
  text-align:center;
}

header{
  padding:20px;
  font-size:22px;
  border-bottom:1px solid #FFD700;
}

.container{
  max-width:500px;
  margin:20px auto;
  background:#111;
  padding:20px;
  border-radius:15px;
  box-shadow:0 0 20px #FFD700;
}

.wallet{
  font-size:18px;
}

.timer{
  font-size:26px;
  margin:15px 0;
}

.bet input{
  padding:8px;
  width:100px;
  text-align:center;
  border-radius:6px;
  border:none;
}

.colors button{
  padding:12px 20px;
  margin:10px;
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
  color:#fff;
}

.red{background:red;}
.green{background:green;}
.blue{background:blue;}

.result-box{
  margin-top:20px;
  font-size:20px;
  padding:10px;
}

.history{
  margin-top:20px;
  max-height:150px;
  overflow-y:auto;
  text-align:left;
  font-size:14px;
}

.history div{
  border-bottom:1px solid #333;
  padding:5px;
}

button:hover{
  opacity:0.85;
}
</style>
</head>

<body>

<header>SuperNFT Advanced Demo Prediction</header>

<div class="container">

<div class="wallet">
Wallet: <span id="wallet">1000</span> Points
</div>

<div class="timer">
Next Result In: <span id="countdown">30</span>s
</div>

<div class="bet">
Bet Amount:
<input type="number" id="betAmount" value="50" min="10">
</div>

<div class="colors">
<button class="red" onclick="chooseColor('red')">Red</button>
<button class="green" onclick="chooseColor('green')">Green</button>
<button class="blue" onclick="chooseColor('blue')">Blue</button>
</div>

<div class="result-box" id="result"></div>

<div class="history" id="history"></div>

</div>

<script>
let wallet = localStorage.getItem("wallet") 
  ? parseInt(localStorage.getItem("wallet")) 
  : 1000;

let selected = null;
let timer = 30;

document.getElementById("wallet").innerText = wallet;

function chooseColor(color){
  selected = color;
  document.getElementById("result").innerText = 
    "Selected: " + color.toUpperCase();
}

function randomResult(){
  const colors = ["red","green","blue"];
  return colors[Math.floor(Math.random()*3)];
}

function updateHistory(text){
  const div = document.createElement("div");
  div.innerText = text;
  document.getElementById("history").prepend(div);
}

function resolveRound(){
  if(!selected) return;

  let bet = parseInt(document.getElementById("betAmount").value);
  if(bet > wallet || bet < 10){
    alert("Invalid Bet");
    return;
  }

  const result = randomResult();

  if(selected === result){
    wallet += bet;  // 2x payout effect
    document.getElementById("result").innerText =
      "🎉 WIN! Result: " + result.toUpperCase();
    updateHistory("WIN +" + bet + " | " + result);
  } else {
    wallet -= bet;
    document.getElementById("result").innerText =
      "❌ LOSS! Result: " + result.toUpperCase();
    updateHistory("LOSS -" + bet + " | " + result);
  }

  selected = null;
  document.getElementById("wallet").innerText = wallet;
  localStorage.setItem("wallet", wallet);
}

setInterval(()=>{
  timer--;
  document.getElementById("countdown").innerText = timer;

  if(timer <= 0){
    resolveRound();
    timer = 30;
  }

},1000);
</script>

</body>
</html>
