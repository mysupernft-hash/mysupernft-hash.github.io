<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SuperNFT - Buy NFT</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  background:#0b0b0b;
  font-family:Arial, sans-serif;
  color:#FFD700;
  margin:0;
  padding:0;
}

.container{
  max-width:500px;
  margin:40px auto;
  background:#111;
  padding:25px;
  border-radius:15px;
  box-shadow:0 0 25px rgba(255,215,0,0.2);
}

h2{
  text-align:center;
  margin-bottom:20px;
}

.tabs{
  display:flex;
  margin-bottom:20px;
}

.tabs button{
  flex:1;
  padding:10px;
  background:#1a1a1a;
  border:1px solid #FFD700;
  color:#FFD700;
  cursor:pointer;
}

.tabs button.active{
  background:linear-gradient(145deg,#FFD700,#e6c200);
  color:#000;
  font-weight:bold;
}

input, select{
  width:100%;
  padding:10px;
  margin:8px 0;
  background:#0f0f0f;
  border:1px solid #FFD700;
  color:#fff;
  border-radius:6px;
}

.summary{
  margin-top:15px;
  background:#0d0d0d;
  padding:15px;
  border-radius:10px;
}

.summary p{
  margin:5px 0;
}

.total{
  font-size:18px;
  font-weight:bold;
}

.pay-btn{
  width:100%;
  padding:12px;
  margin-top:15px;
  background:linear-gradient(145deg,#FFD700,#e6c200);
  color:#000;
  border:none;
  font-weight:bold;
  border-radius:8px;
  cursor:pointer;
}

.pay-btn:hover{
  opacity:0.9;
}
</style>
</head>

<body>

<div class="container">

<h2>Buy SuperNFT</h2>

<div class="tabs">
  <button id="cardTab" class="active">Pay by Card</button>
  <button id="paypalTab">Pay with PayPal</button>
</div>

<!-- CARD FORM -->
<div id="cardForm">

<input type="text" placeholder="Cardholder name">

<select>
  <option>United Arab Emirates</option>
  <option>India</option>
  <option>United States</option>
  <option>United Kingdom</option>
</select>

<input type="text" placeholder="Tax ID number (optional)">
<input type="text" placeholder="Discount code">

<div class="summary">
  <p>Setup fee: $0.00</p>
  <p>Subtotal: $49.00</p>
  <p class="total">Total: $49.00</p>
</div>

<button class="pay-btn">Pay $49.00</button>

</div>

<!-- PAYPAL FORM -->
<div id="paypalForm" style="display:none;">

<input type="email" placeholder="Email address">
<input type="text" placeholder="Full name">

<select>
  <option>United Arab Emirates</option>
  <option>India</option>
  <option>United States</option>
  <option>United Kingdom</option>
</select>

<input type="text" placeholder="Tax ID number (optional)">
<input type="text" placeholder="Discount code">

<div class="summary">
  <p>Setup fee: $0.00</p>
  <p>Subtotal: $49.00</p>
  <p class="total">Total: $49.00</p>
</div>

<button class="pay-btn">Continue with PayPal</button>

</div>

</div>

<script>
const cardTab = document.getElementById("cardTab");
const paypalTab = document.getElementById("paypalTab");
const cardForm = document.getElementById("cardForm");
const paypalForm = document.getElementById("paypalForm");

cardTab.onclick = function(){
  cardForm.style.display="block";
  paypalForm.style.display="none";
  cardTab.classList.add("active");
  paypalTab.classList.remove("active");
}

paypalTab.onclick = function(){
  cardForm.style.display="none";
  paypalForm.style.display="block";
  paypalTab.classList.add("active");
  cardTab.classList.remove("active");
}
</script>

</body>
</html>
