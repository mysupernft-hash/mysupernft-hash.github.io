<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages - SuperNFT</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f0f0f;
  color:#FFD700;
}

/* HEADER */
header{
  background:#1a1a1a;
  padding:12px;
  text-align:center;
  font-size:18px;
  font-weight:bold;
  border-bottom:1px solid #272727;
  position:relative;
}

/* BACK BTN */
.back{
  position:absolute;
  left:10px;
  top:10px;
  cursor:pointer;
  font-size:18px;
}

/* MESSAGE BOX */
.container{
  padding:15px;
}

.message{
  background:#1a1a1a;
  border-radius:12px;
  padding:12px;
  margin-bottom:12px;
  box-shadow:0 0 10px rgba(255,215,0,0.1);
  transition:0.3s;
}

.message:hover{
  transform:scale(1.02);
}

/* UNREAD */
.message.unread{
  border:1px solid #FFD700;
}

/* TITLE */
.title{
  font-size:14px;
  font-weight:bold;
  margin-bottom:5px;
}

/* TEXT */
.text{
  font-size:13px;
  color:#ccc;
}

/* DATE */
.time{
  font-size:10px;
  color:#777;
  margin-top:6px;
}

/* EMPTY */
.empty{
  text-align:center;
  margin-top:50px;
  color:#777;
}
</style>
</head>

<body>

<header>
  <span class="back" onclick="goBack()">←</span>
  💬 Messages
</header>

<div class="container" id="msgBox"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, onSnapshot, updateDoc, getDoc } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* FIREBASE */
const firebaseConfig={
  apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain:"supernft-5b952.firebaseapp.com",
  projectId:"supernft-5b952"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const box = document.getElementById("msgBox");

/* BACK */
window.goBack = function(){
  window.location.href = "index.html";
};

/* LOAD USER */
onAuthStateChanged(auth,(user)=>{

  if(!user){
    location.href="login.html";
    return;
  }

  console.log("USER UID:", user.uid); // DEBUG

  const ref = doc(db,"messages", user.uid);

  /* REAL-TIME LISTENER */
  onSnapshot(ref,(snap)=>{

    console.log("DATA:", snap.data()); // DEBUG

    if(!snap.exists()){
      box.innerHTML = `<div class="empty">No messages yet</div>`;
      return;
    }

    const raw = snap.data();
    const data = raw && raw.list ? raw.list : [];

    if(data.length === 0){
      box.innerHTML = `<div class="empty">No messages yet</div>`;
      return;
    }

    box.innerHTML = "";

    /* SHOW MESSAGES */
    [...data].reverse().forEach(m=>{

      const sender = m.sender === "admin" ? "📢 Admin" : "👤 You";

      const time = m.time
        ? new Date(m.time).toLocaleString()
        : "Now";

      box.innerHTML += `
        <div class="message ${m.read ? '' : 'unread'}">
          <div class="title">${sender}</div>
          <div class="text">${m.text || ""}</div>
          <div class="time">${time}</div>
        </div>
      `;
    });

    /* AUTO MARK READ */
    markRead(user.uid);

  });

});

/* MARK READ */
async function markRead(uid){

  try{
    const ref = doc(db,"messages", uid);
    const snap = await getDoc(ref);

    if(!snap.exists()) return;

    const list = snap.data().list || [];

    const updated = list.map(m => ({
      ...m,
      read: true
    }));

    await updateDoc(ref,{ list: updated });

  }catch(e){
    console.error("Read error:", e);
  }
}

</script>

</body>
</html>
