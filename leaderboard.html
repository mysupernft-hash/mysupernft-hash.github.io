<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Top Earners | SuperNFT</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
margin:0;
font-family:Arial;
background:#0f0f0f;
color:#FFD700;
padding:15px;
}

h2{
text-align:center;
margin-bottom:20px;
}

/* CARD */
.card{
background:#1a1a1a;
padding:12px;
border-radius:12px;
margin-bottom:10px;
display:flex;
justify-content:space-between;
align-items:center;
transition:0.3s;
}

/* RANK */
.rank{
font-weight:bold;
display:flex;
align-items:center;
gap:5px;
}

/* NAME */
.name{
flex:1;
margin-left:10px;
}

/* AMOUNT */
.amount{
font-weight:bold;
}

/* GLOW */
@keyframes glow {
0%{box-shadow:0 0 5px #FFD700;}
50%{box-shadow:0 0 25px #FFD700;}
100%{box-shadow:0 0 5px #FFD700;}
}

/* TOP 3 */
.top1{
background:linear-gradient(90deg,#FFD700,#ffcc00);
color:#000;
font-weight:bold;
animation:glow 2s infinite;
}

.top2{
background:linear-gradient(90deg,#c0c0c0,#999);
color:#000;
font-weight:bold;
}

.top3{
background:linear-gradient(90deg,#cd7f32,#a0522d);
color:#fff;
font-weight:bold;
}

/* REAL USERS HIGHLIGHT */
.real{
border:1px solid #00ff66;
}

</style>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

</head>
<body>

<h2>🏆 Top 100 Earners</h2>

<div id="leaderboard">Loading...</div>

<script>

// =======================
// FIREBASE
// =======================
firebase.initializeApp({
apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
authDomain:"supernft-5b952.firebaseapp.com",
projectId:"supernft-5b952"
});

const db = firebase.firestore();

// =======================
// NAME SYSTEM
// =======================
const firstNames = ["Aarav","Vivaan","Aditya","Arjun","Rahul","Rohan","Aman","Karan","Raj","Vikas","Priya","Ananya","Sneha"];
const lastNames = ["Sharma","Verma","Gupta","Singh","Kumar","Patel","Yadav","Khan"];

function randomName(){
return firstNames[Math.floor(Math.random()*firstNames.length)] + " " +
       lastNames[Math.floor(Math.random()*lastNames.length)];
}

// =======================
// FAKE USERS
// =======================
function generateFakeUsers(count){
let arr=[];
for(let i=0;i<count;i++){
arr.push({
name: randomName(),
totalEarning: Math.random()*10000 + 500,
real:false
});
}
return arr;
}

// =======================
// LOAD LEADERBOARD
// =======================
async function loadLeaderboard(){

let fakeUsers = generateFakeUsers(90);
let realUsers = [];

try{
const snap = await db.collection("users").limit(10).get();

snap.forEach(doc=>{
const u = doc.data();

realUsers.push({
name: u.name || (u.email ? u.email.split("@")[0] : "User"),
totalEarning: u.totalEarning || Math.random()*100,
real:true
});
});

}catch(e){
console.log("Firebase error:", e);
}

// 🔥 ensure 10 real users
while(realUsers.length < 10){
realUsers.push({
name: "User " + (realUsers.length+1),
totalEarning: Math.random()*100,
real:true
});
}

// sort
fakeUsers.sort((a,b)=>b.totalEarning - a.totalEarning);
realUsers.sort((a,b)=>b.totalEarning - a.totalEarning);

// merge (fake first, real last)
const users = [...fakeUsers, ...realUsers];

// render
let html="";
let rank=1;

users.forEach(u=>{

let cls="";
let crown="";

if(rank===1){cls="top1"; crown="👑";}
else if(rank===2){cls="top2"; crown="🥈";}
else if(rank===3){cls="top3"; crown="🥉";}

// highlight real users
let realClass = u.real ? "real" : "";

html += `
<div class="card ${cls} ${realClass}">
  <div class="rank">${crown} #${rank}</div>
  <div class="name">${u.name}</div>
  <div class="amount" data-value="${u.totalEarning}">$0.00</div>
</div>
`;

rank++;

});

document.getElementById("leaderboard").innerHTML = html;

// animate
setTimeout(animateValues,200);

}

// =======================
// COUNT ANIMATION
// =======================
function animateValues(){

const elements = document.querySelectorAll(".amount");

elements.forEach(el=>{

const target = parseFloat(el.getAttribute("data-value"));
let current = 0;

const increment = target / 40;

const timer = setInterval(()=>{

current += increment;

if(current >= target){
current = target;
clearInterval(timer);
}

el.innerText = "$" + current.toFixed(2);

},30);

});

}

// =======================
// LIVE UPDATE
// =======================
function liveUpdate(){

const cards = document.querySelectorAll(".card");

cards.forEach((card,index)=>{

if(index < 50){
let amountEl = card.querySelector(".amount");
let value = parseFloat(amountEl.innerText.replace("$",""));
value += Math.random()*5;
amountEl.innerText = "$" + value.toFixed(2);
}

});

}

setInterval(liveUpdate,1000);

// START
loadLeaderboard();

</script>

</body>
</html>
