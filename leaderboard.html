<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Top Earners | SuperNFT</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
margin:0;
font-family:Arial;
background:#0f0f0f;
color:#FFD700;
padding:15px;
}

h2{
text-align:center;
margin-bottom:20px;
}

.card{
background:#1a1a1a;
padding:12px;
border-radius:12px;
margin-bottom:10px;
display:flex;
justify-content:space-between;
align-items:center;
}

.top1{background:linear-gradient(90deg,#FFD700,#ffcc00);color:#000;font-weight:bold;}
.top2{background:linear-gradient(90deg,#c0c0c0,#999);color:#000;font-weight:bold;}
.top3{background:linear-gradient(90deg,#cd7f32,#a0522d);color:#fff;font-weight:bold;}

.rank{font-weight:bold;}
.name{flex:1;margin-left:10px;}
.amount{font-weight:bold;}

</style>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

</head>
<body>

<h2>🏆 Top 100 Earners</h2>

<div id="leaderboard">Loading...</div>

<script>

// FIREBASE
firebase.initializeApp({
apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
authDomain:"supernft-5b952.firebaseapp.com",
projectId:"supernft-5b952"
});

const db = firebase.firestore();

// =======================
// 🔥 RANDOM NAME SYSTEM
// =======================
const firstNames = ["Aarav","Vivaan","Aditya","Arjun","Rahul","Rohan","Aman","Karan","Raj","Vikas","Priya","Ananya","Sneha","Pooja","Kavya"];
const lastNames = ["Sharma","Verma","Gupta","Singh","Kumar","Patel","Yadav","Khan","Ansari","Malik"];

function randomName(){
return firstNames[Math.floor(Math.random()*firstNames.length)] + " " +
       lastNames[Math.floor(Math.random()*lastNames.length)];
}

// =======================
// 🔥 FAKE USERS
// =======================
function generateFakeUsers(count){

let arr = [];

for(let i=0;i<count;i++){

arr.push({
name: randomName(),
totalEarning: Math.random()*10000 + 50
});

}

return arr;
}

// =======================
// 🔥 LOAD LEADERBOARD
// =======================
async function loadLeaderboard(){

// 🔹 10 real users
const realSnap = await db.collection("users")
.orderBy("totalEarning","desc")
.limit(10)
.get();

let users = [];

// add real users
realSnap.forEach(doc=>{
const u = doc.data();

users.push({
name: u.name || (u.email ? u.email.split("@")[0] : "User"),
totalEarning: u.totalEarning || 0
});
});

// 🔹 90 fake users
const fakeUsers = generateFakeUsers(90);

// merge
users = users.concat(fakeUsers);

// sort
users.sort((a,b)=>b.totalEarning - a.totalEarning);

// limit 100
users = users.slice(0,100);

// render
let html="";
let rank=1;

users.forEach(u=>{

let cls="";
if(rank===1) cls="top1";
else if(rank===2) cls="top2";
else if(rank===3) cls="top3";

html += `
<div class="card ${cls}">
<div class="rank">#${rank}</div>
<div class="name">${u.name}</div>
<div class="amount">$${u.totalEarning.toFixed(2)}</div>
</div>
`;

rank++;

});

document.getElementById("leaderboard").innerHTML = html;

}

loadLeaderboard();

</script>

</body>
</html>
