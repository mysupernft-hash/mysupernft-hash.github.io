<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Top Earners | SuperNFT</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
margin:0;
font-family:Arial;
background:#0f0f0f;
color:#FFD700;
padding:15px;
}

h2{
text-align:center;
margin-bottom:20px;
}

/* CARD */
.card{
background:#1a1a1a;
padding:12px;
border-radius:12px;
margin-bottom:10px;
display:flex;
justify-content:space-between;
align-items:center;
transition:0.3s;
}

/* RANK */
.rank{
font-weight:bold;
display:flex;
align-items:center;
gap:5px;
}

/* NAME */
.name{
flex:1;
margin-left:10px;
}

/* AMOUNT */
.amount{
font-weight:bold;
}

/* GLOW */
@keyframes glow {
0%{box-shadow:0 0 5px #FFD700;}
50%{box-shadow:0 0 25px #FFD700;}
100%{box-shadow:0 0 5px #FFD700;}
}

/* TOP 3 */
.top1{
background:linear-gradient(90deg,#FFD700,#ffcc00);
color:#000;
font-weight:bold;
animation:glow 2s infinite;
}

.top2{
background:linear-gradient(90deg,#c0c0c0,#999);
color:#000;
font-weight:bold;
}

.top3{
background:linear-gradient(90deg,#cd7f32,#a0522d);
color:#fff;
font-weight:bold;
}

</style>

</head>
<body>

<h2 id="title">🏆 Loading...</h2>

<div id="leaderboard">Loading...</div>

<script>

// =======================
// 🔥 DYNAMIC TITLE
// =======================
function setDynamicTitle(){

const now = new Date();
const hours = now.getHours();

let text = "Today";

if(hours < 4){
text = "Yesterday";
}

document.getElementById("title").innerText =
"🏆 " + text + " Top 100 Earners";

}

setDynamicTitle();

// =======================
// 🔥 NAME SYSTEM
// =======================
const firstNames = ["Aarav","Vivaan","Aditya","Arjun","Rahul","Rohan","Aman","Karan","Raj","Vikas","Priya","Ananya","Sneha"];
const lastNames = ["Sharma","Verma","Gupta","Singh","Kumar","Patel","Yadav","Khan"];

function randomName(){
return firstNames[Math.floor(Math.random()*firstNames.length)] + " " +
       lastNames[Math.floor(Math.random()*lastNames.length)];
}

// =======================
// 🔥 COUNTRY FLAGS
// =======================
const countries = [
  {code:"🇮🇳"},
  {code:"🇵🇰"},
  {code:"🇦🇪"}
];

function randomCountry(){
return countries[Math.floor(Math.random()*countries.length)];
}

// =======================
// 🔥 LOAD LEADERBOARD
// =======================
function loadLeaderboard(){

let users = [];

for(let i=0;i<100;i++){

const country = randomCountry();

users.push({
name: randomName(),
totalEarning: Math.random()*10000 + 200,
flag: country.code
});

}

// sort
users.sort((a,b)=>b.totalEarning - a.totalEarning);

// render
let html="";
let rank=1;

users.forEach(u=>{

let cls="";
let crown="";

if(rank===1){cls="top1"; crown="👑";}
else if(rank===2){cls="top2"; crown="🥈";}
else if(rank===3){cls="top3"; crown="🥉";}

html += `
<div class="card ${cls}">
  <div class="rank">${crown} #${rank}</div>
  <div class="name">${u.flag} ${u.name}</div>
  <div class="amount" data-value="${u.totalEarning}">$0.00</div>
</div>
`;

rank++;

});

document.getElementById("leaderboard").innerHTML = html;

// animate
setTimeout(animateValues,200);

}

// =======================
// 🔥 COUNT ANIMATION
// =======================
function animateValues(){

const elements = document.querySelectorAll(".amount");

elements.forEach(el=>{

const target = parseFloat(el.getAttribute("data-value"));
let current = 0;

const increment = target / 40;

const timer = setInterval(()=>{

current += increment;

if(current >= target){
current = target;
clearInterval(timer);
}

el.innerText = "$" + current.toFixed(2);

},30);

});

}

// =======================
// 🔥 LIVE UPDATE
// =======================
function liveUpdate(){

const cards = document.querySelectorAll(".card");

cards.forEach((card,index)=>{

if(index < 50){
let amountEl = card.querySelector(".amount");
let value = parseFloat(amountEl.innerText.replace("$",""));
value += Math.random()*5;
amountEl.innerText = "$" + value.toFixed(2);
}

});

}

setInterval(liveUpdate,1000);

// START
loadLeaderboard();

</script>

</body>
</html>
