<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Top Earners | SuperNFT</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
margin:0;
font-family:Arial;
background:#0f0f0f;
color:#FFD700;
padding:15px;
}

h2{
text-align:center;
margin-bottom:20px;
}

/* CARD */
.card{
background:#1a1a1a;
padding:12px;
border-radius:12px;
margin-bottom:10px;
display:flex;
justify-content:space-between;
align-items:center;
}

/* TOP 3 */
.top1{
background:linear-gradient(90deg,#FFD700,#ffcc00);
color:#000;
font-weight:bold;
}
.top2{
background:linear-gradient(90deg,#c0c0c0,#999);
color:#000;
font-weight:bold;
}
.top3{
background:linear-gradient(90deg,#cd7f32,#a0522d);
color:#fff;
font-weight:bold;
}

.rank{font-weight:bold;}
.name{flex:1;margin-left:10px;}
.amount{font-weight:bold;}

</style>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

</head>
<body>

<h2>🏆 Top 100 Earners</h2>

<div id="leaderboard">Loading...</div>

<script>

// =======================
// 🔥 FIREBASE INIT
// =======================
firebase.initializeApp({
apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
authDomain:"supernft-5b952.firebaseapp.com",
projectId:"supernft-5b952"
});

const db = firebase.firestore();

// =======================
// 🔥 RANDOM NAME SYSTEM
// =======================
const firstNames = [
"Aarav","Vivaan","Aditya","Arjun","Rahul","Rohan","Aman","Karan","Raj","Vikas",
"Priya","Ananya","Sneha","Pooja","Kavya","Neha","Riya","Simran"
];

const lastNames = [
"Sharma","Verma","Gupta","Singh","Kumar","Patel","Yadav","Khan","Ansari","Malik"
];

function randomName(){
return firstNames[Math.floor(Math.random()*firstNames.length)] + " " +
       lastNames[Math.floor(Math.random()*lastNames.length)];
}

// =======================
// 🔥 FAKE USERS
// =======================
function generateFakeUsers(count){
let arr=[];
for(let i=0;i<count;i++){
arr.push({
name: randomName(),
totalEarning: Math.random()*10000 + 100
});
}
return arr;
}

// =======================
// 🔥 LOAD LEADERBOARD
// =======================
async function loadLeaderboard(){

let users = [];

try{

// 🔹 REAL USERS (SAFE QUERY)
const snap = await db.collection("users").limit(10).get();

snap.forEach(doc=>{
const u = doc.data();

users.push({
name: u.name || (u.email ? u.email.split("@")[0] : "User"),
totalEarning: u.totalEarning || Math.random()*500
});
});

}catch(e){
console.log("Firebase error:", e);
}

// 🔹 FAKE USERS (90%)
users = users.concat(generateFakeUsers(90));

// 🔹 SORT
users.sort((a,b)=>b.totalEarning - a.totalEarning);

// 🔹 RENDER
let html="";
let rank=1;

users.slice(0,100).forEach(u=>{

let cls="";
if(rank===1) cls="top1";
else if(rank===2) cls="top2";
else if(rank===3) cls="top3";

html += `
<div class="card ${cls}">
  <div class="rank">#${rank}</div>
  <div class="name">${u.name}</div>
  <div class="amount">$${u.totalEarning.toFixed(2)}</div>
</div>
`;

rank++;

});

document.getElementById("leaderboard").innerHTML = html;

}

loadLeaderboard();

</script>

</body>
</html>
