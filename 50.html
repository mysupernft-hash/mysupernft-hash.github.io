<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SuperNFT Ultra Pyramid</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
body{
  margin:0;
  background:#000;
  color:#FFD700;
  font-family:Arial;
  text-align:center;
}

/* TITLE */
h2{
  margin:15px 0;
}

/* TREE */
.tree{
  display:flex;
  flex-direction:column;
  align-items:center;
}

/* LEVEL */
.level{
  display:flex;
  justify-content:center;
  margin:20px 0;
  position:relative;
}

/* NODE */
.node{
  width:70px;
  height:70px;
  border-radius:50%;
  background:linear-gradient(145deg,#FFD700,#e6c200);
  color:black;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  margin:0 10px;
  font-size:10px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 0 10px #FFD700;
  transition:0.3s;
}

.node:hover{
  transform:scale(1.1);
}

/* PROFILE */
.avatar{
  width:30px;
  height:30px;
  border-radius:50%;
  background:#000;
  margin-bottom:3px;
}

/* SVG LINE */
svg{
  position:absolute;
  top:-20px;
  left:0;
  width:100%;
  height:100%;
  pointer-events:none;
}
</style>
</head>

<body>

<h2>🔺 Ultra Referral Pyramid</h2>

<div class="tree" id="tree"></div>

<script>

firebase.initializeApp({
apiKey:"AIzaSy...",
authDomain:"supernft-5b952.firebaseapp.com",
projectId:"supernft-5b952"
});

const db = firebase.firestore();

const ROOT_UID = new URLSearchParams(window.location.search).get("uid");

/* LOAD USERS */
async function loadTree(){

const snap = await db.collection("users").get();

let users = {};

snap.forEach(doc=>{
  users[doc.id] = doc.data();
});

/* BUILD TREE */
let levels = [];
levels[0] = [ROOT_UID];

let current = [ROOT_UID];

for(let i=1;i<6;i++){

let next = [];

current.forEach(uid=>{
  Object.keys(users).forEach(id=>{
    if(users[id].referredByUid === uid){
      next.push(id);
    }
  });
});

if(next.length === 0) break;

levels[i] = next;
current = next;
}

renderTree(levels, users);

}

/* RENDER TREE */
function renderTree(levels, users){

const tree = document.getElementById("tree");
tree.innerHTML = "";

levels.forEach((level, index)=>{

let levelDiv = document.createElement("div");
levelDiv.className = "level";

/* SVG LINES */
if(index > 0){
let svg = document.createElementNS("http://www.w3.org/2000/svg","svg");

level.forEach((_,i)=>{
let line = document.createElementNS("http://www.w3.org/2000/svg","line");

line.setAttribute("x1","50%");
line.setAttribute("y1","0");
line.setAttribute("x2",(i+1)*(100/(level.length+1))+"%");
line.setAttribute("y2","100%");
line.setAttribute("stroke","red");
line.setAttribute("stroke-width","2");

svg.appendChild(line);
});

levelDiv.appendChild(svg);
}

/* NODES */
level.forEach(uid=>{

let u = users[uid] || {};

let node = document.createElement("div");
node.className = "node";

node.innerHTML = `
<div class="avatar"></div>
💰${u.earnings || 0}$
`;

node.onclick = ()=>openUser(uid);

levelDiv.appendChild(node);

});

tree.appendChild(levelDiv);

});

}

/* CLICK USER */
function openUser(uid){
alert("User: " + uid);
}

/* LOAD */
if(ROOT_UID){
loadTree();
}

</script>

</body>
</html>
