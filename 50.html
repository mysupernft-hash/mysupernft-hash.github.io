<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SuperNFT Pyramid</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#000;
  color:#FFD700;
  padding:15px;
}

/* TITLE */
.title{
  text-align:center;
  font-size:22px;
  margin-bottom:20px;
}

/* TREE */
.tree{
  display:flex;
  flex-direction:column;
  align-items:center;
}

/* NODE */
.node{
  position:relative;
  padding:10px 15px;
  background:#111;
  border-radius:10px;
  margin:10px;
  font-size:13px;
  color:#00ff88;
  box-shadow:0 0 10px rgba(0,255,136,0.2);
  animation:fadeIn 0.5s ease;
}

/* CHILD CONTAINER */
.children{
  display:flex;
  justify-content:center;
  margin-top:20px;
}

/* LINES */
.node::before{
  content:"";
  position:absolute;
  top:-20px;
  left:50%;
  width:2px;
  height:20px;
  background:#FFD700;
}

.children .node::after{
  content:"";
  position:absolute;
  top:-20px;
  left:50%;
  width:100%;
  height:2px;
  background:#FFD700;
}

/* REMOVE LINE FOR ROOT */
.root::before{
  display:none;
}

/* ANIMATION */
@keyframes fadeIn{
  from{
    opacity:0;
    transform:translateY(10px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* TOTAL */
.total{
  text-align:center;
  margin-top:20px;
  color:#00ff88;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="title">👥 Referral Tree</div>

<div id="tree" class="tree"></div>

<div id="total" class="total"></div>

<script>

/* FIREBASE */
firebase.initializeApp({
apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
authDomain:"supernft-5b952.firebaseapp.com",
projectId:"supernft-5b952"
});

const auth = firebase.auth();
const db = firebase.firestore();

/* LOAD TREE */
auth.onAuthStateChanged(async user=>{
  if(!user){
    location.href="login.html";
    return;
  }

  const currentUID = user.uid;

  const snapshot = await db.collection("users").get();

  let users = [];
  snapshot.forEach(doc=>{
    users.push({id:doc.id, ...doc.data()});
  });

  let total = 0;

  function createNode(u, level){

    let percent = level==1 ? 20 : level==2 ? 15 : 10;

    let deposit = Number(u.totalDeposit || 0);
    let profit = deposit * percent / 100;

    total += profit;

    return `
      <div class="node">
        👤 ${u.email || "User"} <br>
        💰 $${profit.toFixed(2)} <br>
        <small>Level ${level} (${percent}%)</small>
      </div>
    `;
  }

  function buildTree(parentUID, level=1){

    let children = users.filter(u=>u.referredByUid === parentUID);

    if(children.length === 0 || level > 3) return "";

    let html = `<div class="children">`;

    children.forEach(u=>{
      html += `
        <div style="text-align:center;">
          ${createNode(u, level)}
          ${buildTree(u.id, level+1)}
        </div>
      `;
    });

    html += `</div>`;

    return html;
  }

  const tree = document.getElementById("tree");

  tree.innerHTML = `
    <div class="node root">👑 You</div>
    ${buildTree(currentUID)}
  `;

  document.getElementById("total").innerText =
    "💰 Total Earnings: $" + total.toFixed(2);

});

</script>

</body>
</html>
