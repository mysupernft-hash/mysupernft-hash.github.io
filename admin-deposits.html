<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Deposits | SuperNFT</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="assets/style.css">

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script src="assets/script.js"></script>
</head>
<body>

<header>Admin Deposits</header>
<nav>
  <a href="admin-dashboard.html">Dashboard</a>
  <a href="admin-users.html">Users</a>
  <a href="admin-nfts.html">NFTs</a>
  <a href="admin-deposits.html">Deposits</a>
  <a href="admin-withdraw.html">Withdraw</a>
  <a href="#" class="logout" onclick="logout()">Logout</a>
</nav>

<div class="main">
<h2>All Deposits</h2>

<table id="depositsTable">
<thead>
<tr>
<th>User Email</th>
<th>Amount</th>
<th>Status</th>
<th>Actions</th>
</tr>
</thead>
<tbody></tbody>
</table>
</div>

<script>
// 🔒 Protect page
protectAdminPage();

const db = firebase.firestore();
const depositsTable = document.getElementById("depositsTable").getElementsByTagName("tbody")[0];

// 🔹 Load all deposits
function loadDeposits(){
  depositsTable.innerHTML = "";
  db.collection("deposits").get().then(snapshot=>{
    snapshot.forEach(doc=>{
      const d = doc.data();
      const row = depositsTable.insertRow();
      row.insertCell(0).innerText = d.userEmail;
      row.insertCell(1).innerText = "$" + (d.amount || 0);
      row.insertCell(2).innerText = d.status || "pending";

      const actionsCell = row.insertCell(3);

      // Approve Button
      const approveBtn = document.createElement("button");
      approveBtn.innerText = "Approve";
      approveBtn.onclick = ()=>{
        db.collection("deposits").doc(doc.id).update({status:"approved"})
          .then(()=>{ alert("Deposit approved"); loadDeposits(); });
      };
      actionsCell.appendChild(approveBtn);

      // Reject Button
      const rejectBtn = document.createElement("button");
      rejectBtn.innerText = "Reject";
      rejectBtn.onclick = ()=>{
        db.collection("deposits").doc(doc.id).update({status:"rejected"})
          .then(()=>{ alert("Deposit rejected"); loadDeposits(); });
      };
      actionsCell.appendChild(rejectBtn);
    });
  });
}

// Initial load
loadDeposits();
</script>

</body>
</html>
