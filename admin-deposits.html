<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Deposits | SuperNFT</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
body{margin:0;font-family:Arial;background:#0f0f0f;color:#FFD700;}
header{background:#111;padding:15px;text-align:center;font-size:20px;}
nav{background:#1a1a1a;padding:10px;text-align:center;}
nav a{color:#FFD700;margin:0 10px;text-decoration:none;}
table{width:100%;border-collapse:collapse;margin-top:20px;}
th,td{border:1px solid #333;padding:10px;text-align:center;}
button{padding:6px 10px;border:none;border-radius:6px;margin:2px;cursor:pointer;}
.approve{background:#00cc66;color:white;}
.reject{background:red;color:white;}
</style>
</head>
<body>

<header>Admin Deposits</header>

<nav>
<a href="admin-dashboard.html">Dashboard</a>
<a href="admin-users.html">Users</a>
<a href="admin-withdraw.html">Withdraw</a>
<a href="logout.html">Logout</a>
</nav>

<h2 style="text-align:center;">Deposit Requests</h2>

<table>
<thead>
<tr>
<th>Email</th>
<th>Amount</th>
<th>TXID</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>
<tbody id="depositBody"></tbody>
</table>

<script>

firebase.initializeApp({
  apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain:"supernft-5b952.firebaseapp.com",
  projectId:"supernft-5b952"
});

const auth = firebase.auth();
const db = firebase.firestore();

auth.onAuthStateChanged(user=>{

if(!user){
  location.href="admin-login.html";
  return;
}

loadDeposits();

});

function loadDeposits(){

const body = document.getElementById("depositBody");
body.innerHTML="";

db.collection("depositRequests")
.get()
.then(snapshot=>{

snapshot.forEach(doc=>{

const d = doc.data();

const row = body.insertRow();

row.insertCell(0).innerText = d.email || "-";
row.insertCell(1).innerText = "$"+(d.amount||0);
row.insertCell(2).innerText = d.txid || "-";
row.insertCell(3).innerText = d.status || "pending";

const actionCell = row.insertCell(4);

const approveBtn = document.createElement("button");
approveBtn.innerText="Approve";
approveBtn.className="approve";
approveBtn.onclick = ()=>approveDeposit(doc.id,d);
actionCell.appendChild(approveBtn);

const rejectBtn = document.createElement("button");
rejectBtn.innerText="Reject";
rejectBtn.className="reject";
rejectBtn.onclick = ()=>rejectDeposit(doc.id);
actionCell.appendChild(rejectBtn);

});

})
.catch(err=>{
console.log(err.message);
});

}

function approveDeposit(id,data){

if(data.status==="approved"){
alert("Already approved");
return;
}

db.collection("depositRequests").doc(id).update({
status:"approved"
}).then(()=>{
alert("Approved");
loadDeposits();
});

}

function rejectDeposit(id){

db.collection("depositRequests").doc(id).update({
status:"rejected"
}).then(()=>{
alert("Rejected");
loadDeposits();
});

}

</script>

</body>
</html>
