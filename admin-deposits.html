<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Deposits</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
body{background:#0f0f0f;color:#FFD700;font-family:Arial;margin:0;padding:20px;}
table{width:100%;border-collapse:collapse;margin-top:20px;}
th,td{border:1px solid #333;padding:8px;text-align:center;}
button{padding:6px 10px;margin:2px;border:none;border-radius:6px;cursor:pointer;}
.approve{background:green;color:white;}
.reject{background:red;color:white;}
</style>
</head>
<body>

<h2>Admin Deposit Requests</h2>

<table>
<thead>
<tr>
<th>Email</th>
<th>Amount</th>
<th>TXID</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>
<tbody id="body"></tbody>
</table>

<script>

firebase.initializeApp({
apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
authDomain:"supernft-5b952.firebaseapp.com",
projectId:"supernft-5b952"
});

const auth = firebase.auth();
const db = firebase.firestore();

auth.onAuthStateChanged(user=>{

if(!user){
alert("Login Required");
return;
}

loadDeposits();

});

function loadDeposits(){

db.collection("depositRequests").get()
.then(snapshot=>{

const body=document.getElementById("body");
body.innerHTML="";

snapshot.forEach(doc=>{

const d=doc.data();
const row=body.insertRow();

row.insertCell(0).innerText=d.email||"-";
row.insertCell(1).innerText="$"+(d.amount||0);
row.insertCell(2).innerText=d.txid||"-";
row.insertCell(3).innerText=d.status||"pending";

const action=row.insertCell(4);

const approve=document.createElement("button");
approve.innerText="Approve";
approve.className="approve";
approve.onclick=()=>approveDeposit(doc.id,d);
action.appendChild(approve);

const reject=document.createElement("button");
reject.innerText="Reject";
reject.className="reject";
reject.onclick=()=>rejectDeposit(doc.id);
action.appendChild(reject);

});

})
.catch(err=>{
alert("Firestore Error: "+err.message);
});

}

function approveDeposit(id,data){

if(data.status==="approved"){
alert("Already Approved");
return;
}

db.collection("depositRequests").doc(id).update({
status:"approved"
})
.then(()=>{
alert("Approved");
loadDeposits();
})
.catch(err=>{
alert(err.message);
});

}

function rejectDeposit(id){

db.collection("depositRequests").doc(id).update({
status:"rejected"
})
.then(()=>{
alert("Rejected");
loadDeposits();
})
.catch(err=>{
alert(err.message);
});

}

</script>

</body>
</html>
