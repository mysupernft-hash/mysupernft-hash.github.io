<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Deposits | SuperNFT</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0d0d0d;
  color:#FFD700;
}

header{
  background:#111;
  padding:15px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
}

nav{
  background:#1a1a1a;
  padding:10px;
  display:flex;
  gap:15px;
  flex-wrap:wrap;
}

nav a{
  color:#FFD700;
  text-decoration:none;
}

.main{
  padding:20px;
}

table{
  width:100%;
  border-collapse:collapse;
}

th, td{
  border:1px solid #333;
  padding:10px;
  text-align:center;
}

button{
  padding:5px 10px;
  border:none;
  border-radius:5px;
  cursor:pointer;
  font-weight:bold;
}

.approve{
  background:green;
  color:white;
}

.reject{
  background:red;
  color:white;
}
</style>
</head>

<body>

<header>Admin Deposits</header>

<nav>
  <a href="admin-dashboard.html">Dashboard</a>
  <a href="admin-users.html">Users</a>
  <a href="admin-deposits.html">Deposits</a>
  <a href="admin-withdraw.html">Withdraw</a>
</nav>

<div class="main">
<h2>All Deposit Requests</h2>

<table>
<thead>
<tr>
<th>Email</th>
<th>Amount</th>
<th>TXID</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>
<tbody id="depositBody"></tbody>
</table>

</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain: "supernft-5b952.firebaseapp.com",
  projectId: "supernft-5b952"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

const depositBody = document.getElementById("depositBody");

auth.onAuthStateChanged(user=>{
  if(!user){
    location.href="admin-login.html";
    return;
  }
  loadDeposits();
});

function loadDeposits(){
  depositBody.innerHTML = "";

  db.collection("depositRequests")
  .orderBy("createdAt","desc")
  .onSnapshot(snapshot=>{

    depositBody.innerHTML = "";

    snapshot.forEach(doc=>{
      const d = doc.data();

      const row = document.createElement("tr");

      row.innerHTML = `
        <td>${d.email}</td>
        <td>$${d.amount}</td>
        <td>${d.txid}</td>
        <td>${d.status}</td>
        <td>
          ${
            d.status === "pending"
            ?
            `<button class="approve" onclick="approveDeposit('${doc.id}','${d.userId}',${d.amount})">Approve</button>
             <button class="reject" onclick="rejectDeposit('${doc.id}')">Reject</button>`
            :
            "Completed"
          }
        </td>
      `;

      depositBody.appendChild(row);
    });

  });
}

/* ✅ APPROVE */
function approveDeposit(depositId, userId, amount){

  const userRef = db.collection("users").doc(userId);
  const depositRef = db.collection("depositRequests").doc(depositId);

  db.runTransaction(async (transaction)=>{

    const userDoc = await transaction.get(userRef);

    if(!userDoc.exists) return;

    const currentDeposit = userDoc.data().totalDeposit || 0;

    transaction.update(userRef,{
      totalDeposit: currentDeposit + amount
    });

    transaction.update(depositRef,{
      status:"approved"
    });

  }).then(()=>{
    alert("Deposit Approved & User Balance Updated");
  });

}

/* ❌ REJECT */
function rejectDeposit(depositId){
  db.collection("depositRequests")
  .doc(depositId)
  .update({status:"rejected"})
  .then(()=>{
    alert("Deposit Rejected");
  });
}

</script>

</body>
</html>
