<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Deposits</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
body{background:#0f0f0f;color:#FFD700;font-family:Arial;margin:0;padding:20px;}
table{width:100%;border-collapse:collapse;margin-top:20px;}
th,td{border:1px solid #333;padding:8px;text-align:center;}
button{padding:6px 10px;margin:2px;border:none;border-radius:6px;cursor:pointer;}
.approve{background:green;color:white;}
.reject{background:red;color:white;}
</style>
</head>
<body>

<h2>Admin Deposit Requests</h2>

<table>
<thead>
<tr>
<th>Email</th>
<th>Amount</th>
<th>TXID</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>
<tbody id="body"></tbody>
</table>

<script>

firebase.initializeApp({
apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
authDomain:"supernft-5b952.firebaseapp.com",
projectId:"supernft-5b952"
});

const auth = firebase.auth();
const db = firebase.firestore();

auth.onAuthStateChanged(user=>{
if(!user){
alert("Login Required");
return;
}
loadDeposits();
});

function loadDeposits(){

db.collection("depositRequests").get()
.then(snapshot=>{

const body=document.getElementById("body");
body.innerHTML="";

snapshot.forEach(doc=>{

const d=doc.data();
const row=body.insertRow();

row.insertCell(0).innerText=d.email||"-";
row.insertCell(1).innerText="$"+(d.amount||0);
row.insertCell(2).innerText=d.txid||"-";
row.insertCell(3).innerText=d.status||"pending";

const action=row.insertCell(4);

const approve=document.createElement("button");
approve.innerText="Approve";
approve.className="approve";
approve.onclick=()=>approveDeposit(doc.id,d);
action.appendChild(approve);

const reject=document.createElement("button");
reject.innerText="Reject";
reject.className="reject";
reject.onclick=()=>rejectDeposit(doc.id);
action.appendChild(reject);

});

});

}

async function approveDeposit(id,data){

if(data.status==="approved"){
alert("Already Approved");
return;
}

const depositAmount = Number(data.amount);
const userId = data.userId;

const userRef = db.collection("users").doc(userId);
const userSnap = await userRef.get();

if(!userSnap.exists){
alert("User not found");
return;
}

const userData = userSnap.data();

// ✅ Update user totalDeposit
await userRef.update({
totalDeposit:(userData.totalDeposit||0)+depositAmount
});

// =============================
// 🔥 LEVEL 1 COMMISSION (20%)
// =============================

const level1Uid = userData.referredByUid;

if(level1Uid){

const level1Ref = db.collection("users").doc(level1Uid);
const level1Snap = await level1Ref.get();

if(level1Snap.exists){

const commission = depositAmount * 0.20;
const refData = level1Snap.data();
const history = refData.commissionHistory || [];

history.push({
level:1,
amount:commission,
depositAmount:depositAmount,
date:new Date()
});

await level1Ref.update({
walletBalance:(refData.walletBalance||0)+commission,
referralEarnings:(refData.referralEarnings||0)+commission,
commissionHistory:history
});

}
}

// =============================
// 🔥 LEVEL 2 COMMISSION (15%)
// =============================

if(level1Uid){

const level1Snap = await db.collection("users").doc(level1Uid).get();
const level1Data = level1Snap.data();
const level2Uid = level1Data.referredByUid;

if(level2Uid){

const level2Ref = db.collection("users").doc(level2Uid);
const level2Snap = await level2Ref.get();

if(level2Snap.exists){

const commission = depositAmount * 0.15;
const refData = level2Snap.data();
const history = refData.commissionHistory || [];

history.push({
level:2,
amount:commission,
depositAmount:depositAmount,
date:new Date()
});

await level2Ref.update({
walletBalance:(refData.walletBalance||0)+commission,
referralEarnings:(refData.referralEarnings||0)+commission,
commissionHistory:history
});

}
}
}

// =============================
// 🔥 LEVEL 3 COMMISSION (10%)
// =============================

if(level1Uid){

const level1Snap = await db.collection("users").doc(level1Uid).get();
const level1Data = level1Snap.data();
const level2Uid = level1Data.referredByUid;

if(level2Uid){

const level2Snap = await db.collection("users").doc(level2Uid).get();
const level2Data = level2Snap.data();
const level3Uid = level2Data.referredByUid;

if(level3Uid){

const level3Ref = db.collection("users").doc(level3Uid);
const level3Snap = await level3Ref.get();

if(level3Snap.exists){

const commission = depositAmount * 0.10;
const refData = level3Snap.data();
const history = refData.commissionHistory || [];

history.push({
level:3,
amount:commission,
depositAmount:depositAmount,
date:new Date()
});

await level3Ref.update({
walletBalance:(refData.walletBalance||0)+commission,
referralEarnings:(refData.referralEarnings||0)+commission,
commissionHistory:history
});

}
}
}
}

// ✅ Mark deposit approved
await db.collection("depositRequests").doc(id).update({
status:"approved"
});

alert("Deposit Approved + Commission Distributed");
loadDeposits();
}

function rejectDeposit(id){

db.collection("depositRequests").doc(id).update({
status:"rejected"
})
.then(()=>{
alert("Rejected");
loadDeposits();
});

}

</script>

</body>
</html>
