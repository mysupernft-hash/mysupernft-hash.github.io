<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Deposits | SuperNFT</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
body{margin:0;font-family:Arial;background:#0f0f0f;color:#FFD700;padding:20px;}
header{font-size:22px;font-weight:bold;margin-bottom:20px;}
table{width:100%;border-collapse:collapse;}
th,td{padding:10px;text-align:center;}
th{background:#1a1a1a;}
tr{background:#111;}
button{padding:6px 10px;border:none;border-radius:6px;font-weight:bold;cursor:pointer;margin:2px;}
.approve{background:#00cc66;color:#000;}
.reject{background:red;color:#fff;}
</style>
</head>
<body>

<header>Admin Deposits</header>

<table>
<thead>
<tr>
<th>Email</th>
<th>Amount</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>
<tbody id="depositBody"></tbody>
</table>

<script>

firebase.initializeApp({
  apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain:"supernft-5b952.firebaseapp.com",
  projectId:"supernft-5b952"
});

const db = firebase.firestore();
const body = document.getElementById("depositBody");

/* LOAD DEPOSITS */
function loadDeposits(){
  body.innerHTML="";

  db.collection("depositRequests").get().then(snapshot=>{
    snapshot.forEach(doc=>{

      const d = doc.data();

      const row = body.insertRow();
      row.insertCell(0).innerText = d.email;
      row.insertCell(1).innerText = "$" + d.amount;
      row.insertCell(2).innerText = d.status;

      const actionCell = row.insertCell(3);

      if(d.status === "pending"){

        const approveBtn = document.createElement("button");
        approveBtn.innerText="Approve";
        approveBtn.className="approve";

        approveBtn.onclick = async ()=>{

          const depositId = doc.id;
          const userId = d.userId;
          const amount = Number(d.amount);

          // Prevent double approve
          const depositSnap = await db.collection("depositRequests").doc(depositId).get();
          if(depositSnap.data().status !== "pending"){
            alert("Already processed");
            return;
          }

          const userRef = db.collection("users").doc(userId);
          const userSnap = await userRef.get();
          if(!userSnap.exists) return;

          const userData = userSnap.data();

          // 1️⃣ Add deposit to user
          await userRef.update({
            totalDeposit: firebase.firestore.FieldValue.increment(amount)
          });

          /* =========================
             🔥 LEVEL COMMISSION LOGIC
          ========================== */

          // LEVEL 1 (20%)
          if(userData.referredByUid){

            const l1Ref = db.collection("users").doc(userData.referredByUid);
            const l1Commission = amount * 0.20;

            await l1Ref.update({
              referralEarnings: firebase.firestore.FieldValue.increment(l1Commission),
              walletBalance: firebase.firestore.FieldValue.increment(l1Commission),
              commissionHistory: firebase.firestore.FieldValue.arrayUnion({
                level:1,
                amount:l1Commission,
                depositAmount:amount,
                from:userId,
                createdAt:new Date()
              })
            });

            const l1Snap = await l1Ref.get();
            const l1Data = l1Snap.data();

            // LEVEL 2 (15%)
            if(l1Data.referredByUid){

              const l2Ref = db.collection("users").doc(l1Data.referredByUid);
              const l2Commission = amount * 0.15;

              await l2Ref.update({
                referralEarnings: firebase.firestore.FieldValue.increment(l2Commission),
                walletBalance: firebase.firestore.FieldValue.increment(l2Commission),
                commissionHistory: firebase.firestore.FieldValue.arrayUnion({
                  level:2,
                  amount:l2Commission,
                  depositAmount:amount,
                  from:userId,
                  createdAt:new Date()
                })
              });

              const l2Snap = await l2Ref.get();
              const l2Data = l2Snap.data();

              // LEVEL 3 (10%)
              if(l2Data.referredByUid){

                const l3Ref = db.collection("users").doc(l2Data.referredByUid);
                const l3Commission = amount * 0.10;

                await l3Ref.update({
                  referralEarnings: firebase.firestore.FieldValue.increment(l3Commission),
                  walletBalance: firebase.firestore.FieldValue.increment(l3Commission),
                  commissionHistory: firebase.firestore.FieldValue.arrayUnion({
                    level:3,
                    amount:l3Commission,
                    depositAmount:amount,
                    from:userId,
                    createdAt:new Date()
                  })
                });

              }
            }
          }

          // 2️⃣ Mark deposit approved
          await db.collection("depositRequests").doc(depositId).update({
            status:"approved"
          });

          alert("Deposit approved & commission distributed ✅");
          loadDeposits();
        };

        actionCell.appendChild(approveBtn);

        const rejectBtn = document.createElement("button");
        rejectBtn.innerText="Reject";
        rejectBtn.className="reject";
        rejectBtn.onclick = async ()=>{
          await db.collection("depositRequests").doc(doc.id).update({
            status:"rejected"
          });
          loadDeposits();
        };

        actionCell.appendChild(rejectBtn);
      }
      else{
        actionCell.innerText = "-";
      }

    });
  });
}

loadDeposits();

</script>

</body>
</html>
