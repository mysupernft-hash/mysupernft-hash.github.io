<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SuperNFT - Live Earnings</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#0f0f0f;
  color:#FFD700;
  text-align:center;
}

header{
  background:#1a1a1a;
  padding:15px;
  font-size:22px;
  border-bottom:2px solid #FFD700;
}

.container{
  padding:20px;
}

.card{
  background:#1a1a1a;
  border:1px solid #FFD700;
  border-radius:12px;
  padding:20px;
  margin:20px auto;
  max-width:420px;
}

.label{
  font-size:14px;
  opacity:0.8;
}

.value{
  font-size:26px;
  font-weight:bold;
  margin-top:8px;
}

.progress{
  width:100%;
  background:#272727;
  border-radius:10px;
  margin-top:15px;
  overflow:hidden;
}

.progress-bar{
  height:12px;
  width:0%;
  background:#FFD700;
  transition:width 1s linear;
}

button{
  margin-top:25px;
  padding:10px 18px;
  border:none;
  border-radius:8px;
  background:#FFD700;
  color:#000;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#e6c200;
}
</style>
</head>
<body>

<header>💹 SuperNFT Live Earnings</header>

<div class="container">

  <div class="card">
    <div class="label">Daily Income</div>
    <div class="value" id="dailyIncome">$0.00</div>
  </div>

  <div class="card">
    <div class="label">Live Earnings</div>
    <div class="value" id="liveEarnings">$0.000000</div>

    <div class="progress">
      <div class="progress-bar" id="progressBar"></div>
    </div>
  </div>

  <button onclick="goBack()">⬅ Back to Dashboard</button>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ===============================
   FIREBASE INIT
=================================*/

const firebaseConfig = {
  apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain:"supernft-5b952.firebaseapp.com",
  projectId:"supernft-5b952"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* ===============================
   LIVE MINING SYSTEM
=================================*/

onAuthStateChanged(auth, async (user) => {

  if (!user) {
    window.location.replace("login.html");
    return;
  }

  const userRef = doc(db,"users",user.uid);

  let intervalStarted = false;

  if (!intervalStarted) {
    intervalStarted = true;

    setInterval(async () => {

      const snap = await getDoc(userRef);
      if (!snap.exists()) return;

      const data = snap.data();

      const now = Date.now();
      const last = data.lastIncomeAt?.toMillis?.() || now;
      const seconds = Math.floor((now - last) / 1000);

      const daily = data.dailyIncome || 0;
      const perSecond = daily / 86400;
      const live = perSecond * seconds;

      // Update UI
      document.getElementById("dailyIncome").innerText =
        "$" + daily.toFixed(2);

      document.getElementById("liveEarnings").innerText =
        "$" + live.toFixed(6);

      const percent = Math.min((seconds / 86400) * 100, 100);
      document.getElementById("progressBar").style.width =
        percent + "%";

      // 24h complete → credit wallet
      if (seconds >= 86400) {
        await updateDoc(userRef, {
          walletBalance: (data.walletBalance || 0) + daily,
          lastIncomeAt: new Date()
        });
      }

    }, 1000);
  }

});

/* ===============================
   NAVIGATION
=================================*/

window.goBack = function(){
  window.location.href = "dashboard.html";
};

</script>

</body>
</html>
