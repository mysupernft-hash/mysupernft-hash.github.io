<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SuperNFT Live Earnings</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f0f0f;
  color:#FFD700;
  text-align:center;
}

header{
  padding:15px;
  background:#1a1a1a;
  font-size:20px;
  border-bottom:2px solid #FFD700;
}

.container{
  padding:20px;
}

.box{
  background:#1a1a1a;
  padding:20px;
  border-radius:12px;
  margin:20px auto;
  max-width:400px;
  border:1px solid #FFD700;
}

.value{
  font-size:24px;
  font-weight:bold;
  margin-top:10px;
}

.progress{
  width:100%;
  background:#272727;
  border-radius:10px;
  overflow:hidden;
  margin-top:15px;
}

.progress-bar{
  height:10px;
  width:0%;
  background:#FFD700;
  transition:width 1s linear;
}

button{
  background:#FFD700;
  border:none;
  padding:10px 15px;
  border-radius:8px;
  color:#000;
  font-weight:bold;
  cursor:pointer;
  margin-top:20px;
}

button:hover{
  background:#e6c200;
}
</style>
</head>
<body>

<header>💹 SuperNFT Live Earnings</header>

<div class="container">

  <div class="box">
    <div>Daily Income</div>
    <div class="value" id="dailyIncome">$0.00</div>
  </div>

  <div class="box">
    <div>Live Earnings</div>
    <div class="value" id="liveEarnings">$0.0000</div>

    <div class="progress">
      <div class="progress-bar" id="progressBar"></div>
    </div>

  </div>

  <button onclick="goBack()">Back to Dashboard</button>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain:"supernft-5b952.firebaseapp.com",
  projectId:"supernft-5b952"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

onAuthStateChanged(auth, async (user) => {

  if (!user) {
    window.location.replace("login.html");
    return;
  }

  const userRef = doc(db, "users", user.uid);

  setInterval(async () => {

    const snap = await getDoc(userRef);
    if (!snap.exists()) return;

    const data = snap.data();

    const now = Date.now();
    const last = data.lastIncomeAt?.toMillis() || now;
    const seconds = Math.floor((now - last) / 1000);

    const perSecond = (data.dailyIncome || 0) / 86400;
    const live = perSecond * seconds;

    // 24h complete → credit wallet
    if (seconds >= 86400) {

      await updateDoc(userRef, {
        walletBalance: (data.walletBalance || 0) + (data.dailyIncome || 0),
        lastIncomeAt: new Date()
      });

      return;
    }

    // Update UI
    document.getElementById("dailyIncome").innerText =
      "$" + (data.dailyIncome || 0).toFixed(2);

    document.getElementById("liveEarnings").innerText =
      "$" + live.toFixed(4);

    // Progress bar %
    const percent = (seconds / 86400) * 100;
    document.getElementById("progressBar").style.width =
      percent + "%";

  }, 1000);

});

window.goBack = function(){
  window.location.href="dashboard.html";
};

</script>

</body>
</html>
