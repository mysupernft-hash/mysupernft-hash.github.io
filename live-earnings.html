<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Earnings | SuperNFT</title>

<style>
body{margin:0;font-family:Arial;background:#0f0f0f;color:#FFD700;text-align:center;}
header{background:#1a1a1a;padding:15px;font-size:20px;font-weight:bold;}
.container{padding:30px 20px;}
.big{font-size:38px;font-weight:bold;margin:20px 0;}
.small{font-size:14px;opacity:0.7;}
.card{background:#1a1a1a;padding:20px;border-radius:12px;margin-top:20px;}
.back{display:block;margin-top:30px;padding:12px;background:#FFD700;color:#000;border-radius:8px;text-decoration:none;font-weight:bold;}
</style>
</head>

<body>

<header>💹 Live Earnings</header>

<div class="container">

<div class="big" id="liveEarnings">$0.000000</div>
<div class="small">Real-time mining income</div>

<div class="card">
  Wallet Total:
  <div class="big">$<span id="walletTotal">0.00</span></div>
</div>

<a href="dashboard.html" class="back">⬅ Back to Dashboard</a>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain:"supernft-5b952.firebaseapp.com",
  projectId:"supernft-5b952"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

onAuthStateChanged(auth, async (user)=>{

  if(!user){
    location.href="login.html";
    return;
  }

  const userRef = doc(db,"users",user.uid);
  const snap = await getDoc(userRef);

  if(!snap.exists()) return;

  let data = snap.data();

  let dailyIncome = data.dailyIncome || 0;
  let walletBalance = data.walletBalance || 0;

  // If no income set
  if(dailyIncome <= 0){
    document.getElementById("liveEarnings").innerText="$0.000000";
    document.getElementById("walletTotal").innerText=walletBalance.toFixed(2);
    return;
  }

  // First time setup
  if(!data.lastIncomeAt){
    await updateDoc(userRef,{
      lastIncomeAt: serverTimestamp()
    });
    return;
  }

  let lastIncomeAt = data.lastIncomeAt.toMillis();

  let creditedToday = false;

  async function updateMining(){

    const now = Date.now();
    const seconds = Math.floor((now - lastIncomeAt) / 1000);

    const perSecond = dailyIncome / 86400;
    const live = perSecond * seconds;

    // Credit after 24 hours only once
    if(seconds >= 86400 && !creditedToday){

      creditedToday = true;

      walletBalance += dailyIncome;

      await updateDoc(userRef,{
        walletBalance: walletBalance,
        lastIncomeAt: serverTimestamp()
      });

      lastIncomeAt = Date.now();
      return;
    }

    document.getElementById("liveEarnings").innerText =
      "$" + live.toFixed(6);

    document.getElementById("walletTotal").innerText =
      (walletBalance + live).toFixed(2);
  }

  updateMining();
  setInterval(updateMining,1000);

});

</script>

</body>
</html>
