<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Earnings | SuperNFT</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0f0f0f;
  color:#FFD700;
}

header{
  background:#1a1a1a;
  padding:15px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
}

.container{
  padding:20px;
}

.card{
  background:#1a1a1a;
  padding:20px;
  border-radius:12px;
  margin-bottom:20px;
  text-align:center;
}

.big{
  font-size:32px;
  font-weight:bold;
  margin-top:10px;
}

.small{
  font-size:14px;
  opacity:0.8;
}

.btn{
  display:block;
  margin-top:20px;
  padding:12px;
  background:#FFD700;
  color:#000;
  text-align:center;
  border-radius:8px;
  text-decoration:none;
  font-weight:bold;
}
</style>
</head>
<body>

<header>💹 Live Earnings</header>

<div class="container">

  <div class="card">
    <div>Daily Income</div>
    <div class="big">$<span id="dailyIncome">0</span></div>
  </div>

  <div class="card">
    <div>Live Earnings</div>
    <div class="big">$<span id="liveEarnings">0.000000</span></div>
    <div class="small">Mining in progress...</div>
  </div>

  <a href="dashboard.html" class="btn">⬅ Back to Dashboard</a>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain:"supernft-5b952.firebaseapp.com",
  projectId:"supernft-5b952"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

onAuthStateChanged(auth,(user)=>{

  if(!user){
    location.href="login.html";
    return;
  }

  const userRef = doc(db,"users",user.uid);

  onSnapshot(userRef,(snap)=>{

    if(!snap.exists()) return;

    const data = snap.data();

    const daily = data.dailyIncome || 0;
    document.getElementById("dailyIncome").innerText = daily.toFixed(2);

    // 🔥 LIVE MINING CALCULATION (Same as Account Page)

    function updateLive(){

      const now = Date.now();
      const last = data.lastIncomeAt?.toMillis() || now;

      const secondsPassed = (now - last) / 1000;
      const perSecond = daily / 86400;

      const live = (data.liveEarnings || 0) + (perSecond * secondsPassed);

      document.getElementById("liveEarnings").innerText =
        live.toFixed(6);

      requestAnimationFrame(updateLive);
    }

    updateLive();

  });

});

</script>

</body>
</html>
