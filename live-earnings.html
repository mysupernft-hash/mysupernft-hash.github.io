<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Earnings | SuperNFT</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#0f0f0f;
  color:#FFD700;
}

header{
  background:#1a1a1a;
  padding:15px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
}

.container{
  padding:20px;
}

.card{
  background:#1a1a1a;
  border-radius:12px;
  padding:20px;
  margin-bottom:15px;
  text-align:center;
}

.big{
  font-size:28px;
  font-weight:bold;
  margin-top:10px;
}

.back{
  display:block;
  margin-top:20px;
  padding:12px;
  background:#272727;
  color:#FFD700;
  text-align:center;
  border-radius:8px;
  text-decoration:none;
}
</style>
</head>

<body>

<header>💹 Live Earnings</header>

<div class="container">

  <div class="card">
    <div>Daily Income</div>
    <div class="big">$<span id="dailyIncome">0</span></div>
  </div>

  <div class="card">
    <div>Live Earnings</div>
    <div class="big">$<span id="liveEarnings">0.000000</span></div>
  </div>

  <div class="card">
    <div>Total Wallet (Live)</div>
    <div class="big">$<span id="walletBalance">0</span></div>
  </div>

  <a href="dashboard.html" class="back">⬅ Back to Dashboard</a>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* 🔥 Firebase Config */
const firebaseConfig = {
  apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain:"supernft-5b952.firebaseapp.com",
  projectId:"supernft-5b952"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* 🔥 AUTH CHECK */
onAuthStateChanged(auth, async(user)=>{

  if(!user){
    location.href="login.html";
    return;
  }

  const userRef = doc(db,"users",user.uid);
  const snap = await getDoc(userRef);

  if(!snap.exists()) return;

  const data = snap.data();

  const dailyIncome = data.dailyIncome || 0;
  const walletBalance = data.walletBalance || 0;

  const lastIncomeAt = data.lastIncomeAt?.toMillis() || Date.now();

  document.getElementById("dailyIncome").innerText =
    dailyIncome.toFixed(2);

  /* 🔥 REAL TIME CALCULATION (NO DATABASE UPDATE) */
  function animate(){

    const now = Date.now();
    const secondsPassed = (now - lastIncomeAt) / 1000;

    const perSecond = dailyIncome / 86400;

    const live = perSecond * secondsPassed;

    document.getElementById("liveEarnings").innerText =
      live.toFixed(6);

    document.getElementById("walletBalance").innerText =
      (walletBalance + live).toFixed(2);

    requestAnimationFrame(animate);
  }

  animate();

});

</script>

</body>
</html>
