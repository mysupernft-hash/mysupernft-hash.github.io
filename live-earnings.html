<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Earnings | SuperNFT</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0f0f0f;
  color:#FFD700;
}

header{
  background:#1a1a1a;
  padding:15px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
  position:sticky;
  top:0;
}

.container{
  padding:20px;
}

.card{
  background:#1a1a1a;
  padding:25px;
  border-radius:15px;
  text-align:center;
  margin-bottom:20px;
  box-shadow:0 0 20px rgba(255,215,0,0.1);
}

.big{
  font-size:32px;
  font-weight:bold;
  margin-top:10px;
}

.small{
  font-size:14px;
  opacity:0.7;
}

.back{
  display:block;
  margin-top:20px;
  padding:12px;
  background:#FFD700;
  color:#000;
  text-align:center;
  border-radius:10px;
  text-decoration:none;
  font-weight:bold;
}

.mining{
  margin-top:15px;
  font-size:14px;
  color:#00ff88;
  animation:blink 1s infinite;
}

@keyframes blink{
  50%{opacity:0.4;}
}
</style>
</head>

<body>

<header>⚡ Live Earnings</header>

<div class="container">

<div class="card">
  <div>Current Live Earnings</div>
  <div class="big">$<span class="liveEarnings">0.000000</span></div>
  <div class="mining">● Mining Active</div>
</div>

<div class="card">
  <div>Total Daily Income</div>
  <div class="big">$<span id="dailyIncome">0</span></div>
  <div class="small">Calculated per 24 hours</div>
</div>

<a href="dashboard.html" class="back">⬅ Back to Dashboard</a>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain:"supernft-5b952.firebaseapp.com",
  projectId:"supernft-5b952"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

onAuthStateChanged(auth,(user)=>{

  if(!user){
    location.href="login.html";
    return;
  }

  const userRef = doc(db,"users",user.uid);

  onSnapshot(userRef,(snap)=>{

    if(!snap.exists()) return;

    const data = snap.data();

    const live = data.liveEarnings || 0;
    const daily = data.dailyIncome || 0;

    // Update live everywhere
    document.querySelectorAll(".liveEarnings").forEach(el=>{
      el.innerText = Number(live).toFixed(6);
    });

    document.getElementById("dailyIncome").innerText = daily;

  });

});

</script>

</body>
</html>
