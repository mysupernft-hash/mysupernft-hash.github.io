<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Earnings | SuperNFT</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0f0f0f;
  color:#FFD700;
  text-align:center;
}

header{
  background:#1a1a1a;
  padding:15px;
  font-size:20px;
  font-weight:bold;
}

.container{
  padding:20px;
}

.card{
  background:#1a1a1a;
  padding:20px;
  border-radius:12px;
  margin-bottom:15px;
}

.big{
  font-size:30px;
  font-weight:bold;
}

.small{
  font-size:14px;
  opacity:0.8;
}

.back{
  display:block;
  margin-top:20px;
  padding:12px;
  background:#272727;
  border-radius:8px;
  color:#FFD700;
  text-decoration:none;
}
</style>
</head>

<body>

<header>⚡ Live Earnings</header>

<div class="container">

  <div class="card">
    <div class="small">Daily Income</div>
    <div class="big" id="dailyIncome">$0</div>
  </div>

  <div class="card">
    <div class="small">Live Mining</div>
    <div class="big" id="liveEarnings">$0.000000</div>
  </div>

  <div class="card">
    <div class="small">Wallet Balance (With Live)</div>
    <div class="big" id="walletTotal">$0</div>
  </div>

  <a href="dashboard.html" class="back">⬅ Back to Dashboard</a>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain: "supernft-5b952.firebaseapp.com",
  projectId: "supernft-5b952"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

onAuthStateChanged(auth, async (user) => {

  if(!user){
    window.location.href = "login.html";
    return;
  }

  const userRef = doc(db,"users",user.uid);
  const snap = await getDoc(userRef);

  if(!snap.exists()) return;

  const data = snap.data();

  const dailyIncome = data.dailyIncome || 0;
  let lastIncomeAt = data.lastIncomeAt?.toMillis?.() || Date.now();

  document.getElementById("dailyIncome").innerText =
    "$" + dailyIncome.toFixed(2);

  function updateLive(){

    const now = Date.now();
    const secondsPassed = Math.floor((now - lastIncomeAt) / 1000);

    const perSecond = dailyIncome / 86400;
    const live = perSecond * secondsPassed;

    // 24h complete → credit wallet
    if(secondsPassed >= 86400){

      updateDoc(userRef,{
        walletBalance: (data.walletBalance || 0) + dailyIncome,
        lastIncomeAt: new Date()
      });

      lastIncomeAt = Date.now();
      return;
    }

    document.getElementById("liveEarnings").innerText =
      "$" + live.toFixed(6);

    const totalWallet = (data.walletBalance || 0) + live;

    document.getElementById("walletTotal").innerText =
      "$" + totalWallet.toFixed(2);
  }

  updateLive();
  setInterval(updateLive,1000);

});

</script>

</body>
</html>
