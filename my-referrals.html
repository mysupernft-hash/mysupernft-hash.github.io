<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Referrals | SuperNFT</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f0f0f;
  color:#FFD700;
  padding:20px;
}
.card{
  background:#1a1a1a;
  padding:15px;
  border-radius:12px;
  margin-bottom:15px;
}
button{
  padding:8px 12px;
  border:none;
  border-radius:6px;
  background:#FFD700;
  color:#000;
  font-weight:bold;
  cursor:pointer;
}
button:hover{
  background:#e6c200;
}
.link-box{
  word-break:break-all;
  margin-top:8px;
  font-size:14px;
}
</style>
</head>

<body>

<h2>👥 My Referrals</h2>

<!-- Existing Referral Code -->
<div class="card">
  <div><b>Your Referral Code</b></div>
  <div id="refCode">Loading...</div>
</div>

<!-- ✅ NEW FULL LINK SECTION -->
<div class="card">
  <div><b>Full Referral Link</b></div>
  <div id="fullReferralLink" class="link-box">Loading...</div>
  <button onclick="copyFullReferral()">Copy Link</button>
</div>

<!-- Existing Referral Stats (Untouched) -->
<div class="card">
  <div><b>Total Referrals</b></div>
  <div id="refCount">0</div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain:"supernft-5b952.firebaseapp.com",
  projectId:"supernft-5b952"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

onAuthStateChanged(auth, async(user)=>{

  if(!user){
    window.location.href="login.html";
    return;
  }

  const snap = await getDoc(doc(db,"users",user.uid));
  if(!snap.exists()) return;

  const data = snap.data();

  // Show Referral Code
  document.getElementById("refCode").innerText =
    data.referralCode || "N/A";

  // ✅ Full Referral Link
  const fullLink =
    "https://mysupernft-hash.github.io/signup.html?ref=" +
    data.referralCode;

  document.getElementById("fullReferralLink").innerText = fullLink;

  // Existing Referral Count (if using subcollection)
  const refCol = collection(db,"users",user.uid,"referrals");
  const refSnap = await getDocs(refCol);
  document.getElementById("refCount").innerText = refSnap.size;

});

// Copy function
window.copyFullReferral = function(){
  const text = document.getElementById("fullReferralLink").innerText;
  navigator.clipboard.writeText(text);
  alert("Referral link copied!");
}

</script>

</body>
</html>
