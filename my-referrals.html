<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>My Referrals | SuperNFT</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f0f0f;
  color:#FFD700;
  padding:15px;
}

h2{
  text-align:center;
}

.card{
  background:#1a1a1a;
  padding:15px;
  border-radius:12px;
  margin-bottom:15px;
}

.user-box{
  background:#111;
  padding:10px;
  border-radius:8px;
  margin-top:10px;
}

.small{
  font-size:12px;
  color:#ccc;
}

button{
  padding:8px 12px;
  border:none;
  border-radius:6px;
  background:#FFD700;
  color:#000;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#e6c200;
}

.link-box{
  word-break:break-all;
  margin-top:8px;
}

.stat{
  font-size:20px;
  font-weight:bold;
  text-align:center;
  margin-top:5px;
}

</style>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

</head>
<body>

<h2>👥 My Referrals</h2>

<div class="card">
  <b>Your Referral Code</b>
  <div id="refCode">Loading...</div>
</div>

<div class="card">
  <b>Full Referral Link</b>
  <div id="fullReferralLink" class="link-box">Loading...</div>
  <button onclick="copyLink()">Copy</button>
</div>

<div class="card">
  <b>Total Referrals</b>
  <div id="count" class="stat">0</div>
</div>

<div class="card">
  <b>Referral Users</b>
  <div id="list">Loading...</div>
</div>

<script>

firebase.initializeApp({
apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
authDomain:"supernft-5b952.firebaseapp.com",
projectId:"supernft-5b952"
});

const auth = firebase.auth();
const db = firebase.firestore();

auth.onAuthStateChanged(user=>{

if(!user){
location.href="login.html";
return;
}

loadReferrals(user);

});

async function loadReferrals(user){

const userDoc = await db.collection("users").doc(user.uid).get();
if(!userDoc.exists) return;

const data = userDoc.data();
const referralCode = data.referralCode;

// Show referral code
document.getElementById("refCode").innerText = referralCode;

// Show full link
document.getElementById("fullReferralLink").innerText =
"https://mysupernft-hash.github.io/signup.html?ref=" + referralCode;


// 🔥 Real-time listener for ALL users
db.collection("users").onSnapshot(snapshot=>{

let allRefs = new Map();

snapshot.forEach(doc=>{

const u = doc.data();

// NEW SYSTEM (UID Based)
if(u.referredByUid === user.uid){
allRefs.set(doc.id, u);
}

// OLD SYSTEM (Code Based)
if(u.referredBy === referralCode){
allRefs.set(doc.id, u);
}

});

const referrals = Array.from(allRefs.values());

// Sort newest first
referrals.sort((a,b)=>{
if(!a.createdAt || !b.createdAt) return 0;
return b.createdAt.seconds - a.createdAt.seconds;
});

document.getElementById("count").innerText = referrals.length;

let html="";

if(referrals.length===0){
html="No referrals yet.";
}
else{

referrals.forEach(u=>{

const displayName =
u.name ||
(u.email ? u.email.split("@")[0] : "User");

const join =
u.createdAt?.toDate().toLocaleString() || "-";

html += `
<div class="user-box">
<b>${displayName}</b><br>
${u.email || ""}<br>
<div class="small">Joined: ${join}</div>
</div>
`;

});

}

document.getElementById("list").innerHTML = html;

});

}


// Copy link
function copyLink(){
const text = document.getElementById("fullReferralLink").innerText;
navigator.clipboard.writeText(text);
alert("Referral link copied!");
}

</script>

</body>
</html>
