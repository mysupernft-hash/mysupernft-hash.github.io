<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Referrals | SuperNFT</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#0f0f0f;
  color:#FFD700;
}
header{
  background:#1a1a1a;
  padding:15px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
}
.container{
  padding:20px;
}
.card{
  background:#1a1a1a;
  border-radius:12px;
  padding:15px;
  margin-bottom:12px;
}
.card small{
  color:#aaa;
}
.loading{
  text-align:center;
  margin-top:40px;
}
.back{
  display:block;
  margin-top:20px;
  text-align:center;
  color:#FFD700;
  text-decoration:none;
}
.empty{
  text-align:center;
  margin-top:30px;
  color:#aaa;
}
</style>
</head>

<body>

<header>My Referrals</header>

<div class="container" id="list">
  <div class="loading" id="loading">Loading referrals...</div>
</div>

<a href="dashboard.html" class="back">⬅ Back to Dashboard</a>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore,
  collection,
  getDocs,
  orderBy,
  query
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* 🔥 Firebase Config */
const firebaseConfig = {
  apiKey: "AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain: "supernft-5b952.firebaseapp.com",
  projectId: "supernft-5b952",
  storageBucket: "supernft-5b952.appspot.com",
  messagingSenderId: "278097730700",
  appId: "1:278097730700:web:6ba9892334456fd8512fa9"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const list = document.getElementById("list");
const loading = document.getElementById("loading");

/* 🔹 Load referrals */
onAuthStateChanged(auth, async(user)=>{
  if(!user){
    window.location.replace("login.html");
    return;
  }

  try{
    const q = query(
      collection(db,"users",user.uid,"referrals"),
      orderBy("joinedAt","desc")
    );

    const snap = await getDocs(q);
    loading.remove();

    if(snap.empty){
      list.innerHTML = `<div class="empty">No referrals yet</div>`;
      return;
    }

    snap.forEach(doc=>{
      const d = doc.data();
      const date = d.joinedAt
        ? d.joinedAt.toDate().toLocaleDateString()
        : "-";

      const div = document.createElement("div");
      div.className = "card";
      div.innerHTML = `
        <b>${d.email}</b><br>
        <small>Joined: ${date}</small><br>
        <small>Reward: $${d.reward}</small>
      `;
      list.appendChild(div);
    });

  }catch(err){
    console.error(err);
    list.innerHTML = `<div class="empty">Failed to load referrals</div>`;
  }
});
</script>

</body>
</html>
