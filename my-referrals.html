<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>My Referrals | SuperNFT</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f0f0f;
  color:#FFD700;
  padding:15px;
}

h2{text-align:center;}

.card{
  background:#1a1a1a;
  padding:15px;
  border-radius:12px;
  margin-bottom:15px;
}

.user-box{
  background:#111;
  padding:12px;
  border-radius:10px;
  margin-top:10px;
}

.small{font-size:12px;color:#ccc;}

button{
  padding:8px 12px;
  border:none;
  border-radius:6px;
  background:#FFD700;
  color:#000;
  font-weight:bold;
  cursor:pointer;
}
button:hover{background:#e6c200;}

.link-box{word-break:break-all;margin-top:8px;}

.stat{
  font-size:20px;
  font-weight:bold;
  text-align:center;
}

/* TREE */
#tree{overflow-x:auto;}

.tree ul{
  padding-top:20px;
  position:relative;
  display:flex;
  justify-content:center;
}

.tree ul::before{
  content:'';
  position:absolute;
  top:0;
  left:50%;
  border-left:2px solid #FFD700;
  height:20px;
}

.tree li{
  list-style:none;
  text-align:center;
  position:relative;
  padding:20px 10px 0;
}

.tree li::before, .tree li::after{
  content:'';
  position:absolute;
  top:0;
  width:50%;
  height:20px;
  border-top:2px solid #FFD700;
}

.tree li::before{right:50%;}
.tree li::after{
  left:50%;
  border-left:2px solid #FFD700;
}

.tree li:only-child::before,
.tree li:only-child::after{display:none;}

.tree li:first-child::before{border:none;}
.tree li:last-child::after{border:none;}

.node{
  display:inline-block;
  padding:14px 16px 8px;
  border-radius:25px;
  background:#111;
  border:1px solid #FFD700;
  position:relative;
  font-size:13px;
}

.node:hover{
  transform:scale(1.1);
  box-shadow:0 0 20px #FFD700;
}

/* LEVEL TAG */
.level-tag{
  position:absolute;
  top:-10px;
  left:50%;
  transform:translateX(-50%);
  background:#FFD700;
  color:#000;
  font-size:10px;
  padding:2px 8px;
  border-radius:10px;
  font-weight:bold;
}

.clickable{cursor:pointer;}
</style>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

</head>
<body>

<h2>👥 My Referrals</h2>

<div class="card">
<b>Your Referral Code</b>
<div id="refCode">Loading...</div>
</div>

<div class="card">
<b>Full Referral Link</b>
<div id="fullReferralLink" class="link-box">Loading...</div>
<button onclick="copyLink()">Copy</button>
</div>

<div class="card">
<b>Total Referrals</b>
<div id="count" class="stat">0</div>
</div>

<div class="card">
<b>Referral Users</b>
<div id="list">Loading...</div>
</div>

<div class="card">
<b>🌳 Referral Tree</b>
<div id="tree"></div>
</div>

<script>

firebase.initializeApp({
apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
authDomain:"supernft-5b952.firebaseapp.com",
projectId:"supernft-5b952"
});

const auth = firebase.auth();
const db = firebase.firestore();

auth.onAuthStateChanged(user=>{
if(!user){location.href="login.html";return;}
loadReferrals(user);
});

async function loadReferrals(user){

const userDoc = await db.collection("users").doc(user.uid).get();
const data = userDoc.data();
const referralCode = data.referralCode;

document.getElementById("refCode").innerText = referralCode;

document.getElementById("fullReferralLink").innerText =
"https://mysupernft-hash.github.io/signup.html?ref=" + referralCode;

db.collection("users").onSnapshot(snapshot=>{

let allUsers = [];

snapshot.forEach(doc=>{
allUsers.push({id:doc.id,...doc.data()});
});

/* LEVEL 1 */
let level1 = allUsers.filter(u =>
u.referredByUid === user.uid || u.referredBy === referralCode
);

/* LEVEL 2 */
let level2 = allUsers.filter(u =>
level1.some(l1 => u.referredByUid === l1.id)
);

/* LEVEL 3 */
let level3 = allUsers.filter(u =>
level2.some(l2 => u.referredByUid === l2.id)
);

/* LIST (same as before) */
document.getElementById("count").innerText = level1.length;

let html="";
level1.forEach(u=>{
html+=`
<div class="user-box">
<b class="clickable" onclick="showDetails('${u.id}')">
${u.name || u.email}
</b><br>
${u.email || ""}
</div>`;
});
document.getElementById("list").innerHTML = html;

/* TREE BUILD */
let treeHTML = `<div class="tree"><ul>

<li>
<div class="node">👑 YOU</div>

<ul>
${level1.map(l1=>`
<li>
<div class="node clickable" onclick="showDetails('${l1.id}')">
<div class="level-tag">Level 1</div>
${l1.name || l1.email}
</div>

<ul>
${level2.filter(l2=>l2.referredByUid===l1.id).map(l2=>`
<li>
<div class="node clickable" onclick="showDetails('${l2.id}')">
<div class="level-tag">Level 2</div>
${l2.name || l2.email}
</div>

<ul>
${level3.filter(l3=>l3.referredByUid===l2.id).map(l3=>`
<li>
<div class="node clickable" onclick="showDetails('${l3.id}')">
<div class="level-tag">Level 3</div>
${l3.name || l3.email}
</div>
</li>
`).join("")}
</ul>

</li>
`).join("")}
</ul>

</li>
`).join("")}
</ul>

</li>
</ul></div>`;

document.getElementById("tree").innerHTML = treeHTML;

});

}

function showDetails(uid){
db.collection("users").doc(uid).get().then(snap=>{
const d = snap.data();
alert(
`Name: ${d.name}
Deposit: $${d.totalDeposit||0}
Wallet: $${d.walletBalance||0}`
);
});
}

function copyLink(){
navigator.clipboard.writeText(
document.getElementById("fullReferralLink").innerText
);
alert("Copied!");
}

</script>

</body>
</html>
