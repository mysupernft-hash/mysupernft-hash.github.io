<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Referrals | SuperNFT</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#0f0f0f;
  color:#FFD700;
}
header{
  background:#1a1a1a;
  padding:14px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
}
.container{
  padding:20px;
}
.card{
  background:#1a1a1a;
  border-radius:12px;
  padding:15px;
  margin-bottom:12px;
}
.card b{
  font-size:15px;
}
.loading{
  text-align:center;
  margin-top:40px;
  color:#aaa;
}
.back-btn{
  display:block;
  margin:20px;
  padding:12px;
  background:#272727;
  color:#FFD700;
  text-align:center;
  border-radius:8px;
  text-decoration:none;
}
</style>
</head>

<body>

<header>My Referrals</header>

<div class="container" id="list">
  <div class="loading">Loading referrals...</div>
</div>

<a href="dashboard.html" class="back-btn">⬅ Back to Dashboard</a>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* 🔥 Firebase Config */
const firebaseConfig = {
  apiKey: "AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain: "supernft-5b952.firebaseapp.com",
  projectId: "supernft-5b952",
  storageBucket: "supernft-5b952.appspot.com",
  messagingSenderId: "278097730700",
  appId: "1:278097730700:web:6ba9892334456fd8512fa9"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const list = document.getElementById("list");

/* 🔹 Load referrals */
onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.href = "login.html";
    return;
  }

  try {
    const refSnap = await getDocs(
      collection(db, "users", user.uid, "referrals")
    );

    list.innerHTML = "";

    if (refSnap.empty) {
      list.innerHTML =
        "<div class='loading'>You have no referrals yet</div>";
      return;
    }

    refSnap.forEach(docSnap => {
      const r = docSnap.data();
      const joined =
        r.joinedAt?.toDate
          ? r.joinedAt.toDate().toLocaleDateString()
          : "—";

      list.innerHTML += `
        <div class="card">
          <b>${r.email || "Unknown user"}</b><br><br>
          💰 Reward: $${r.reward || 0}<br>
          📅 Joined: ${joined}
        </div>
      `;
    });

  } catch (err) {
    console.error("Failed to load referral:", err);
    list.innerHTML =
      "<div class='loading'>⚠️ Failed to load referrals</div>";
  }
});
</script>

</body>
</html>
