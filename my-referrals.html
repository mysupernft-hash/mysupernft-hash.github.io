<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Referrals | SuperNFT</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#0f0f0f;
  color:#FFD700;
}
header{
  background:#1a1a1a;
  padding:15px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
}
.container{
  padding:20px;
}
.card{
  background:#1a1a1a;
  border-radius:12px;
  padding:15px;
  margin-bottom:15px;
}
.big{
  font-size:26px;
  font-weight:bold;
}
.list{
  margin-top:10px;
}
.item{
  padding:10px;
  border-bottom:1px solid #272727;
  font-size:14px;
}
.item:last-child{
  border-bottom:none;
}
.small{
  font-size:12px;
  opacity:0.8;
}
.back{
  display:block;
  text-align:center;
  margin-top:20px;
  padding:12px;
  background:#272727;
  border-radius:8px;
  color:#FFD700;
  text-decoration:none;
}
.notice{
  background:#272727;
  padding:12px;
  border-radius:10px;
  margin-bottom:15px;
  font-size:13px;
}
</style>
</head>

<body>

<header>👥 My Referrals</header>

<div class="container">

<div class="notice">
⚠️ Important: You earn $5 for every successful referral.
Bonus is credited instantly after referral code is applied.
</div>

<div class="card">
<h3>Your Referral Code</h3>
<div class="big" id="refCode">---</div>
</div>

<div class="card">
<h3>Total Referrals</h3>
<div class="big" id="totalRef">0</div>
</div>

<div class="card">
<h3>Total Referral Earnings</h3>
<div class="big">$<span id="totalEarn">0</span></div>
</div>

<div class="card">
<h3>Referral History</h3>
<div class="list" id="refList">
<div class="small">Loading...</div>
</div>
</div>

<a class="back" href="dashboard.html">⬅ Back to Dashboard</a>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { 
getFirestore, doc, getDoc,
collection, onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain:"supernft-5b952.firebaseapp.com",
  projectId:"supernft-5b952"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

onAuthStateChanged(auth,(user)=>{

  if(!user){
    window.location.href="login.html";
    return;
  }

  console.log("Current UID:", user.uid);

  const userRef=doc(db,"users",user.uid);

  /* 🔹 Load Main User Data */
  getDoc(userRef).then((snap)=>{

    if(!snap.exists()) return;

    const data=snap.data();

    document.getElementById("refCode").innerText =
      data.referralCode || "---";

    document.getElementById("totalEarn").innerText =
      data.referralEarnings || 0;

  });

  /* 🔹 Real-time Referral History */
  const refCol=collection(db,"users",user.uid,"referrals");

  onSnapshot(refCol,(snapshot)=>{

    const list=document.getElementById("refList");
    list.innerHTML="";

    document.getElementById("totalRef").innerText =
      snapshot.size;

    if(snapshot.empty){
      list.innerHTML=
      `<div class="small">No referrals yet</div>`;
      return;
    }

    snapshot.forEach(docSnap=>{

      const r=docSnap.data();

      let date="Pending";

      if(r.joinedAt && r.joinedAt.toDate){
        date=r.joinedAt.toDate().toLocaleString();
      }

      list.innerHTML+=`
      <div class="item">
        <div>${r.email || "User"}</div>
        <div class="small">
        Joined: ${date} • Reward: $${r.reward || 0}
        </div>
      </div>
      `;

    });

  });

});

</script>

</body>
</html>
