<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>My Referrals | SuperNFT</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f0f0f;
  color:#FFD700;
  padding:15px;
}

h2{text-align:center;}

.card{
  background:#1a1a1a;
  padding:15px;
  border-radius:12px;
  margin-bottom:15px;
}

.user-box{
  background:#111;
  padding:12px;
  border-radius:10px;
  margin-top:10px;
}

.small{
  font-size:12px;
  color:#ccc;
}

button{
  padding:8px 12px;
  border:none;
  border-radius:6px;
  background:#FFD700;
  color:#000;
  font-weight:bold;
  cursor:pointer;
  margin-top:8px;
}

button:hover{background:#e6c200;}

.link-box{
  word-break:break-all;
  margin-top:8px;
}

.stat{
  font-size:22px;
  font-weight:bold;
  text-align:center;
}

.clickable{
  cursor:pointer;
}

#detailModal{
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.8);
  justify-content:center;
  align-items:center;
  z-index:999;
}

.modal-box{
  background:#111;
  padding:20px;
  border-radius:12px;
  width:90%;
  max-width:350px;
}

</style>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

</head>
<body>

<h2>👥 My Referrals</h2>

<div class="card">
<b>Your Referral Code</b>
<div id="refCode">Loading...</div>
</div>

<div class="card">
<b>Full Referral Link</b>
<div id="fullReferralLink" class="link-box">Loading...</div>
<button onclick="copyLink()">Copy</button>
</div>

<div class="card">
<b>Total Referrals</b>
<div id="count" class="stat">0</div>
</div>

<div class="card">
<b>Referral Users</b>
<div id="list">Loading...</div>
</div>


<!-- DETAIL MODAL -->
<div id="detailModal">
  <div class="modal-box">
    <h3 id="detailName"></h3>
    <div style="line-height:1.8;margin-top:10px;">
      Daily Income: $<span id="detailDaily">0</span><br>
      Total Deposit: $<span id="detailDeposit">0</span><br>
      Wallet Balance: $<span id="detailWallet">0</span><br>
      Referral Income: $<span id="detailReferral">0</span>
    </div>
    <button style="width:100%;" onclick="closeModal()">Close</button>
  </div>
</div>


<script>

firebase.initializeApp({
apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
authDomain:"supernft-5b952.firebaseapp.com",
projectId:"supernft-5b952"
});

const auth = firebase.auth();
const db = firebase.firestore();

let referralCache = {}; // 🔥 RULE SAFE CACHE

auth.onAuthStateChanged(user=>{
if(!user){
location.href="login.html";
return;
}
loadReferrals(user);
});

async function loadReferrals(user){

const userDoc = await db.collection("users").doc(user.uid).get();
if(!userDoc.exists) return;

const data = userDoc.data();
const referralCode = data.referralCode;

document.getElementById("refCode").innerText = referralCode;

document.getElementById("fullReferralLink").innerText =
"https://mysupernft-hash.github.io/signup.html?ref=" + referralCode;


// 🔥 Real-time safe system
db.collection("users").onSnapshot(snapshot=>{

let allRefs = new Map();

snapshot.forEach(doc=>{

const u = doc.data();

// UID system
if(u.referredByUid === user.uid){
allRefs.set(doc.id, u);
}

// Code system
if(u.referredBy === referralCode){
allRefs.set(doc.id, u);
}

});

const referrals = Array.from(allRefs.entries())
.map(([id,data])=>({id,...data}));

document.getElementById("count").innerText = referrals.length;

let html="";
referralCache = {}; // reset cache

if(referrals.length===0){
html="No referrals yet.";
}
else{

referrals.forEach(u=>{

referralCache[u.id] = u; // 🔥 store locally

const displayName =
u.name || (u.email ? u.email.split("@")[0] : "User");

const join =
u.createdAt?.toDate().toLocaleString() || "-";

html += `
<div class="user-box">
<b class="clickable" onclick="showDetails('${u.id}')">
${displayName}
</b><br>
${u.email || ""}<br>
<div class="small">Joined: ${join}</div>
</div>
`;
});

}

document.getElementById("list").innerHTML = html;

});
}


// 🔥 RULE SAFE DETAIL FUNCTION
function showDetails(uid){

const d = referralCache[uid];
if(!d) return;

const daily =
(d.dailyIncome && d.dailyIncome > 0)
? d.dailyIncome
: (d.liveEarnings || 0);

const referral =
(d.referralEarnings && d.referralEarnings > 0)
? d.referralEarnings
: (d.totalIncome || 0);

document.getElementById("detailName").innerText =
d.name || d.email;

document.getElementById("detailDaily").innerText =
Number(daily).toFixed(2);

document.getElementById("detailDeposit").innerText =
(d.totalDeposit || 0).toFixed(2);

document.getElementById("detailWallet").innerText =
(d.walletBalance || 0).toFixed(2);

document.getElementById("detailReferral").innerText =
Number(referral).toFixed(2);

document.getElementById("detailModal").style.display="flex";
}

function closeModal(){
document.getElementById("detailModal").style.display="none";
}

function copyLink(){
const text = document.getElementById("fullReferralLink").innerText;
navigator.clipboard.writeText(text);
alert("Referral link copied!");
}

</script>

</body>
</html>
