<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Referral Code | SuperNFT</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#0f0f0f;
  color:#FFD700;
}
header{
  background:#1a1a1a;
  padding:15px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
}
.container{
  max-width:420px;
  margin:40px auto;
  padding:20px;
}
.card{
  background:#1a1a1a;
  padding:20px;
  border-radius:12px;
  text-align:center;
}
.code-box{
  background:#272727;
  padding:15px;
  margin:15px 0;
  font-size:22px;
  font-weight:bold;
  border-radius:8px;
  letter-spacing:2px;
}
button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:8px;
  background:#FFD700;
  color:#000;
  font-weight:bold;
  cursor:pointer;
}
.msg{
  margin-top:15px;
  text-align:center;
  font-size:14px;
}
.back{
  display:block;
  margin-top:20px;
  text-align:center;
  text-decoration:none;
  color:#FFD700;
}
</style>
</head>

<body>

<header>My Referral Code</header>

<div class="container">
  <div class="card">
    <p>Invite friends & earn rewards</p>

    <div class="code-box" id="refCode">Loading...</div>

    <button onclick="copyCode()">Copy Referral Code</button>

    <div class="msg" id="msg"></div>
  </div>

  <a href="dashboard.html" class="back">⬅ Back to Dashboard</a>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* Firebase config */
const firebaseConfig = {
  apiKey: "AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain: "supernft-5b952.firebaseapp.com",
  projectId: "supernft-5b952"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const refBox = document.getElementById("refCode");
const msg = document.getElementById("msg");

onAuthStateChanged(auth, async (user)=>{
  if(!user){
    window.location.href = "login.html";
    return;
  }

  const snap = await getDoc(doc(db,"users",user.uid));
  if(snap.exists()){
    const data = snap.data();
    refBox.innerText = data.referralCode || "NOT SET";
  }else{
    refBox.innerText = "User data missing";
  }
});

window.copyCode = function(){
  const text = refBox.innerText;
  if(!text || text==="Loading...") return;

  navigator.clipboard.writeText(text);
  msg.innerText = "✅ Referral code copied!";
};
</script>

</body>
</html>
