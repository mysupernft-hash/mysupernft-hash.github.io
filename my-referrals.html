<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>My Referrals | SuperNFT</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f0f0f;
  color:#FFD700;
  padding:15px;
}

h2{text-align:center;}

.card{
  background:#1a1a1a;
  padding:15px;
  border-radius:12px;
  margin-bottom:15px;
}

.user-box{
  background:#111;
  padding:12px;
  border-radius:10px;
  margin-top:10px;
}

.small{
  font-size:12px;
  color:#ccc;
}

button{
  padding:8px 12px;
  border:none;
  border-radius:6px;
  background:#FFD700;
  color:#000;
  font-weight:bold;
  cursor:pointer;
  margin-top:8px;
}

button:hover{background:#e6c200;}

.link-box{word-break:break-all;margin-top:8px;}
.stat{text-align:center;font-size:20px;font-weight:bold;}

/* 🌳 TREE */
#tree{
  text-align:center;
  margin-top:10px;
}

.node{
  display:inline-block;
  background:#111;
  border:1px solid #FFD700;
  border-radius:20px;
  padding:8px 14px;
  margin:10px;
  font-size:13px;
  box-shadow:0 0 10px rgba(255,215,0,0.3);
  transition:0.3s;
}

.node:hover{
  transform:scale(1.1);
  box-shadow:0 0 20px #FFD700;
}

.children{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:15px;
}

.line{
  width:2px;
  height:20px;
  background:#FFD700;
  margin:auto;
}

/* MODAL */
#detailModal{
  display:none;
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.8);
  justify-content:center;
  align-items:center;
  z-index:999;
}

.modal-box{
  background:#111;
  padding:20px;
  border-radius:12px;
  width:90%;
  max-width:350px;
}

.clickable{cursor:pointer;}
</style>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

</head>
<body>

<h2>👥 My Referrals</h2>

<div class="card">
  <b>Your Referral Code</b>
  <div id="refCode">Loading...</div>
</div>

<div class="card">
  <b>Full Referral Link</b>
  <div id="fullReferralLink" class="link-box">Loading...</div>
  <button onclick="copyLink()">Copy</button>
</div>

<div class="card">
  <b>Total Referrals</b>
  <div id="count" class="stat">0</div>
</div>

<div class="card">
  <b>Referral Users</b>
  <div id="list">Loading...</div>
</div>

<div class="card">
  <b>🌳 Referral Tree (Real)</b>
  <div id="tree"></div>
</div>

<!-- MODAL -->
<div id="detailModal">
  <div class="modal-box">
    <h3 id="detailName"></h3>
    <div>
      Daily Income: $<span id="detailDaily"></span><br>
      Deposit: $<span id="detailDeposit"></span><br>
      Wallet: $<span id="detailWallet"></span><br>
      Referral Income: $<span id="detailReferral"></span>
    </div>
    <button onclick="closeModal()">Close</button>
  </div>
</div>

<script>

firebase.initializeApp({
apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
authDomain:"supernft-5b952.firebaseapp.com",
projectId:"supernft-5b952"
});

const auth = firebase.auth();
const db = firebase.firestore();

auth.onAuthStateChanged(user=>{
if(!user){
location.href="login.html";
return;
}
loadData(user);
});

async function loadData(user){

const doc = await db.collection("users").doc(user.uid).get();
const data = doc.data();

document.getElementById("refCode").innerText = data.referralCode;

document.getElementById("fullReferralLink").innerText =
"https://mysupernft-hash.github.io/signup.html?ref=" + data.referralCode;


// 🔥 FULL USERS FETCH
db.collection("users").onSnapshot(snapshot=>{

let users = [];

snapshot.forEach(d=>{
users.push({id:d.id,...d.data()});
});

// LIST (same system)
const referrals = users.filter(u =>
u.referredByUid === user.uid || u.referredBy === data.referralCode
);

document.getElementById("count").innerText = referrals.length;

let html="";
referrals.forEach(u=>{
const name = u.name || u.email?.split("@")[0] || "User";

html+=`
<div class="user-box">
<b class="clickable" onclick="showDetails('${u.id}')">${name}</b>
<div class="small">${u.email||""}</div>
</div>`;
});

document.getElementById("list").innerHTML = html;


// 🌳 BUILD REAL TREE
const tree = buildTree(users, user.uid);

// 🌳 RENDER
renderTree(tree);

});

}


// 🔥 TREE LOGIC
function buildTree(users, rootId){

function getChildren(parentId){
return users
.filter(u=>u.referredByUid===parentId)
.map(u=>({
...u,
children:getChildren(u.id)
}));
}

return {
id:rootId,
name:"👑 YOU",
children:getChildren(rootId)
};
}


// 🔥 RENDER TREE
function renderTree(tree){

function create(node){

let name = node.name || node.email || "User";

let html = `<div class="node clickable" onclick="showDetails('${node.id}')">${name}</div>`;

if(node.children && node.children.length>0){
html+=`<div class="line"></div><div class="children">`;

node.children.forEach(c=>{
html+=`<div>${create(c)}</div>`;
});

html+=`</div>`;
}

return html;
}

document.getElementById("tree").innerHTML = create(tree);
}


// MODAL
function showDetails(uid){
db.collection("users").doc(uid).get().then(s=>{
const d=s.data();

detailName.innerText=d.name||d.email;
detailDaily.innerText=(d.dailyIncome||0).toFixed(2);
detailDeposit.innerText=(d.totalDeposit||0).toFixed(2);
detailWallet.innerText=(d.walletBalance||0).toFixed(2);
detailReferral.innerText=(d.referralEarnings||0).toFixed(2);

detailModal.style.display="flex";
});
}

function closeModal(){
detailModal.style.display="none";
}

window.onclick = e=>{
if(e.target===detailModal) closeModal();
}

// COPY
function copyLink(){
navigator.clipboard.writeText(fullReferralLink.innerText);
alert("Copied!");
}

</script>

</body>
</html>
