<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Referrals | SuperNFT</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f0f0f;
  color:#FFD700;
  padding:20px;
}
.card{
  background:#1a1a1a;
  padding:15px;
  border-radius:12px;
  margin-bottom:15px;
}
button{
  padding:8px 12px;
  border:none;
  border-radius:6px;
  background:#FFD700;
  color:#000;
  font-weight:bold;
  cursor:pointer;
}
button:hover{
  background:#e6c200;
}
.link-box{
  word-break:break-all;
  margin-top:8px;
}
.user-box{
  background:#111;
  padding:10px;
  border-radius:8px;
  margin-top:10px;
  font-size:14px;
}
.small{
  font-size:12px;
  color:#ccc;
}
</style>
</head>
<body>

<h2>👥 My Referrals</h2>

<div class="card">
  <div><b>Your Referral Code</b></div>
  <div id="refCode">Loading...</div>
</div>

<div class="card">
  <div><b>Full Referral Link</b></div>
  <div id="fullReferralLink" class="link-box">Loading...</div>
  <button onclick="copyFullReferral()">Copy Link</button>
</div>

<div class="card">
  <div><b>Total Referrals</b></div>
  <div id="refCount">0</div>
</div>

<div class="card">
  <div><b>Referred Users</b></div>
  <div id="referralList">Loading...</div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain:"supernft-5b952.firebaseapp.com",
  projectId:"supernft-5b952"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

onAuthStateChanged(auth, async(user)=>{

  if(!user){
    window.location.href="login.html";
    return;
  }

  const snap = await getDoc(doc(db,"users",user.uid));
  if(!snap.exists()) return;

  const data = snap.data();
  const referralCode = data.referralCode;

  // Show referral code
  document.getElementById("refCode").innerText = referralCode;

  // Full link
  const fullLink =
    "https://mysupernft-hash.github.io/signup.html?ref=" + referralCode;

  document.getElementById("fullReferralLink").innerText = fullLink;

  // 🔥 Get referred users
  const q = query(collection(db,"users"), where("referredBy","==",referralCode));
  const querySnapshot = await getDocs(q);

  document.getElementById("refCount").innerText = querySnapshot.size;

  let html = "";

  if(querySnapshot.empty){
    html = "No referrals yet.";
  } else {
    querySnapshot.forEach(doc=>{
      const u = doc.data();
      const joinDate = u.createdAt?.toDate().toLocaleString() || "-";

      html += `
        <div class="user-box">
          <div><b>${u.name || "No Name"}</b></div>
          <div>${u.email}</div>
          <div class="small">Joined: ${joinDate}</div>
        </div>
      `;
    });
  }

  document.getElementById("referralList").innerHTML = html;

});

// Copy function
window.copyFullReferral = function(){
  const text = document.getElementById("fullReferralLink").innerText;
  navigator.clipboard.writeText(text);
  alert("Referral link copied!");
}

</script>

</body>
</html>
