<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Referrals | SuperNFT</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f0f0f;
  color:#FFD700;
}
header{
  padding:15px;
  text-align:center;
  background:#1a1a1a;
  font-size:20px;
  font-weight:bold;
}
.container{
  padding:20px;
}
.card{
  background:#1a1a1a;
  padding:15px;
  border-radius:10px;
  margin-bottom:10px;
}
.small{font-size:13px;color:#ccc;}
.loading{text-align:center;margin-top:40px;}
.error{color:red;text-align:center;}
.back{
  display:block;
  margin-top:20px;
  text-align:center;
  background:#272727;
  padding:12px;
  border-radius:8px;
  color:#FFD700;
  text-decoration:none;
}
</style>
</head>

<body>

<header>My Referrals</header>

<div class="container" id="list">
  <div class="loading">Loading referrals...</div>
</div>

<a href="dashboard.html" class="back">⬅ Back to Dashboard</a>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, collection, getDocs
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain: "supernft-5b952.firebaseapp.com",
  projectId: "supernft-5b952"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const list = document.getElementById("list");

onAuthStateChanged(auth, async (user)=>{
  if(!user){
    location.href="login.html";
    return;
  }

  try{
    const refCol = collection(db,"users",user.uid,"referrals");
    const snap = await getDocs(refCol);

    list.innerHTML = "";

    if(snap.empty){
      list.innerHTML = "<p class='small'>No referrals yet.</p>";
      return;
    }

    snap.forEach(doc=>{
      const d = doc.data();
      list.innerHTML += `
        <div class="card">
          <b>${d.email}</b>
          <div class="small">
            Reward: $${d.reward}<br>
            Joined: ${d.joinedAt?.toDate().toLocaleDateString()}
          </div>
        </div>
      `;
    });

  }catch(err){
    console.error(err);
    list.innerHTML =
      "<p class='error'>Failed to load referrals</p>";
  }
});
</script>

</body>
</html>
