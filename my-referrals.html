<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Referrals | SuperNFT</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#0f0f0f;
  color:#FFD700;
}
header{
  background:#1a1a1a;
  padding:14px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
}
.container{
  padding:20px;
}
.card{
  background:#1a1a1a;
  border-radius:12px;
  padding:15px;
  margin-bottom:12px;
}
.card strong{
  display:block;
  font-size:15px;
}
.empty{
  text-align:center;
  margin-top:40px;
  color:#999;
}
.back{
  display:block;
  margin-top:20px;
  padding:12px;
  background:#272727;
  text-align:center;
  color:#FFD700;
  border-radius:8px;
  text-decoration:none;
}
</style>
</head>

<body>

<header>My Referrals</header>

<div class="container" id="referralList">
  <div class="empty">Loading...</div>
</div>

<a href="dashboard.html" class="back">⬅ Back to Dashboard</a>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* 🔥 Firebase config */
const firebaseConfig = {
  apiKey: "AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain: "supernft-5b952.firebaseapp.com",
  projectId: "supernft-5b952",
  storageBucket: "supernft-5b952.appspot.com",
  messagingSenderId: "278097730700",
  appId: "1:278097730700:web:6ba9892334456fd8512fa9"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const listDiv = document.getElementById("referralList");

onAuthStateChanged(auth, (user) => {
  if (!user) {
    window.location.href = "login.html";
    return;
  }

  const refCol = collection(db, "users", user.uid, "referrals");

  onSnapshot(refCol, (snap) => {
    listDiv.innerHTML = "";

    if (snap.empty) {
      listDiv.innerHTML = `<div class="empty">No referrals yet</div>`;
      return;
    }

    snap.forEach(doc => {
      const d = doc.data();
      listDiv.innerHTML += `
        <div class="card">
          <strong>${d.email || "Unknown user"}</strong>
          <span>Joined: ${new Date(d.joinedAt.seconds * 1000).toLocaleDateString()}</span><br>
          <span>Reward: $${d.reward || 0}</span>
        </div>
      `;
    });
  });
});
</script>

</body>
</html>
