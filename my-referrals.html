<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Referrals | SuperNFT</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#0f0f0f;
  color:#FFD700;
}
header{
  background:#1a1a1a;
  padding:14px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
}
.container{
  padding:20px;
}
.card{
  background:#1a1a1a;
  border-radius:12px;
  padding:15px;
  margin-bottom:12px;
}
.loading{
  text-align:center;
  margin-top:40px;
  font-size:16px;
}
.email{
  font-size:14px;
}
.reward{
  font-weight:bold;
  margin-top:6px;
}
.date{
  font-size:12px;
  color:#ccc;
  margin-top:4px;
}
.back{
  display:block;
  margin-top:20px;
  padding:12px;
  background:#272727;
  color:#FFD700;
  text-align:center;
  border-radius:8px;
  text-decoration:none;
}
</style>
</head>

<body>

<header>My Referrals</header>

<div class="container">
  <div id="status" class="loading">Loading referrals...</div>
  <div id="list"></div>

  <a href="dashboard.html" class="back">⬅ Back to Dashboard</a>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore,
  collection,
  getDocs,
  query,
  orderBy
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* 🔥 Firebase config */
const firebaseConfig = {
  apiKey: "AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain: "supernft-5b952.firebaseapp.com",
  projectId: "supernft-5b952"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const statusEl = document.getElementById("status");
const listEl = document.getElementById("list");

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.href = "login.html";
    return;
  }

  try {
    const refCol = collection(db, "users", user.uid, "referrals");
    const q = query(refCol, orderBy("joinedAt", "desc"));
    const snap = await getDocs(q);

    statusEl.style.display = "none";

    if (snap.empty) {
      statusEl.style.display = "block";
      statusEl.innerText = "😔 No referrals yet";
      return;
    }

    snap.forEach(docSnap => {
      const d = docSnap.data();

      const div = document.createElement("div");
      div.className = "card";

      div.innerHTML = `
        <div class="email">${d.email || "Unknown email"}</div>
        <div class="reward">💰 Reward: $${d.reward || 0}</div>
        <div class="date">
          Joined: ${
            d.joinedAt
              ? new Date(d.joinedAt.seconds * 1000).toLocaleString()
              : "—"
          }
        </div>
      `;

      listEl.appendChild(div);
    });

  } catch (err) {
    console.error(err);
    statusEl.innerText = "❌ Failed to load referrals";
  }
});
</script>

</body>
</html>
