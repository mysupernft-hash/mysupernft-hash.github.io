<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>My Referrals | SuperNFT</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  background:#0f0f0f;
  color:#FFD700;
  font-family:Arial;
}
header{
  padding:15px;
  text-align:center;
  font-size:20px;
  background:#1a1a1a;
}
.container{
  padding:20px;
}
.card{
  background:#1a1a1a;
  padding:15px;
  border-radius:10px;
  margin-bottom:12px;
}
.small{font-size:13px;color:#aaa;}
</style>
</head>

<body>

<header>My Referrals</header>

<div class="container" id="list">
  <p>Loading...</p>
</div>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, getDocs } from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain: "supernft-5b952.firebaseapp.com",
  projectId: "supernft-5b952"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

onAuthStateChanged(auth, async(user)=>{
  if(!user){
    location.href="login.html";
    return;
  }

  const list = document.getElementById("list");
  list.innerHTML = "";

  try{
    const snap = await getDocs(
      collection(db, "users", user.uid, "referrals")
    );

    if(snap.empty){
      list.innerHTML = "<p>No referrals yet</p>";
      return;
    }

    snap.forEach(doc=>{
      const d = doc.data();
      list.innerHTML += `
        <div class="card">
          <b>${d.email}</b><br>
          <span class="small">
            Reward: $${d.reward}<br>
            Joined: ${d.joinedAt?.toDate().toDateString()}
          </span>
        </div>
      `;
    });

  }catch(e){
    list.innerHTML = "<p>❌ Failed to load referrals</p>";
    console.error(e);
  }
});
</script>

</body>
</html>
