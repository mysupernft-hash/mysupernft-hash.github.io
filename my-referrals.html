<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>My Referrals</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f0f0f;
  color:#FFD700;
  padding:20px;
}
.card{
  background:#1a1a1a;
  padding:15px;
  border-radius:12px;
  margin-bottom:15px;
}
.user-box{
  background:#111;
  padding:10px;
  border-radius:8px;
  margin-top:10px;
}
.small{
  font-size:12px;
  color:#ccc;
}
button{
  padding:8px 12px;
  border:none;
  border-radius:6px;
  background:#FFD700;
  color:#000;
  font-weight:bold;
  cursor:pointer;
}
</style>
</head>
<body>

<h2>👥 My Referrals</h2>

<div class="card">
  <b>Your Referral Code</b>
  <div id="refCode">Loading...</div>
</div>

<div class="card">
  <b>Full Referral Link</b>
  <div id="fullReferralLink">Loading...</div>
  <button onclick="copyLink()">Copy</button>
</div>

<div class="card">
  <b>Total Referrals</b>
  <div id="count">0</div>
</div>

<div class="card">
  <b>Referral Users</b>
  <div id="list">Loading...</div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain:"supernft-5b952.firebaseapp.com",
  projectId:"supernft-5b952"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

onAuthStateChanged(auth, async(user)=>{

  if(!user){
    location.href="login.html";
    return;
  }

  const snap = await getDoc(doc(db,"users",user.uid));
  if(!snap.exists()) return;

  const data = snap.data();
  const code = data.referralCode;

  document.getElementById("refCode").innerText = code;

  const fullLink =
    "https://mysupernft-hash.github.io/signup.html?ref=" + code;

  document.getElementById("fullReferralLink").innerText = fullLink;

  // 🔥 RULE SAFE READ
  const refCol = collection(db,"users",user.uid,"referrals");
  const refSnap = await getDocs(refCol);

  document.getElementById("count").innerText = refSnap.size;

  let html="";

  if(refSnap.empty){
    html="No referrals yet.";
  } else {

    refSnap.forEach(doc=>{
      const u = doc.data();
      const join =
        u.joinedAt?.toDate().toLocaleString() || "-";

      html += `
        <div class="user-box">
          <b>${u.name || "No Name"}</b><br>
          ${u.email || ""}<br>
          <div class="small">Joined: ${join}</div>
        </div>
      `;
    });

  }

  document.getElementById("list").innerHTML = html;

});

window.copyLink=function(){
  navigator.clipboard.writeText(
    document.getElementById("fullReferralLink").innerText
  );
  alert("Copied!");
}

</script>

</body>
</html>
