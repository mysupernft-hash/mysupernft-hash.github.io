<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Referrals | SuperNFT</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#0f0f0f;
  color:#FFD700;
}
header{
  padding:15px;
  text-align:center;
  background:#1a1a1a;
  font-size:20px;
  font-weight:bold;
}
.container{
  padding:20px;
}
.card{
  background:#1a1a1a;
  padding:15px;
  border-radius:10px;
  margin-bottom:12px;
}
.email{
  font-size:15px;
}
.small{
  font-size:12px;
  opacity:0.8;
}
.loading{
  text-align:center;
  margin-top:50px;
}
.back{
  display:block;
  margin:20px;
  padding:12px;
  background:#272727;
  color:#FFD700;
  text-align:center;
  border-radius:8px;
  text-decoration:none;
}
</style>
</head>

<body>

<header>My Referrals</header>

<div class="container" id="list">
  <div class="loading">Loading referrals...</div>
</div>

<a href="dashboard.html" class="back">⬅ Back to Dashboard</a>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore,
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* 🔥 Firebase Config */
const firebaseConfig = {
  apiKey: "AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain: "supernft-5b952.firebaseapp.com",
  projectId: "supernft-5b952"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const list = document.getElementById("list");

/* ✅ WAIT FOR AUTH FIRST */
onAuthStateChanged(auth, async(user)=>{
  if(!user){
    window.location.href = "login.html";
    return;
  }

  try{
    const refCol = collection(db,"users",user.uid,"referrals");
    const snap = await getDocs(refCol);

    list.innerHTML = "";

    if(snap.empty){
      list.innerHTML = "<div class='loading'>No referrals yet</div>";
      return;
    }

    snap.forEach(doc=>{
      const d = doc.data();
      list.innerHTML += `
        <div class="card">
          <div class="email">${d.email || "Unknown user"}</div>
          <div class="small">
            Reward: $${d.reward || 0}<br>
            Joined: ${d.joinedAt?.toDate().toLocaleDateString() || ""}
          </div>
        </div>
      `;
    });

  }catch(err){
    console.error(err);
    list.innerHTML = "<div class='loading'>⚠️ Failed to load referrals</div>";
  }
});
</script>

</body>
</html>
