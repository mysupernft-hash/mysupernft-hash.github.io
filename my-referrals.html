<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>My Referrals | SuperNFT</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f0f0f;
  color:#FFD700;
  padding:15px;
}
h2{
  text-align:center;
}
.card{
  background:#1a1a1a;
  padding:15px;
  border-radius:12px;
  margin-bottom:15px;
}
.user-box{
  background:#111;
  padding:10px;
  border-radius:8px;
  margin-top:10px;
}
.small{
  font-size:12px;
  color:#ccc;
}
button{
  padding:8px 12px;
  border:none;
  border-radius:6px;
  background:#FFD700;
  color:#000;
  font-weight:bold;
  cursor:pointer;
  margin-top:10px;
}
button:hover{
  background:#e6c200;
}
.link-box{
  word-break:break-all;
  margin-top:8px;
}
</style>
</head>
<body>

<h2>👥 My Referrals</h2>

<div class="card">
  <b>Your Referral Code</b>
  <div id="refCode">Loading...</div>
</div>

<div class="card">
  <b>Full Referral Link</b>
  <div id="fullReferralLink" class="link-box">Loading...</div>
  <button onclick="copyLink()">Copy Link</button>
</div>

<div class="card">
  <b>Total Referrals</b>
  <div id="count">0</div>
</div>

<div class="card">
  <b>Referral Users</b>
  <div id="list">Loading...</div>
</div>

<script>

firebase.initializeApp({
apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
authDomain:"supernft-5b952.firebaseapp.com",
projectId:"supernft-5b952"
});

const auth = firebase.auth();
const db = firebase.firestore();

auth.onAuthStateChanged(async user=>{

if(!user){
location.href="login.html";
return;
}

const userDoc = await db.collection("users").doc(user.uid).get();
if(!userDoc.exists) return;

const data = userDoc.data();
const code = data.referralCode || "N/A";

document.getElementById("refCode").innerText = code;

const fullLink =
"https://mysupernft-hash.github.io/signup.html?ref=" + code;

document.getElementById("fullReferralLink").innerText = fullLink;

// 🔥 DIRECT QUERY FROM MAIN USERS COLLECTION
const snapshot = await db.collection("users")
.where("referredByUid","==",user.uid)
.get();

document.getElementById("count").innerText = snapshot.size;

let html="";

if(snapshot.empty){
html="No referrals yet.";
}
else{

snapshot.forEach(doc=>{

const u = doc.data();

const displayName =
u.name ||
(u.email ? u.email.split("@")[0] : "User");

const joinDate =
u.createdAt && u.createdAt.toDate
? u.createdAt.toDate().toLocaleString()
: "-";

html+=`
<div class="user-box">
<b>${displayName}</b><br>
${u.email || ""}<br>
<div class="small">Joined: ${joinDate}</div>
</div>
`;

});

}

document.getElementById("list").innerHTML = html;

});

function copyLink(){
const text = document.getElementById("fullReferralLink").innerText;
navigator.clipboard.writeText(text);
alert("Referral link copied!");
}

</script>

</body>
</html>
