<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Trust Stats | SuperNFT</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f0f0f;
  color:#FFD700;
  padding:15px;
}

h2{
  text-align:center;
}

.box{
  background:#1a1a1a;
  padding:15px;
  border-radius:12px;
  margin-bottom:15px;
  text-align:center;
}

.big{
  font-size:22px;
  font-weight:bold;
  margin-top:5px;
}

#liveFeed{
  font-size:13px;
  color:#ccc;
  line-height:1.8;
  max-height:200px;
  overflow:hidden;
}

.live-box{
  background:#111;
  padding:10px;
  border-radius:10px;
}
</style>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

</head>
<body>

<h2>🔥 Live Trust Stats</h2>

<div class="box">
  Users
  <div id="users" class="big">0</div>
</div>

<div class="box">
  Total Paid
  <div id="paid" class="big">$0</div>
</div>

<div class="box">
  Total Invested
  <div id="invest" class="big">$0</div>
</div>

<div class="box">
  <b>🟢 Live Activity</b>
  <div class="live-box" id="liveFeed"></div>
</div>

<script>

// 🔥 Firebase Init
firebase.initializeApp({
  apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain:"supernft-5b952.firebaseapp.com",
  projectId:"supernft-5b952"
});

const db = firebase.firestore();

// 🔥 REAL DATA
let realUsers = 0;
let realPaid = 0;
let realInvest = 0;

async function loadRealStats(){
  const snapshot = await db.collection("users").get();

  realUsers = snapshot.size;

  snapshot.forEach(doc=>{
    const d = doc.data();
    realPaid += (d.referralEarnings || 0);
    realInvest += (d.totalDeposit || 0);
  });
}

// 🔥 HYBRID VALUES
let users = 12000;
let paid = 50000;
let invested = 100000;

async function startHybrid(){

  await loadRealStats();

  users = realUsers + Math.floor(Math.random()*2000);
  paid = realPaid + Math.floor(Math.random()*10000);
  invested = realInvest + Math.floor(Math.random()*20000);

}

// 🔥 LIVE COUNTER UPDATE
setInterval(()=>{

  users += Math.random() < 0.5 ? 1 : 0;
  paid += Math.random()*3;
  invested += Math.random()*6;

  document.getElementById("users").innerText =
    Math.floor(users).toLocaleString()+"+";

  document.getElementById("paid").innerText =
    "$"+Math.floor(paid).toLocaleString()+"+";

  document.getElementById("invest").innerText =
    "$"+Math.floor(invested).toLocaleString()+"+";

},1500);

// 🔥 INDIAN NAMES
const names = [
  "Rahul","Amit","Priya","Neha","Arjun",
  "Rohit","Sneha","Vikas","Ankit","Pooja"
];

// 🔥 LOAD REAL USERS
async function loadRealUsers(){

  const snapshot = await db.collection("users").limit(10).get();

  return snapshot.docs.map(doc=>{
    const d = doc.data();
    return d.name || (d.email ? d.email.split("@")[0] : "User");
  });

}

let realNames = [];

// 🔥 LIVE ACTIVITY (HYBRID)
async function startFeed(){

  realNames = await loadRealUsers();

  setInterval(()=>{

    const useReal = Math.random() < 0.3;

    let name;

    if(useReal && realNames.length > 0){
      name = realNames[Math.floor(Math.random()*realNames.length)];
    }else{
      name = names[Math.floor(Math.random()*names.length)];
    }

    const amount = (Math.random()*5+1).toFixed(2);

    const actions = [
      `🟢 ${name} earned $${amount}`,
      `💰 ${name} invested $${(amount*20).toFixed(0)}`,
      `✔ ${name} withdrew $${(amount*10).toFixed(0)}`
    ];

    const msg = actions[Math.floor(Math.random()*actions.length)];

    const feed = document.getElementById("liveFeed");

    const div = document.createElement("div");
    div.innerText = msg;

    feed.prepend(div);

    if(feed.childNodes.length > 12){
      feed.removeChild(feed.lastChild);
    }

  },2500);

}

// 🚀 START
startHybrid();
startFeed();

</script>

</body>
</html>
