<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Live Trust System</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  background:#0f0f0f;
  color:#FFD700;
  font-family:Arial;
  padding:15px;
}

.card{
  background:#1a1a1a;
  padding:15px;
  border-radius:12px;
  margin-bottom:15px;
  text-align:center;
}

.big{
  font-size:22px;
  font-weight:bold;
}

#liveFeed{
  font-size:13px;
  line-height:1.8;
}
</style>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

</head>
<body>

<h2 style="text-align:center;">🔥 Live Platform Stats</h2>

<div class="card">
  Users<br>
  <div id="users" class="big">0</div>
</div>

<div class="card">
  Total Paid<br>
  <div id="paid" class="big">$0</div>
</div>

<div class="card">
  Total Invested<br>
  <div id="invest" class="big">$0</div>
</div>

<div class="card">
  <b>🟢 Live Activity</b>
  <div id="liveFeed">Loading...</div>
</div>

<script>

// 🔥 FIREBASE CONFIG
firebase.initializeApp({
  apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain:"supernft-5b952.firebaseapp.com",
  projectId:"supernft-5b952"
});

const db = firebase.firestore();

// ============================
// 🔥 BASE VALUES (fallback)
// ============================
let users = 12540;
let paid = 58230;
let invested = 120000;

// ============================
// 🔥 FETCH REAL DATA
// ============================
db.collection("users").onSnapshot(snapshot=>{

  let realUsers = snapshot.size;
  let totalDeposit = 0;
  let totalWithdraw = 0;

  snapshot.forEach(doc=>{
    const d = doc.data();

    totalDeposit += d.totalDeposit || 0;
    totalWithdraw += d.totalWithdraw || 0;
  });

  // REAL + BOOST
  users = realUsers + Math.floor(realUsers * 0.3); // 30% boost
  invested = totalDeposit * 1.2;
  paid = totalWithdraw * 1.3;

});

// ============================
// 🔥 SMOOTH FAKE GROWTH
// ============================
setInterval(()=>{

  users += Math.floor(Math.random()*2)+1;
  paid += Math.random()*10;
  invested += Math.random()*20;

  document.getElementById("users").innerText =
    users.toLocaleString()+"+";

  document.getElementById("paid").innerText =
    "$"+Math.floor(paid).toLocaleString()+"+";

  document.getElementById("invest").innerText =
    "$"+Math.floor(invested).toLocaleString()+"+";

},1000);

// ============================
// 🔥 INDIAN NAMES
// ============================
const names = [
"Aarav","Vivaan","Aditya","Arjun","Krishna",
"Rahul","Rohan","Aman","Karan","Siddharth",
"Raj","Ankit","Vikas","Deepak","Yash",
"Priya","Ananya","Sneha","Pooja","Kavya",
"Neha","Riya","Simran","Aisha","Meera"
];

// ============================
// 🔥 LIVE ACTIVITY SYSTEM
// ============================
setInterval(()=>{

  const name = names[Math.floor(Math.random()*names.length)];

  const earn = (Math.random()*3+1).toFixed(2);
  const investAmt = (Math.random()*200+20).toFixed(0);
  const withdrawAmt = (Math.random()*150+10).toFixed(0);

  const msgs = [
    `🟢 ${name} earned $${earn}`,
    `💰 ${name} invested $${investAmt}`,
    `✔ ${name} withdrew $${withdrawAmt}`
  ];

  const msg = msgs[Math.floor(Math.random()*msgs.length)];

  const feed = document.getElementById("liveFeed");

  feed.innerHTML = msg + "<br>" + feed.innerHTML;

  if(feed.childNodes.length > 10){
    feed.removeChild(feed.lastChild);
  }

},2500);

// ============================
// 🔥 BIG REALISTIC JUMP
// ============================
setInterval(()=>{

  if(Math.random() < 0.3){

    users += Math.floor(Math.random()*20)+10;
    paid += Math.random()*200;
    invested += Math.random()*400;

  }

},5000);

</script>

</body>
</html>
