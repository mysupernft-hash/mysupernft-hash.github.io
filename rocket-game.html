<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SuperNFT Crash Demo</title>

<style>
body{
  margin:0;
  background:#000;
  font-family:Arial;
  color:#FFD700;
  text-align:center;
}

header{
  padding:20px;
  font-size:22px;
  border-bottom:1px solid #FFD700;
}

.container{
  max-width:500px;
  margin:20px auto;
  background:#111;
  padding:20px;
  border-radius:15px;
  box-shadow:0 0 25px #FFD700;
}

.multiplier{
  font-size:48px;
  margin:20px 0;
}

button{
  padding:10px 20px;
  margin:10px;
  border:none;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

.start{background:#FFD700;color:#000;}
.cash{background:#00cc66;color:#000;}
.crashed{color:red;}

.wallet{
  margin-bottom:15px;
  font-size:18px;
}

.leaderboard{
  margin-top:20px;
  text-align:left;
  max-height:150px;
  overflow-y:auto;
  font-size:14px;
}

.leaderboard div{
  border-bottom:1px solid #333;
  padding:5px;
}
</style>
</head>

<body>

<header>SuperNFT Crash Multiplier Demo</header>

<div class="container">

<div class="wallet">
Wallet: <span id="wallet">0</span> Points
</div>

<div class="multiplier" id="multiplier">1.00x</div>

<button class="start" onclick="startGame()">Start</button>
<button class="cash" onclick="cashOut()">Cash Out</button>

<div id="status"></div>

<div class="leaderboard" id="leaderboard"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, addDoc, getDocs, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain: "supernft-5b952.firebaseapp.com",
  projectId: "supernft-5b952"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let multiplier = 1.00;
let interval;
let crashPoint;
let playing = false;
let userId;

const multiplierEl = document.getElementById("multiplier");
const walletEl = document.getElementById("wallet");
const statusEl = document.getElementById("status");

onAuthStateChanged(auth, async user => {
  if(!user){
    window.location.href = "login.html";
    return;
  }

  userId = user.uid;
  const userRef = doc(db,"users",userId);
  const snap = await getDoc(userRef);

  if(!snap.exists()){
    await setDoc(userRef,{ wallet:1000 });
    walletEl.innerText = 1000;
  } else {
    walletEl.innerText = snap.data().wallet || 1000;
  }

  loadLeaderboard();
});

function randomCrash(){
  return (Math.random()*5 + 1).toFixed(2); // crash between 1x and 6x
}

function startGame(){
  if(playing) return;

  multiplier = 1.00;
  crashPoint = randomCrash();
  playing = true;
  statusEl.innerText = "";
  multiplierEl.classList.remove("crashed");

  interval = setInterval(()=>{
    multiplier += 0.02;
    multiplierEl.innerText = multiplier.toFixed(2)+"x";

    if(multiplier >= crashPoint){
      clearInterval(interval);
      playing = false;
      multiplierEl.classList.add("crashed");
      statusEl.innerText = "💥 Crashed at "+ crashPoint +"x";
    }

  },100);
}

async function cashOut(){
  if(!playing) return;

  clearInterval(interval);
  playing = false;

  const userRef = doc(db,"users",userId);
  const snap = await getDoc(userRef);
  let wallet = snap.data().wallet || 0;

  let reward = Math.floor(multiplier * 20);
  wallet += reward;

  await updateDoc(userRef,{ wallet: wallet });

  await addDoc(collection(db,"leaderboard"),{
    user:userId,
    score:multiplier,
    timestamp:Date.now()
  });

  walletEl.innerText = wallet;
  statusEl.innerText = "✅ Cashed at "+ multiplier.toFixed(2)+"x | +"+reward+" Points";

  loadLeaderboard();
}

async function loadLeaderboard(){
  const q = query(collection(db,"leaderboard"), orderBy("score","desc"), limit(5));
  const snap = await getDocs(q);

  const board = document.getElementById("leaderboard");
  board.innerHTML = "<strong>Top Scores:</strong><br>";

  snap.forEach(doc=>{
    board.innerHTML += "<div>"+ doc.data().score.toFixed(2)+"x</div>";
  });
}

</script>

</body>
</html>
