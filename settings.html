<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SuperNFT – Ultra Settings</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0f0f0f;
  color:#FFD700;
}

header{
  padding:15px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
  background:#1a1a1a;
}

.container{
  padding:15px;
}

.card{
  background:#1a1a1a;
  padding:15px;
  border-radius:12px;
  margin-bottom:15px;
}

.section-title{
  font-size:16px;
  margin-bottom:10px;
  font-weight:bold;
}

.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

input,select{
  padding:6px;
  border-radius:6px;
  border:none;
}

.toggle{
  transform:scale(1.2);
}

button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

.primary{
  background:#FFD700;
  color:#000;
}

.secondary{
  background:#272727;
  color:#FFD700;
}

#adminBox{
  display:none;
  margin-top:20px;
}
</style>
</head>
<body>

<header>⚙️ Ultra Settings</header>

<div class="container">

<!-- ACCOUNT INFO -->
<div class="card">
  <div class="section-title">👤 Account Info</div>
  <div>Email: <span id="email">---</span></div>
  <div>UID: <span id="uid">---</span></div>
</div>

<!-- UI SETTINGS -->
<div class="card">
  <div class="section-title">🎨 UI Preferences</div>

  <div class="row">
    <span>Theme</span>
    <select id="theme">
      <option value="dark">Dark</option>
      <option value="gold">Gold</option>
    </select>
  </div>

  <div class="row">
    <span>Hide Balance</span>
    <input type="checkbox" id="hideBalance" class="toggle">
  </div>

  <div class="row">
    <span>Auto Compound</span>
    <input type="checkbox" id="autoCompound" class="toggle">
  </div>
</div>

<!-- SECURITY -->
<div class="card">
  <div class="section-title">🔐 Security</div>

  <div class="row">
    <span>Withdraw Protection</span>
    <input type="checkbox" id="withdrawProtection" class="toggle">
  </div>

  <div class="row">
    <span>Change Withdraw PIN</span>
    <input type="password" id="pin" placeholder="New PIN">
  </div>

  <button class="primary" onclick="changePassword()">Change Password</button>
</div>

<!-- SAVE -->
<div class="card">
  <button class="primary" onclick="saveSettings()">💾 Save Settings</button>
  <button class="secondary" onclick="logout()">🚪 Logout</button>
</div>

<!-- 🔒 HIDDEN ADMIN BOX -->
<div id="adminBox">
  <div class="card">
    <div class="section-title">🛡 Admin Access</div>
    <input type="password" id="adminPin" placeholder="Enter Admin PIN">
    <button class="primary" onclick="verifyAdmin()">Enter Admin</button>
  </div>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, updatePassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain:"supernft-5b952.firebaseapp.com",
  projectId:"supernft-5b952"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

let userRef;

onAuthStateChanged(auth, async(user)=>{
  if(!user){
    location.href="login.html";
    return;
  }

  document.getElementById("email").innerText=user.email;
  document.getElementById("uid").innerText=user.uid;

  userRef=doc(db,"users",user.uid);
});

/* SAVE SETTINGS */
window.saveSettings=async function(){

  const settings={
    theme:document.getElementById("theme").value,
    hideBalance:document.getElementById("hideBalance").checked,
    autoCompound:document.getElementById("autoCompound").checked,
    withdrawProtection:document.getElementById("withdrawProtection").checked
  };

  const pin=document.getElementById("pin").value;
  if(pin){
    settings.withdrawPIN=pin;
  }

  await updateDoc(userRef,{settings});

  alert("✅ Settings Saved!");
}

/* CHANGE PASSWORD */
window.changePassword=async function(){
  const user=auth.currentUser;
  const newPass=prompt("Enter new password:");
  if(newPass){
    await updatePassword(user,newPass);
    alert("Password Updated!");
  }
}

/* LOGOUT */
window.logout=function(){
  signOut(auth).then(()=>location.href="login.html");
}

/* ============================= */
/* 🔥 INVISIBLE Z GESTURE ADMIN */
/* ============================= */

let gesturePoints=[];

document.addEventListener("touchstart",()=>{
  gesturePoints=[];
});

document.addEventListener("touchmove",(e)=>{
  const t=e.touches[0];
  gesturePoints.push({x:t.clientX,y:t.clientY});
});

document.addEventListener("touchend",()=>{

  if(gesturePoints.length<25) return;

  let first=gesturePoints[0];
  let mid=gesturePoints[Math.floor(gesturePoints.length/2)];
  let last=gesturePoints[gesturePoints.length-1];

  let width=window.innerWidth;

  let topLine = first.x < width*0.3 && mid.x > width*0.6;
  let diagonal = mid.y > first.y + 40;
  let bottomLine = last.x > width*0.6;

  if(topLine && diagonal && bottomLine){
    document.getElementById("adminBox").style.display="block";
    alert("🛡 Admin Mode Activated");
  }
});

/* VERIFY ADMIN PIN */
window.verifyAdmin=function(){

  const pin=document.getElementById("adminPin").value;

  if(pin==="7788"){   // 🔑 CHANGE THIS PIN
    window.location.href="admin.html";
  }else{
    alert("❌ Wrong PIN");
  }
}

</script>

</body>
</html>
