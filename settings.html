<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SuperNFT – Ultra Settings</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0f0f0f;
  color:#FFD700;
}

header{
  padding:15px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
  background:#1a1a1a;
  position:relative;
}

#adminIcon{
  position:absolute;
  right:15px;
  top:12px;
  font-size:22px;
  cursor:pointer;
  opacity:0.6;
}

.container{
  padding:15px;
}

.card{
  background:#1a1a1a;
  padding:15px;
  border-radius:12px;
  margin-bottom:15px;
}

.section-title{
  font-size:16px;
  margin-bottom:10px;
  font-weight:bold;
}

.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

input,select{
  padding:6px;
  border-radius:6px;
  border:none;
}

.toggle{
  transform:scale(1.2);
}

button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

.primary{
  background:#FFD700;
  color:#000;
}

.secondary{
  background:#272727;
  color:#FFD700;
}

/* 🔒 ADMIN MODAL */
#adminModal{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.8);
justify-content:center;
align-items:center;
z-index:9999;
}
</style>
</head>
<body>

<header>
⚙️ Ultra Settings
<span id="adminIcon">👑</span>
</header>

<div class="container">

<!-- ACCOUNT INFO -->
<div class="card">
  <div class="section-title">👤 Account Info</div>
  <div>Email: <span id="email">---</span></div>
  <div>UID: <span id="uid">---</span></div>
</div>

<!-- UI SETTINGS -->
<div class="card">
  <div class="section-title">🎨 UI Preferences</div>

  <div class="row">
    <span>Theme</span>
    <select id="theme">
      <option value="dark">Dark</option>
      <option value="gold">Gold</option>
    </select>
  </div>

  <div class="row">
    <span>Hide Balance</span>
    <input type="checkbox" id="hideBalance" class="toggle">
  </div>

  <div class="row">
    <span>Auto Compound</span>
    <input type="checkbox" id="autoCompound" class="toggle">
  </div>
</div>

<!-- SECURITY -->
<div class="card">
  <div class="section-title">🔐 Security</div>

  <div class="row">
    <span>Withdraw Protection</span>
    <input type="checkbox" id="withdrawProtection" class="toggle">
  </div>

  <div class="row">
    <span>Change Withdraw PIN</span>
    <input type="password" id="pin" placeholder="New PIN">
  </div>

  <button class="primary" onclick="changePassword()">Change Password</button>
</div>

<!-- SAVE -->
<div class="card">
  <button class="primary" onclick="saveSettings()">💾 Save Settings</button>
  <button class="secondary" onclick="logout()">🚪 Logout</button>
</div>

</div>

<!-- 🔒 ADMIN PIN MODAL -->
<div id="adminModal">
  <div style="background:#1a1a1a;padding:20px;border-radius:12px;width:85%;max-width:300px;text-align:center;">
    <h3>🛡 Admin Access</h3>

    <input type="password" id="adminPin"
           placeholder="Enter Admin PIN"
           style="width:100%;padding:8px;margin:10px 0;border-radius:6px;border:none;">

    <button class="primary" onclick="checkAdminPin()">Enter</button>
    <button class="secondary" onclick="closeAdmin()">Cancel</button>
  </div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, updatePassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain:"supernft-5b952.firebaseapp.com",
  projectId:"supernft-5b952"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

let userRef;

onAuthStateChanged(auth, async(user)=>{
  if(!user){
    location.href="login.html";
    return;
  }

  document.getElementById("email").innerText=user.email;
  document.getElementById("uid").innerText=user.uid;

  userRef=doc(db,"users",user.uid);
  const snap=await getDoc(userRef);

  if(snap.exists()){
    const s=snap.data().settings || {};

    document.getElementById("theme").value=s.theme || "dark";
    document.getElementById("hideBalance").checked=s.hideBalance || false;
    document.getElementById("autoCompound").checked=s.autoCompound || false;
    document.getElementById("withdrawProtection").checked=s.withdrawProtection || false;
  }
});

window.saveSettings=async function(){

  const settings={
    theme:document.getElementById("theme").value,
    hideBalance:document.getElementById("hideBalance").checked,
    autoCompound:document.getElementById("autoCompound").checked,
    withdrawProtection:document.getElementById("withdrawProtection").checked
  };

  const pin=document.getElementById("pin").value;
  if(pin){
    settings.withdrawPIN=pin;
  }

  await updateDoc(userRef,{settings});
  alert("✅ Settings Saved Successfully!");
}

window.changePassword=async function(){
  const user=auth.currentUser;
  const newPass=prompt("Enter new password:");
  if(newPass){
    await updatePassword(user,newPass);
    alert("Password Updated!");
  }
}

window.logout=function(){
  signOut(auth).then(()=>location.href="login.html");
}

/* 👑 ADMIN ACCESS */

document.getElementById("adminIcon")
.addEventListener("click",function(){
  document.getElementById("adminModal").style.display="flex";
});

window.closeAdmin=function(){
  document.getElementById("adminModal").style.display="none";
}

window.checkAdminPin=function(){

  const pin=document.getElementById("adminPin").value;
  const SECRET="1449";

  if(pin===SECRET){
    window.location.href="admin.html";
  }else{
    alert("❌ Wrong PIN");
  }
}

</script>

</body>
</html>
