<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SuperNFT – Ultra Settings</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0f0f0f;
  color:#FFD700;
}
header{
  padding:15px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
  background:#1a1a1a;
}
.container{
  padding:15px;
}
.card{
  background:#1a1a1a;
  padding:15px;
  border-radius:12px;
  margin-bottom:15px;
}
.section-title{
  font-size:16px;
  margin-bottom:10px;
  font-weight:bold;
}
.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}
input,select{
  padding:6px;
  border-radius:6px;
  border:none;
}
.toggle{
  transform:scale(1.2);
}
button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}
.primary{
  background:#FFD700;
  color:#000;
}
.secondary{
  background:#272727;
  color:#FFD700;
}
</style>
</head>
<body>

<header>⚙️ Ultra Settings</header>

<div class="container">

<!-- ACCOUNT INFO -->
<div class="card">
  <div class="section-title">👤 Account Info</div>
  <div>Email: <span id="email">---</span></div>
  <div>UID: <span id="uid">---</span></div>
</div>

<!-- UI SETTINGS -->
<div class="card">
  <div class="section-title">🎨 UI Preferences</div>

  <div class="row">
    <span>Theme</span>
    <select id="theme">
      <option value="dark">Dark</option>
      <option value="gold">Gold</option>
    </select>
  </div>

  <div class="row">
    <span>Hide Balance</span>
    <input type="checkbox" id="hideBalance" class="toggle">
  </div>
</div>

<!-- SAVE -->
<div class="card">
  <button class="primary" onclick="saveSettings()">💾 Save Settings</button>
  <button class="secondary" onclick="logout()">🚪 Logout</button>
</div>

<!-- 🔒 HIDDEN ADMIN ACCESS -->
<div class="card" id="adminBox" style="display:none;">
  <div class="section-title">🛡 Admin Access</div>
  <input type="password" id="adminPin" placeholder="Enter Admin PIN">
  <button class="primary" onclick="verifyAdmin()">Enter Admin Panel</button>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain:"supernft-5b952.firebaseapp.com",
  projectId:"supernft-5b952"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

let userRef;

onAuthStateChanged(auth, async(user)=>{
  if(!user){
    location.href="login.html";
    return;
  }

  document.getElementById("email").innerText=user.email;
  document.getElementById("uid").innerText=user.uid;

  userRef=doc(db,"users",user.uid);
  const snap=await getDoc(userRef);

  if(snap.exists()){
    const s=snap.data().settings || {};
    document.getElementById("theme").value=s.theme || "dark";
    document.getElementById("hideBalance").checked=s.hideBalance || false;
  }
});

/* 💾 SAVE SETTINGS */
window.saveSettings=async function(){
  const settings={
    theme:document.getElementById("theme").value,
    hideBalance:document.getElementById("hideBalance").checked
  };
  await updateDoc(userRef,{settings});
  alert("✅ Settings Saved!");
}

/* 🚪 LOGOUT */
window.logout=function(){
  signOut(auth).then(()=>location.href="login.html");
}

/* 🔥 TRIPLE TAP ADMIN ACCESS */
let tapCounter = 0;
let tapTimer = null;

document.addEventListener("click", function(){

  tapCounter++;

  if(tapCounter === 1){
    tapTimer = setTimeout(()=>{
      tapCounter = 0;
    },1000);
  }

  if(tapCounter === 3){
    clearTimeout(tapTimer);
    tapCounter = 0;
    document.getElementById("adminBox").style.display="block";
    alert("🛡 Admin Mode Activated");
  }

});

/* 🔐 VERIFY ADMIN PIN */
window.verifyAdmin = function(){

  const pin = document.getElementById("adminPin").value;

  const ADMIN_SECRET_PIN = "1449"; // 🔥 YOUR PIN

  if(pin === ADMIN_SECRET_PIN){
    window.location.href="admin.html";
  }else{
    alert("❌ Wrong PIN");
  }
}

</script>

</body>
</html>
