<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>My Account - SuperNFT</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0f0f0f;
  color:#FFD700;
}

header{
  background:#1a1a1a;
  padding:15px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
}

.container{
  padding:15px;
}

.card{
  background:#1a1a1a;
  padding:15px;
  border-radius:12px;
  margin-bottom:15px;
}

.row{
  display:flex;
  justify-content:space-between;
  padding:12px 0;
  border-bottom:1px solid #272727;
}

.row:last-child{
  border-bottom:none;
}

.value{
  font-weight:bold;
}

.status-active{
  color:#00ff88;
}

.status-banned{
  color:#ff4444;
}

.btn{
  display:block;
  width:100%;
  text-align:center;
  padding:12px;
  background:#FFD700;
  color:#000;
  border-radius:8px;
  text-decoration:none;
  margin-top:10px;
  font-weight:bold;
  border:none;
  cursor:pointer;
}

.btn:hover{
  background:#e6c200;
}
</style>
</head>

<body>

<header>👤 My Account</header>

<div class="container">

<!-- USER INFO -->
<div class="card">
  <div class="row"><div>Email</div><div class="value" id="email">---</div></div>
  <div class="row"><div>User ID</div><div class="value" id="uid">---</div></div>
  <div class="row"><div>Level</div><div class="value" id="level">0</div></div>
  <div class="row"><div>Account Status</div><div class="value" id="status">---</div></div>
</div>

<!-- WALLET -->
<div class="card">
  <div class="row"><div>Wallet Balance</div><div class="value">$<span id="wallet">0</span></div></div>
  <div class="row"><div>Daily Income</div><div class="value">$<span id="daily">0</span></div></div>
  <div class="row"><div>Live Earnings</div><div class="value">$<span id="live">0</span></div></div>
  <div class="row"><div>Referral Earnings</div><div class="value">$<span id="referral">0</span></div></div>
</div>

<button class="btn" onclick="logout()">Logout</button>

</div>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain:"supernft-5b952.firebaseapp.com",
  projectId:"supernft-5b952"
});

const auth=firebase.auth();
const db=firebase.firestore();

auth.onAuthStateChanged(user=>{

  if(!user){
    window.location.href="login.html";
    return;
  }

  document.getElementById("email").innerText=user.email;
  document.getElementById("uid").innerText=user.uid;

  db.collection("users").doc(user.uid)
    .onSnapshot(doc=>{

      if(!doc.exists) return;

      const u=doc.data();

      document.getElementById("wallet").innerText=(u.walletBalance||0).toFixed(2);
      document.getElementById("daily").innerText=(u.dailyIncome||0).toFixed(2);
      document.getElementById("live").innerText=(u.liveEarnings||0).toFixed(4);
      document.getElementById("referral").innerText=(u.referralEarnings||0).toFixed(2);
      document.getElementById("level").innerText=u.level||0;

      const statusEl=document.getElementById("status");

      if(u.banned===true){
        statusEl.innerText="BANNED";
        statusEl.className="value status-banned";
      }else{
        statusEl.innerText="ACTIVE";
        statusEl.className="value status-active";
      }

    });

});

function logout(){
  auth.signOut().then(()=>{
    window.location.href="login.html";
  });
}
</script>

</body>
</html>
