<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account | SuperNFT</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0f0f0f;
  color:#FFD700;
}
header{
  background:#1a1a1a;
  padding:15px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
}
.container{padding:15px;}
.card{
  background:#1a1a1a;
  padding:15px;
  border-radius:12px;
  margin-bottom:15px;
}
.section-title{
  font-weight:bold;
  margin-bottom:10px;
}
.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:6px 0;
  font-size:14px;
}
input{
  background:#272727;
  border:none;
  border-radius:6px;
  padding:6px;
  color:#FFD700;
}
.btn-small{
  background:#FFD700;
  border:none;
  padding:6px 10px;
  border-radius:6px;
  cursor:pointer;
  font-weight:bold;
}
.big{font-size:18px;font-weight:bold;}
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
</style>
</head>

<body>

<header>👤 My Account</header>

<div class="container">

<!-- BASIC INFO -->
<div class="card">
<div class="section-title">Basic Info</div>

<div class="row">
  <span>Name</span>
  <div style="display:flex;gap:6px;">
    <input type="text" id="nameInput">
    <button class="btn-small" onclick="saveName()">Save</button>
  </div>
</div>

<div class="row"><span>Email</span><span id="email">-</span></div>
<div class="row"><span>UID</span><span id="uid">-</span></div>
<div class="row"><span>Referral Code</span><span id="refCode">-</span></div>
<div class="row"><span>VIP Level</span><span id="vipLevel">VIP 0</span></div>
<div class="row"><span>Status</span><span id="status">-</span></div>
<div class="row"><span>Join Date</span><span id="joinDate">-</span></div>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
authDomain:"supernft-5b952.firebaseapp.com",
projectId:"supernft-5b952"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

let currentUser;

onAuthStateChanged(auth, async(user)=>{
if(!user){location.href="login.html";return;}
currentUser=user;

document.getElementById("email").innerText=user.email;
document.getElementById("uid").innerText=user.uid;

const snap=await getDoc(doc(db,"users",user.uid));
if(!snap.exists()) return;
const d=snap.data();

/* Load Name Properly */
document.getElementById("nameInput").value =
d.name || user.displayName || user.email.split("@")[0];

document.getElementById("refCode").innerText=d.referralCode||"-";
document.getElementById("vipLevel").innerText="VIP "+(d.level||0);
document.getElementById("joinDate").innerText=d.createdAt?.toDate().toLocaleDateString()||"-";
document.getElementById("status").innerText=d.banned?"BANNED":"ACTIVE";

});

/* SAVE NAME FUNCTION */
window.saveName = async function(){

const newName=document.getElementById("nameInput").value.trim();

if(!newName){
alert("Name cannot be empty");
return;
}

try{

// Update Firestore
await updateDoc(doc(db,"users",currentUser.uid),{
name:newName
});

// Update Firebase Auth
await updateProfile(currentUser,{
displayName:newName
});

alert("Name updated successfully");

}catch(err){
alert("Error: "+err.message);
}

}

</script>

</body>
</html>
