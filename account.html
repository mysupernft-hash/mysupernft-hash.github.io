<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account | SuperNFT</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"></script>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#0f0f0f;
color:#FFD700;
}

header{
background:#1a1a1a;
padding:15px;
text-align:center;
font-size:20px;
font-weight:bold;
}

.container{
padding:15px;
}

.card{
background:#1a1a1a;
padding:15px;
border-radius:12px;
margin-bottom:15px;
box-shadow:0 0 15px rgba(255,215,0,0.1);
}

.center{text-align:center;}

.big{font-size:20px;font-weight:bold;}

.row{
display:flex;
justify-content:space-between;
margin-top:8px;
}

.grid-2{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
}

.small-card{
background:#111;
padding:10px;
border-radius:10px;
text-align:center;
font-size:14px;
}

.small-card span{
display:block;
font-size:16px;
margin-top:4px;
font-weight:bold;
}

.progress{
height:8px;
background:#333;
border-radius:5px;
margin-top:8px;
overflow:hidden;
}

.progress-bar{
height:100%;
background:#FFD700;
width:0%;
}

.badge{
font-size:22px;
margin-top:5px;
}

.btn{
display:block;
margin-top:10px;
padding:12px;
background:#FFD700;
color:#000;
border-radius:8px;
text-align:center;
text-decoration:none;
font-weight:bold;
}

.logout{
background:#ff4444;
color:#fff;
}
</style>
</head>

<body>

<header>👤 My Account</header>

<div class="container">

<!-- PROFILE -->
<div class="card center">
<div id="email">Loading...</div>
<div style="font-size:12px;">UID: <span id="uid">---</span></div>
<div class="badge" id="rankBadge">⭐ VIP 0</div>
<div>Commission: <span id="commission">5%</span></div>
<div class="progress">
<div class="progress-bar" id="levelBar"></div>
</div>
<div style="font-size:12px;margin-top:5px;">Next Level Progress</div>
</div>

<!-- WALLET -->
<div class="card">
<div class="row">
<div>Wallet Balance</div>
<div class="big">$<span id="wallet">0</span></div>
</div>
<div class="row">
<div>Total Deposit</div>
<div>$<span id="deposit">0</span></div>
</div>
<div class="row">
<div>Total Withdraw</div>
<div>$<span id="withdraw">0</span></div>
</div>
</div>

<!-- INCOME -->
<div class="card">
<div class="grid-2">
<div class="small-card">
Daily Income
<span>$<span id="daily">0</span></span>
</div>
<div class="small-card">
Live Earnings
<span>$<span id="live">0</span></span>
</div>
<div class="small-card">
Referral Bonus
<span>$<span id="referral">0</span></span>
</div>
<div class="small-card">
Team Commission
<span>$<span id="teamBonus">0</span></span>
</div>
</div>
</div>

<!-- TEAM SUMMARY -->
<div class="card">
<div class="row">
<div>Total Team</div>
<div id="teamCount">0</div>
</div>
<div class="row">
<div>VIP Level</div>
<div id="level">0</div>
</div>
</div>

<!-- ACTION BUTTONS -->
<div class="card">
<a href="deposit.html" class="btn">Deposit</a>
<a href="withdraw.html" class="btn">Withdraw</a>
<a href="settings.html" class="btn">Settings</a>
<button onclick="logout()" class="btn logout">Logout</button>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
authDomain:"supernft-5b952.firebaseapp.com",
projectId:"supernft-5b952"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

onAuthStateChanged(auth, async(user)=>{

if(!user){
location.href="login.html";
return;
}

document.getElementById("email").innerText=user.email;
document.getElementById("uid").innerText=user.uid;

const userRef=doc(db,"users",user.uid);
const snap=await getDoc(userRef);

if(!snap.exists()) return;

const data=snap.data();

document.getElementById("wallet").innerText=data.walletBalance||0;
document.getElementById("deposit").innerText=data.totalDeposit||0;
document.getElementById("withdraw").innerText=data.withdraw||0;
document.getElementById("daily").innerText=data.dailyIncome||0;
document.getElementById("live").innerText=data.liveEarnings||0;
document.getElementById("referral").innerText=data.referralEarnings||0;
document.getElementById("teamBonus").innerText=data.teamBonus||0;
document.getElementById("level").innerText=data.level||0;

/* VIP SYSTEM */
const level=data.level||0;

let commission=5;
if(level>=5) commission=10;
if(level>=8) commission=15;

document.getElementById("commission").innerText=commission+"%";
document.getElementById("rankBadge").innerText="👑 VIP "+level;

let progress=(data.totalDeposit||0)/1000*100;
if(progress>100) progress=100;

document.getElementById("levelBar").style.width=progress+"%";

/* Team Count */
const refCol=collection(db,"users",user.uid,"referrals");
const refSnap=await getDocs(refCol);
document.getElementById("teamCount").innerText=refSnap.size;

});

window.logout=function(){
signOut(auth).then(()=>location.href="login.html");
}

</script>

</body>
</html>
