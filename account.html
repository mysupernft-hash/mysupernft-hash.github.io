<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>My Account - SuperNFT</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b0b0b;
  color: #ffd700;
}

.container {
  max-width: 500px;
  margin: 40px auto;
  background: #111;
  border: 1px solid #222;
  border-radius: 10px;
  padding: 25px;
  box-shadow: 0 0 15px rgba(255,215,0,0.1);
}

h2 {
  text-align: center;
  margin-bottom: 20px;
}

.row {
  display: flex;
  justify-content: space-between;
  padding: 10px 0;
  border-bottom: 1px solid #222;
}

.row span {
  color: #aaa;
}

.value {
  font-weight: bold;
}

.status-active {
  color: #00ff88;
}

.status-banned {
  color: #ff4444;
}

.logout {
  margin-top: 20px;
  width: 100%;
  padding: 12px;
  background: #ffd700;
  color: #000;
  border: none;
  font-weight: bold;
  cursor: pointer;
  border-radius: 5px;
}
</style>
</head>

<body>

<div class="container">
  <h2>My Account</h2>

  <div class="row"><span>Email</span><div class="value" id="email">---</div></div>
  <div class="row"><span>User ID</span><div class="value" id="uid">---</div></div>
  <div class="row"><span>Wallet Balance</span><div class="value">$<span id="balance">0</span></div></div>
  <div class="row"><span>Daily Income</span><div class="value">$<span id="daily">0</span></div></div>
  <div class="row"><span>Referral Earnings</span><div class="value">$<span id="referral">0</span></div></div>
  <div class="row"><span>Level</span><div class="value" id="level">1</div></div>
  <div class="row">
    <span>Account Status</span>
    <div class="value" id="status">---</div>
  </div>

  <button class="logout" onclick="logout()">Logout</button>
</div>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain: "supernft-5b952.firebaseapp.com",
  projectId: "supernft-5b952"
});

const auth = firebase.auth();
const db   = firebase.firestore();

auth.onAuthStateChanged(user => {
  if (!user) {
    window.location.href = "login.html";
    return;
  }

  document.getElementById("email").innerText = user.email;
  document.getElementById("uid").innerText   = user.uid;

  db.collection("users").doc(user.uid).get().then(doc => {
    if (!doc.exists) return;

    const u = doc.data();

    document.getElementById("balance").innerText  = u.balance || 0;
    document.getElementById("daily").innerText    = u.dailyIncome || 0;
    document.getElementById("referral").innerText = u.referralEarnings || 0;
    document.getElementById("level").innerText    = u.level || 1;

    const statusEl = document.getElementById("status");
    if (u.banned === true) {
      statusEl.innerText = "BANNED";
      statusEl.className = "value status-banned";
    } else {
      statusEl.innerText = "ACTIVE";
      statusEl.className = "value status-active";
    }
  });
});

function logout(){
  auth.signOut().then(() => {
    window.location.href = "login.html";
  });
}
</script>

</body>
</html>
