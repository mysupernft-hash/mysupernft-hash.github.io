<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>User Details | SuperNFT Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
body{margin:0;font-family:Arial;background:#0d0d0d;color:#FFD700;padding:15px;}
.card{background:#111;padding:15px;border-radius:10px;margin-bottom:15px;}
input,select{
width:100%;padding:8px;margin-top:5px;margin-bottom:10px;
border:none;border-radius:6px;background:#1a1a1a;color:#FFD700;
}
button{padding:10px 14px;border:none;border-radius:6px;font-weight:bold;cursor:pointer;}
.saveBtn{background:#FFD700;color:black;width:100%;margin-top:20px;}
.deleteBtn{background:red;color:white;}
.addBtn{background:#333;color:#FFD700;margin-top:10px;}
table{width:100%;border-collapse:collapse;margin-top:10px;}
th,td{padding:8px;text-align:center;}
th{background:#1a1a1a;}
tr{background:#111;}
</style>
</head>

  <body>
  <div id="toast" style="
  position:fixed;
  top:20px;
  left:50%;
  transform:translateX(-50%) translateY(-10px);
  background:rgba(0,0,0,0.6);
  backdrop-filter:blur(10px);
  color:#00ff88;
  padding:8px 14px;
  border-radius:20px;
  font-size:12px;
  display:none;
  opacity:0;
  transition:0.3s;
  z-index:9999;
  box-shadow:0 0 10px rgba(0,255,136,0.3);
">
Message Sent ✅
</div>

<h2>👤 User Details</h2>

<div class="card">

<label>Wallet</label>
<input id="wallet">

<label>Deposit</label>
<input id="deposit">

<label>Referral Earnings</label>
<input id="referral">

<label>Daily Income</label>
<input id="daily">

<label>Level</label>
<input id="level">

<label>Live Earnings</label>
<input id="live">

<label>Role</label>
<select id="role">
<option value="user">User</option>
<option value="vip">VIP</option>
<option value="admin">Admin</option>
</select>

<label>Verified</label>
<select id="verified">
<option value="false">No</option>
<option value="true">Yes</option>
</select>

</div>

<!-- 👥 REFERRAL INFO -->
<div class="card">

<h3>👥 Referral Information</h3>

<p><b>Referred By Code:</b> <span id="referredCode">-</span></p>
<p><b>Referred By UID:</b> <span id="referredUid">-</span></p>

<p><b>Total Referrals:</b> <span id="refCount">0</span></p>

<table>
<thead>
<tr>
<th>Email</th>
<th>UID</th>
</tr>
</thead>

<tbody id="referralUsers"></tbody>

</table>

</div>

<!-- 💎 NFT SECTION -->
<div class="card">
<h3>🖼 Purchased NFTs</h3>

<table>
<thead>
<tr>
<th>Amount</th>
<th>Delete</th>
</tr>
</thead>
<tbody id="nftTable"></tbody>
</table>

<button onclick="addNFT()" class="addBtn">Add NFT</button>
</div>

<!-- 💸 WITHDRAW SECTION -->
<div class="card">
<h3>💸 Withdraw History</h3>

<table>
<thead>
<tr>
<th>Requested</th>
<th>Approved</th>
<th>Status</th>
<th>Delete</th>
</tr>
</thead>
<tbody id="withdrawTable"></tbody>
</table>

<button onclick="addWithdraw()" class="addBtn">Add Withdraw</button>
</div>

<!-- 💬 SEND MESSAGE -->
<div class="card">

<h3>💬 Send Message to User</h3>

<textarea id="adminMsg" placeholder="Type message..."
style="width:100%;height:80px;background:#1a1a1a;color:#FFD700;border:none;border-radius:6px;padding:10px;"></textarea>

<button onclick="sendMessage()" class="addBtn">
Send Message
</button>

  <div id="sentMessages" style="
margin-top:10px;
font-size:12px;
color:#00ff88;
"></div>

</div>
  
<button class="saveBtn" onclick="saveUser()">Save Changes</button>
<button onclick="loginAsUser()" style="background:#00aa00;color:white;width:100%;margin-top:10px;">
👁 Login As User
</button>
<script>

firebase.initializeApp({
apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
authDomain:"supernft-5b952.firebaseapp.com",
projectId:"supernft-5b952"
});

const auth = firebase.auth();
const db = firebase.firestore();

const params = new URLSearchParams(window.location.search);
const uid = params.get("uid");

let withdrawHistory = [];
let purchasedNFTs = [];

/* NFT PRICES */
const NFT_PRICES = [
10,15,20,25,30,35,40,45,50,
55,60,65,70,75,80,90,100,
150,200,250,300,350,400,450,
499,599,699,799,899,999
];

/* AUTH */
auth.onAuthStateChanged(user=>{
if(!user){
alert("Login required");
window.location.href="admin-login.html";
return;
}
loadUserData();
});

function loadUserData(){

db.collection("users").doc(uid).get().then(doc=>{

if(!doc.exists){
alert("User not found");
return;
}

const u = doc.data();

wallet.value = u.walletBalance || 0;
deposit.value = u.totalDeposit || 0;
referral.value = u.referralEarnings || 0;
daily.value = u.dailyIncome || 0;
level.value = u.level || 0;
live.value = u.liveEarnings || 0;
role.value = u.role || "user";
verified.value = u.verified ? "true" : "false";

withdrawHistory = u.withdrawHistory || [];
purchasedNFTs = u.purchasedNFTs || [];

renderWithdraw();
renderNFTs();

/* 🔥 Referral Info */
document.getElementById("referredCode").innerText =
u.referredBy || "None";

document.getElementById("referredUid").innerText =
u.referredByUid || "None";

db.collection("users")
.where("referredByUid","==",uid)
.get()
.then(snapshot=>{

const table = document.getElementById("referralUsers");

document.getElementById("refCount").innerText =
snapshot.size;

if(snapshot.empty){
table.innerHTML="<tr><td colspan='2'>No referrals</td></tr>";
return;
}

let html="";

snapshot.forEach(d=>{

const data = d.data();

html+=`
<tr>
<td>${data.email || "-"}</td>
<td>${d.id}</td>
</tr>
`;

});

table.innerHTML = html;

});

});

}

/* NFT RENDER */
function renderNFTs(){

const table = document.getElementById("nftTable");

if(!purchasedNFTs.length){
table.innerHTML="<tr><td colspan='2'>No NFTs</td></tr>";
return;
}

let html="";

purchasedNFTs.forEach((id,index)=>{

html+=`
<tr>
<td>
<select id="nft-${index}">
${NFT_PRICES.map((price,i)=>`
<option value="${i}" ${id===i?"selected":""}>
$${price}
</option>
`).join("")}
</select>
</td>
<td>
<button class="deleteBtn" onclick="deleteNFT(${index})">X</button>
</td>
</tr>
`;

});

table.innerHTML = html;

}

function addNFT(){
purchasedNFTs.push(0);
renderNFTs();
}

function deleteNFT(index){
purchasedNFTs.splice(index,1);
renderNFTs();
}

/* WITHDRAW RENDER */
function renderWithdraw(){

const table = document.getElementById("withdrawTable");

if(!withdrawHistory.length){
table.innerHTML="<tr><td colspan='4'>No Withdraw History</td></tr>";
return;
}

let html="";

withdrawHistory.forEach((w,index)=>{

html+=`
<tr>
<td><input type="number" id="req-${index}" value="${w.requestedAmount||0}"></td>
<td><input type="number" id="app-${index}" value="${w.approvedAmount||0}"></td>
<td>
<select id="status-${index}">
<option value="pending" ${w.status==="pending"?"selected":""}>Pending</option>
<option value="approved" ${w.status==="approved"?"selected":""}>Approved</option>
<option value="rejected" ${w.status==="rejected"?"selected":""}>Rejected</option>
</select>
</td>
<td><button class="deleteBtn" onclick="deleteRow(${index})">X</button></td>
</tr>
`;

});

table.innerHTML = html;

}

function addWithdraw(){
withdrawHistory.push({
requestedAmount:0,
approvedAmount:0,
status:"pending",
message:"",
createdAt:new Date().toISOString()
});
renderWithdraw();
}

function deleteRow(index){
withdrawHistory.splice(index,1);
renderWithdraw();
}

/* SAVE */
function saveUser(){

purchasedNFTs = purchasedNFTs.map((_,index)=>
Number(document.getElementById(`nft-${index}`).value)
);

withdrawHistory.forEach((w,index)=>{

w.requestedAmount = Number(document.getElementById(`req-${index}`).value);
w.approvedAmount = Number(document.getElementById(`app-${index}`).value);
w.status = document.getElementById(`status-${index}`).value;

if(w.status==="approved"){
w.message = `You received $${w.approvedAmount} in your bank`;
}else{
w.message="";
}

});

db.collection("users").doc(uid).update({
walletBalance:Number(wallet.value),
totalDeposit:Number(deposit.value),
referralEarnings:Number(referral.value),
dailyIncome:Number(daily.value),
level:Number(level.value),
liveEarnings:Number(live.value),
role:role.value,
verified:verified.value==="true",
withdrawHistory:withdrawHistory,
purchasedNFTs:purchasedNFTs
}).then(()=>{
alert("Updated Successfully");
});

}

  function loginAsUser(){

localStorage.setItem("adminPreviewUID", uid);

window.open("dashboard.html","_blank");

}

  function sendMessage(){

const text = document.getElementById("adminMsg").value.trim();

if(!text){
alert("Enter message");
return;
}

const ref = db.collection("messages").doc(uid);

ref.get().then(doc=>{

let list = [];

if(doc.exists){
list = doc.data().list || [];
}

list.push({
  text: text,
  read: false,
  time: Date.now(),
  sender: "admin"   // 🔥 VERY IMPORTANT
});

// SAVE
ref.set({ list:list }, { merge:true }).then(()=>{
  addSentMessage(text);
showToast("Message Sent ✅");
document.getElementById("adminMsg").value="";
});

});

}

  function showToast(msg){

  const toast = document.getElementById("toast");
  toast.innerText = msg;
  toast.style.display = "block";

  setTimeout(()=>{
    toast.style.opacity = "1";
    toast.style.transform = "translateX(-50%) translateY(0)";
  },50);

  setTimeout(()=>{
    toast.style.opacity = "0";
    toast.style.transform = "translateX(-50%) translateY(-10px)";
    setTimeout(()=>{
      toast.style.display = "none";
    },300);
  },2000);
}

  function addSentMessage(text){

  const box = document.getElementById("sentMessages");

  const div = document.createElement("div");

  div.innerText = text + " ✅";

  div.style.marginBottom = "5px";

  box.prepend(div); // latest message upar
}

  // 🔥 LOAD SENT MESSAGES
db.collection("messages").doc(uid).get().then(doc=>{
  if(!doc.exists) return;

  const list = doc.data().list || [];

  const box = document.getElementById("sentMessages");
  box.innerHTML = "";

  // latest upar dikhane ke liye reverse
  [...list].reverse().forEach(m=>{
    addSentMessage(m.text);
  });
});

</script>

</body>
</html>
