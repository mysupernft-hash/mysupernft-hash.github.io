<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>User Details | SuperNFT Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>

body{
margin:0;
font-family:Arial;
background:#0d0d0d;
color:#FFD700;
padding:15px;
}

.card{
background:#111;
padding:15px;
border-radius:10px;
margin-bottom:15px;
}

input,select{
width:100%;
padding:8px;
margin-top:5px;
margin-bottom:10px;
border:none;
border-radius:6px;
background:#1a1a1a;
color:#FFD700;
}

button{
padding:10px 14px;
border:none;
border-radius:6px;
font-weight:bold;
cursor:pointer;
}

.saveBtn{
background:#FFD700;
color:black;
width:100%;
margin-top:20px;
}

.deleteBtn{
background:red;
color:white;
}

.addBtn{
background:#333;
color:#FFD700;
margin-top:10px;
}

table{
width:100%;
border-collapse:collapse;
margin-top:10px;
}

th,td{
padding:8px;
text-align:center;
}

th{
background:#1a1a1a;
}

tr{
background:#111;
}

</style>
</head>

<body>

<h2>👤 User Details</h2>

<div class="card">

<label>Wallet</label>
<input id="wallet">

<label>Deposit</label>
<input id="deposit">

<label>Referral Earnings</label>
<input id="referral">

<label>Daily Income</label>
<input id="daily">

<label>Level</label>
<input id="level">

<label>Live Earnings</label>
<input id="live">

<label>Role</label>
<select id="role">
<option value="user">User</option>
<option value="vip">VIP</option>
<option value="admin">Admin</option>
</select>

<label>Verified</label>
<select id="verified">
<option value="false">No</option>
<option value="true">Yes</option>
</select>

</div>

<div class="card">

<h3>👥 Referral Information</h3>

<p><b>Referred By Code:</b> <span id="referredCode">-</span></p>
<p><b>Referred By UID:</b> <span id="referredUid">-</span></p>

<p><b>Total Referrals:</b> <span id="refCount">0</span></p>

<table>
<thead>
<tr>
<th>Email</th>
<th>UID</th>
</tr>
</thead>

<tbody id="referralUsers"></tbody>

</table>

</div>

<div class="card">

<h3>🖼 Purchased NFTs</h3>

<table>
<thead>
<tr>
<th>Amount</th>
<th>Delete</th>
</tr>
</thead>

<tbody id="nftTable"></tbody>

</table>

<button onclick="addNFT()" class="addBtn">Add NFT</button>

</div>

<div class="card">

<h3>💸 Withdraw History</h3>

<table>

<thead>
<tr>
<th>Requested</th>
<th>Approved</th>
<th>Status</th>
<th>Delete</th>
</tr>
</thead>

<tbody id="withdrawTable"></tbody>

</table>

<button onclick="addWithdraw()" class="addBtn">Add Withdraw</button>

</div>

<button class="saveBtn" onclick="saveUser()">Save Changes</button>

<script>

firebase.initializeApp({
apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
authDomain:"supernft-5b952.firebaseapp.com",
projectId:"supernft-5b952"
});

const auth = firebase.auth();
const db = firebase.firestore();

const params = new URLSearchParams(window.location.search);
const uid = params.get("uid");

let withdrawHistory = [];
let purchasedNFTs = [];

let walletBase = 0;
let totalDepositBase = 0;
let lastIncomeAt = 0;
let dailyIncomeCalc = 0;

const NFT_PRICES = [
10,15,20,25,30,35,40,45,50,
55,60,65,70,75,80,90,100,
150,200,250,300,350,400,450,
499,599,699,799,899,999
];

auth.onAuthStateChanged(user=>{

if(!user){
alert("Login required");
window.location.href="admin-login.html";
return;
}

loadUserData();

});

function loadUserData(){

db.collection("users").doc(uid).get().then(doc=>{

if(!doc.exists){
alert("User not found");
return;
}

const u = doc.data();

wallet.value = u.walletBalance || 0;
deposit.value = u.totalDeposit || 0;
referral.value = u.referralEarnings || 0;
daily.value = u.dailyIncome || 0;
level.value = u.level || 0;
live.value = u.liveEarnings || 0;

role.value = u.role || "user";
verified.value = u.verified ? "true" : "false";

walletBase = u.walletBalance || 0;
totalDepositBase = u.totalDeposit || 0;

dailyIncomeCalc = totalDepositBase * 0.025;

if(u.lastIncomeAt){
lastIncomeAt = u.lastIncomeAt.toMillis();
}else{
lastIncomeAt = Date.now();
}

withdrawHistory = u.withdrawHistory || [];
purchasedNFTs = u.purchasedNFTs || [];

renderWithdraw();
renderNFTs();
loadReferrals(u);

startMining();

});

}

function startMining(){

function updateMining(){

const now = Date.now();
const seconds = Math.floor((now - lastIncomeAt)/1000);

const perSecond = dailyIncomeCalc / 86400;
const liveEarn = perSecond * seconds;

const finalWallet = walletBase + liveEarn;

wallet.value = finalWallet.toFixed(2);
daily.value = dailyIncomeCalc.toFixed(2);
live.value = liveEarn.toFixed(6);

}

updateMining();
setInterval(updateMining,1000);

}

</script>

</body>
</html>
