<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>User Details | SuperNFT Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
body{margin:0;font-family:Arial;background:#0d0d0d;color:#FFD700;padding:15px;}
h2{text-align:center}
.card{background:#111;padding:15px;border-radius:10px;margin-bottom:15px;}
input,select{width:100%;padding:8px;margin-top:5px;margin-bottom:10px;border:none;border-radius:6px;}
button{padding:8px 12px;border:none;cursor:pointer;font-weight:bold;border-radius:6px;margin-top:5px;}
.saveBtn{background:#FFD700;}
.deleteBtn{background:red;color:white;}
.sectionBox{background:#1a1a1a;padding:10px;border-radius:8px;margin-bottom:10px;}
</style>
</head>

<body>

<h2>👤 User Details</h2>

<div class="card">
<b>Email:</b> <span id="email"></span><br>
<b>UID:</b> <span id="uid"></span>
</div>

<div class="card">
<label>Wallet</label>
<input id="wallet">

<label>Deposit</label>
<input id="deposit">

<label>Referral Earnings</label>
<input id="referral">

<label>Level</label>
<input id="level">

<label>Live Earnings</label>
<input id="live">

<label>Role</label>
<select id="role">
<option value="user">User</option>
<option value="vip">VIP</option>
<option value="admin">Admin</option>
</select>

<label>Verified</label>
<select id="verified">
<option value="false">No</option>
<option value="true">Yes</option>
</select>

<button class="saveBtn" onclick="saveUser()">Save Changes</button>
<button class="deleteBtn" onclick="deleteUser()">Delete User</button>
</div>

<button id="toggleWithdrawBtn" class="saveBtn" onclick="toggleWithdraw()">
💸 Show Withdraw History
</button>

<div id="withdrawSection" style="display:none;">
<div class="card">
<h3>💸 Withdraw History</h3>
<div id="withdrawList"></div>
<button onclick="addWithdraw()">Add Manual Withdraw</button>
</div>
</div>

<script>

firebase.initializeApp({
apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
authDomain:"supernft-5b952.firebaseapp.com",
projectId:"supernft-5b952"
});

const db=firebase.firestore();
const params=new URLSearchParams(window.location.search);
const uid=params.get("uid");
document.getElementById("uid").innerText=uid;

let withdrawHistory=[];

/* LOAD USER */
db.collection("users").doc(uid).onSnapshot(doc=>{
const u=doc.data();
if(!u) return;

email.innerText=u.email||"";
wallet.value=u.walletBalance||0;
deposit.value=u.totalDeposit||0;
referral.value=u.referralEarnings||0;
level.value=u.level||0;
live.value=u.liveEarnings||0;
role.value=u.role||"user";
verified.value=u.verified?"true":"false";

withdrawHistory=u.withdrawHistory||[];
renderWithdraw();
});

/* TOGGLE */
function toggleWithdraw(){
const section=document.getElementById("withdrawSection");
const btn=document.getElementById("toggleWithdrawBtn");
if(section.style.display==="none"){
section.style.display="block";
btn.innerText="❌ Hide Withdraw History";
}else{
section.style.display="none";
btn.innerText="💸 Show Withdraw History";
}
}

/* RENDER WITHDRAW */
function renderWithdraw(){

if(withdrawHistory.length===0){
withdrawList.innerHTML="No Withdraw History";
return;
}

let html="";

withdrawHistory.forEach((w,index)=>{

html+=`
<div class="sectionBox">

<label>Requested Amount</label>
<input type="number" id="req-${index}" value="${w.requestedAmount||0}">

<label>Approved Amount</label>
<input type="number" id="app-${index}" value="${w.approvedAmount||0}">

<label>Status</label>
<select id="status-${index}">
<option value="pending" ${w.status==="pending"?"selected":""}>Pending</option>
<option value="approved" ${w.status==="approved"?"selected":""}>Approved</option>
<option value="rejected" ${w.status==="rejected"?"selected":""}>Rejected</option>
</select>

<label>Message</label>
<input type="text" id="msg-${index}" value="${w.message||""}">

</div>`;
});

withdrawList.innerHTML=html;
}

/* SAVE USER + WITHDRAW */
function saveUser(){

db.collection("users").doc(uid).get().then(doc=>{

const userData=doc.data();
let walletChange=0;

// Process Withdraw Updates
withdrawHistory.forEach((oldEntry,index)=>{

const newRequested=Number(document.getElementById(`req-${index}`).value);
const newApproved=Number(document.getElementById(`app-${index}`).value);
const newStatus=document.getElementById(`status-${index}`).value;
const newMessage=document.getElementById(`msg-${index}`).value;

// Pending → Approved
if(oldEntry.status!=="approved" && newStatus==="approved"){
walletChange-=newApproved;
}

// Approved → Rejected
if(oldEntry.status==="approved" && newStatus==="rejected"){
walletChange+=oldEntry.approvedAmount;
}

// Approved amount changed
if(oldEntry.status==="approved" && newStatus==="approved"){
const diff=oldEntry.approvedAmount-newApproved;
walletChange+=diff;
}

withdrawHistory[index]={
requestedAmount:newRequested,
approvedAmount:newApproved,
status:newStatus,
message:newMessage,
createdAt:oldEntry.createdAt||new Date().toISOString()
};

});

db.collection("users").doc(uid).update({
walletBalance:Number(wallet.value)+walletChange,
totalDeposit:Number(deposit.value),
referralEarnings:Number(referral.value),
level:Number(level.value),
liveEarnings:Number(live.value),
role:role.value,
verified:verified.value==="true",
withdrawHistory:withdrawHistory
}).then(()=>alert("User + Withdraw Updated"));

});

}

/* ADD WITHDRAW */
function addWithdraw(){
withdrawHistory.push({
requestedAmount:0,
approvedAmount:0,
status:"pending",
message:"",
createdAt:new Date().toISOString()
});
renderWithdraw();
}

/* DELETE USER */
function deleteUser(){
if(confirm("Delete this user permanently?")){
db.collection("users").doc(uid).delete()
.then(()=>{
alert("User Deleted");
window.location.href="admin.html";
});
}
}

</script>
</body>
</html>
