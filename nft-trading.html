<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SuperNFT Market</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
margin:0;
background:#0b0b0f;
color:#fff;
font-family:Arial;
}

/* HEADER */
.header{
display:flex;
justify-content:space-between;
padding:10px;
background:#111;
font-size:14px;
}

.tabs{
display:flex;
gap:15px;
padding:10px;
background:#111;
overflow-x:auto;
}

.tab{
color:#aaa;
cursor:pointer;
}

.tab.active{
color:#FFD700;
font-weight:bold;
}

/* TABLE */
.table{
padding:10px;
}

.row{
display:flex;
justify-content:space-between;
padding:12px;
border-bottom:1px solid #222;
align-items:center;
}

.row:hover{
background:#111;
}

/* NAME */
.name{
font-weight:bold;
}

/* PRICE */
.price{
font-weight:bold;
}

/* GREEN RED */
.green{color:#00ff66;}
.red{color:#ff4444;}

.small{
font-size:12px;
color:#aaa;
}

</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <div>12:07</div>
  <div>📶 🔋55%</div>
</div>

<!-- TABS -->
<div class="tabs">
  <div class="tab active">Hot</div>
  <div class="tab">Gainers</div>
  <div class="tab">Losers</div>
  <div class="tab">New</div>
  <div class="tab">24h Vol</div>
  <div class="tab">Market Cap</div>
</div>

<!-- TABLE -->
<div class="table" id="market"></div>

<script>

// ================= FAKE NFT MARKET =================
const coins = [
"BNBR","BTC O","ETH O","SOL","XRP",
"DOGE","ADA","LTC","BCH","TRX","FET"
];

let market = [];

// INIT DATA
coins.forEach(c=>{
market.push({
name:c,
price:Math.random()*60000+10,
change:Math.random()*10-5
});
});

// RENDER
function render(){

let html="";

market.forEach((c,i)=>{

const changeClass = c.change >=0 ? "green":"red";

html += `
<div class="row">
  <div>
    <div class="name">${c.name}</div>
    <div class="small">NFT / USDT</div>
  </div>

  <div class="price ${changeClass}">
    ${c.price.toFixed(2)}
    <div class="small">$${c.price.toFixed(2)}</div>
  </div>
</div>
`;

});

document.getElementById("market").innerHTML = html;

}

// LIVE UPDATE
setInterval(()=>{

market.forEach(c=>{

c.price += (Math.random()-0.5)*50;
c.change = Math.random()*10-5;

});

render();

},1000);

render();

</script>

</body>
</html>
