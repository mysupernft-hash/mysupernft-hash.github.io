<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SuperNFT Pro Trading</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
margin:0;
background:#0b0b0f;
color:#FFD700;
font-family:Arial;
}

/* HEADER */
header{
padding:10px;
background:#111;
text-align:center;
font-weight:bold;
}

/* LAYOUT */
.container{
display:flex;
height:calc(100vh - 50px);
}

/* LEFT NFT LIST */
.sidebar{
width:25%;
background:#111;
overflow-y:auto;
border-right:1px solid #222;
}

.nft{
padding:12px;
border-bottom:1px solid #222;
cursor:pointer;
display:flex;
justify-content:space-between;
}

.nft:hover{
background:#1a1a1a;
}

/* MAIN */
.main{
flex:1;
display:flex;
flex-direction:column;
}

/* PRICE BAR */
.price-bar{
padding:10px;
background:#111;
display:flex;
justify-content:space-between;
}

.green{color:#00ff66;}
.red{color:#ff4444;}

/* CHART */
.chart-box{
flex:1;
padding:10px;
}

canvas{
background:#0f172a;
border-radius:10px;
}

/* TRADE PANEL */
.trade{
width:25%;
background:#111;
padding:10px;
border-left:1px solid #222;
}

input{
width:100%;
padding:10px;
margin:5px 0;
background:#0f0f0f;
border:1px solid #333;
color:#FFD700;
border-radius:6px;
}

button{
width:100%;
padding:10px;
margin-top:8px;
border:none;
border-radius:6px;
font-weight:bold;
cursor:pointer;
}

.buy{
background:#00ff66;
color:#000;
}

.sell{
background:#ff4444;
color:#fff;
}

</style>
</head>

<body>

<header>📊 SuperNFT Pro Trading</header>

<div class="container">

<!-- LEFT NFT LIST -->
<div class="sidebar" id="nftList"></div>

<!-- MAIN -->
<div class="main">

<div class="price-bar">
  <div id="pair">Gold NFT / USDT</div>
  <div id="price">$100</div>
</div>

<div class="chart-box">
  <canvas id="chart"></canvas>
</div>

</div>

<!-- TRADE PANEL -->
<div class="trade">
  <h3>Trade</h3>

  <input type="number" id="amount" placeholder="Amount">

  <button class="buy" onclick="buy()">BUY</button>
  <button class="sell" onclick="sell()">SELL</button>

</div>

</div>

<script>

// ================= NFT DATA =================
const NFTs = [
{name:"Gold NFT", price:100},
{name:"Diamond NFT", price:300},
{name:"Ruby NFT", price:500},
{name:"Elite NFT", price:1000}
];

const nftList = document.getElementById("nftList");

// RENDER LIST
NFTs.forEach((n,i)=>{
nftList.innerHTML += `
<div class="nft" onclick="selectNFT(${i})">
  <span>${n.name}</span>
  <span>$${n.price}</span>
</div>
`;
});

let currentPrice = 100;
let selectedNFT = NFTs[0];

// ================= CHART =================
const ctx = document.getElementById("chart").getContext("2d");

const chart = new Chart(ctx,{
type:"line",
data:{
labels:[],
datasets:[{
data:[],
borderColor:"#FFD700",
tension:0.4
}]
},
options:{
plugins:{legend:{display:false}},
scales:{
x:{display:false},
y:{ticks:{color:"#FFD700"}}
}
}
});

// ================= SELECT NFT =================
function selectNFT(i){

selectedNFT = NFTs[i];
currentPrice = selectedNFT.price;

document.getElementById("pair").innerText =
selectedNFT.name + " / USDT";

chart.data.labels=[];
chart.data.datasets[0].data=[];
}

// ================= LIVE PRICE =================
setInterval(()=>{

let oldPrice = currentPrice;

currentPrice += (Math.random()-0.5)*10;

document.getElementById("price").innerText =
"$" + currentPrice.toFixed(2);

// COLOR CHANGE
if(currentPrice > oldPrice){
document.getElementById("price").className = "green";
}else{
document.getElementById("price").className = "red";
}

// CHART UPDATE
chart.data.labels.push("");
chart.data.datasets[0].data.push(currentPrice);

if(chart.data.labels.length > 30){
chart.data.labels.shift();
chart.data.datasets[0].data.shift();
}

chart.update();

},1000);

// ================= BUY SELL =================
function buy(){

const amt = document.getElementById("amount").value;

if(!amt) return alert("Enter amount");

alert("Bought " + selectedNFT.name + " at $" + currentPrice.toFixed(2));

}

function sell(){

const amt = document.getElementById("amount").value;

if(!amt) return alert("Enter amount");

alert("Sold " + selectedNFT.name + " at $" + currentPrice.toFixed(2));

}

</script>

</body>
</html>
