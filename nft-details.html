<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SuperNFT NFT Details</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#000;
  color:#FFD700;
  text-align:center;
}
header{
  padding:18px;
  background:#1a1a1a;
  font-size:22px;
  border-bottom:2px solid #FFD700;
}
.container{
  padding:20px;
}
.nft-img{
  width:90%;
  max-width:400px;
  border-radius:15px;
  border:3px solid #FFD700;
  box-shadow:0 0 25px #FFD700;
}
.price{
  font-size:20px;
  margin:15px 0;
}
.calc-box{
  background:#1a1a1a;
  border-radius:12px;
  padding:15px;
  margin:20px auto;
  max-width:400px;
  border:1px solid #FFD700;
}
.calc-row{
  display:flex;
  justify-content:space-between;
  margin:8px 0;
}
.buy-btn{
  background:#FFD700;
  color:#000;
  border:none;
  padding:12px;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
  margin-top:20px;
  width:220px;
}
.buy-btn:hover{
  background:#e6c200;
}
.status{
  margin-top:15px;
  font-size:14px;
}
</style>
</head>
<body>

<header>SuperNFT NFT Details</header>

<div class="container">

  <img id="nftImage" class="nft-img">
  <div class="price" id="price"></div>

  <div class="calc-box">
    <div class="calc-row"><span>Daily Income:</span><span id="daily"></span></div>
    <div class="calc-row"><span>Weekly Income:</span><span id="weekly"></span></div>
    <div class="calc-row"><span>Monthly Income:</span><span id="monthly"></span></div>
    <div class="calc-row"><span>Yearly Income:</span><span id="yearly"></span></div>
  </div>

  <button class="buy-btn" onclick="buyNFT()">Buy NFT</button>

  <div class="status" id="status"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { 
  getFirestore, 
  doc, 
  getDoc, 
  updateDoc, 
  arrayUnion 
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "supernft-5b952.firebaseapp.com",
  projectId: "supernft-5b952"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* NFT DATA */
const NFTS=[
{price:10,p:0.2,img:"images/IMG_0458.png"},
{price:15,p:0.3,img:"images/IMG_0459.png"},
{price:20,p:0.4,img:"images/IMG_0460.png"},
{price:25,p:0.5,img:"images/IMG_0461.png"},
{price:30,p:0.6,img:"images/IMG_0462.png"},
{price:35,p:0.7,img:"images/IMG_0463.png"},
{price:40,p:0.8,img:"images/IMG_0464.png"},
{price:45,p:0.9,img:"images/IMG_0465.png"},
{price:50,p:1,img:"images/IMG_0466.png"},
{price:55,p:1.3,img:"images/IMG_0467.png"},
{price:60,p:1.5,img:"images/IMG_0468.png"},
{price:65,p:1.63,img:"images/IMG_0469.png"},
{price:70,p:1.75,img:"images/IMG_0470.png"},
{price:75,p:1.88,img:"images/IMG_0471.png"},
{price:80,p:2,img:"images/IMG_0472.png"},
{price:90,p:2.25,img:"images/IMG_0473.png"},
{price:100,p:2.5,img:"images/IMG_0474.png"},
{price:150,p:5,img:"images/IMG_0475.png"},
{price:200,p:6.6,img:"images/IMG_0476.png"},
{price:250,p:8.25,img:"images/IMG_0477.png"},
{price:300,p:10,img:"images/IMG_0478.png"},
{price:350,p:11.6,img:"images/IMG_0479.png"},
{price:400,p:13.3,img:"images/IMG_0480.png"},
{price:450,p:15,img:"images/IMG_0481.png"},
{price:499,p:25,img:"images/IMG_0482.png"},
{price:599,p:30,img:"images/IMG_0483.png"},
{price:699,p:40,img:"images/IMG_0497.png"},
{price:799,p:30,img:"images/IMG_0498.png"},
{price:899,p:45,img:"images/IMG_0499.png"},
{price:999,p:100,img:"images/IMG_0503.png"}
];

const params = new URLSearchParams(window.location.search);
let id = parseInt(params.get("id"));
if(isNaN(id) || id<0 || id>=NFTS.length){ id=0; }

const nft = NFTS[id];

document.getElementById("nftImage").src = nft.img;
document.getElementById("price").innerText = "Price: $" + nft.price;
document.getElementById("daily").innerText = "$" + nft.p.toFixed(2);
document.getElementById("weekly").innerText = "$" + (nft.p*7).toFixed(2);
document.getElementById("monthly").innerText = "$" + (nft.p*30).toFixed(2);
document.getElementById("yearly").innerText = "$" + (nft.p*365).toFixed(2);

let currentUser=null;

onAuthStateChanged(auth,(user)=>{
  currentUser=user;
});

window.buyNFT = async function(){

  const status=document.getElementById("status");
  status.innerText="";

  if(!currentUser){
    status.innerText="Please login first.";
    return;
  }

  const userRef=doc(db,"users",currentUser.uid);
  const snap=await getDoc(userRef);

  if(!snap.exists()){
    status.innerText="User not found.";
    return;
  }

  const data=snap.data();
  const wallet=data.walletBalance||0;
  const daily=data.dailyIncome||0;
  const purchased=data.purchasedNFTs||[];

  if(purchased.includes(id)){
    status.innerText="You already purchased this NFT.";
    return;
  }

  if(wallet<nft.price){
    status.innerText="Insufficient Balance.";
    return;
  }

  await updateDoc(userRef,{
    walletBalance: wallet - nft.price,
    dailyIncome: daily + nft.p,
    purchasedNFTs: arrayUnion(id),
    lastIncomeAt: new Date() // 🔥 INSTANT MINING RESET
  });

  status.innerText="🎉 Purchase Successful!";
  status.style.color="#00ff00";

  setTimeout(()=>{
    window.location.href="dashboard.html";
  },1500);
};

</script>

</body>
</html>
