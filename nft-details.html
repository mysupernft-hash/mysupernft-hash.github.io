<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Investments | SuperNFT</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f0f0f;
  color:#FFD700;
}
header{
  background:#1a1a1a;
  padding:15px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
}
.container{
  padding:20px;
}
.card{
  background:#1a1a1a;
  border-radius:12px;
  padding:15px;
  margin-bottom:15px;
}
.card img{
  width:100%;
  border-radius:10px;
}
.card h3{
  margin:10px 0 5px;
}
.card p{
  font-size:14px;
  color:#ccc;
}
.empty{
  text-align:center;
  margin-top:50px;
  color:#999;
}
.back{
  display:block;
  text-align:center;
  margin-top:20px;
  color:#FFD700;
  text-decoration:none;
}
</style>
</head>

<body>

<header>My Investments</header>

<div class="container" id="list">
  <div class="empty">Loading investments...</div>
</div>

<a href="dashboard.html" class="back">⬅ Back to Dashboard</a>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore,
  collection,
  getDocs,
  query,
  orderBy
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain: "supernft-5b952.firebaseapp.com",
  projectId: "supernft-5b952"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const list = document.getElementById("list");

onAuthStateChanged(auth, async(user)=>{
  if(!user){
    location.href="login.html";
    return;
  }

  const q = query(
    collection(db,"users",user.uid,"investments"),
    orderBy("purchasedAt","desc")
  );

  const snap = await getDocs(q);

  if(snap.empty){
    list.innerHTML = `<div class="empty">No investments yet</div>`;
    return;
  }

  list.innerHTML = "";

  snap.forEach(doc=>{
    const d = doc.data();

    list.innerHTML += `
      <div class="card">
        <img src="${d.image}">
        <h3>${d.name}</h3>
        <p>Price: $${d.price}</p>
        <p>Purchased on: ${d.purchasedAt?.toDate().toLocaleDateString()}</p>
      </div>
    `;
  });
});
</script>

</body>
</html>
