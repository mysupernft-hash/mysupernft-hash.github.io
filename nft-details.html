<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>NFT Details</title>
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<style>
body{
 background:#0d0d0d;
 color:#FFD700;
 font-family:Arial;
 margin:0;
 padding:20px;
}

.card{
 max-width:420px;
 margin:auto;
 background:#111;
 padding:20px;
 border-radius:14px;
 text-align:center;
 box-shadow:0 0 25px #000;
}

img{
 width:100%;
 border-radius:12px;
 margin-bottom:15px;
}

h2{margin:10px 0}

.stats{
 background:#0a0a0a;
 padding:15px;
 border-radius:10px;
 margin-top:15px;
 text-align:left;
 line-height:1.8;
}

button{
 width:100%;
 padding:14px;
 margin-top:15px;
 background:#FFD700;
 border:none;
 border-radius:8px;
 font-weight:bold;
 cursor:pointer;
}

button:hover{opacity:.9}

#error{
 color:red;
 margin-top:15px;
}
</style>
</head>
<body>

<div class="card">

<div id="content">Loading NFT...</div>

<div id="error"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore,doc,getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* FIREBASE CONFIG */
const app=initializeApp({
 apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
 authDomain:"supernft-5b952.firebaseapp.com",
 projectId:"supernft-5b952"
});

const db=getFirestore(app);

/* GET NFT ID FROM URL */
const params=new URLSearchParams(location.search);
const id=params.get("id");

/* LOAD NFT */
async function loadNFT(){

 if(!id){
  document.getElementById("error").innerText="NFT id missing in URL";
  return;
 }

 try{

  const snap=await getDoc(doc(db,"nfts",id));

  if(!snap.exists()){
   document.getElementById("error").innerText="NFT not found";
   return;
  }

  const nft=snap.data();

  /* REMOVE SPACE FROM URL */
  const img=nft.imageURL.trim();

  /* CALCULATIONS */
  const price=nft.price;
  const daily=nft.dailyIncome;
  const weekly=daily*7;
  const monthly=daily*30;
  const yearly=daily*365;

  document.getElementById("content").innerHTML=`

   <img src="${img}" onerror="this.src='https://via.placeholder.com/400x300?text=NFT'">

   <h2>${nft.name}</h2>
   <p>Category: ${nft.category}</p>

   <div class="stats">
   💰 Price: $${price}<br>
   📈 Daily: $${daily}<br>
   📅 Weekly: $${weekly.toFixed(2)}<br>
   📆 Monthly: $${monthly.toFixed(2)}<br>
   🗓 Yearly: $${yearly.toFixed(2)}
   </div>

   <button onclick="alert('Buy system connect karo')">
   BUY NFT
   </button>
  `;

 }catch(e){
  document.getElementById("error").innerText=e.message;
 }

}

loadNFT();

</script>
</body>
</html>
