<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NFT Details</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
 background:#000;
 color:#fff;
 font-family:Arial;
 margin:0;
}

.container{
 padding:20px;
 display:flex;
 justify-content:center;
}

.card{
 background:#111;
 border:1px solid gold;
 padding:20px;
 border-radius:15px;
 width:350px;
 text-align:center;
 box-shadow:0 0 20px #000;
}

.nftImg{
 width:100%;
 height:300px;
 object-fit:cover;
 border-radius:12px;
 margin-bottom:15px;
 border:1px solid gold;
}

.name{
 font-size:22px;
 margin-bottom:10px;
}

.price{
 color:gold;
 font-size:20px;
 margin-bottom:15px;
}

.stats{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px;
 margin-bottom:15px;
}

.stats div{
 background:#000;
 border:1px solid gold;
 padding:10px;
 border-radius:8px;
 font-size:14px;
}

button{
 background:gold;
 border:none;
 padding:12px;
 width:100%;
 font-weight:bold;
 border-radius:10px;
 cursor:pointer;
 font-size:16px;
}

button:hover{
 opacity:.9;
}

.loading{
 text-align:center;
 margin-top:50px;
 color:gold;
}
</style>
</head>
<body>

<div id="app" class="loading">Loading NFT...</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore,doc,getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* FIREBASE CONFIG */
const firebaseConfig={
 apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
 authDomain:"supernft-5b952.firebaseapp.com",
 projectId:"supernft-5b952"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

/* GET ID FROM URL */
const id=new URLSearchParams(location.search).get("id");

if(!id){
 document.getElementById("app").innerHTML="NFT not selected";
 throw "No id";
}

/* FETCH NFT */
const ref=doc(db,"nfts",id);
const snap=await getDoc(ref);

if(!snap.exists()){
 document.getElementById("app").innerHTML="NFT not found";
 throw "NFT missing";
}

const nft=snap.data();

/* IMAGE FIX */
const image=
 nft.image ||
 nft.imageUrl ||
 nft.imageURL ||
 nft.img ||
 "https://via.placeholder.com/300x300?text=NFT";

/* CALCULATIONS */
const price=Number(nft.price||0);
const daily=Number(nft.dailyIncome||0);
const weekly=(daily*7).toFixed(2);
const monthly=(daily*30).toFixed(2);
const yearly=(daily*365).toFixed(2);

/* RENDER UI */
document.getElementById("app").innerHTML=`
<div class="container">

<div class="card">

<img src="${image}" class="nftImg">

<div class="name">${nft.name||"NFT"}</div>

<div class="price">$${price}</div>

<div class="stats">
<div>Daily<br>$${daily}</div>
<div>Weekly<br>$${weekly}</div>
<div>Monthly<br>$${monthly}</div>
<div>Yearly<br>$${yearly}</div>
</div>

<button id="buyBtn">Buy NFT</button>

</div>
</div>
`;

/* BUY CLICK */
document.getElementById("buyBtn").onclick=()=>{
 alert("Connect buy system with wallet balance");
};

</script>
</body>
</html>
