<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Investments | SuperNFT</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#0d0d0d;
  color:#FFD700;
}
header{
  background:#111;
  padding:15px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
  border-bottom:1px solid #222;
}
.container{
  padding:20px;
}
.card{
  background:#141414;
  border-radius:14px;
  padding:15px;
  margin-bottom:18px;
  box-shadow:0 0 12px rgba(255,215,0,0.08);
}
.card img{
  width:100%;
  border-radius:12px;
  margin-bottom:12px;
}
.card h3{
  margin:6px 0;
  font-size:18px;
}
.card p{
  margin:4px 0;
  font-size:14px;
  color:#c9b037;
}
.badge{
  display:inline-block;
  margin-top:8px;
  padding:6px 12px;
  border-radius:20px;
  background:#FFD700;
  color:#000;
  font-size:12px;
  font-weight:bold;
}
.empty{
  text-align:center;
  margin-top:60px;
  color:#777;
}
.back{
  display:block;
  text-align:center;
  margin:25px 0 10px;
  color:#FFD700;
  text-decoration:none;
  font-size:15px;
}
</style>
</head>

<body>

<header>💼 My Investments</header>

<div class="container" id="list">
  <div class="empty">Loading investments...</div>
</div>

<a href="dashboard.html" class="back">⬅ Back to Dashboard</a>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore,
  collection,
  getDocs,
  query,
  orderBy
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain: "supernft-5b952.firebaseapp.com",
  projectId: "supernft-5b952"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const list = document.getElementById("list");

onAuthStateChanged(auth, async(user)=>{
  if(!user){
    location.href="login.html";
    return;
  }

  const q = query(
    collection(db,"users",user.uid,"investments"),
    orderBy("purchasedAt","desc")
  );

  const snap = await getDocs(q);

  if(snap.empty){
    list.innerHTML = `<div class="empty">No investments yet</div>`;
    return;
  }

  list.innerHTML = "";

  snap.forEach(doc=>{
    const d = doc.data();
    const date = d.purchasedAt?.toDate().toLocaleDateString() || "";

    list.innerHTML += `
      <div class="card">
        <img src="${d.image}">
        <h3>${d.name}</h3>
        <p>💰 Invested: $${d.price}</p>
        <p>📅 Date: ${date}</p>
        <span class="badge">ACTIVE</span>
      </div>
    `;
  });
});
</script>

</body>
</html>
