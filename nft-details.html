<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SuperNFT Dashboard</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    color:white;
}

/* Dashboard Header */
.header{
    padding:20px;
    text-align:center;
    font-size:24px;
    font-weight:bold;
    background:rgba(0,0,0,0.6);
    color:#00eaff;
}

/* NFT Container */
.container{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:30px;
    padding:40px;
}

/* NFT Card */
.card{
    width:250px;
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(10px);
    border-radius:20px;
    padding:20px;
    text-align:center;
    box-shadow:0 0 20px rgba(0,255,255,0.2);
    transition:0.3s;
}

.card:hover{
    transform:translateY(-5px);
}

/* NFT Image */
.nft-image{
    width:100%;
    border-radius:15px;
    cursor:pointer;
    transition:0.3s;
}

.nft-image:hover{
    transform:scale(1.05);
}

.card h3{
    margin:10px 0 5px 0;
}

.card p{
    color:#00ffcc;
    font-weight:bold;
}

/* Fullscreen Modal */
.modal{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.95);
    justify-content:center;
    align-items:center;
    z-index:9999;
    animation:fadeIn 0.3s ease;
}

.modal img{
    max-width:85%;
    max-height:85%;
    border-radius:20px;
    animation:zoomIn 0.3s ease;
}

/* Close Button */
.close{
    position:absolute;
    top:30px;
    right:50px;
    font-size:40px;
    color:white;
    cursor:pointer;
}

/* Animations */
@keyframes zoomIn{
    from{transform:scale(0.6);}
    to{transform:scale(1);}
}

@keyframes fadeIn{
    from{opacity:0;}
    to{opacity:1;}
}

@media(max-width:768px){
    .card{
        width:90%;
    }
}
</style>
</head>

<body>

<div class="header">
    SuperNFT Dashboard
</div>

<div class="container">

    <div class="card">
        <img src="images/IMG_0458.png" class="nft-image">
        <h3>NFT #1</h3>
        <p>$10</p>
    </div>

    <div class="card">
        <img src="images/IMG_0459.png" class="nft-image">
        <h3>NFT #2</h3>
        <p>$20</p>
    </div>

    <div class="card">
        <img src="images/IMG_0460.png" class="nft-image">
        <h3>NFT #3</h3>
        <p>$30</p>
    </div>

    <div class="card">
        <img src="images/IMG_0461.png" class="nft-image">
        <h3>NFT #4</h3>
        <p>$40</p>
    </div>

</div>

<!-- Modal -->
<div class="modal" id="imageModal">
    <span class="close" id="closeBtn">&times;</span>
    <img id="modalImg">
</div>

<script>
const modal = document.getElementById("imageModal");
const modalImg = document.getElementById("modalImg");
const closeBtn = document.getElementById("closeBtn");

// 🔥 Important Part (Fixes First Image Bug Forever)
document.querySelectorAll(".nft-image").forEach(function(image){
    image.addEventListener("click", function(){
        modal.style.display = "flex";
        modalImg.src = this.src; // Current clicked image
    });
});

// Close Button
closeBtn.addEventListener("click", function(){
    modal.style.display = "none";
});

// Click outside image close
modal.addEventListener("click", function(e){
    if(e.target === modal){
        modal.style.display = "none";
    }
});
</script>

</body>
</html>
