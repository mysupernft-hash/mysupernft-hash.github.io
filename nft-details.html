<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NFT Details</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
 background:#0d0d0d;
 color:#FFD700;
 font-family:Arial;
 margin:0;
}

.container{
 max-width:420px;
 margin:40px auto;
 background:#111;
 padding:20px;
 border-radius:14px;
 box-shadow:0 0 20px #000;
 text-align:center;
}

img{
 width:100%;
 height:260px;
 object-fit:cover;
 border-radius:12px;
 display:none;
}

h2{
 margin:15px 0 10px;
}

.info{
 text-align:left;
 margin-top:15px;
 line-height:1.8;
}

button{
 width:100%;
 padding:14px;
 margin-top:18px;
 border:none;
 border-radius:8px;
 background:#FFD700;
 font-weight:bold;
 cursor:pointer;
}

button:hover{
 opacity:.9;
}

/* MODAL */
.modal{
 position:fixed;
 top:0;
 left:0;
 width:100%;
 height:100%;
 background:#000000c7;
 display:none;
 justify-content:center;
 align-items:center;
}

.modal-box{
 background:#111;
 padding:25px;
 border-radius:14px;
 width:90%;
 max-width:350px;
 text-align:left;
}

.close{
 float:right;
 cursor:pointer;
 font-size:20px;
}
</style>
</head>
<body>

<div class="container">

<img id="img">

<h2 id="name">Loading...</h2>

<div class="info" id="info"></div>

<button id="buyBtn">BUY NFT</button>

</div>

<!-- CALCULATION MODAL -->
<div class="modal" id="modal">
<div class="modal-box">

<span class="close" id="close">✖</span>
<h3>Profit Calculation</h3>

<div id="calc"></div>

</div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
getFirestore,doc,getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* FIREBASE CONFIG */
const firebaseConfig={
 apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
 authDomain:"supernft-5b952.firebaseapp.com",
 projectId:"supernft-5b952"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

/* GET NFT ID */
const id=new URLSearchParams(location.search).get("id");
if(!id) alert("NFT ID missing");

/* LOAD NFT */
const snap=await getDoc(doc(db,"nfts",id));

if(!snap.exists()){
 document.body.innerHTML="<h2 style='text-align:center'>NFT NOT FOUND</h2>";
 throw "NFT missing";
}

const data=snap.data();

/* IMAGE FIX */
const img=document.getElementById("img");

let url=(
 data.imageurl ||
 data.imageUrl ||
 data.imageURL ||
 ""
).trim();

if(!url)
 url="https://via.placeholder.com/400x260?text=No+Image";

img.onerror=()=> img.src="https://via.placeholder.com/400x260?text=Image+Error";
img.src=url;
img.style.display="block";

/* TEXT */
document.getElementById("name").innerText=data.name;

document.getElementById("info").innerHTML=`
Price : $${data.price}<br>
Daily Income : $${data.dailyIncome}<br>
Category : ${data.category}
`;

/* CALCULATION */
function calc(){

const price=data.price;
const daily=data.dailyIncome;

const weekly=daily*7;
const monthly=daily*30;
const yearly=daily*365;

document.getElementById("calc").innerHTML=`
Investment : $${price}<br><br>

Daily : $${daily.toFixed(2)}<br>
Weekly : $${weekly.toFixed(2)}<br>
Monthly : $${monthly.toFixed(2)}<br>
Yearly : $${yearly.toFixed(2)}<br><br>

Total Year Profit : $${(yearly-price).toFixed(2)}
`;
}

/* OPEN CALC */
document.getElementById("buyBtn").onclick=()=>{
 document.getElementById("modal").style.display="flex";
 calc();
};

img.onclick=()=>{
 document.getElementById("modal").style.display="flex";
 calc();
};

/* CLOSE */
document.getElementById("close").onclick=()=>{
 document.getElementById("modal").style.display="none";
};

</script>
</body>
</html>
