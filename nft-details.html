<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NFT Details</title>

<style>
body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#0d0d0d;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{
    background:#1a1a1a;
    padding:20px;
    border-radius:15px;
    width:320px;
    text-align:center;
    box-shadow:0 0 20px rgba(0,255,255,0.2);
}

.card img{
    width:100%;
    border-radius:12px;
    margin-bottom:15px;
}

.title{
    font-size:22px;
    font-weight:bold;
    margin-bottom:10px;
}

.info{
    font-size:16px;
    margin:6px 0;
    color:#ccc;
}

.price{
    color:#00ffd5;
    font-size:20px;
    margin-top:10px;
}

.btn{
    margin-top:15px;
    background:#00ffd5;
    color:black;
    border:none;
    padding:12px;
    width:100%;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}

.btn:hover{
    background:#00c9aa;
}
</style>
</head>

<body>

<div class="card" id="nftCard">
    Loading NFT...
</div>
