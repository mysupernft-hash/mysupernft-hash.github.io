<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NFT Details</title>
<style>
body{
  margin:0;
  font-family:Arial;
  background:#000;
  color:#FFD700;
  text-align:center;
}
.card{
  margin:40px auto;
  padding:20px;
  width:90%;
  max-width:420px;
  border-radius:15px;
  background:#111;
  box-shadow:0 0 20px #FFD70055;
}
img{
  width:100%;
  border-radius:12px;
  margin-bottom:15px;
}
button{
  background:#FFD700;
  color:#000;
  border:none;
  padding:12px 20px;
  border-radius:10px;
  font-size:18px;
  cursor:pointer;
  margin-top:15px;
}
.calc{
  margin-top:20px;
  font-size:18px;
  line-height:1.8;
}
</style>
</head>
<body>

<div class="card">
  <img id="nftImage">
  <h2 id="name"></h2>
  <h3 id="price"></h3>

  <div class="calc" id="calc"></div>

  <button onclick="buy()">Buy NFT</button>
</div>

<script>
const params=new URLSearchParams(location.search);
const id=params.get("id") || "0458";

/* NFT DATA */
const nft={
  price:10,
  daily:0.2
};

/* IMAGE LOAD */
document.getElementById("nftImage").src=
`https://mysupernft-hash.github.io/images/IMG_${id}.png`;

/* NAME + PRICE */
document.getElementById("name").innerText="Starter NFT #"+id;
document.getElementById("price").innerText="Price: $"+nft.price;

/* CALCULATION */
const daily=nft.daily;
const weekly=(daily*7).toFixed(2);
const monthly=(daily*30).toFixed(2);
const yearly=(daily*365).toFixed(2);

document.getElementById("calc").innerHTML=`
Daily Income: $${daily}<br>
Weekly Income: $${weekly}<br>
Monthly Income: $${monthly}<br>
Yearly Income: $${yearly}
`;

function buy(){
  alert("NFT Purchased Successfully 🚀");
}
</script>

</body>
</html>
