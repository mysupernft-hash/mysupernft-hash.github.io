<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SuperNFT NFT Details</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#000;
  color:#FFD700;
  text-align:center;
}
header{
  padding:18px;
  background:#1a1a1a;
  font-size:22px;
  border-bottom:2px solid #FFD700;
}
.container{padding:20px;}
.nft-img{
  width:90%;
  max-width:400px;
  border-radius:15px;
  border:3px solid #FFD700;
  box-shadow:0 0 25px #FFD700;
}
.price{font-size:20px;margin:15px 0;}
.calc-box{
  background:#1a1a1a;
  border-radius:12px;
  padding:15px;
  margin:20px auto;
  max-width:400px;
  border:1px solid #FFD700;
}
.calc-row{
  display:flex;
  justify-content:space-between;
  margin:8px 0;
}
.buy-btn{
  background:#FFD700;
  color:#000;
  border:none;
  padding:12px;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
  margin-top:20px;
  width:220px;
}
.buy-btn:hover{background:#e6c200;}
.status{margin-top:15px;font-size:14px;}
</style>
</head>

<body>

<header>SuperNFT NFT Details</header>

<div class="container">

  <img id="nftImage" class="nft-img">
  <div class="price" id="price"></div>

  <div class="calc-box">
    <div class="calc-row"><span>Daily Income:</span><span id="daily"></span></div>
    <div class="calc-row"><span>Weekly Income:</span><span id="weekly"></span></div>
    <div class="calc-row"><span>Monthly Income:</span><span id="monthly"></span></div>
    <div class="calc-row"><span>Yearly Income:</span><span id="yearly"></span></div>
  </div>

  <button class="buy-btn" id="buyBtn" onclick="buyNFT()">Checking Login...</button>
  <div class="status" id="status"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain: "supernft-5b952.firebaseapp.com",
  projectId: "supernft-5b952"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* 🔥 FULL NFT LIST */
const NFTS = [

{cat:"beginner",price:1,p:0.01,img:"images/IMG_2629.png"},

{cat:"beginner",price:7,p:0.07,img:"images/IMG_2633.png"},

{cat:"beginner",price:9,p:0.09,img:"images/IMG_2638.png"},

{cat:"rising",price:55,p:1.3,img:"images/IMG_0467.png"},

{cat:"rising",price:65,p:1.63,img:"images/IMG_0469.png"},
{cat:"rising",price:70,p:1.75,img:"images/IMG_0470.png"},
{cat:"rising",price:75,p:1.88,img:"images/IMG_0471.png"},
{cat:"rising",price:80,p:2,img:"images/IMG_0472.png"},
{cat:"rising",price:90,p:2.25,img:"images/IMG_0473.png"},

{cat:"legendary",price:499,p:25,img:"images/IMG_0482.png"},

{cat:"legendary",price:899,p:45,img:"images/IMG_0499.png"},
{cat:"legendary",price:999,p:100,img:"images/IMG_0503.png"},

/* 🔥 ULTRA NFTs */
{cat:"ultra",price:1000,p:200,img:"images/IMG_3012.png"},
{cat:"ultra",price:2000,p:400,img:"images/IMG_3022.png"},
{cat:"ultra",price:3000,p:600,img:"images/IMG_3023.png"},
{cat:"ultra",price:4000,p:800,img:"images/IMG_3024.png"},
{cat:"ultra",price:5000,p:1000,img:"images/IMG_3025.png"},
{cat:"ultra",price:6000,p:1200,img:"images/IMG_3026.png"},
{cat:"ultra",price:7000,p:1400,img:"images/IMG_3027.png"},
{cat:"ultra",price:8000,p:1600,img:"images/IMG_3028.png"},
{cat:"ultra",price:9000,p:1800,img:"images/IMG_3029.png"},
{cat:"ultra",price:10000,p:2000,img:"images/IMG_3031.png"}

];

/* ✅ GET PARAMS */
const params = new URLSearchParams(window.location.search);
const id = parseInt(params.get("id"));
const cat = params.get("cat");

/* ✅ FILTER */
let filtered = NFTS;
if(cat && cat !== "all"){
  filtered = NFTS.filter(n => n.cat === cat);
}

/* ✅ FINAL NFT */
const nft = filtered[id] || NFTS[0];

/* ✅ UI SET */
document.getElementById("nftImage").src = nft.img;
document.getElementById("price").innerText = "Price: $" + nft.price;
document.getElementById("daily").innerText = "$" + nft.p.toFixed(2);
document.getElementById("weekly").innerText = "$" + (nft.p*7).toFixed(2);
document.getElementById("monthly").innerText = "$" + (nft.p*30).toFixed(2);
document.getElementById("yearly").innerText = "$" + (nft.p*365).toFixed(2);

/* 🔐 AUTH */
let currentUser = null;
const buyBtn = document.getElementById("buyBtn");
buyBtn.disabled = true;

onAuthStateChanged(auth,(user)=>{
  if(!user){
    window.location.href="login.html";
    return;
  }
  currentUser = user;
  buyBtn.disabled = false;
  buyBtn.innerText = "Buy NFT";
});

/* 💰 BUY */
window.buyNFT = async function(){

  const status = document.getElementById("status");

  const userRef = doc(db,"users",currentUser.uid);
  const snap = await getDoc(userRef);
  if(!snap.exists()) return;

  const data = snap.data();

  const wallet = data.walletBalance || 0;
  const purchased = data.purchasedNFTs || [];

  if(purchased.includes(nft.price)){
    status.innerText="Already Purchased.";
    return;
  }

  if(wallet < nft.price){
    status.innerText="Insufficient Balance.";
    return;
  }

  await updateDoc(userRef,{
    walletBalance: wallet - nft.price,
    dailyIncome: (data.dailyIncome||0) + nft.p,
    purchasedNFTs: arrayUnion(nft.price)
  });

  status.innerText="🎉 Purchase Successful!";

  setTimeout(()=>{
    window.location.href="dashboard.html";
  },1500);
};

</script>

</body>
</html>
