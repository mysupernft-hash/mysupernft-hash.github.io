<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NFT Details</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
body{
 background:#0d0d0d;
 color:#FFD700;
 font-family:Arial;
 margin:0;
 padding:20px;
}

.container{
 max-width:420px;
 margin:auto;
 background:#111;
 padding:20px;
 border-radius:14px;
 box-shadow:0 0 20px #000;
 text-align:center;
}

img{
 width:100%;
 height:260px;
 object-fit:cover;
 border-radius:12px;
 border:2px solid #FFD700;
 margin-bottom:15px;
 cursor:pointer;
}

h2{margin:5px 0;}

.price{
 font-size:20px;
 margin:10px 0;
}

.calc{
 background:#000;
 padding:15px;
 border-radius:10px;
 margin-top:15px;
 display:none;
}

.row{
 display:flex;
 justify-content:space-between;
 margin:6px 0;
}

button{
 width:100%;
 padding:14px;
 margin-top:15px;
 background:#FFD700;
 border:none;
 border-radius:8px;
 font-weight:bold;
 cursor:pointer;
}

button:hover{
 opacity:.9;
}
</style>
</head>
<body>

<div class="container">

<img id="img">

<h2 id="name">Loading...</h2>

<div class="price">$<span id="price">0</span></div>

<button id="buyBtn">Buy NFT</button>

<div class="calc" id="calcBox">

<h3>Profit Calculation</h3>

<div class="row"><span>Investment</span><span id="inv"></span></div>
<div class="row"><span>Daily</span><span id="daily"></span></div>
<div class="row"><span>Weekly</span><span id="weekly"></span></div>
<div class="row"><span>Monthly</span><span id="monthly"></span></div>
<div class="row"><span>Yearly</span><span id="yearly"></span></div>

</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
 apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
 authDomain:"supernft-5b952.firebaseapp.com",
 projectId:"supernft-5b952"
});

const db = getFirestore(app);

const params = new URLSearchParams(window.location.search);
const id = params.get("id");

const container = document.getElementById("nftBox");

async function loadNFT(){
 if(!id){
  container.innerHTML="NFT ID missing";
  return;
 }

 const ref = doc(db,"nfts",id);
 const snap = await getDoc(ref);

 if(!snap.exists()){
  container.innerHTML="NFT not found";
  return;
 }

 const d = snap.data();
 const price = Number(d.price);
 const daily = Number(d.dailyIncome);

 container.innerHTML = `
  <img src="${d.imageURL.trim()}" style="width:100%;max-width:420px;border-radius:15px">
  <h2>${d.name}</h2>
  <p>Price: $${price}</p>
  <p>Daily: $${daily}</p>
  <hr>
  <p>Weekly: $${(daily*7).toFixed(2)}</p>
  <p>Monthly: $${(daily*30).toFixed(2)}</p>
  <p>Yearly: $${(daily*365).toFixed(2)}</p>
 `;
}

loadNFT();
</script>
</body>
</html>
