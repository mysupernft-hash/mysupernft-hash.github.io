<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NFT Details</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
margin:0;
background:#0d0d0d;
font-family:Arial;
color:#FFD700;
}

/* CARD */
.container{
max-width:420px;
margin:40px auto;
background:#111;
padding:25px;
border-radius:18px;
text-align:center;
box-shadow:0 0 30px #000;
}

img{
width:100%;
height:260px;
object-fit:cover;
border-radius:12px;
margin-bottom:15px;
cursor:pointer;
}

h2{margin:10px 0}

.info{
background:#000;
padding:12px;
margin:10px 0;
border-radius:10px;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:10px;
background:#FFD700;
font-weight:bold;
cursor:pointer;
margin-top:15px;
}

/* MODAL */
#calcModal{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.85);
display:none;
align-items:center;
justify-content:center;
z-index:999;
}

.modalBox{
background:#111;
padding:30px;
border-radius:18px;
width:90%;
max-width:360px;
text-align:center;
box-shadow:0 0 30px #000;
}

</style>
</head>
<body>

<div class="container">

<img id="img">

<h2 id="name">Loading...</h2>

<div class="info">Price: <span id="price"></span></div>
<div class="info">Category: <span id="category"></span></div>
<div class="info">Daily Income: <span id="daily"></span></div>
<div class="info">Monthly Profit: $<span id="monthly"></span></div>

<button onclick="openCalc()">Buy NFT</button>

</div>


<!-- MODAL -->
<div id="calcModal">
<div class="modalBox">

<h2>📊 Earnings Details</h2>

<div id="calcData" style="line-height:2;margin-top:15px"></div>

<button onclick="closeCalc()" style="margin-top:20px">Close</button>

</div>
</div>



<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore,doc,getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
 authDomain:"supernft-5b952.firebaseapp.com",
 projectId:"supernft-5b952"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);


/* GET NFT ID FROM URL */
const id=new URLSearchParams(location.search).get("id");

let nftData=null;


/* LOAD NFT DATA */
async function load(){

const snap=await getDoc(doc(db,"nfts",id));

if(!snap.exists()){
document.body.innerHTML="<h2 style='color:white;text-align:center;margin-top:50px'>NFT Not Found</h2>";
return;
}

const d=snap.data();
nftData=d;

document.getElementById("name").innerText=d.name;
document.getElementById("price").innerText="$"+d.price;
document.getElementById("category").innerText=d.category;
document.getElementById("daily").innerText="$"+d.dailyIncome;
document.getElementById("monthly").innerText=(d.dailyIncome*30).toFixed(2);
document.getElementById("img").src=d.imageURL.trim();

}

load();



/* OPEN CALC */
window.openCalc=()=>{

const price=nftData.price;
const daily=nftData.dailyIncome;

const weekly=daily*7;
const monthly=daily*30;
const yearly=daily*365;

document.getElementById("calcData").innerHTML=`
💰 Investment: <b>$${price}</b><br>
🟢 Live Earnings: <b>$${daily}</b><br>
📅 Daily: <b>$${daily}</b><br>
📆 Weekly: <b>$${weekly.toFixed(2)}</b><br>
🗓 Monthly: <b>$${monthly.toFixed(2)}</b><br>
📈 Yearly: <b>$${yearly.toFixed(2)}</b>
`;

document.getElementById("calcModal").style.display="flex";
}


/* CLOSE CALC */
window.closeCalc=()=>{
document.getElementById("calcModal").style.display="none";
}


/* IMAGE CLICK = OPEN CALC */
document.getElementById("img").onclick=openCalc;

</script>

</body>
</html>
