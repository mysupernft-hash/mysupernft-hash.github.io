<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SuperNFT Details</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:black;
    color:#d4af37;
}

/* Container */
.container{
    text-align:center;
    padding:40px 20px;
}

/* NFT Image */
.nft-image{
    width:90%;
    max-width:400px;
    border-radius:15px;
    border:3px solid #d4af37;
    box-shadow:0 0 25px #d4af37;
}

/* Price */
.price{
    font-size:24px;
    margin:20px 0;
}

/* Calculation Box */
.calc-box{
    background:#111;
    border:2px solid #d4af37;
    border-radius:15px;
    padding:20px;
    margin-top:30px;
    max-width:400px;
    margin-left:auto;
    margin-right:auto;
}

.calc-box h3{
    margin-bottom:15px;
    color:#ffd700;
}

.calc-item{
    display:flex;
    justify-content:space-between;
    margin:8px 0;
    font-size:18px;
}
</style>
</head>

<body>

<div class="container">

    <h1 style="color:#ffd700;">NFT Details</h1>

    <!-- NFT Image -->
    <img id="nftImage" class="nft-image">

    <div class="price" id="nftPrice"></div>

    <!-- Earnings Calculation -->
    <div class="calc-box">
        <h3>Profit Calculation</h3>
        <div class="calc-item">
            <span>Daily:</span>
            <span id="daily"></span>
        </div>
        <div class="calc-item">
            <span>Weekly:</span>
            <span id="weekly"></span>
        </div>
        <div class="calc-item">
            <span>Monthly:</span>
            <span id="monthly"></span>
        </div>
        <div class="calc-item">
            <span>Yearly:</span>
            <span id="yearly"></span>
        </div>
    </div>

</div>

<script>
// URL se data lena
const params = new URLSearchParams(window.location.search);
const img = params.get("img");
const price = parseFloat(params.get("price"));

// Default agar kuch na mile
const finalImg = img ? "images/" + img : "images/IMG_0458.png";
const finalPrice = price ? price : 10;

// Page me set karna
document.getElementById("nftImage").src = finalImg;
document.getElementById("nftPrice").innerText = "Price: $" + finalPrice;

// 🔥 Calculation Logic (Example: 5% Daily Return)
let daily = finalPrice * 0.05;
let weekly = daily * 7;
let monthly = daily * 30;
let yearly = daily * 365;

document.getElementById("daily").innerText = "$" + daily.toFixed(2);
document.getElementById("weekly").innerText = "$" + weekly.toFixed(2);
document.getElementById("monthly").innerText = "$" + monthly.toFixed(2);
document.getElementById("yearly").innerText = "$" + yearly.toFixed(2);
</script>

</body>
</html>
