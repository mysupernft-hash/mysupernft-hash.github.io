<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NFT Details</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:black;
    color:#d4af37;
}

.container{
    max-width:500px;
    margin:40px auto;
    padding:20px;
    border:1px solid #d4af37;
    border-radius:15px;
    text-align:center;
    box-shadow:0 0 20px rgba(212,175,55,0.4);
}

img{
    width:100%;
    border-radius:15px;
    margin-bottom:15px;
}

h1{
    margin:10px 0;
}

.info{
    margin:10px 0;
    font-size:18px;
}

button{
    margin-top:20px;
    padding:12px 20px;
    border:none;
    border-radius:10px;
    background:#d4af37;
    color:black;
    font-weight:bold;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

<img id="nftImage" src="" alt="NFT">

<h1 id="nftName">NFT Name</h1>

<div class="info" id="nftPrice">Price:</div>
<div class="info" id="nftProfit">Daily Profit:</div>

<button onclick="goBack()">Back</button>

</div>

<script>
const nft = JSON.parse(localStorage.getItem("selectedNFT"));

if(!nft){
    document.body.innerHTML="<h2 style='text-align:center'>No NFT Selected</h2>";
}else{

document.getElementById("nftImage").src = nft.image;
document.getElementById("nftName").innerText = nft.name;
document.getElementById("nftPrice").innerText = "Price: $" + nft.price;

let profit = (nft.price * nft.percent)/100;
document.getElementById("nftProfit").innerText = "Daily Profit: $" + profit.toFixed(2);

}

function goBack(){
    window.history.back();
}
</script>

</body>
</html>
