<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SuperNFT NFT Details</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#000;
  color:#FFD700;
  text-align:center;
}

header{
  padding:20px;
  background:#1a1a1a;
  font-size:24px;
  border-bottom:2px solid #FFD700;
}

.container{
  padding:20px;
}

.nft-img{
  width:90%;
  max-width:400px;
  border-radius:15px;
  border:3px solid #FFD700;
  box-shadow:0 0 25px #FFD700;
}

.price{
  font-size:22px;
  margin:15px 0;
}

.calc-box{
  background:#1a1a1a;
  border-radius:12px;
  padding:15px;
  margin:20px auto;
  max-width:400px;
  border:1px solid #FFD700;
}

.calc-row{
  display:flex;
  justify-content:space-between;
  margin:8px 0;
}

.buy-btn{
  background:#FFD700;
  color:#000;
  border:none;
  padding:10px 15px;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
  margin-top:15px;
}

.buy-btn:hover{
  background:#e6c200;
}
</style>
</head>
<body>

<header>SuperNFT NFT Details</header>

<div class="container">

  <img id="nftImage" class="nft-img">
  <div class="price" id="price"></div>

  <div class="calc-box">
    <div class="calc-row"><span>Daily Income:</span><span id="daily"></span></div>
    <div class="calc-row"><span>Weekly Income:</span><span id="weekly"></span></div>
    <div class="calc-row"><span>Monthly Income:</span><span id="monthly"></span></div>
    <div class="calc-row"><span>Yearly Income:</span><span id="yearly"></span></div>
  </div>

  <button class="buy-btn" onclick="goBack()">Back to Dashboard</button>

</div>

<script>

// Get data from localStorage
const price = parseFloat(localStorage.getItem("nftPrice"));
const img = localStorage.getItem("nftImg");
const dailyIncome = parseFloat(localStorage.getItem("nftDaily"));

// Safety check
if(!price || !img || !dailyIncome){
  document.body.innerHTML = "<h2 style='color:#FFD700;margin-top:50px;'>No NFT Selected</h2>";
} else {

  document.getElementById("nftImage").src = img;
  document.getElementById("price").innerText = "Price: $" + price;

  let weekly = dailyIncome * 7;
  let monthly = dailyIncome * 30;
  let yearly = dailyIncome * 365;

  document.getElementById("daily").innerText = "$" + dailyIncome.toFixed(2);
  document.getElementById("weekly").innerText = "$" + weekly.toFixed(2);
  document.getElementById("monthly").innerText = "$" + monthly.toFixed(2);
  document.getElementById("yearly").innerText = "$" + yearly.toFixed(2);
}

function goBack(){
  window.location.href="dashboard.html";
}

</script>

</body>
</html>
