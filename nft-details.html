<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SuperNFT Details</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#000;
  color:#d4af37;
  text-align:center;
}

header{
  padding:20px;
  font-size:28px;
  font-weight:bold;
  background:#111;
  color:#ffd700;
  border-bottom:2px solid #d4af37;
}

.nft-container{
  padding:30px 15px;
}

.nft-image{
  width:90%;
  max-width:450px;
  border:4px solid #d4af37;
  border-radius:15px;
  box-shadow:0 0 30px #d4af37;
}

.price{
  font-size:24px;
  margin:20px 0;
  color:#00ffcc;
  font-weight:bold;
}

.calc-box{
  background:#111;
  border:2px solid #d4af37;
  border-radius:15px;
  padding:20px;
  max-width:420px;
  margin:20px auto;
}

.calc-title{
  font-size:20px;
  margin-bottom:15px;
  color:#ffd700;
}

.calc-item{
  display:flex;
  justify-content:space-between;
  font-size:18px;
  margin:8px 0;
}
</style>
</head>

<body>

<header>SuperNFT NFT Details</header>

<div class="nft-container">

  <img id="nftImage" class="nft-image">
  <div class="price" id="price"></div>

  <div class="calc-box">
    <div class="calc-title">Profit Calculation (5% Daily)</div>
    <div class="calc-item"><span>Daily:</span><span id="daily"></span></div>
    <div class="calc-item"><span>Weekly:</span><span id="weekly"></span></div>
    <div class="calc-item"><span>Monthly:</span><span id="monthly"></span></div>
    <div class="calc-item"><span>Yearly:</span><span id="yearly"></span></div>
  </div>

</div>

<script>

// 30 NFT DATA
const nftData = [
{id:1,img:"IMG_0458.png",price:10},
{id:2,img:"IMG_0459.png",price:20},
{id:3,img:"IMG_0460.png",price:30},
{id:4,img:"IMG_0461.png",price:40},
{id:5,img:"IMG_0462.png",price:50},
{id:6,img:"IMG_0463.png",price:60},
{id:7,img:"IMG_0464.png",price:70},
{id:8,img:"IMG_0465.png",price:80},
{id:9,img:"IMG_0466.png",price:90},
{id:10,img:"IMG_0467.png",price:100},
{id:11,img:"IMG_0468.png",price:110},
{id:12,img:"IMG_0469.png",price:120},
{id:13,img:"IMG_0470.png",price:130},
{id:14,img:"IMG_0471.png",price:140},
{id:15,img:"IMG_0472.png",price:150},
{id:16,img:"IMG_0473.png",price:160},
{id:17,img:"IMG_0474.png",price:170},
{id:18,img:"IMG_0475.png",price:180},
{id:19,img:"IMG_0476.png",price:190},
{id:20,img:"IMG_0477.png",price:200},
{id:21,img:"IMG_0478.png",price:210},
{id:22,img:"IMG_0479.png",price:220},
{id:23,img:"IMG_0480.png",price:230},
{id:24,img:"IMG_0481.png",price:240},
{id:25,img:"IMG_0482.png",price:250},
{id:26,img:"IMG_0483.png",price:260},
{id:27,img:"IMG_0484.png",price:270},
{id:28,img:"IMG_0485.png",price:280},
{id:29,img:"IMG_0486.png",price:290},
{id:30,img:"IMG_0487.png",price:300}
];

// URL se ID lena
const params = new URLSearchParams(window.location.search);
const id = parseInt(params.get("id")) || 1;

// NFT find karna
const nft = nftData.find(n => n.id === id) || nftData[0];

// Image set karna
document.getElementById("nftImage").src = "images/" + nft.img;

// Price set karna
document.getElementById("price").innerText = "Price: $" + nft.price;

// Profit Calculation (5% Daily)
let daily = nft.price * 0.05;
let weekly = daily * 7;
let monthly = daily * 30;
let yearly = daily * 365;

document.getElementById("daily").innerText = "$" + daily.toFixed(2);
document.getElementById("weekly").innerText = "$" + weekly.toFixed(2);
document.getElementById("monthly").innerText = "$" + monthly.toFixed(2);
document.getElementById("yearly").innerText = "$" + yearly.toFixed(2);

</script>

</body>
</html>
