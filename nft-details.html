<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NFT Details | SuperNFT</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#0f0f0f;
  color:#FFD700;
}
header{
  padding:15px;
  text-align:center;
  background:#1a1a1a;
  font-size:20px;
  font-weight:bold;
}
.container{
  padding:20px;
}
.card{
  background:#1a1a1a;
  border-radius:12px;
  padding:20px;
}
.nft-img{
  width:100%;
  border-radius:10px;
  margin-bottom:15px;
}
.price{
  font-size:22px;
  font-weight:bold;
  margin:10px 0;
}
button{
  width:100%;
  padding:14px;
  margin-top:15px;
  background:#FFD700;
  color:#000;
  border:none;
  border-radius:8px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}
.back{
  display:block;
  margin-top:20px;
  text-align:center;
  color:#FFD700;
  text-decoration:none;
}
</style>
</head>

<body>

<header>NFT Details</header>

<div class="container">
  <div class="card">
    <img src="https://i.imgur.com/7QZ6FhK.png" class="nft-img">
    <h2>SuperNFT #001</h2>
    <p>Exclusive SuperNFT with daily rewards.</p>
    <div class="price">Price: $10</div>

    <button onclick="buyNFT()">Buy NFT</button>
  </div>

  <a href="dashboard.html" class="back">⬅ Back to Dashboard</a>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore,
  doc,
  getDoc,
  updateDoc,
  increment
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* 🔥 Firebase Config */
const firebaseConfig = {
  apiKey: "AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain: "supernft-5b952.firebaseapp.com",
  projectId: "supernft-5b952",
  storageBucket: "supernft-5b952.appspot.com",
  messagingSenderId: "278097730700",
  appId: "1:278097730700:web:6ba9892334456fd8512fa9"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser;
let userRef;

/* 🔐 AUTH CHECK */
onAuthStateChanged(auth, (user)=>{
  if(!user){
    location.href="login.html";
    return;
  }
  currentUser = user;
  userRef = doc(db,"users",user.uid);
});

/* 🪙 BUY NFT FUNCTION */
window.buyNFT = async function(){

  if(!currentUser){
    alert("Please login first");
    return;
  }

  const snap = await getDoc(userRef);
  if(!snap.exists()){
    alert("User data not found");
    return;
  }

  const userData = snap.data();
  const balance = userData.walletBalance || 0;

  if(balance < 10){
    alert("❌ Insufficient Balance");
    return;
  }

  await updateDoc(userRef,{
    walletBalance: increment(-10),
    nfts: increment(1)
  });

  alert("🎉 NFT purchased successfully!");
  location.href = "wallet.html";
};
</script>

</body>
</html>
