<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NFT Details</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
 background:#0d0d0d;
 color:#FFD700;
 font-family:Arial;
 margin:0;
}

.container{
 max-width:420px;
 margin:auto;
 padding:20px;
}

.card{
 background:#111;
 border-radius:14px;
 padding:20px;
 text-align:center;
 box-shadow:0 0 20px #000;
}

img{
 width:100%;
 border-radius:12px;
 margin-bottom:15px;
}

button{
 width:100%;
 padding:14px;
 margin-top:15px;
 border:none;
 border-radius:8px;
 font-weight:bold;
 background:#FFD700;
 cursor:pointer;
}

button:hover{
 opacity:.9;
}

.modal{
 position:fixed;
 inset:0;
 background:#000000c7;
 display:none;
 align-items:center;
 justify-content:center;
}

.modal-box{
 background:#111;
 padding:25px;
 border-radius:12px;
 width:90%;
 max-width:340px;
 text-align:center;
}

.close{
 background:red;
 margin-top:15px;
}
</style>
</head>
<body>

<div class="container">
<div class="card">

<img id="img">

<h2 id="name">Loading...</h2>

<p>💰 Price: $<span id="price"></span></p>
<p>📦 Category: <span id="cat"></span></p>
<p>📈 Daily Income: $<span id="daily"></span></p>

<button id="buyBtn">Buy NFT</button>
<button id="calcBtn">View Earnings</button>

</div>
</div>

<!-- MODAL -->
<div class="modal" id="modal">
<div class="modal-box">

<h3>Earnings Calculation</h3>

<p>Daily: $<span id="d"></span></p>
<p>Weekly: $<span id="w"></span></p>
<p>Monthly: $<span id="m"></span></p>
<p>Yearly: $<span id="y"></span></p>

<button class="close" onclick="modal.style.display='none'">Close</button>

</div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore,doc,getDoc,updateDoc,increment } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth,onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig={
 apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
 authDomain:"supernft-5b952.firebaseapp.com",
 projectId:"supernft-5b952"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const auth=getAuth(app);

let nftData;
let currentUser;

/* GET NFT ID FROM URL */
const id=new URLSearchParams(location.search).get("id");

/* LOAD NFT */
async function loadNFT(){

const ref=doc(db,"nfts",id);
const snap=await getDoc(ref);

if(!snap.exists()){
 alert("NFT not found");
 return;
}

nftData=snap.data();

/* UI SET */
img.src=nftData.imageURL.trim();
name.innerText=nftData.name;
price.innerText=nftData.price;
cat.innerText=nftData.category;
daily.innerText=nftData.dailyIncome;

}

loadNFT();

/* LOGIN */
onAuthStateChanged(auth,u=>{
 if(!u) location.href="login.html";
 else currentUser=u;
});

/* CALC BUTTON */
calcBtn.onclick=()=>{

d.innerText=nftData.dailyIncome;
w.innerText=(nftData.dailyIncome*7).toFixed(2);
m.innerText=(nftData.dailyIncome*30).toFixed(2);
y.innerText=(nftData.dailyIncome*365).toFixed(2);

modal.style.display="flex";
};

/* BUY NFT */
buyBtn.onclick=async()=>{

const userRef=doc(db,"users",currentUser.uid);
const userSnap=await getDoc(userRef);
const user=userSnap.data();

if(user.walletBalance < nftData.price){
 alert("Not enough balance");
 return;
}

await updateDoc(userRef,{
 walletBalance:increment(-nftData.price),
 dailyIncome:increment(nftData.dailyIncome)
});

alert("NFT Purchased Successfully");
};

</script>

</body>
</html>
