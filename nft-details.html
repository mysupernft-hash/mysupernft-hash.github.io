<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NFT Details | SuperNFT</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#0d0d0d;
  color:#FFD700;
}
header{
  background:#111;
  padding:15px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
  border-bottom:1px solid #222;
}
.container{
  padding:20px;
}
.nft-card{
  background:#141414;
  border-radius:16px;
  padding:18px;
  box-shadow:0 0 15px rgba(255,215,0,0.1);
}
.nft-card img{
  width:100%;
  border-radius:14px;
  margin-bottom:15px;
}
.nft-card h2{
  margin:10px 0 6px;
  font-size:20px;
}
.nft-card p{
  margin:6px 0;
  font-size:15px;
  color:#d4af37;
}
.buy-btn{
  width:100%;
  margin-top:15px;
  padding:14px;
  background:#FFD700;
  color:#000;
  border:none;
  border-radius:30px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}
.buy-btn:hover{
  background:#e0c200;
}
.back{
  display:block;
  text-align:center;
  margin-top:25px;
  color:#FFD700;
  text-decoration:none;
}
</style>
</head>

<body>

<header>🖼 NFT Details</header>

<div class="container">
  <div class="nft-card">
    <img id="nftImage" src="">
    <h2 id="nftName">NFT Name</h2>
    <p>💰 Price: $<span id="nftPrice">0</span></p>
    <p>📆 Validity: 365 Days</p>
    <p>💹 Daily Income: Dynamic</p>

    <button class="buy-btn" onclick="buyNFT()">Buy NFT</button>
  </div>

  <a href="dashboard.html" class="back">⬅ Back to Dashboard</a>
</div>

<script>
/* Load NFT Data */
const img = localStorage.getItem("nftImage");
const name = localStorage.getItem("nftName");
const price = localStorage.getItem("nftPrice");

if(img) document.getElementById("nftImage").src = img;
if(name) document.getElementById("nftName").innerText = name;
if(price) document.getElementById("nftPrice").innerText = price;

/* Buy NFT */
function buyNFT(){
  alert("🎉 Congratulations! NFT Purchased Successfully");
  window.location.href = "my-investments.html";
}
</script>

</body>
</html>
