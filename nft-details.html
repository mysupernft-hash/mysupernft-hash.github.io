<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NFT Details - SuperNFT</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f0f0f;
  color: #FFD700;
}

.main-content {
  padding: 20px;
  padding-bottom: 80px; /* for sticky footer */
}

.nft-details {
  max-width: 500px;
  margin: 50px auto;
  padding: 20px;
  background: #1a1a1a;
  border-radius: 12px;
  text-align: center;
}

.nft-details h2 {
  margin-bottom: 10px;
}

.nft-details p {
  margin: 8px 0;
  font-size: 18px;
}

button {
  padding: 12px 20px;
  background: #FFD700;
  border: none;
  color: #000;
  font-weight: bold;
  border-radius: 6px;
  cursor: pointer;
  transition: 0.2s;
  margin-top: 15px;
}

button:hover {
  background: #e0c200;
}

#message {
  margin-top: 15px;
  font-weight: bold;
  font-size: 16px;
}

/* Footer */
footer {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 60px;
  display: flex;
  justify-content: space-around;
  align-items: center;
  background: #1a1a1a;
  color: #FFD700;
  z-index: 999;
  font-size: 18px;
}

footer div:hover {
  color: #fff;
  cursor: pointer;
}

/* Responsive */
@media screen and (max-width: 768px) {
  .nft-details {
    margin: 20px;
  }
  footer {
    font-size: 14px;
  }
}
</style>
</head>
<body>

<div class="main-content">
  <div class="nft-details">
    <h2 id="nftName">Starter NFT #1</h2>
    <p>Category: <span id="nftCategory">starter</span></p>
    <p>Price: <span id="nftPrice">10</span> Coins</p>
    <button id="buyBtn">Buy NFT</button>
    <div id="message"></div>
  </div>
</div>

<footer>
  <div>👤 My Account</div>
  <div>📁 Investments</div>
  <div>💳 Wallet</div>
  <div>💸 Withdraw</div>
  <div>💹 Live</div>
</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// 🔹 Firebase Config
const firebaseConfig = {
  apiKey: "AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain: "supernft-5b952.firebaseapp.com",
  projectId: "supernft-5b952",
  storageBucket: "supernft-5b952.appspot.com",
  messagingSenderId: "278097730700",
  appId: "1:278097730700:web:6ba9892334456fd8512fa9"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const buyBtn = document.getElementById("buyBtn");
const message = document.getElementById("message");

buyBtn.addEventListener("click", async () => {
  const user = auth.currentUser;
  if (!user) {
    message.style.color = "#ff4444";
    message.textContent = "Please login first!";
    return;
  }

  const userRef = doc(db, "users", user.uid);
  const nftPrice = Number(document.getElementById("nftPrice").textContent);
  const nftName = document.getElementById("nftName").textContent;

  const userSnap = await getDoc(userRef);
  const walletBalance = userSnap.data().walletBalance || 0;

  if (walletBalance >= nftPrice) {
    // Deduct price and add NFT
    await updateDoc(userRef, {
      walletBalance: walletBalance - nftPrice,
      ownedNFTs: arrayUnion(nftName)
    });
    message.style.color = "#00ff00";
    message.textContent = "✅ Done! NFT purchased successfully.";
  } else {
    message.style.color = "#ff4444";
    message.textContent = "❌ Insufficient balance!";
  }
});
</script>

</body>
</html>
