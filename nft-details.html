<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SuperNFT - NFT Details</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
  color: white;
}

.container {
  padding: 30px;
  text-align: center;
}

h1 {
  margin-bottom: 20px;
  font-size: 28px;
  color: #00eaff;
}

/* NFT Image */
#nftMainImage {
  width: 100%;
  max-width: 500px;
  border-radius: 15px;
  cursor: pointer;
  transition: 0.3s;
}

/* Hover effect */
#nftMainImage:hover {
  transform: scale(1.05);
}

/* Modal Fullscreen */
.modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.95);
  z-index: 9999;
  justify-content: center;
  align-items: center;
}

.modal img {
  max-width: 80%;
  max-height: 80%;
  border-radius: 15px;
  animation: zoomIn 0.3s ease;
}

.closeBtn {
  position: absolute;
  top: 30px;
  right: 40px;
  font-size: 40px;
  color: white;
  cursor: pointer;
}

/* Zoom animation */
@keyframes zoomIn {
  from { transform: scale(0.7); }
  to { transform: scale(1); }
}
</style>
</head>

<body>

<div class="container">

  <h1>NFT Details</h1>

  <!-- NFT Image -->
  <img id="nftMainImage" src="images/IMG_0458.png" alt="NFT Image">

  <p style="margin-top: 15px; font-size: 18px; color: #00ffcc;">
    Click image to view larger
  </p>

</div>

<!-- Modal for Fullscreen Image -->
<div class="modal" id="imageModal">
  <span class="closeBtn" id="closeBtn">&times;</span>
  <img id="modalImg">
</div>

<script>
// Modal elements
var modal = document.getElementById("imageModal");
var mainImg = document.getElementById("nftMainImage");
var modalImg = document.getElementById("modalImg");
var closeBtn = document.getElementById("closeBtn");

// Click Image → open modal
mainImg.onclick = function() {
  modal.style.display = "flex";
  modalImg.src = this.src;
};

// Close modal
closeBtn.onclick = function() {
  modal.style.display = "none";
}

// Click outside image → close
window.onclick = function(e) {
  if (e.target == modal) {
    modal.style.display = "none";
  }
}
</script>

</body>
</html>
