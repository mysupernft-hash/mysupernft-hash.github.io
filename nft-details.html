<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NFT Details</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
body{
background:#0b0b0b;
color:#FFD700;
font-family:Arial;
margin:0;
padding:0;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{
background:#111;
padding:25px;
border-radius:14px;
width:340px;
text-align:center;
box-shadow:0 0 20px #000;
}

img{
width:100%;
height:220px;
object-fit:cover;
border-radius:10px;
margin-bottom:15px;
background:#000;
}

h2{
margin:5px 0;
}

.stat{
background:#0d0d0d;
padding:10px;
margin-top:8px;
border-radius:8px;
font-size:14px;
}

button{
width:100%;
margin-top:15px;
padding:13px;
border:none;
border-radius:8px;
background:#FFD700;
font-weight:bold;
cursor:pointer;
}

button:hover{
opacity:.9;
}

.loader{
border:4px solid #222;
border-top:4px solid #FFD700;
border-radius:50%;
width:40px;
height:40px;
animation:spin 1s linear infinite;
margin:20px auto;
}

@keyframes spin{
0%{transform:rotate(0deg)}
100%{transform:rotate(360deg)}
}

</style>
</head>
<body>

<div class="card">

<div id="loader" class="loader"></div>

<img id="img" style="display:none">

<h2 id="name"></h2>
<div class="stat" id="price"></div>

<div class="stat" id="daily"></div>
<div class="stat" id="weekly"></div>
<div class="stat" id="monthly"></div>
<div class="stat" id="yearly"></div>

<button id="buyBtn">Buy NFT</button>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* FIREBASE CONFIG */
const app = initializeApp({
 apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
 authDomain:"supernft-5b952.firebaseapp.com",
 projectId:"supernft-5b952"
});

const db=getFirestore(app);

/* GET NFT ID FROM URL */
const id=new URLSearchParams(location.search).get("id");

if(!id){
alert("NFT ID missing");
throw "";
}

/* FETCH NFT */
const snap=await getDoc(doc(db,"nfts",id));

if(!snap.exists()){
alert("NFT not found");
throw "";
}

const data=snap.data();

/* HIDE LOADER */
document.getElementById("loader").style.display="none";

/* IMAGE LOAD SAFE */
const img=document.getElementById("img");

let url=(data.imageURL || "").trim();

/* fallback if empty */
if(!url) url="https://via.placeholder.com/300x200?text=No+Image";

/* handle broken image */
img.onerror=()=>{
img.src="https://via.placeholder.com/300x200?text=Image+Error";
};

img.src=url;
img.style.display="block";

/* TEXT DATA */
document.getElementById("name").innerText=data.name || "NFT";

const price=data.price || 0;
const daily=data.dailyIncome || 0;

document.getElementById("price").innerText=`Price: $${price}`;
document.getElementById("daily").innerText=`Daily Income: $${daily.toFixed(2)}`;
document.getElementById("weekly").innerText=`Weekly: $${(daily*7).toFixed(2)}`;
document.getElementById("monthly").innerText=`Monthly: $${(daily*30).toFixed(2)}`;
document.getElementById("yearly").innerText=`Yearly: $${(daily*365).toFixed(2)}`;

/* BUY BUTTON */
document.getElementById("buyBtn").onclick=()=>{
alert(
`Investment = $${price}

Daily = $${daily}
Weekly = $${(daily*7).toFixed(2)}
Monthly = $${(daily*30).toFixed(2)}
Yearly = $${(daily*365).toFixed(2)}`
);
};

</script>
</body>
</html>
