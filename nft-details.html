<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>NFT Details</title>
<style>
body{
 background:#0d0d0d;
 color:#FFD700;
 font-family:Arial;
 text-align:center;
 padding:20px;
}
.card{
 background:#111;
 padding:20px;
 border-radius:15px;
 max-width:400px;
 margin:auto;
 box-shadow:0 0 15px #000;
}
img{
 width:100%;
 border-radius:10px;
 margin-bottom:15px;
}
button{
 background:#FFD700;
 border:none;
 padding:12px;
 width:100%;
 font-weight:bold;
 border-radius:8px;
 cursor:pointer;
}
</style>
</head>
<body>

<div class="card">
<img id="img">

<h2 id="name"></h2>

<p>💰 Price: $<span id="price"></span></p>
<p>📈 Daily: $<span id="daily"></span></p>
<p>📅 Weekly: $<span id="weekly"></span></p>
<p>📆 Monthly: $<span id="monthly"></span></p>
<p>🗓 Yearly: $<span id="yearly"></span></p>

<button id="buyBtn">Buy NFT</button>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore,doc,getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app=initializeApp({
 apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
 authDomain:"supernft-5b952.firebaseapp.com",
 projectId:"supernft-5b952"
});

const db=getFirestore(app);

/* GET NFT ID FROM URL */
const id=new URLSearchParams(location.search).get("id");

if(!id){
 alert("NFT not found");
}

/* LOAD NFT */
const snap=await getDoc(doc(db,"nfts",id));

if(!snap.exists()){
 alert("NFT missing");
}

const d=snap.data();

/* SET UI */
document.getElementById("img").src=d.imageURL.trim();
document.getElementById("name").innerText=d.name;
document.getElementById("price").innerText=d.price;
document.getElementById("daily").innerText=d.dailyIncome;

/* CALCULATIONS */
document.getElementById("weekly").innerText=(d.dailyIncome*7).toFixed(2);
document.getElementById("monthly").innerText=(d.dailyIncome*30).toFixed(2);
document.getElementById("yearly").innerText=(d.dailyIncome*365).toFixed(2);

</script>
</body>
</html>
