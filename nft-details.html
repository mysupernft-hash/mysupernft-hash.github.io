<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NFT Details</title>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "YOUR KEY",
  authDomain: "YOUR DOMAIN",
  projectId: "YOUR ID",
  storageBucket: "YOUR",
  messagingSenderId: "YOUR",
  appId: "YOUR"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.addEventListener("DOMContentLoaded", async () => {

  const params = new URLSearchParams(window.location.search);
  const nftId = params.get("id");

  if(!nftId){
    document.body.innerHTML = "<h2 style='color:white;text-align:center'>NFT Not Found</h2>";
    return;
  }

  const ref = doc(db,"nfts",nftId);
  const snap = await getDoc(ref);

  if(!snap.exists()){
    document.body.innerHTML = "<h2 style='color:white;text-align:center'>Invalid NFT</h2>";
    return;
  }

  const data = snap.data();

  /* ---------- IMAGE FIX ---------- */
  let image = "";

  if(data.imageUrl){
    image = data.imageUrl;
  }
  else if(data.imageurl){
    image = data.imageurl;
  }
  else{
    image = `images/${nftId}.png`;
  }

  /* ---------- CALCULATIONS ---------- */
  const price = Number(data.price);
  const daily = Number(data.dailyIncome);
  const monthly = daily * 30;
  const yearly = daily * 365;

  /* ---------- SHOW DATA ---------- */

  document.getElementById("img").src = image;
  document.getElementById("name").innerText = data.name;
  document.getElementById("price").innerText = "$"+price;
  document.getElementById("daily").innerText = "$"+daily.toFixed(2);
  document.getElementById("monthly").innerText = "$"+monthly.toFixed(2);
  document.getElementById("yearly").innerText = "$"+yearly.toFixed(2);

});
</script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#000;
  color:#fff;
}

.card{
  max-width:400px;
  margin:40px auto;
  background:#111;
  border:1px solid gold;
  border-radius:15px;
  padding:20px;
  text-align:center;
  box-shadow:0 0 20px gold;
}

img{
  width:100%;
  border-radius:12px;
  margin-bottom:15px;
}

h1{
  color:gold;
}

.box{
  margin:10px 0;
  padding:10px;
  background:#000;
  border:1px solid gold;
  border-radius:10px;
}
</style>
</head>

<body>

<div class="card">

<img id="img" src="">

<h1 id="name">Loading...</h1>

<div class="box">Price: <span id="price"></span></div>
<div class="box">Daily Income: <span id="daily"></span></div>
<div class="box">Monthly Income: <span id="monthly"></span></div>
<div class="box">Yearly Income: <span id="yearly"></span></div>

</div>

</body>
</html>
