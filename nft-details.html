<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SuperNFT Dashboard</title>

<style>
body{
  background:#000;
  color:#d4af37;
  font-family:Arial;
  margin:0;
}

header{
  padding:20px;
  text-align:center;
  font-size:26px;
  background:#111;
  border-bottom:2px solid #d4af37;
}

.nft-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:20px;
  padding:20px;
}

.nft-card{
  background:#111;
  border:2px solid #d4af37;
  border-radius:12px;
  padding:10px;
  text-align:center;
}

.nft-card img{
  width:100%;
  border-radius:10px;
}

.price{
  margin-top:8px;
}
</style>
</head>
<body>

<header>SuperNFT Dashboard</header>

<div class="nft-grid" id="nftGrid"></div>

<script>
const nftData = [];

for(let i=1;i<=30;i++){
  nftData.push({
    id:i,
    img:`IMG_${457+i}.png`, // IMG_0458 to IMG_0487
    price:i*10
  });
}

const grid = document.getElementById("nftGrid");

nftData.forEach(nft=>{
  grid.innerHTML += `
    <div class="nft-card">
      <a href="nft-details.html?id=${nft.id}">
        <img src="images/${nft.img}" alt="NFT">
      </a>
      <div class="price">Price: $${nft.price}</div>
    </div>
  `;
});
</script>

</body>
</html>
