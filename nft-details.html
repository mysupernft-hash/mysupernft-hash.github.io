<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SuperNFT Dashboard</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    color:white;
}

.container{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:30px;
    padding:40px;
}

.card{
    width:250px;
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(10px);
    border-radius:20px;
    padding:20px;
    text-align:center;
    box-shadow:0 0 20px rgba(0,255,255,0.2);
}

.card img{
    width:100%;
    border-radius:15px;
    cursor:pointer;
    transition:0.3s;
}

.card img:hover{
    transform:scale(1.05);
}

button{
    margin-top:10px;
    padding:10px 20px;
    border:none;
    border-radius:25px;
    background:linear-gradient(45deg,#00eaff,#00ffcc);
    font-weight:bold;
    cursor:pointer;
}

/* Modal */
.modal{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.95);
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.modal img{
    max-width:80%;
    max-height:80%;
    border-radius:20px;
}

.close{
    position:absolute;
    top:30px;
    right:40px;
    font-size:40px;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

    <!-- NFT 1 -->
    <div class="card">
        <img src="images/IMG_0458.png" class="nft-image">
        <h3>NFT #1</h3>
        <p>$10</p>
        <button class="buy-btn" data-img="images/IMG_0458.png">Buy NFT</button>
    </div>

    <!-- NFT 2 -->
    <div class="card">
        <img src="images/IMG_0459.png" class="nft-image">
        <h3>NFT #2</h3>
        <p>$20</p>
        <button class="buy-btn" data-img="images/IMG_0459.png">Buy NFT</button>
    </div>

    <!-- NFT 3 -->
    <div class="card">
        <img src="images/IMG_0460.png" class="nft-image">
        <h3>NFT #3</h3>
        <p>$30</p>
        <button class="buy-btn" data-img="images/IMG_0460.png">Buy NFT</button>
    </div>

</div>

<!-- Modal -->
<div class="modal" id="imageModal">
    <span class="close" id="closeBtn">&times;</span>
    <img id="modalImg">
</div>

<script>
var modal = document.getElementById("imageModal");
var modalImg = document.getElementById("modalImg");
var closeBtn = document.getElementById("closeBtn");

// Image click event
document.querySelectorAll(".nft-image").forEach(function(img){
    img.addEventListener("click", function(){
        modal.style.display="flex";
        modalImg.src = this.src;
    });
});

// Buy button click event
document.querySelectorAll(".buy-btn").forEach(function(btn){
    btn.addEventListener("click", function(){
        var imgSrc = this.getAttribute("data-img");
        modal.style.display="flex";
        modalImg.src = imgSrc;
    });
});

// Close modal
closeBtn.onclick = function(){
    modal.style.display="none";
};

window.onclick = function(e){
    if(e.target == modal){
        modal.style.display="none";
    }
};
</script>

</body>
</html>
