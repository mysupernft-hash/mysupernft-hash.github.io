<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SuperNFT NFT Details</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#000;
  color:#FFD700;
  text-align:center;
}

header{
  padding:20px;
  background:#1a1a1a;
  font-size:22px;
  border-bottom:2px solid #FFD700;
}

.container{
  padding:20px;
}

.nft-img{
  width:95%;
  max-width:380px;
  border-radius:15px;
  border:3px solid #FFD700;
  box-shadow:0 0 25px #FFD700;
}

.price{
  font-size:20px;
  margin:15px 0;
}

.calc-box{
  background:#1a1a1a;
  border-radius:12px;
  padding:15px;
  margin:20px auto;
  max-width:400px;
  border:1px solid #FFD700;
}

.calc-row{
  display:flex;
  justify-content:space-between;
  margin:8px 0;
}

.buy-btn{
  background:#FFD700;
  color:#000;
  border:none;
  padding:12px;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
  margin-top:20px;
  width:200px;
}

.buy-btn:hover{
  background:#e6c200;
}
</style>
</head>
<body>

<header>SuperNFT NFT Details</header>

<div class="container">

  <img id="nftImage" class="nft-img">
  <div class="price" id="price"></div>

  <div class="calc-box">
    <div class="calc-row"><span>Daily Income:</span><span id="daily"></span></div>
    <div class="calc-row"><span>Weekly Income:</span><span id="weekly"></span></div>
    <div class="calc-row"><span>Monthly Income:</span><span id="monthly"></span></div>
    <div class="calc-row"><span>Yearly Income:</span><span id="yearly"></span></div>
  </div>

  <button class="buy-btn" onclick="buyNFT()">Buy NFT</button>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain: "supernft-5b952.firebaseapp.com",
  projectId: "supernft-5b952"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* NFT DATA */
const NFTS = JSON.parse(localStorage.getItem("ALL_NFTS"));

const params = new URLSearchParams(window.location.search);
const id = parseInt(params.get("id"));

if(!NFTS || isNaN(id) || !NFTS[id]){
  alert("Invalid NFT");
  window.location.href="dashboard.html";
}

const nft = NFTS[id];

document.getElementById("nftImage").src = nft.img;
document.getElementById("price").innerText = "Price: $" + nft.price;
document.getElementById("daily").innerText = "$" + nft.p.toFixed(2);
document.getElementById("weekly").innerText = "$" + (nft.p*7).toFixed(2);
document.getElementById("monthly").innerText = "$" + (nft.p*30).toFixed(2);
document.getElementById("yearly").innerText = "$" + (nft.p*365).toFixed(2);

/* BUY FUNCTION */
window.buyNFT = async function(){

  const user = auth.currentUser;

  if(!user){
    alert("Please login first");
    return;
  }

  const userRef = doc(db,"users",user.uid);
  const snap = await getDoc(userRef);

  if(!snap.exists()){
    alert("User not found");
    return;
  }

  const data = snap.data();
  const wallet = data.walletBalance || 0;
  const daily = data.dailyIncome || 0;

  if(wallet < nft.price){
    alert("❌ Insufficient Balance!");
    return;
  }

  await updateDoc(userRef,{
    walletBalance: wallet - nft.price,
    dailyIncome: daily + nft.p,
    purchasedNFTs: arrayUnion(id)
  });

  alert("🎉 Purchase Successful!");
  window.location.href="dashboard.html";
};

</script>

</body>
</html>
