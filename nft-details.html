<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SuperNFT NFT Details</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#000;
  color:#FFD700;
  text-align:center;
}
header{
  padding:18px;
  background:#1a1a1a;
  font-size:22px;
  border-bottom:2px solid #FFD700;
}
.container{
  padding:20px;
}
.nft-img{
  width:90%;
  max-width:400px;
  border-radius:15px;
  border:3px solid #FFD700;
  box-shadow:0 0 25px #FFD700;
}
.price{
  font-size:20px;
  margin:15px 0;
}
.buy-btn{
  background:#FFD700;
  color:#000;
  border:none;
  padding:12px;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
  margin-top:20px;
  width:220px;
}
.status{
  margin-top:15px;
  font-size:14px;
}
</style>
</head>
<body>

<header>SuperNFT NFT Details</header>

<div class="container">

  <img id="nftImage" class="nft-img">
  <div class="price" id="price"></div>

  <div>
    <div>Daily Income: <span id="daily"></span></div>
    <div>Weekly: <span id="weekly"></span></div>
    <div>Monthly: <span id="monthly"></span></div>
  </div>

  <button class="buy-btn" onclick="buyNFT()">Buy NFT</button>
  <div class="status" id="status"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { 
  getFirestore, 
  doc, 
  getDoc, 
  updateDoc, 
  arrayUnion 
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain: "supernft-5b952.firebaseapp.com",
  projectId: "supernft-5b952"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* NFT DATA */
const NFTS=[
{price:10,p:0.2,img:"images/IMG_0458.png"},
{price:20,p:0.4,img:"images/IMG_0460.png"},
{price:50,p:1,img:"images/IMG_0466.png"},
{price:100,p:2.5,img:"images/IMG_0474.png"},
{price:200,p:6.6,img:"images/IMG_0476.png"},
{price:500,p:25,img:"images/IMG_0482.png"},
{price:999,p:100,img:"images/IMG_0503.png"}
];

const params = new URLSearchParams(window.location.search);
let id = parseInt(params.get("id"));
if(isNaN(id) || id<0 || id>=NFTS.length) id=0;

const nft = NFTS[id];

document.getElementById("nftImage").src=nft.img;
document.getElementById("price").innerText="Price: $"+nft.price;
document.getElementById("daily").innerText="$"+nft.p.toFixed(2);
document.getElementById("weekly").innerText="$"+(nft.p*7).toFixed(2);
document.getElementById("monthly").innerText="$"+(nft.p*30).toFixed(2);

let currentUser=null;

onAuthStateChanged(auth,(user)=>{
  if(!user){
    document.getElementById("status").innerText="Please login first.";
    return;
  }
  currentUser=user;
});

window.buyNFT=async function(){

  const status=document.getElementById("status");

  if(!currentUser){
    status.innerText="Please login first.";
    return;
  }

  const userRef=doc(db,"users",currentUser.uid);
  const snap=await getDoc(userRef);
  if(!snap.exists()){
    status.innerText="User not found.";
    return;
  }

  const data=snap.data();

  let wallet=data.walletBalance||0;
  let deposit=data.totalDeposit||0;
  let daily=data.dailyIncome||0;
  let live=data.liveEarnings||0;
  const purchased=data.purchasedNFTs||[];

  if(purchased.includes(id)){
    status.innerText="Already purchased.";
    return;
  }

  const totalAvailable=wallet+deposit;

  if(totalAvailable<nft.price){
    status.innerText="Insufficient Balance.";
    return;
  }

  // Deduct from wallet first then deposit
  let remaining=nft.price;

  if(wallet>=remaining){
    wallet-=remaining;
  }else{
    remaining-=wallet;
    wallet=0;
    deposit-=remaining;
  }

  // 🔥 Instant reward
  const instantReward=nft.p;

  await updateDoc(userRef,{
    walletBalance: wallet + instantReward,
    totalDeposit: deposit,
    dailyIncome: daily + nft.p,
    liveEarnings: live + instantReward,
    purchasedNFTs: arrayUnion(id)
  });

  status.innerText="🎉 Purchase Successful!";

  setTimeout(()=>{
    window.location.href="dashboard.html";
  },1500);
};

</script>
</body>
</html>
