<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NFT Details</title>

<style>
body{
 margin:0;
 font-family:Arial,Helvetica,sans-serif;
 background:#0d1117;
 color:#fff;
 display:flex;
 justify-content:center;
 align-items:center;
 height:100vh;
}

.card{
 width:380px;
 background:#161b22;
 border-radius:20px;
 box-shadow:0 0 30px rgba(0,255,255,.2);
 padding:20px;
 text-align:center;
 animation:fade .6s ease;
}

@keyframes fade{
 from{opacity:0; transform:translateY(20px)}
 to{opacity:1; transform:translateY(0)}
}

img{
 width:100%;
 height:260px;
 object-fit:cover;
 border-radius:15px;
 margin-bottom:15px;
}

.badge{
 background:#00ffd5;
 color:#000;
 padding:5px 12px;
 border-radius:50px;
 font-size:13px;
 display:inline-block;
 margin-bottom:10px;
}

h2{margin:5px 0}

.price{
 font-size:22px;
 color:#00ffd5;
 margin:10px 0;
}

.calc{
 background:#0d1117;
 padding:15px;
 border-radius:12px;
 margin:15px 0;
}

button{
 width:100%;
 padding:14px;
 border:none;
 border-radius:12px;
 font-size:16px;
 background:linear-gradient(45deg,#00ffd5,#00aaff);
 color:#000;
 font-weight:bold;
 cursor:pointer;
 transition:.3s;
}

button:hover{
 transform:scale(1.05);
}

.msg{
 margin-top:10px;
 font-size:14px;
 color:#00ffd5;
}
</style>
</head>
<body>

<div class="card">

<img id="img">

<div class="badge" id="cat"></div>

<h2 id="name"></h2>

<div class="price" id="price"></div>

<div class="calc">
Daily Income: <b id="daily"></b><br><br>
Monthly: <b id="monthly"></b><br>
Yearly: <b id="yearly"></b>
</div>

<button id="buyBtn">Buy NFT</button>

<div class="msg" id="msg"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const app=initializeApp({
 apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
 authDomain:"supernft-5b952.firebaseapp.com",
 projectId:"supernft-5b952"
});

const db=getFirestore(app);
const auth=getAuth(app);

const params=new URLSearchParams(location.search);
const id=params.get("id");

const img=document.getElementById("img");
const nameEl=document.getElementById("name");
const priceEl=document.getElementById("price");
const dailyEl=document.getElementById("daily");
const monthlyEl=document.getElementById("monthly");
const yearlyEl=document.getElementById("yearly");
const catEl=document.getElementById("cat");
const msg=document.getElementById("msg");

let nftData=null;
let user=null;

async function loadNFT(){

 const snap=await getDoc(doc(db,"nfts",id));

 if(!snap.exists()){
  msg.innerText="NFT not found";
  return;
 }

 const data=snap.data();
 nftData=data;

 img.src=(data.imageURL || "").trim();
 img.onerror=()=>img.src="https://via.placeholder.com/400x300?text=NFT";

 nameEl.innerText=data.name.trim();
 priceEl.innerText="$"+data.price;
 catEl.innerText=data.category;

 dailyEl.innerText="$"+data.dailyIncome;

 monthlyEl.innerText="$"+(data.dailyIncome*30).toFixed(2);
 yearlyEl.innerText="$"+(data.dailyIncome*365).toFixed(2);
}

loadNFT();

onAuthStateChanged(auth,u=>user=u);

document.getElementById("buyBtn").onclick=async()=>{

 if(!user){
  msg.innerText="Login first";
  return;
 }

 const ref=doc(db,"users",user.uid);
 const snap=await getDoc(ref);

 let balance=snap.data().walletBalance||0;

 if(balance<nftData.price){
  msg.innerText="Insufficient balance";
  return;
 }

 await updateDoc(ref,{
  walletBalance:increment(-nftData.price),
  dailyIncome:increment(nftData.dailyIncome)
 });

 msg.innerText="NFT Purchased Successfully";
};

</script>

</body>
</html>
