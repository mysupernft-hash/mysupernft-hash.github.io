<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SuperNFT - Live Earnings</title>

<!-- Chart.js CDN -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
  margin:0;
  background:#0b0b10;
  color:#FFD700;
  font-family:Segoe UI;
}

header{
  text-align:center;
  padding:20px;
  font-size:22px;
  font-weight:bold;
  background:#111;
}

.chart-wrapper{
  width:95%;
  max-width:750px;
  height:380px;
  margin:50px auto;
  background:#0f172a;
  padding:20px;
  border-radius:14px;
  box-shadow:0 0 25px rgba(255,215,0,0.3);
}
</style>
</head>

<body>

<header>📈 Live Earnings Chart</header>

<div class="chart-wrapper">
  <canvas id="earningsChart"></canvas>
</div>

<script type="module">

/* ================= FIREBASE IMPORT ================= */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ================= FIREBASE CONFIG ================= */
const firebaseConfig={
  apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain:"supernft-5b952.firebaseapp.com",
  projectId:"supernft-5b952"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

/* ================= INIT CHART FIRST ================= */
const ctx=document.getElementById("earningsChart").getContext("2d");

const earningsChart=new Chart(ctx,{
  type:"line",
  data:{
    labels:[],
    datasets:[{
      label:"Live Earnings ($)",
      data:[],
      borderColor:"#FFD700",
      backgroundColor:"rgba(255,215,0,0.2)",
      borderWidth:2,
      tension:0.4,
      fill:true,
      pointRadius:3,
      pointBackgroundColor:"#FFD700"
    }]
  },
  options:{
    responsive:true,
    maintainAspectRatio:false,
    plugins:{
      legend:{ labels:{ color:"#FFD700" }}
    },
    scales:{
      x:{
        ticks:{ color:"#FFD700" },
        grid:{ color:"rgba(255,215,0,0.1)" }
      },
      y:{
        ticks:{ color:"#FFD700" },
        grid:{ color:"rgba(255,215,0,0.1)" }
      }
    }
  }
});

/* ================= UPDATE CHART FUNCTION ================= */
function updateChart(value){

  const time=new Date().toLocaleTimeString();

  earningsChart.data.labels.push(time);
  earningsChart.data.datasets[0].data.push(value);

  // Keep last 20 points
  if(earningsChart.data.labels.length>20){
    earningsChart.data.labels.shift();
    earningsChart.data.datasets[0].data.shift();
  }

  earningsChart.update();
}

/* ================= AUTH + FIRESTORE ================= */
onAuthStateChanged(auth,(user)=>{

  if(!user){
    window.location="login.html";
    return;
  }

  const userRef=doc(db,"users",user.uid);

  onSnapshot(userRef,(snap)=>{

    if(!snap.exists()){
      console.log("User document not found");
      return;
    }

    const data=snap.data();

    // 🔥 IMPORTANT: Make sure Firestore field name matches
    const earnings=data.liveEarnings || 0;

    updateChart(earnings);

  },(error)=>{
    console.error("Firestore Error:",error);
  });

});

</script>

</body>
</html>
