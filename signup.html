<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, sendEmailVerification } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc, serverTimestamp, collection, query, where, getDocs, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* 🔥 Firebase Config */
const firebaseConfig = {
  apiKey: "AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain: "supernft-5b952.firebaseapp.com",
  projectId: "supernft-5b952",
  storageBucket: "supernft-5b952.appspot.com",
  messagingSenderId: "278097730700",
  appId: "1:278097730700:web:6ba9892334456fd8512fa9"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* 🔹 AUTO FILL REFERRAL FROM URL */
const urlParams = new URLSearchParams(window.location.search);
const refFromURL = urlParams.get("ref");

if(refFromURL){
  document.getElementById("referralInput").value = refFromURL.toUpperCase();
}

/* 🔹 Signup */
document.getElementById("signupBtn").addEventListener("click", async () => {

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();
  const referralCode = document.getElementById("referralInput").value.trim().toUpperCase();

  if (!email || !password || !referralCode) {
    alert("All fields including Referral Code are required");
    return;
  }

  try {

    /* 🔎 CHECK IF REFERRAL EXISTS */
    const q = query(collection(db, "users"), where("referralCode", "==", referralCode));
    const querySnapshot = await getDocs(q);

    if (querySnapshot.empty) {
      alert("Invalid Referral Code!");
      return;
    }

    // Get referrer document
    const referrerDoc = querySnapshot.docs[0];

    /* 🔹 CREATE USER */
    const cred = await createUserWithEmailAndPassword(auth, email, password);
    const user = cred.user;

    const newReferralCode = "SNFT" + user.uid.substring(0,6).toUpperCase();

    await setDoc(doc(db, "users", user.uid), {
      email: email,

      walletBalance: 0,
      dailyIncome: 0,
      liveEarnings: 0,
      totalDeposit: 0,

      referralCode: newReferralCode,
      referredBy: referralCode,
      referralEarnings: 0,

      role: "user",
      banned: false,

      createdAt: serverTimestamp()
    });

    /* 🔥 OPTIONAL: Give referral bonus */
    await updateDoc(referrerDoc.ref, {
      referralEarnings: increment(1)
    });

    await sendEmailVerification(user);
    window.location.href = "verification.html";

  } catch (err) {
    if (err.code === "auth/email-already-in-use") {
      alert("Email already registered");
    } else {
      alert(err.message);
    }
    console.error(err);
  }

});
</script>
