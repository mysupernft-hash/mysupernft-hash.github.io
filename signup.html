<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SuperNFT Signup</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{
  background:#0f0f0f;
  color:#FFD700;
  font-family:Arial;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box{
  background:#1a1a1a;
  padding:25px;
  border-radius:12px;
  width:100%;
  max-width:350px;
}
input,button{
  width:100%;
  padding:12px;
  margin:8px 0;
  border-radius:6px;
  border:none;
}
input{background:#111;color:#FFD700}
button{
  background:#FFD700;
  color:#000;
  font-weight:bold;
  cursor:pointer;
}
button:hover{background:#e6c200}
a{color:#FFD700;font-size:14px}
</style>
</head>

<body>
<div class="box">
  <h2>Create Account</h2>

  <input type="email" id="email" placeholder="Email" required>
  <input type="password" id="password" placeholder="Password" required>
  <input type="text" id="referral" placeholder="Referral Code" required>

  <button onclick="signup()">Sign Up</button>

  <p style="text-align:center">
    <a href="login.html">Already have account? Login</a>
  </p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, sendEmailVerification } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, query, where, getDocs, doc, setDoc } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* 🔥 Firebase Config (same as dashboard) */
const firebaseConfig = {
  apiKey: "AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain: "supernft-5b952.firebaseapp.com",
  projectId: "supernft-5b952",
  storageBucket: "supernft-5b952.appspot.com",
  messagingSenderId: "278097730700",
  appId: "1:278097730700:web:6ba9892334456fd8512fa9"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* 🔐 SIGNUP FUNCTION */
async function signup(){
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();
  const referral = document.getElementById("referral").value.trim();

  if(!email || !password || !referral){
    alert("All fields are required");
    return;
  }

  /* ✅ Verify referral code */
  const q = query(collection(db,"users"), where("referralCode","==",referral));
  const snap = await getDocs(q);

  if(snap.empty){
    alert("Invalid referral code");
    return;
  }

  try{
    const cred = await createUserWithEmailAndPassword(auth,email,password);
    const uid = cred.user.uid;

    const myReferral = "SNFT" + uid.slice(0,6).toUpperCase();

    await setDoc(doc(db,"users",uid),{
      email: email,
      referralCode: myReferral,
      referredBy: referral,
      walletBalance: 0,
      totalDeposit: 0,
      dailyIncome: 0,
      liveEarnings: 0,
      nfts: [],
      createdAt: Date.now()
    });

    await sendEmailVerification(cred.user);

    window.location.href = "verification.html";
  }
  catch(err){
    alert(err.message);
  }
}

/* 🔥 VERY IMPORTANT LINE */
window.signup = signup;
</script>
</body>
</html>
