<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SuperNFT Signup</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#0f0f0f;
  color:#FFD700;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box{
  width:100%;
  max-width:380px;
  background:#1a1a1a;
  padding:25px;
  border-radius:12px;
}
h2{text-align:center;margin-bottom:20px;}
input{
  width:100%;
  padding:12px;
  margin-bottom:12px;
  border-radius:8px;
  border:none;
  outline:none;
}
button{
  width:100%;
  padding:12px;
  background:#FFD700;
  border:none;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}
button:hover{background:#e6c200;}
.links{
  text-align:center;
  margin-top:12px;
  font-size:14px;
}
.links a{color:#FFD700;text-decoration:none;}
</style>
</head>

<body>

<div class="box">
  <h2>Create Account</h2>

  <input type="email" id="email" placeholder="Email" required>
  <input type="password" id="password" placeholder="Password" required>
  <input type="text" id="referral" placeholder="Referral Code" required>

  <button id="signupBtn">Sign Up</button>

  <div class="links">
    <p><a href="login.html">Already have an account? Login</a></p>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* 🔥 Firebase Config (SAME AS DASHBOARD) */
const firebaseConfig = {
  apiKey: "AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain: "supernft-5b952.firebaseapp.com",
  projectId: "supernft-5b952",
  storageBucket: "supernft-5b952.appspot.com",
  messagingSenderId: "278097730700",
  appId: "1:278097730700:web:6ba9892334456fd8512fa9"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* 🔹 Signup Function */
async function signup(){
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();
  const referral = document.getElementById("referral").value.trim();

  if(!email || !password || !referral){
    alert("All fields are required");
    return;
  }

  try{
    /* 🔹 Verify Referral Code */
    const refSnap = await getDoc(doc(db,"referrals", referral));
    if(!refSnap.exists()){
      alert("Invalid referral code");
      return;
    }

    /* 🔹 Create User */
    const cred = await createUserWithEmailAndPassword(auth,email,password);

    /* 🔹 Save User Data */
    await setDoc(doc(db,"users",cred.user.uid),{
      email: email,
      referralUsed: referral,
      walletBalance: 0,
      totalDeposit: 0,
      dailyIncome: 0,
      liveEarnings: 0,
      createdAt: new Date()
    });

    /* 🔥 Redirect to Verification Page */
    window.location.href = "verification.html";

  }catch(err){
    alert(err.message);
  }
}

/* 🔥 BUTTON FIX (IMPORTANT) */
document.getElementById("signupBtn").addEventListener("click", signup);
</script>

</body>
</html>
