<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SuperNFT Signup</title>

<style>
body {margin:0;font-family:Arial,sans-serif;background:#0f0f0f;color:#FFD700;}
.container{max-width:400px;margin:80px auto;padding:20px;background:#1a1a1a;border-radius:12px;}
h2{text-align:center;margin-bottom:20px;}
input{width:100%;padding:10px;margin:8px 0;border-radius:6px;border:none;background:#272727;color:#FFD700;}
button{width:100%;padding:12px;margin-top:12px;background:#FFD700;color:#000;border:none;font-weight:bold;border-radius:6px;cursor:pointer;}
button:hover{background:#e0c200;}
.options{display:flex;justify-content:space-between;margin-top:10px;}
a{color:#FFD700;text-decoration:none;}
</style>
</head>
<body>

<div class="container">
  <h2>Sign Up</h2>

  <input type="text" id="name" placeholder="Full Name" required>
  <input type="email" id="email" placeholder="Email" required>
  <input type="password" id="password" placeholder="Password" required>
  <input type="text" id="referralInput" placeholder="Referral Code (Required)" required>

  <button id="signupBtn">Sign Up</button>

  <div class="options">
    <a href="login.html">Login</a>
    <a href="forgot.html">Forgot Password?</a>
  </div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, deleteUser, sendEmailVerification, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc, getDocs, collection, query, where, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* 🔥 Firebase Config */
const firebaseConfig = {
  apiKey: "AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain: "supernft-5b952.firebaseapp.com",
  projectId: "supernft-5b952"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* =============================
   🔥 AUTO REFERRAL FROM LINK
============================= */

const urlParams = new URLSearchParams(window.location.search);
const refFromURL = urlParams.get("ref");

if (refFromURL) {
  const refInput = document.getElementById("referralInput");
  refInput.value = refFromURL.toUpperCase();
  refInput.readOnly = true;
}

/* =============================
   🚀 SIGNUP WITH BONUS SYSTEM
============================= */

document.getElementById("signupBtn").addEventListener("click", async () => {

  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();
  const referralCode = document.getElementById("referralInput").value.trim().toUpperCase();

  if (!name || !email || !password || !referralCode) {
    alert("All fields including Referral Code are required.");
    return;
  }

  try {

    // 1️⃣ Create Auth User
    const cred = await createUserWithEmailAndPassword(auth, email, password);
    const user = cred.user;

    await updateProfile(user, { displayName: name });

    // 2️⃣ Check referral exists
    const q = query(collection(db, "users"), where("referralCode", "==", referralCode));
    const snapshot = await getDocs(q);

    if (snapshot.empty) {
      alert("Invalid Referral Code!");
      await deleteUser(user);
      return;
    }

    const refDoc = snapshot.docs[0];
    const refUserId = refDoc.id;
    const refUserData = refDoc.data();

    const BONUS = 5;

    // 3️⃣ Generate new referral code
    const newReferralCode = "SNFT" + user.uid.substring(0,6).toUpperCase();

    // 4️⃣ Save new user with $5 bonus
    await setDoc(doc(db, "users", user.uid), {
      name: name,
      email: email,
      referralCode: newReferralCode,
      referredBy: referralCode,
      referredByUid: refUserId
      referralUsed: true,
      walletBalance: BONUS,
      referralEarnings: 0,
      dailyIncome: 0,
      liveEarnings: 0,
      totalDeposit: 0,
      totalWithdraw: 0,
      role: "user",
      banned: false,
      verified: false,
      level: 1,
      createdAt: serverTimestamp()
    });

    // 5️⃣ Update referrer wallet
    await updateDoc(doc(db, "users", refUserId), {
      walletBalance: (refUserData.walletBalance || 0) + BONUS,
      referralEarnings: (refUserData.referralEarnings || 0) + BONUS
    });

    await sendEmailVerification(user);

    alert("$5 Bonus credited to both users!");
    window.location.href = "verification.html";

  } catch (err) {

    if (err.code === "auth/email-already-in-use") {
      alert("Email already registered");
    } else {
      alert(err.message);
    }

  }

});

</script>

</body>
</html>
