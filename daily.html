<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Income | SuperNFT</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f0f0f;
  color:#FFD700;
}

header{
  background:#1a1a1a;
  padding:15px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
}

.container{
  padding:15px;
}

.card{
  background:#1a1a1a;
  padding:15px;
  border-radius:12px;
  margin-bottom:15px;
}

.big{
  font-size:28px;
  font-weight:bold;
  text-align:center;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.small{
  background:#111;
  padding:12px;
  border-radius:10px;
  text-align:center;
  font-size:14px;
}

.small span{
  display:block;
  font-size:18px;
  margin-top:5px;
  font-weight:bold;
}

.progress{
  background:#222;
  border-radius:10px;
  overflow:hidden;
  height:10px;
  margin-top:8px;
}

.progress-bar{
  height:100%;
  background:#FFD700;
  width:0%;
}

canvas{
  background:#111;
  border-radius:12px;
  padding:10px;
}

@media(max-width:480px){
  .grid{grid-template-columns:1fr 1fr;}
}
</style>
</head>
<body>

<header>⚡ Daily Income</header>

<div class="container">

<!-- LIVE EARNINGS -->
<div class="card">
  <div style="text-align:center;font-size:14px;">Live Earnings</div>
  <div class="big">$<span id="live">0.000000</span></div>
</div>

<!-- DAILY RATE -->
<div class="card grid">
  <div class="small">
    Daily Rate
    <span>$<span id="dailyRate">0</span></span>
  </div>
  <div class="small">
    Per Second
    <span>$<span id="perSecond">0</span></span>
  </div>
</div>

<!-- INCOME BREAKDOWN -->
<div class="card">
  <h3>Income Breakdown</h3>
  <div class="grid">
    <div class="small">NFT Income <span>$<span id="nftIncome">0</span></span></div>
    <div class="small">Referral <span>$<span id="refIncome">0</span></span></div>
    <div class="small">Team <span>$<span id="teamIncome">0</span></span></div>
    <div class="small">Pool <span>$<span id="poolIncome">0</span></span></div>
  </div>
</div>

<!-- VIP SECTION -->
<div class="card">
  <h3>VIP Status</h3>
  <div>Rank: VIP <span id="vip">0</span></div>
  <div>Commission: <span id="commission">0</span>%</div>
  <div class="progress">
    <div class="progress-bar" id="vipBar"></div>
  </div>
  <div style="font-size:12px;margin-top:5px;">
    Progress to next VIP: <span id="vipProgress">0</span>%
  </div>
</div>

<!-- TEAM TODAY -->
<div class="card">
  <h3>Team Earnings Today</h3>
  <div class="grid">
    <div class="small">Level 1 <span>$<span id="lvl1">0</span></span></div>
    <div class="small">Level 2-10 <span>$<span id="lvl10">0</span></span></div>
  </div>
</div>

<!-- GRAPH -->
<div class="card">
  <h3>Last 7 Days Earnings</h3>
  <canvas id="chart"></canvas>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
authDomain:"supernft-5b952.firebaseapp.com",
projectId:"supernft-5b952"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

let baseLive=0;
let daily=0;

onAuthStateChanged(auth,async(user)=>{

if(!user){
location.href="login.html";
return;
}

const snap=await getDoc(doc(db,"users",user.uid));
if(!snap.exists()) return;

const data=snap.data();

daily=data.dailyIncome||0;
baseLive=data.liveEarnings||0;

document.getElementById("dailyRate").innerText=daily.toFixed(2);
document.getElementById("perSecond").innerText=(daily/86400).toFixed(6);
document.getElementById("live").innerText=baseLive.toFixed(6);

document.getElementById("nftIncome").innerText=daily.toFixed(2);
document.getElementById("refIncome").innerText=(data.referralEarnings||0).toFixed(2);
document.getElementById("teamIncome").innerText=(data.teamCommission||0).toFixed(2);
document.getElementById("poolIncome").innerText=(data.poolReward||0).toFixed(2);

let vip=data.level||0;
document.getElementById("vip").innerText=vip;

let commission = vip*2+5;
document.getElementById("commission").innerText=commission;

let progress = Math.min((data.totalDeposit||0)/1000*100,100);
document.getElementById("vipProgress").innerText=progress.toFixed(0);
document.getElementById("vipBar").style.width=progress+"%";

document.getElementById("lvl1").innerText=(data.level1Income||0).toFixed(2);
document.getElementById("lvl10").innerText=(data.level10Income||0).toFixed(2);

/* LIVE ANIMATION */
setInterval(()=>{
  baseLive += daily/86400;
  document.getElementById("live").innerText=baseLive.toFixed(6);
},1000);

/* GRAPH */
new Chart(document.getElementById("chart"),{
type:"line",
data:{
labels:["Mon","Tue","Wed","Thu","Fri","Sat","Sun"],
datasets:[{
label:"Earnings",
data:[
daily*0.8,
daily*1.1,
daily*0.9,
daily*1.3,
daily*1.0,
daily*1.4,
daily
],
borderColor:"#FFD700",
backgroundColor:"rgba(255,215,0,0.1)"
}]
}
});

});
</script>

</body>
</html>
