<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Mining | SuperNFT</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f0f0f;
  color:#FFD700;
}
header{
  background:#1a1a1a;
  padding:15px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
}
.container{padding:15px;}
.card{
  background:#1a1a1a;
  padding:15px;
  border-radius:12px;
  margin-bottom:15px;
}
.big{
  font-size:28px;
  font-weight:bold;
}
.row{
  display:flex;
  justify-content:space-between;
  margin:8px 0;
}
canvas{
  background:#1a1a1a;
  border-radius:12px;
  padding:10px;
}
</style>
</head>
<body>

<header>⚡ Daily Mining Dashboard</header>

<div class="container">

<div class="card">
  <div>Live Earnings</div>
  <div class="big">$<span id="live">0.000000</span></div>
</div>

<div class="card">
  <div class="row"><span>Daily Rate</span><span id="dailyRate">$0</span></div>
  <div class="row"><span>Today Earnings</span><span id="todayEarnings">$0</span></div>
  <div class="row"><span>Hourly</span><span id="hourRate">$0</span></div>
  <div class="row"><span>Per Second</span><span id="secRate">$0</span></div>
</div>

<div class="card">
  <canvas id="chart"></canvas>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
authDomain:"supernft-5b952.firebaseapp.com",
projectId:"supernft-5b952"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

onAuthStateChanged(auth, async(user)=>{

if(!user){
location.href="login.html";
return;
}

const userRef=doc(db,"users",user.uid);
const snap=await getDoc(userRef);
if(!snap.exists()) return;

const data=snap.data();

let wallet = data.walletBalance || 0;
let referral = data.referralEarnings || 0;

/* 🔥 DAILY FORMULA
   2.5% of wallet
   + full referral earnings added
*/
let daily = (wallet * 0.025) + referral;

let live = 0;

document.getElementById("dailyRate").innerText="$"+daily.toFixed(2);
document.getElementById("hourRate").innerText="$"+(daily/24).toFixed(4);
document.getElementById("secRate").innerText="$"+(daily/86400).toFixed(6);

const perSecond=(daily/86400);

setInterval(()=>{

// Live earnings
live += perSecond;
document.getElementById("live").innerText=live.toFixed(6);

// Today earnings
const now = new Date();
const midnight = new Date();
midnight.setHours(0,0,0,0);

const secondsToday = (now - midnight)/1000;
const todayEarned = perSecond * secondsToday;

document.getElementById("todayEarnings").innerText =
"$"+todayEarned.toFixed(4);

},1000);

// GRAPH
new Chart(document.getElementById("chart"),{
type:"bar",
data:{
labels:["Mon","Tue","Wed","Thu","Fri","Sat","Sun"],
datasets:[{
label:"Last 7 Days Income",
data:data.incomeHistory || [5,8,6,9,7,10,12],
backgroundColor:"#FFD700"
}]
},
options:{
plugins:{legend:{display:false}},
scales:{
x:{ticks:{color:"#FFD700"}},
y:{ticks:{color:"#FFD700"}}
}
}
});

});

</script>
</body>
</html>
