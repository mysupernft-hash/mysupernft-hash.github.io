<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SuperNFT Admin</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#0d0d0d;
  color:#FFD700;
}

/* Header */
header{
  background:#111;
  padding:14px;
  text-align:center;
  font-size:18px;
  font-weight:bold;
  position:sticky;
  top:0;
  z-index:100;
}

/* Container */
.container{
  padding:10px;
}

/* Scroll Wrapper */
.table-wrapper{
  overflow-x:auto;
}

/* Table */
table{
  width:100%;
  min-width:700px;
  border-collapse:collapse;
}

th,td{
  border:1px solid #333;
  padding:8px;
  text-align:center;
  font-size:13px;
}

th{
  background:#1a1a1a;
}

/* Inputs */
input,select{
  width:70px;
  padding:4px;
  background:#222;
  color:#FFD700;
  border:none;
  border-radius:5px;
  font-size:12px;
}

/* Buttons */
button{
  padding:5px 8px;
  font-size:12px;
  font-weight:bold;
  border:none;
  border-radius:6px;
  background:#FFD700;
  color:#000;
  cursor:pointer;
}

button:hover{
  background:#e6c200;
}

/* Mobile Card Style (Below 480px) */
@media(max-width:480px){

  table{
    min-width:600px;
  }

  th,td{
    font-size:12px;
    padding:6px;
  }

  input,select{
    width:55px;
  }

  button{
    font-size:11px;
    padding:4px 6px;
  }
}
</style>
</head>

<body>

<header>🔥 SuperNFT Admin Panel</header>

<div class="container">
  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>Email</th>
          <th>Wallet</th>
          <th>Daily</th>
          <th>Referral</th>
          <th>Level</th>
          <th>Banned</th>
          <th>Save</th>
        </tr>
      </thead>
      <tbody id="users"></tbody>
    </table>
  </div>
</div>

<script>

// 🔥 Firebase Init
firebase.initializeApp({
  apiKey: "AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain: "supernft-5b952.firebaseapp.com",
  projectId: "supernft-5b952"
});

const db = firebase.firestore();

// 🔥 Load Users
db.collection("users").get().then(snapshot => {

  let html = "";

  snapshot.forEach(doc => {

    const u = doc.data();

    html += `
      <tr>
        <td style="min-width:140px">${u.email || ""}</td>

        <td><input id="w_${doc.id}" value="${u.walletBalance || 0}"></td>

        <td><input id="d_${doc.id}" value="${u.dailyIncome || 0}"></td>

        <td><input id="r_${doc.id}" value="${u.referralEarnings || 0}"></td>

        <td><input id="l_${doc.id}" value="${u.level || 0}"></td>

        <td>
          <select id="ban_${doc.id}">
            <option value="false" ${u.banned ? "" : "selected"}>No</option>
            <option value="true" ${u.banned ? "selected" : ""}>Yes</option>
          </select>
        </td>

        <td>
          <button onclick="saveUser('${doc.id}')">
            Save
          </button>
        </td>
      </tr>
    `;
  });

  document.getElementById("users").innerHTML = html;

}).catch(error => {
  alert("Error: " + error.message);
});

// 🔥 Save User
function saveUser(uid){

  db.collection("users").doc(uid).update({
    walletBalance: Number(document.getElementById("w_"+uid).value),
    dailyIncome: Number(document.getElementById("d_"+uid).value),
    referralEarnings: Number(document.getElementById("r_"+uid).value),
    level: Number(document.getElementById("l_"+uid).value),
    banned: document.getElementById("ban_"+uid).value === "true"
  })
  .then(()=>alert("✅ Updated"))
  .catch(error=>alert("❌ "+error.message));

}
</script>

</body>
</html>
