<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Login - SuperNFT</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<style>
body { background:#0d0d0d; color:#ffd700; font-family:Arial; text-align:center }
input { padding:10px; margin:5px; width:250px }
button { padding:10px 20px; background:#ffd700; border:none; cursor:pointer }
</style>
</head>

<body>

<h2>Admin Login</h2>

<input id="email" placeholder="Email"><br>
<input id="password" type="password" placeholder="Password"><br><br>
<button onclick="login()">Login</button>

<p id="msg"></p>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain: "supernft-5b952.firebaseapp.com",
  projectId: "supernft-5b952"
});

const auth = firebase.auth();

function login(){
  const email = document.getElementById("email").value;
  const pass  = document.getElementById("password").value;

  auth.signInWithEmailAndPassword(email, pass)
    .then(() => {
      window.location.href = "admin-dashboard.html";
    })
    .catch(err => {
      document.getElementById("msg").innerText = err.message;
    });
}
</script>

</body>
</html>
