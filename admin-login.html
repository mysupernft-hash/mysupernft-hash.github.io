<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Login | SuperNFT</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#0d0d0d;
  color:#FFD700;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.login-box{
  background:#1a1a1a;
  padding:30px;
  width:320px;
  border-radius:10px;
  text-align:center;
}
input{
  width:100%;
  padding:12px;
  margin:10px 0;
  border:none;
  border-radius:5px;
  outline:none;
}
button{
  width:100%;
  padding:12px;
  background:#FFD700;
  color:#000;
  border:none;
  border-radius:5px;
  font-weight:bold;
  cursor:pointer;
}
button:hover{background:#e6c200;}
.msg{margin-top:10px;font-size:14px;}
</style>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
</head>

<body>

<div class="login-box">
  <h2>Admin Login</h2>

  <input type="email" id="email" placeholder="Admin Email" value="mysupernft@gmail.com">
  <input type="password" id="password" placeholder="Password">

  <button onclick="adminLogin()">Login</button>

  <div class="msg" id="msg"></div>
</div>

<script>
/* 🔥 FIREBASE CONFIG (YOUR PROJECT) */
const firebaseConfig = {
  apiKey: "AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain: "supernft-5b952.firebaseapp.com",
  projectId: "supernft-5b952"
};

// Initialize Firebase (ONLY ONCE)
firebase.initializeApp(firebaseConfig);

// ✅ ADMIN EMAIL (FIXED)
const ADMIN_EMAIL = "mysupernft@gmail.com";

const msg = document.getElementById("msg");

/* 🔐 ADMIN LOGIN FUNCTION */
function adminLogin(){
  const email = document.getElementById("email").value.trim().toLowerCase();
  const password = document.getElementById("password").value;

  if(!email || !password){
    msg.innerText = "Enter email & password";
    return;
  }

  msg.innerText = "Logging in...";

  firebase.auth()
    .setPersistence(firebase.auth.Auth.Persistence.LOCAL)
    .then(()=>{
      return firebase.auth().signInWithEmailAndPassword(email, password);
    })
    .then(res=>{
      if(res.user.email.toLowerCase() !== ADMIN_EMAIL){
        msg.innerText = "Access denied. Admin only.";
        firebase.auth().signOut();
        return;
      }
      window.location.href = "admin-dashboard.html";
    })
    .catch(err=>{
      msg.innerText = err.message;
    });
}
</script>

</body>
</html>
