<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SuperNFT Admin Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
body{
  margin:0;
  background:#0d0d0d;
  font-family:Arial;
  color:#FFD700;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box{
  background:#1a1a1a;
  padding:25px;
  border-radius:12px;
  width:90%;
  max-width:400px;
}
h2{
  text-align:center;
}
input{
  width:100%;
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:6px;
}
button{
  width:100%;
  padding:12px;
  margin-top:15px;
  background:#FFD700;
  border:none;
  font-weight:bold;
  cursor:pointer;
}
button:hover{
  background:#e6c200;
}
#error{
  color:red;
  margin-top:10px;
  text-align:center;
}
</style>
</head>

<body>

<div class="box">
  <h2>🔐 Admin Login</h2>

  <input type="email" id="email" placeholder="Admin Email">
  <input type="password" id="password" placeholder="Password">

  <button onclick="adminLogin()">Login</button>

  <div id="error"></div>
</div>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain: "supernft-5b952.firebaseapp.com",
  projectId: "supernft-5b952"
});

const auth = firebase.auth();
const db   = firebase.firestore();

function adminLogin(){

  const email = document.getElementById("email").value;
  const pass  = document.getElementById("password").value;

  auth.signInWithEmailAndPassword(email,pass)
  .then(cred => {

    const uid = cred.user.uid;

    // 🔎 Check role in Firestore
    db.collection("users").doc(uid).get()
    .then(doc => {

      if(!doc.exists){
        document.getElementById("error").innerText="User not found";
        return;
      }

      const data = doc.data();

      if(data.role === "superadmin"){
        window.location.href="admin.html";
      }else{
        document.getElementById("error").innerText=
        "❌ Access Denied (Not Superadmin)";
      }

    });

  })
  .catch(err=>{
    document.getElementById("error").innerText=err.message;
  });

}
</script>

</body>
</html>
