<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Login | SuperNFT</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0d0d0d;
  color:#FFD700;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box{
  background:#111;
  padding:30px;
  border-radius:10px;
  width:300px;
  text-align:center;
}
input{
  width:100%;
  padding:10px;
  margin:8px 0;
  background:#000;
  border:1px solid #444;
  color:#FFD700;
}
button{
  width:100%;
  padding:10px;
  background:#FFD700;
  border:none;
  font-weight:bold;
  cursor:pointer;
}
button:hover{opacity:0.8}
</style>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>

<body>

<div class="box">
<h2>Admin Login</h2>
<input id="email" type="email" placeholder="Admin Email">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<p id="msg"></p>
</div>

<script>
// 🔹 Firebase Config (same as site)
const firebaseConfig = {
  apiKey: "AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain: "supernft-5b952.firebaseapp.com",
  projectId: "supernft-5b952",
};
firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

// 🔐 LOGIN FUNCTION
function login(){
  const email = email.value;
  const password = password.value;
  msg.innerText="Logging in...";

  auth.signInWithEmailAndPassword(email,password)
  .then(res=>{
    return db.collection("users").doc(res.user.uid).get();
  })
  .then(doc=>{
    if(!doc.exists || doc.data().isAdmin !== true){
      auth.signOut();
      msg.innerText="❌ Not an admin";
      return;
    }
    // ✅ ADMIN VERIFIED
    window.location.href="admin-dashboard.html";
  })
  .catch(err=>{
    msg.innerText=err.message;
  });
}
</script>

</body>
</html>
