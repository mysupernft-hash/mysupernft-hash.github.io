<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SuperNFT Admin Login</title>
<style>
body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #0d0d0d;
    color: #FFD700;
    font-family: Arial, sans-serif;
}
.login-box {
    background: #1a1a1a;
    padding: 30px;
    border-radius: 10px;
    width: 300px;
    text-align: center;
    box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
}
h2 {
    margin-bottom: 20px;
}
input {
    width: 100%;
    padding: 12px;
    margin: 5px 0;
    border-radius: 6px;
    border: none;
    outline: none;
}
button {
    width: 100%;
    padding: 12px;
    background: #FFD700;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}
button:hover {
    background: #e6c200;
}
.error {
    color: red;
    margin-top: 10px;
    font-size: 14px;
}
</style>
<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
</head>
<body>
<div class="login-box">
    <h2>Admin Login</h2>
    <input type="email" id="email" placeholder="Email" />
    <input type="password" id="password" placeholder="Password" />
    <button onclick="login()">Login</button>
    <div id="error" class="error"></div>
</div>

<script>
// 🔹 Firebase Config
const firebaseConfig = {
  apiKey: "AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain: "supernft-5b952.firebaseapp.com",
  projectId: "supernft-5b952",
  storageBucket: "supernft-5b952.firebasestorage.app",
  messagingSenderId: "278097730700",
  appId: "1:278097730700:web:014d5ab680859db4512fa9",
  measurementId: "G-BME7FWT355"
};

// 🔹 Initialize Firebase
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

// 🔹 Admin email (change to your admin)
const ADMIN_EMAIL = "admin@supernft.com";

// 🔹 Login function
async function login() {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();
    const errorBox = document.getElementById("error");
    errorBox.innerText = "";

    if(!email || !password){
        errorBox.innerText = "Please enter email & password!";
        return;
    }

    try {
        const cred = await auth.signInWithEmailAndPassword(email, password);
        if(cred.user.email === ADMIN_EMAIL){
            // ✅ Admin verified
            window.location.href = "admin-nfts.html"; // redirect to admin dashboard
        } else {
            await auth.signOut();
            errorBox.innerText = "Access denied. Admin only.";
        }
    } catch (e) {
        errorBox.innerText = e.message;
    }
}
</script>
</body>
</html>
