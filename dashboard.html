<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SuperNFT Dashboard</title>

<style>
body{margin:0;font-family:Arial;background:#0f0f0f;color:#FFD700;}
header{background:#1a1a1a;padding:12px;display:flex;justify-content:space-between;align-items:center;}
.menu-toggle{font-size:26px;cursor:pointer;}
#sidebar{position:fixed;top:0;left:-260px;width:260px;height:100%;background:#1a1a1a;padding:20px;transition:.3s;overflow:auto;}
#sidebar.active{left:0;}
#sidebar button{width:100%;background:none;border:none;color:#FFD700;padding:10px;text-align:left;cursor:pointer;}
#sidebar button:hover{background:#272727;border-radius:6px;}
#overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);display:none;}
#overlay.active{display:block;}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:15px;margin:20px;}
.stat-box{background:#1a1a1a;padding:15px;border-radius:12px;text-align:center;cursor:pointer;}
#referralBox{margin:20px;background:#1a1a1a;padding:10px;border-radius:10px;display:flex;justify-content:space-between;align-items:center;border:1px solid #FFD700;}
.nft-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;margin:20px;}
.nft{background:#1a1a1a;padding:10px;border-radius:12px;text-align:center;}
.nft img{width:100%;border-radius:8px;}
button{background:#FFD700;border:none;padding:6px 8px;border-radius:6px;font-weight:bold;cursor:pointer;}
footer{background:#1a1a1a;padding:15px;display:grid;grid-template-columns:repeat(5,1fr);text-align:center;margin-top:20px;}
footer div{cursor:pointer;}
</style>
</head>
<body>

<header>
<h2>SuperNFT Dashboard</h2>
<div id="walletBalanceTop">$0</div>
</header>

<div class="stats">
<div class="stat-box">
<h4>Daily Income</h4>
<p id="dailyIncome">$0</p>
</div>
<div class="stat-box">
<h4>Live Earnings</h4>
<p id="liveEarnings">$0</p>
</div>
<div class="stat-box">
<h4>Total Deposit</h4>
<p id="depositMoney">$0</p>
</div>
<div class="stat-box">
<h4>Wallet Balance</h4>
<p id="walletBalanceP">$0</p>
</div>
</div>

<div class="nft-grid" id="nfts"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
authDomain:"supernft-5b952.firebaseapp.com",
projectId:"supernft-5b952"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

onAuthStateChanged(auth, async (user)=>{
if(!user){window.location.href="login.html";return;}

const userRef=doc(db,"users",user.uid);
let snap=await getDoc(userRef);

if(!snap.exists()){
await setDoc(userRef,{
walletBalance:0,
dailyIncome:0,
totalDeposit:0,
lastIncomeAt:new Date()
});
snap=await getDoc(userRef);
}

setInterval(async ()=>{
const s=await getDoc(userRef);
if(!s.exists()) return;
const d=s.data();

const now=Date.now();
const last=d.lastIncomeAt?.toMillis?.()||now;
const seconds=Math.floor((now-last)/1000);

const daily=d.dailyIncome||0;
const live=(daily/86400)*seconds;

document.getElementById("dailyIncome").innerText="$"+daily.toFixed(2);
document.getElementById("liveEarnings").innerText="$"+live.toFixed(6);
document.getElementById("walletBalanceP").innerText="$"+((d.walletBalance||0)+live).toFixed(2);
document.getElementById("walletBalanceTop").innerText="$"+((d.walletBalance||0)+live).toFixed(2);
document.getElementById("depositMoney").innerText="$"+(d.totalDeposit||0);

},1000);

});

/* 30 NFTs with images */
const NFTS=[
{price:10,p:0.2,img:"/images/IMG_0458.png"},
{price:15,p:0.3,img:"/images/IMG_0459.png"},
{price:20,p:0.4,img:"/images/IMG_0460.png"},

{price:75,p:1.88,img:"/images/IMG_0471.png"},
{price:80,p:2,img:"/images/IMG_0472.png"},
{price:90,p:2.25,img:"/images/IMG_0473.png"},

{price:999,p:100,img:"/images/IMG_0503.png"}
];

const container=document.getElementById("nfts");

NFTS.forEach((n,i)=>{
container.innerHTML+=`
<div class="nft">
<img src="${n.img}">
<p>Price $${n.price}</p>
<p>Daily $${n.p}</p>
</div>
`;
});
</script>

</body>
</html>
