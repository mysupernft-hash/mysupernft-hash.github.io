<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard | SuperNFT</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#0b0b0b;
  color:#FFD700;
}
header{
  background:#111;
  padding:15px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
  border-bottom:1px solid #222;
}
.balance{
  text-align:center;
  padding:15px;
  font-size:18px;
}
.nft-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:15px;
  padding:15px;
}
.nft-card{
  background:#141414;
  border-radius:14px;
  padding:10px;
  box-shadow:0 0 10px rgba(255,215,0,0.1);
}
.nft-card img{
  width:100%;
  border-radius:10px;
}
.nft-card h4{
  margin:8px 0 4px;
  font-size:14px;
}
.nft-card p{
  margin:0;
  font-size:12px;
  color:#d4af37;
}
.nft-card button{
  width:100%;
  margin-top:8px;
  padding:8px;
  border:none;
  border-radius:20px;
  background:#FFD700;
  color:#000;
  font-weight:bold;
  cursor:pointer;
}
footer{
  position:fixed;
  bottom:0;
  width:100%;
  background:#111;
  display:flex;
  justify-content:space-around;
  padding:10px 0;
  border-top:1px solid #222;
}
footer div{
  font-size:13px;
  cursor:pointer;
}
</style>
</head>

<body>

<header>🚀 SuperNFT Dashboard</header>

<div class="balance">
Wallet Balance: <b>$<span id="wallet">0</span></b>
</div>

<!-- NFT GRID -->
<div class="nft-grid" id="nftGrid"></div>

<footer>
  <div onclick="location.href='dashboard.html'">🏠 Home</div>
  <div onclick="location.href='my-investments.html'">💼 My Investments</div>
  <div onclick="location.href='profile.html'">👤 Profile</div>
</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain: "supernft-5b952.firebaseapp.com",
  projectId: "supernft-5b952"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const nftGrid = document.getElementById("nftGrid");
const walletEl = document.getElementById("wallet");

/* 🔐 AUTH */
onAuthStateChanged(auth, async(user)=>{
  if(!user){
    location.href="login.html";
    return;
  }

  const snap = await getDoc(doc(db,"users",user.uid));
  if(snap.exists()){
    walletEl.innerText = snap.data().walletBalance || 0;
  }

  loadNFTs();
});

/* 🖼️ 30 NFTs DATA */
function loadNFTs(){
  nftGrid.innerHTML = "";
  for(let i=1;i<=30;i++){
    nftGrid.innerHTML += `
      <div class="nft-card">
        <img src="https://picsum.photos/300/300?random=${i}"
             onclick="event.stopPropagation(); openNFT(${i})">

        <h4>SuperNFT #${i}</h4>
        <p>Price: $${i}</p>

        <button onclick="event.stopPropagation(); buyNFT(${i})">
          Buy NFT
        </button>
      </div>
    `;
  }
}

/* ❌ BUG FIXED: My Investment auto open band */
window.openNFT = function(id){
  location.href = "nft-details.html?id=" + id;
}

window.buyNFT = function(price){
  alert("NFT Buy Clicked | Price $" + price);
}
</script>

</body>
</html>
