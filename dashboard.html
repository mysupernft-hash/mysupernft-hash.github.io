/* Firebase Auth + REAL TIME MINING SYSTEM */
onAuthStateChanged(auth, async (user) => {

  if(!user){
    window.location.replace("login.html");
    return;
  }

  // 🔥 Show Name Instead of Email

  // Admin preview mode
let previewUID = localStorage.getItem("adminPreviewUID");

const userRef = doc(db,"users", previewUID ? previewUID : user.uid);
  const snap = await getDoc(userRef);

  if(!snap.exists()) return;

  const data = snap.data();

  // ✅ SHOW NAME (NOT EMAIL)
document.getElementById("userEmail").textContent =
  data.name || user.displayName || user.email.split("@")[0];

  const totalDeposit = data.totalDeposit || 0;

// ✅ Dashboard Total Deposit Update
document.querySelector("#depositMoney p").innerText =
  "$" + totalDeposit.toFixed(2);

  // ✅ VERIFIED CHECK
if(data.verified === true){
  document.getElementById("verifiedTick").style.display = "inline-flex";
} else {
  document.getElementById("verifiedTick").style.display = "none";
}

  let wallet = data.walletBalance || 0;

// ❌ Deposit se pehle wallet aur mining band
if(totalDeposit <= 0){

wallet = 0;

document.getElementById("dailyIncome").innerText = "$0.00";
document.getElementById("liveEarnings").innerText = "$0.00";

document.getElementById("walletBalanceP").innerText = "$0.00";
document.getElementById("walletBalanceTop").innerText = "$0.00";

return;

}

// 🔥 SAME FORMULA as daily.html
let dailyIncome = data.dailyIncome || (wallet * 0.025);

  // ⏳ First time setup
  if(!data.lastIncomeAt){
    await updateDoc(userRef,{
      lastIncomeAt:new Date()
    });
    return;
  }

  let lastIncomeAt = data.lastIncomeAt.toMillis();

  // Referral Code
  document.getElementById("referralCode").innerText =
    "Referral: " + (data.referralCode || "N/A");

  function updateMining(){

    const now = Date.now();
    const seconds = Math.floor((now - lastIncomeAt)/1000);

    const perSecond = dailyIncome / 86400;
    const live = perSecond * seconds;

    // 🔥 24h Complete → Credit Wallet
    if(seconds >= 86400){

      wallet += dailyIncome;

      updateDoc(userRef,{
        walletBalance: wallet,
        lastIncomeAt: new Date()
      });

      lastIncomeAt = Date.now();
      return;
    }

    // 🖥 Update UI

    document.getElementById("dailyIncome").innerText =
      "$" + dailyIncome.toFixed(2);

    document.getElementById("liveEarnings").innerText =
      "$" + live.toFixed(6);

    document.getElementById("walletBalanceP").innerText =
      "$" + (wallet + live).toFixed(2);

    document.getElementById("walletBalanceTop").innerText =
      "$" + (wallet + live).toFixed(2);
  }

  updateMining();
  setInterval(updateMining,1000);

});
