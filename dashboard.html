<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SuperNFT Dashboard</title>

<style>
body{margin:0;font-family:Arial;background:#0f0f0f;color:#FFD700;overflow-x:hidden;}
header{position:sticky;top:0;background:#111;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222;}
.menu-toggle{font-size:26px;cursor:pointer;transition:.3s;}
.menu-toggle:hover{transform:scale(1.1);}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:15px;margin:20px;}
.stat-box{background:#1a1a1a;padding:15px;border-radius:12px;text-align:center;cursor:pointer;transition:.3s;}
.stat-box:hover{background:#222;}
#referralBox{margin:20px;background:#1a1a1a;padding:12px;border-radius:10px;display:flex;justify-content:space-between;align-items:center;border:1px solid #FFD700;}
.filter-buttons{margin:20px;}
.filter-buttons button{margin-right:6px;margin-bottom:6px;}
.nft-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;margin:20px;}
.nft{background:#1a1a1a;padding:10px;border-radius:12px;text-align:center;transition:.3s;}
.nft:hover{transform:scale(1.03);}
.nft img{width:100%;border-radius:8px;cursor:pointer;}
button{background:#FFD700;border:none;padding:6px 10px;border-radius:6px;font-weight:bold;cursor:pointer;}
footer{background:#111;padding:15px;display:grid;grid-template-columns:repeat(5,1fr);text-align:center;margin-top:20px;border-top:1px solid #222;}
footer div{cursor:pointer;}

/* PREMIUM SIDEBAR */
#sidebar{
position:fixed;top:0;left:-280px;width:280px;height:100vh;
background:linear-gradient(180deg,#111,#0a0a0a);
padding:25px 20px;transition:.35s cubic-bezier(.77,0,.18,1);
z-index:1000;overflow-y:auto;box-shadow:5px 0 25px rgba(0,0,0,.8);
border-right:1px solid #222;
}
#sidebar.active{left:0;}
#sidebar h2{text-align:center;margin-bottom:25px;}
#sidebar button{
width:100%;background:none;border:none;color:#FFD700;
padding:12px;margin-bottom:8px;text-align:left;
border-radius:8px;transition:.25s;display:flex;gap:10px;
}
#sidebar button:hover{
background:#1c1c1c;
box-shadow:0 0 12px rgba(255,215,0,.4);
transform:translateX(5px);
}
#overlay{
position:fixed;top:0;left:0;width:100%;height:100%;
background:rgba(0,0,0,.7);backdrop-filter:blur(4px);
display:none;z-index:999;
}
#overlay.active{display:block;}
</style>
</head>
<body>

<div id="overlay"></div>

<header>
<span class="menu-toggle">&#9776;</span>
<h3>SuperNFT Dashboard</h3>
<div id="walletBalanceTop">$0</div>
</header>

<!-- SIDEBAR -->
<div id="sidebar">
<h2>SuperNFT</h2>
<button onclick="openPage('account')">👤 My Account</button>
<button onclick="openPage('my-referrals')">💹 My Referrals</button>
<button onclick="openPage('use-referral')">🎁 Use Referral</button>
<button onclick="openPage('trading')">📊 Trading</button>
<button onclick="openPage('my-investments')">📁 Investments</button>
<button onclick="openPage('wallet')">💳 Wallet</button>
<button onclick="openPage('withdraw')">💸 Withdraw</button>
<button onclick="openPage('live-earnings')">💹 Live Earnings</button>
<button onclick="openPage('deposit')">💰 Deposit</button>
<button onclick="openPage('my-team')">👥 My Team</button>
<button onclick="openPage('my-level')">📊 My Level</button>
<button onclick="openPage('calculator')">📈 Calculator</button>
<button onclick="openPage('settings')">⚙️ Settings</button>
<hr style="border-color:#222;margin:18px 0;">
<button onclick="location.href='logout.html'">🔒 Logout</button>
</div>

<!-- STATS -->
<div class="stats">
<div class="stat-box" onclick="openPage('live-earnings')">
<h4>Daily Income</h4>
<p id="dailyIncome">$0</p>
</div>
<div class="stat-box" onclick="openPage('live-earnings')">
<h4>Live Earnings</h4>
<p id="liveEarnings">$0</p>
</div>
<div class="stat-box">
<h4>Total Deposit</h4>
<p id="depositMoney">$0</p>
</div>
<div class="stat-box" onclick="openPage('wallet')">
<h4>Wallet Balance</h4>
<p id="walletBalanceP">$0</p>
</div>
</div>

<div id="referralBox">
<span id="referralCode">Referral: N/A</span>
<button onclick="copyReferral()">Copy</button>
</div>

<div class="filter-buttons">
<button onclick="filterNFT('all')">All</button>
<button onclick="filterNFT('starter')">Starter</button>
<button onclick="filterNFT('rising')">Rising</button>
<button onclick="filterNFT('elite')">Elite</button>
<button onclick="filterNFT('legendary')">Legendary</button>
</div>

<div class="nft-grid" id="nfts"></div>

<footer>
<div onclick="openPage('my-investments')">📁 Investments</div>
<div onclick="openPage('wallet')">💳 Wallet</div>
<div onclick="openPage('withdraw')">💸 Withdraw</div>
<div onclick="openPage('live-earnings')">💹 Live</div>
<div onclick="openPage('account')">👤 Account</div>
</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
authDomain:"supernft-5b952.firebaseapp.com",
projectId:"supernft-5b952"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

let miningStarted=false;

onAuthStateChanged(auth, async (user)=>{
if(!user){window.location.href="login.html";return;}
const userRef=doc(db,"users",user.uid);
let snap=await getDoc(userRef);

if(!snap.exists()){
await setDoc(userRef,{
walletBalance:0,
dailyIncome:0,
totalDeposit:0,
referralCode:"SNFT"+Math.floor(100000+Math.random()*900000),
lastIncomeAt:new Date()
});
snap=await getDoc(userRef);
}

if(!miningStarted){
miningStarted=true;
setInterval(async ()=>{
const s=await getDoc(userRef);
if(!s.exists()) return;
const d=s.data();

const now=Date.now();
const last=d.lastIncomeAt?.toMillis?.()||now;
const seconds=Math.floor((now-last)/1000);

const daily=d.dailyIncome||0;
const live=(daily/86400)*seconds;

if(seconds>=86400){
await updateDoc(userRef,{
walletBalance:(d.walletBalance||0)+daily,
lastIncomeAt:new Date()
});
return;
}

document.getElementById("dailyIncome").innerText="$"+daily.toFixed(2);
document.getElementById("liveEarnings").innerText="$"+live.toFixed(6);
document.getElementById("walletBalanceP").innerText="$"+((d.walletBalance||0)+live).toFixed(2);
document.getElementById("walletBalanceTop").innerText="$"+((d.walletBalance||0)+live).toFixed(2);
document.getElementById("depositMoney").innerText="$"+(d.totalDeposit||0);
document.getElementById("referralCode").innerText="Referral: "+d.referralCode;

},1000);
}
});

/* SIDEBAR */
const sidebar=document.getElementById("sidebar");
const overlay=document.getElementById("overlay");
document.querySelector(".menu-toggle").onclick=()=>{
sidebar.classList.toggle("active");
overlay.classList.toggle("active");
};
overlay.onclick=()=>{
sidebar.classList.remove("active");
overlay.classList.remove("active");
};

window.openPage=function(page){window.location.href=page+".html";};

window.copyReferral=function(){
const text=document.getElementById("referralCode").innerText.split(" ")[1];
navigator.clipboard.writeText(text);
alert("Referral Copied!");
};

/* NFT DATA */
const NFTS=[
{cat:"starter",price:10,p:0.2,img:"/images/IMG_0458.png"},

{cat:"legendary",price:899,p:45,img:"/images/IMG_0499.png"},
{cat:"legendary",price:999,p:100,img:"/images/IMG_0503.png"}
];

const container=document.getElementById("nfts");

function renderNFT(list){
container.innerHTML="";
list.forEach((n,i)=>{
container.innerHTML+=`
<div class="nft">
<img src="${n.img}" onclick="location.href='nft-details.html?id=${i}'">
<p>Price $${n.price}</p>
<p>Daily $${n.p}</p>
<button onclick="location.href='nft-details.html?id=${i}'">Buy NFT</button>
</div>`;
});
}

renderNFT(NFTS);

window.filterNFT=function(cat){
if(cat==="all"){renderNFT(NFTS);return;}
renderNFT(NFTS.filter(n=>n.cat===cat));
};
</script>

</body>
</html>
