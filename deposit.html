<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deposit Funds | SuperNFT</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0d0d0d;
  color:#FFD700;
  display:flex;
  flex-direction:column;
  min-height:100vh;
}
header{
  background:#111;
  padding:15px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
}
.main{flex:1;padding:20px;text-align:center;}
.card{
  background:#1a1a1a;
  padding:15px;
  border-radius:10px;
  margin-bottom:20px;
}
.qr-img{width:220px;margin:10px auto;display:block;}
.wallet{
  background:#000;
  padding:10px;
  border-radius:6px;
  word-break:break-all;
  margin:10px 0;
}
button{
  padding:10px 15px;
  border:none;
  border-radius:6px;
  background:#FFD700;
  color:#000;
  font-weight:bold;
  cursor:pointer;
}
button:hover{background:#e6c200;}
input{
  width:100%;
  padding:10px;
  border-radius:6px;
  border:none;
  margin-top:8px;
}
footer{
  display:flex;
  justify-content:space-around;
  background:#1a1a1a;
  padding:12px 0;
}
</style>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

</head>
<body>

<header>Deposit Funds</header>

<div class="main">

<div class="card">
<h3>Send Payment</h3>

<img src="images/IMG_0757.jpeg" class="qr-img">

<div class="wallet" id="wallet">
0xaf984e5d8be77dda62cd0cd89107d1a3b1b1038a
</div>

<button onclick="copyWallet()">Copy Address</button>
</div>

<div class="card">
<h3>Submit Deposit</h3>

<input type="number" id="amount" placeholder="Amount ($)">
<input type="text" id="txid" placeholder="Transaction ID">

<button onclick="makeDeposit()">Submit</button>

<h3>Total Deposit: $<span id="balance">0</span></h3>
</div>

</div>

<footer>
<div onclick="location.href='dashboard.html'">Dashboard</div>
<div onclick="location.href='wallet.html'">Wallet</div>
<div onclick="location.href='withdraw.html'">Withdraw</div>
</footer>

<script>

firebase.initializeApp({
apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
authDomain:"supernft-5b952.firebaseapp.com",
projectId:"supernft-5b952"
});

const auth = firebase.auth();
const db = firebase.firestore();

let currentUser;

/* AUTH */
auth.onAuthStateChanged(user=>{
if(!user) location.href="login.html";
else{
currentUser=user;
loadBalance();
}
});

/* COPY */
function copyWallet(){
navigator.clipboard.writeText(document.getElementById("wallet").innerText);
alert("Copied!");
}

/* LOAD BALANCE */
function loadBalance(){
db.collection("users").doc(currentUser.uid)
.onSnapshot(doc=>{
if(!doc.exists) return;
document.getElementById("balance").innerText =
(doc.data().totalDeposit||0).toFixed(2);
});
}

/* CREATE REQUEST */
function makeDeposit(){

const amount = parseFloat(document.getElementById("amount").value);
const txid = document.getElementById("txid").value;

if(!amount || amount<=0){
alert("Enter valid amount");
return;
}
if(!txid){
alert("Enter TXID");
return;
}

db.collection("depositRequests").add({
userId: currentUser.uid,
email: currentUser.email,
amount: amount,
txid: txid,
status: "pending",
referralPaid: false,
createdAt: firebase.firestore.FieldValue.serverTimestamp()
});

alert("Request Sent");

document.getElementById("amount").value="";
document.getElementById("txid").value="";
}

/* ========================================= */
/* 🔥 ADMIN APPROVE FUNCTION (IMPORTANT) */
/* ========================================= */

async function approveDeposit(requestId){

const reqRef = db.collection("depositRequests").doc(requestId);
const reqSnap = await reqRef.get();

if(!reqSnap.exists) return alert("No request");

const req = reqSnap.data();

if(req.status==="approved"){
alert("Already approved");
return;
}

const userRef = db.collection("users").doc(req.userId);
const userSnap = await userRef.get();

const user = userSnap.data();

let wallet = user.walletBalance || 0;
let deposit = user.totalDeposit || 0;

/* ✅ ADD DEPOSIT */
wallet += req.amount;
deposit += req.amount;

await userRef.update({
walletBalance: wallet,
totalDeposit: deposit
});

/* 🔥 3 LEVEL REFERRAL */

let level1 = user.referredByUid;

// LEVEL 1 (20%)
if(level1){

const ref1Ref = db.collection("users").doc(level1);
const ref1Snap = await ref1Ref.get();

if(ref1Snap.exists){

let bonus1 = req.amount * 0.20;

await ref1Ref.update({
walletBalance: firebase.firestore.FieldValue.increment(bonus1),
referralEarnings: firebase.firestore.FieldValue.increment(bonus1)
});

let level2 = ref1Snap.data().referredByUid;

// LEVEL 2 (15%)
if(level2){

const ref2Ref = db.collection("users").doc(level2);
const ref2Snap = await ref2Ref.get();

if(ref2Snap.exists){

let bonus2 = req.amount * 0.15;

await ref2Ref.update({
walletBalance: firebase.firestore.FieldValue.increment(bonus2),
referralEarnings: firebase.firestore.FieldValue.increment(bonus2)
});

let level3 = ref2Snap.data().referredByUid;

// LEVEL 3 (10%)
if(level3){

const ref3Ref = db.collection("users").doc(level3);
const ref3Snap = await ref3Ref.get();

if(ref3Snap.exists){

let bonus3 = req.amount * 0.10;

await ref3Ref.update({
walletBalance: firebase.firestore.FieldValue.increment(bonus3),
referralEarnings: firebase.firestore.FieldValue.increment(bonus3)
});

}
}
}
}
}
}

/* ✅ MARK APPROVED */
await reqRef.update({
status:"approved",
referralPaid:true
});

alert("✅ Deposit Approved + 3 Level Income Given");

}

</script>

  <script type="module">

/* Firebase Config */
const firebaseConfig = {
  apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain:"supernft-5b952.firebaseapp.com",
  projectId:"supernft-5b952"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

/* 🔒 PROTECTION */
onAuthStateChanged(auth,(user)=>{
  if(!user){
    // ❌ Not logged in → redirect
    window.location.replace("login.html");
  }

</script>

</body>
</html>
