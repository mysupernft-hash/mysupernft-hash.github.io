<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deposit | SuperNFT</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f0f0f;
  color:#FFD700;
}

header{
  background:#1a1a1a;
  padding:15px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
}

.container{
  padding:20px;
}

.card{
  background:#1a1a1a;
  padding:15px;
  border-radius:12px;
  margin-bottom:15px;
}

.balance{
  font-size:24px;
  font-weight:bold;
}

input, select{
  width:100%;
  padding:12px;
  border:none;
  border-radius:8px;
  background:#272727;
  color:#FFD700;
  margin-top:10px;
}

button{
  width:100%;
  padding:12px;
  margin-top:15px;
  border:none;
  border-radius:8px;
  background:#FFD700;
  color:#000;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#e6c200;
}

.status{
  margin-top:10px;
  font-size:14px;
}

.history-card{
  background:#111;
  padding:10px;
  border-radius:10px;
  margin-top:10px;
  font-size:13px;
}

.pending{color:orange}
.approved{color:#00ff00}
.rejected{color:red}

.back{
  display:block;
  text-align:center;
  margin-top:20px;
  padding:10px;
  background:#272727;
  border-radius:8px;
  text-decoration:none;
  color:#FFD700;
}
</style>
</head>

<body>

<header>💰 Deposit Funds</header>

<div class="container">

<!-- WALLET BALANCE -->
<div class="card">
  Available Balance
  <div class="balance">$<span id="walletBalance">0.00</span></div>
</div>

<!-- DEPOSIT FORM -->
<div class="card">
  <div>Deposit Amount</div>
  <input type="number" id="amount" placeholder="Enter amount">

  <div>Transaction ID (TXID)</div>
  <input type="text" id="txid" placeholder="Enter blockchain txid">

  <button onclick="makeDeposit()">Submit Deposit</button>

  <div class="status" id="status"></div>
</div>

<!-- HISTORY -->
<div class="card">
  <h3>Deposit History</h3>
  <div id="history">Loading...</div>
</div>

<a href="dashboard.html" class="back">⬅ Back to Dashboard</a>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, doc, getDoc, updateDoc,
  collection, addDoc, serverTimestamp,
  query, where, orderBy, onSnapshot, getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain:"supernft-5b952.firebaseapp.com",
  projectId:"supernft-5b952"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

let currentUser=null;
let walletAmount=0;

/* AUTH + REALTIME WALLET */
onAuthStateChanged(auth,(user)=>{

  if(!user){
    window.location.replace("login.html");
    return;
  }

  currentUser=user;
  const userRef=doc(db,"users",user.uid);

  onSnapshot(userRef,(snap)=>{
    if(!snap.exists()) return;

    const data=snap.data();
    walletAmount=data.walletBalance||0;

    document.getElementById("walletBalance").innerText=
      walletAmount.toFixed(2);
  });

  loadHistory();
});

/* MAKE DEPOSIT */
window.makeDeposit=async function(){

  const status=document.getElementById("status");
  const amount=Number(document.getElementById("amount").value);
  const txid=document.getElementById("txid").value.trim();

  if(!amount||amount<=0){
    status.innerText="Enter valid amount";
    return;
  }

  if(amount<10){
    status.innerText="Minimum deposit is $10";
    return;
  }

  if(!txid || txid.length<6){
    status.innerText="Enter valid TXID";
    return;
  }

  status.innerText="Checking TXID...";

  // 🔒 Duplicate TXID Protection
  const checkQuery=query(
    collection(db,"depositRequests"),
    where("txid","==",txid)
  );

  const existing=await getDocs(checkQuery);

  if(!existing.empty){
    status.innerText="This TXID already used";
    return;
  }

  status.innerText="Submitting deposit request...";

  try{

    await addDoc(collection(db,"depositRequests"),{
      uid:currentUser.uid,
      email:currentUser.email,
      amount:amount,
      txid:txid,
      status:"pending",
      createdAt:serverTimestamp()
    });

    status.innerText=
      "✅ Deposit submitted. Waiting for admin approval.";

    document.getElementById("amount").value="";
    document.getElementById("txid").value="";

  }catch(err){
    status.innerText="Deposit failed";
  }
};

/* LOAD HISTORY */
function loadHistory(){

  const q=query(
    collection(db,"depositRequests"),
    where("uid","==",currentUser.uid),
    orderBy("createdAt","desc")
  );

  onSnapshot(q,(snapshot)=>{

    let html="";

    snapshot.forEach(doc=>{

      const d=doc.data();
      let statusClass="pending";

      if(d.status==="approved") statusClass="approved";
      if(d.status==="rejected") statusClass="rejected";

      let time="";
      if(d.createdAt?.seconds){
        const date=new Date(d.createdAt.seconds*1000);
        time=date.toLocaleString();
      }

      html+=`
      <div class="history-card">
        <div><b>ID:</b> ${doc.id}</div>
        <div><b>Amount:</b> $${d.amount}</div>
        <div><b>TXID:</b> ${d.txid}</div>
        <div><b>Date:</b> ${time}</div>
        <div>
          <b>Status:</b>
          <span class="${statusClass}">
            ${d.status}
          </span>
        </div>
      </div>
      `;
    });

    document.getElementById("history").innerHTML=
      html || "No deposit history found";

  });
}

</script>
</body>
</html>
