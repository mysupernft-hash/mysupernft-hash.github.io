<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deposit Funds | SuperNFT</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0d0d0d;
  color:#FFD700;
  display:flex;
  flex-direction:column;
  min-height:100vh;
}

header{
  background:#111;
  padding:15px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
}

.main{
  flex:1;
  padding:20px;
  text-align:center;
}

.card{
  background:#1a1a1a;
  padding:15px;
  border-radius:10px;
  margin-bottom:20px;
}

.qr-img{
  width:220px;
  margin:10px auto;
  display:block;
}

.wallet{
  background:#000;
  padding:10px;
  border-radius:6px;
  word-break:break-all;
  margin:10px 0;
}

button{
  padding:10px 15px;
  border:none;
  border-radius:6px;
  background:#FFD700;
  color:#000;
  font-weight:bold;
  cursor:pointer;
}

button:hover{background:#e6c200;}

input{
  width:100%;
  padding:10px;
  border-radius:6px;
  border:none;
  margin-top:8px;
}

footer{
  display:flex;
  justify-content:space-around;
  background:#1a1a1a;
  padding:12px 0;
  flex-wrap:wrap;
}

footer div{
  cursor:pointer;
}

footer div:hover{
  color:#fff;
}
</style>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

</head>
<body>

<header>Deposit Funds</header>

<div class="main">

<div class="card">
<h3>Send Payment to Binance Wallet</h3>

<img src="images/binance-qr.png" class="qr-img">

<div class="wallet" id="wallet">
0xYOUR_BINANCE_WALLET_ADDRESS
</div>

<button onclick="copyWallet()">Copy Wallet Address</button>
</div>

<div class="card">
<h3>Submit Deposit Request</h3>

<input type="number" id="depositAmount" placeholder="Enter amount ($)">
<input type="text" id="txid" placeholder="Transaction ID / Hash">

<button onclick="makeDeposit()">Submit Deposit</button>

<h3>Your Balance: $<span id="balance">0</span></h3>
</div>

</div>

<footer>
<div onclick="location.href='dashboard.html'">Investments</div>
<div onclick="location.href='wallet.html'">Wallet</div>
<div onclick="location.href='withdraw.html'">Withdraw</div>
<div onclick="location.href='live-earnings.html'">Earnings</div>
<div onclick="location.href='my-account.html'">Account</div>
</footer>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain: "supernft-5b952.firebaseapp.com",
  projectId: "supernft-5b952",
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

let currentUser;

auth.onAuthStateChanged(user=>{
  if(!user) location.href="signup.html";
  else{
    currentUser = user;
    loadBalance();
  }
});

function copyWallet(){
  const text = document.getElementById("wallet").innerText;
  navigator.clipboard.writeText(text);
  alert("Wallet copied!");
}

function loadBalance(){
  db.collection("users").doc(currentUser.uid).get()
  .then(doc=>{
    if(doc.exists)
      document.getElementById("balance").innerText =
        doc.data().balance || 0;
  });
}

function makeDeposit(){
  const amount = parseFloat(
    document.getElementById("depositAmount").value
  );
  const txid = document.getElementById("txid").value;

  if(!amount || amount <= 0){
    alert("Enter valid amount");
    return;
  }

  if(!txid){
    alert("Enter transaction ID");
    return;
  }

  db.collection("depositRequests").add({
    userId: currentUser.uid,
    email: currentUser.email,
    amount: amount,
    txid: txid,
    status: "pending",
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(()=>{
    alert("Deposit request sent for approval");
    document.getElementById("depositAmount").value="";
    document.getElementById("txid").value="";
  });
}
</script>

</body>
</html>
