<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SuperNFT Trading</title>

<style>
body {
    margin: 0;
    background-color: #0F0F0F;
    font-family: Arial, sans-serif;
    color: white;
    text-align: center;
}

header {
    padding: 40px 20px 10px 20px;
}

h1 {
    font-size: 38px;
    margin-bottom: 10px;
}

p {
    color: #aaaaaa;
    margin-bottom: 40px;
}

.section {
    max-width: 1200px;
    margin: auto;
    padding: 20px;
}

footer {
    margin-top: 60px;
    padding: 20px;
    color: #777;
    font-size: 14px;
}
</style>
</head>

<body>

<header>
<h1>SuperNFT Live Crypto Dashboard</h1>
<p>Track real-time cryptocurrency prices & market overview</p>
</header>

<div class="section">

<!-- ADVANCED CHART -->
<div id="tradingview_chart" style="height:600px;"></div>

<script src="https://s3.tradingview.com/tv.js"></script>
<script>
new TradingView.widget({
    "width": "100%",
    "height": 600,
    "symbol": "BINANCE:BTCUSDT",
    "interval": "D",
    "timezone": "Etc/UTC",
    "theme": "dark",
    "style": "1",
    "locale": "en",
    "enable_publishing": false,
    "allow_symbol_change": true,
    "watchlist": [
        "BINANCE:BTCUSDT",
        "BINANCE:ETHUSDT",
        "BINANCE:BNBUSDT",
        "BINANCE:SOLUSDT",
        "BINANCE:XRPUSDT",
        "BINANCE:ADAUSDT"
    ],
    "container_id": "tradingview_chart"
});
</script>

</div>

<div class="section">

<!-- MARKET OVERVIEW -->
<div class="tradingview-widget-container">
<script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-market-overview.js" async>
{
  "colorTheme": "dark",
  "dateRange": "1D",
  "showChart": true,
  "locale": "en",
  "width": "100%",
  "height": "500",
  "tabs": [
    {
      "title": "Crypto Market",
      "symbols": [
        {"s": "BINANCE:BTCUSDT", "d": "Bitcoin"},
        {"s": "BINANCE:ETHUSDT", "d": "Ethereum"},
        {"s": "BINANCE:BNBUSDT", "d": "BNB"},
        {"s": "BINANCE:SOLUSDT", "d": "Solana"},
        {"s": "BINANCE:XRPUSDT", "d": "XRP"},
        {"s": "BINANCE:ADAUSDT", "d": "Cardano"}
      ]
    }
  ]
}
</script>
</div>

</div>

<footer>
© 2026 SuperNFT Trading Dashboard |
</footer>

</body>
</html>
