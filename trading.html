<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SuperNFT Trading</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://s3.tradingview.com/tv.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f0f0f;
  color:#FFD700;
}

/* HEADER */
header{
  background:#111;
  padding:12px 15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  border-bottom:1px solid #222;
}

.brand{
  font-size:18px;
  font-weight:bold;
  color:#FFD700;
}

.symbol-section{
  display:flex;
  align-items:center;
  gap:10px;
}

#symbolName{
  font-weight:bold;
  font-size:16px;
}

#livePrice{
  color:#00ff66;
  font-weight:bold;
}

.search-box{
  padding:6px 10px;
  border-radius:6px;
  border:none;
  outline:none;
}

button{
  padding:6px 10px;
  border:none;
  border-radius:6px;
  background:#FFD700;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#e6c200;
}

/* CHART */
#chart{
  height:75vh;
}

/* WATCHLIST */
.watchlist{
  background:#111;
  padding:10px;
  display:flex;
  overflow-x:auto;
  gap:10px;
  border-top:1px solid #222;
}

.coin{
  padding:6px 12px;
  background:#1a1a1a;
  border-radius:6px;
  cursor:pointer;
  white-space:nowrap;
}

.coin:hover{
  background:#333;
}
</style>
</head>
<body>

<header>

<div>
  <div class="brand">🚀 SuperNFT Trading</div>
  <div class="symbol-section">
    <div id="symbolName">BTCUSDT</div>
    <div id="livePrice">$0.00</div>
  </div>
</div>

<div>
  <input type="text" id="searchInput" class="search-box" placeholder="Search e.g. ETHUSDT">
  <button onclick="searchSymbol()">Search</button>
</div>

</header>

<div id="chart"></div>

<!-- WATCHLIST -->
<div class="watchlist">
  <div class="coin" onclick="loadChart('BTCUSDT')">BTCUSDT</div>
  <div class="coin" onclick="loadChart('ETHUSDT')">ETHUSDT</div>
  <div class="coin" onclick="loadChart('BNBUSDT')">BNBUSDT</div>
  <div class="coin" onclick="loadChart('SOLUSDT')">SOLUSDT</div>
  <div class="coin" onclick="loadChart('XRPUSDT')">XRPUSDT</div>
  <div class="coin" onclick="loadChart('ADAUSDT')">ADAUSDT</div>
  <div class="coin" onclick="loadChart('DOGEUSDT')">DOGEUSDT</div>
</div>

<script>

let currentSymbol = "BTCUSDT";
let widget;

/* LOAD CHART */
function loadChart(symbol){

  currentSymbol = symbol.toUpperCase();
  document.getElementById("symbolName").innerText = currentSymbol;

  if(widget) widget.remove();

  widget = new TradingView.widget({
    container_id: "chart",
    autosize: true,
    symbol: "BINANCE:" + currentSymbol,
    interval: "15",
    timezone: "Etc/UTC",
    theme: "dark",
    style: "1",
    locale: "en",
    toolbar_bg: "#111",
    enable_publishing: false,
    hide_top_toolbar: false,
    hide_legend: false,
    save_image: false
  });

  loadLivePrice();
}

/* SEARCH FUNCTION */
function searchSymbol(){
  const val = document.getElementById("searchInput").value.trim();
  if(val){
    loadChart(val);
  }
}

/* LIVE PRICE */
function loadLivePrice(){

  fetch(`https://api.binance.com/api/v3/ticker/price?symbol=${currentSymbol}`)
  .then(res=>res.json())
  .then(data=>{
    const price = parseFloat(data.price).toFixed(4);
    document.getElementById("livePrice").innerText = "$"+price;
  })
  .catch(()=>{});
}

/* AUTO UPDATE PRICE */
setInterval(()=>{
  loadLivePrice();
},3000);

/* DEFAULT LOAD */
loadChart("BTCUSDT");

</script>

</body>
</html>
