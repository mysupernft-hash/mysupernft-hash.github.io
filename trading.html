<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SuperNFT Trading</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            background-color: #0F0F0F;
            font-family: Arial, sans-serif;
            color: white;
            text-align: center;
        }

        header {
            padding: 40px 20px 10px 20px;
        }

        h1 {
            font-size: 40px;
            margin-bottom: 10px;
        }

        p {
            color: #aaaaaa;
            margin-bottom: 40px;
        }

        .chart-container {
            max-width: 1200px;
            margin: auto;
            padding: 20px;
        }

        footer {
            margin-top: 50px;
            padding: 20px;
            color: #777;
            font-size: 14px;
        }
    </style>
</head>

<body>

<header>
    <h1>SuperNFT Live Crypto Trading</h1>
    <p>Track real-time cryptocurrency prices powered by TradingView</p>
</header>

<div class="chart-container">

    <!-- TradingView Widget BEGIN -->
    <div class="tradingview-widget-container">
        <div id="tradingview_chart" style="height:600px;"></div>

        <script src="https://s3.tradingview.com/tv.js"></script>
        <script>
            new TradingView.widget({
                "width": "100%",
                "height": 600,
                "symbol": "BINANCE:BTCUSDT",
                "interval": "D",
                "timezone": "Etc/UTC",
                "theme": "dark",
                "style": "1",
                "locale": "en",
                "enable_publishing": false,
                "allow_symbol_change": true,
                "container_id": "tradingview_chart"
            });
        </script>
    </div>
    <!-- TradingView Widget END -->

</div>

<footer>
    © 2026 SuperNFT. All rights reserved.
</footer>

</body>
</html>
