<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SuperNFT Trading</title>

<style>
body {
    margin: 0;
    background-color: #000000;
    font-family: Arial, sans-serif;
    color: #ffffff;
}

/* NAVBAR */
nav {
    background-color: #0a0a0a;
    padding: 18px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #d4af37;
}

nav .logo {
    font-size: 24px;
    font-weight: bold;
    color: #d4af37;
    letter-spacing: 1px;
}

nav ul {
    list-style: none;
    display: flex;
    gap: 25px;
    margin: 0;
}

nav ul li a {
    text-decoration: none;
    color: #ffffff;
    font-size: 16px;
    transition: 0.3s;
}

nav ul li a:hover {
    color: #d4af37;
}

.active {
    color: #d4af37;
    font-weight: bold;
}

/* HEADER */
header {
    text-align: center;
    padding: 60px 20px 20px 20px;
}

h1 {
    font-size: 40px;
    margin-bottom: 10px;
    color: #d4af37;
}

p {
    color: #bbbbbb;
}

/* SECTION */
.section {
    max-width: 1200px;
    margin: auto;
    padding: 20px;
}

/* FOOTER */
footer {
    margin-top: 60px;
    padding: 25px;
    text-align: center;
    color: #888;
    font-size: 14px;
    border-top: 1px solid #d4af37;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<nav>
    <div class="logo">SuperNFT</div>
    <ul>
        <li><a href="https://mysupernft-hash.github.io">Home</a></li>
        <li><a href="trading.html" class="active">Trading</a></li>
    </ul>
</nav>

<header>
<h1>SuperNFT Crypto Trading</h1>
<p>Premium Real-Time Crypto Market Dashboard</p>
</header>

<div class="section">

<!-- ADVANCED CHART -->
<div id="tradingview_chart" style="height:600px;"></div>

<script src="https://s3.tradingview.com/tv.js"></script>
<script>
new TradingView.widget({
    "width": "100%",
    "height": 600,
    "symbol": "BINANCE:BTCUSDT",
    "interval": "D",
    "timezone": "Etc/UTC",
    "theme": "dark",
    "style": "1",
    "locale": "en",
    "enable_publishing": false,
    "allow_symbol_change": true,
    "watchlist": [
        "BINANCE:BTCUSDT",
        "BINANCE:ETHUSDT",
        "BINANCE:BNBUSDT",
        "BINANCE:SOLUSDT",
        "BINANCE:XRPUSDT",
        "BINANCE:ADAUSDT"
    ],
    "container_id": "tradingview_chart"
});
</script>

</div>

<footer>
© 2026 SuperNFT | Black & Gold Edition
</footer>

</body>
</html>
