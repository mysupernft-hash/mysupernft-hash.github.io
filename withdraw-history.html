<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Withdraw History | SuperNFT</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f0f0f;
  color:#FFD700;
  padding:15px;
}

h2{
  text-align:center;
  margin-bottom:20px;
}

.card{
  background:#1a1a1a;
  padding:15px;
  border-radius:12px;
  margin-bottom:12px;
  border-left:4px solid #FFD700;
}

.title{
  font-weight:bold;
  font-size:14px;
}

.date{
  font-size:12px;
  color:#aaa;
  margin-top:3px;
}

.amount{
  font-size:18px;
  font-weight:bold;
  margin-top:8px;
}

.status{
  font-size:13px;
  margin-top:5px;
}

.status-pending{color:orange}
.status-approved{color:#00ff00}
.status-rejected{color:red}

.success-msg{
  margin-top:6px;
  color:#00ff00;
  font-size:13px;
}
</style>
</head>

<body>

<h2>💸 Withdraw History</h2>

<div id="history">Loading...</div>

<script>

firebase.initializeApp({
  apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain:"supernft-5b952.firebaseapp.com",
  projectId:"supernft-5b952"
});

const auth = firebase.auth();
const db   = firebase.firestore();

auth.onAuthStateChanged(user=>{
  if(!user){
    location.href="login.html";
    return;
  }

  db.collection("withdrawRequests")
  .where("uid","==",user.uid)
  .orderBy("createdAt","desc")
  .onSnapshot(snapshot=>{

    let html="";

    if(snapshot.empty){
      html="<div style='text-align:center;color:#aaa'>No history found</div>";
    }

    snapshot.forEach(doc=>{

      const w = doc.data();

      let statusClass="status-pending";
      if(w.status==="approved") statusClass="status-approved";
      if(w.status==="rejected") statusClass="status-rejected";

      let dateText="";
      if(w.createdAt?.seconds){
        const date=new Date(w.createdAt.seconds*1000);
        dateText=date.toLocaleString();
      }

      let successMessage="";
      if(w.status==="approved"){
        successMessage=`
        <div class="success-msg">
          ✅ ${w.amount}$ received in your Binance wallet
        </div>`;
      }

      html+=`
        <div class="card">
          <div class="title">Withdraw</div>
          <div class="date">${dateText}</div>

          <div class="amount">+${w.amount}$</div>

          <div class="status ${statusClass}">
            ${w.status.toUpperCase()}
          </div>

          ${successMessage}
        </div>
      `;
    });

    document.getElementById("history").innerHTML = html;

  });

});

</script>

</body>
</html>
