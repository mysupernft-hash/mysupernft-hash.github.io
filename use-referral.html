<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Use Referral - SuperNFT</title>

<style>
body{
margin:0;
font-family:Arial, sans-serif;
background:#0f0f0f;
color:#FFD700;
text-align:center;
}
.container{
padding:40px 20px;
}
.card{
background:#1a1a1a;
padding:25px;
border-radius:12px;
display:inline-block;
max-width:420px;
width:100%;
box-shadow:0 0 20px rgba(255,215,0,0.2);
}
.notice{
background:#111;
border:1px solid #FFD700;
border-radius:10px;
padding:15px;
margin-top:25px;
font-size:14px;
text-align:left;
}
input{
width:90%;
padding:12px;
border-radius:6px;
border:none;
margin-top:10px;
font-size:15px;
}
button{
margin-top:18px;
padding:12px 20px;
border:none;
border-radius:6px;
background:#FFD700;
color:#000;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}
button:hover{
background:#e6c200;
}
ul{
padding-left:18px;
}
.status{
margin-top:15px;
font-size:14px;
}
</style>
</head>
<body>

<div class="container">
<h2>🎁 Use Referral Code</h2>

<div class="card">

<input type="text" id="refCode" placeholder="Enter Referral Code">
<br>
<button onclick="applyReferral()">Apply Referral</button>

<div class="status" id="status"></div>

<div class="notice">
<strong>⚠️ Important Notice:</strong>
<ul>
<li>$5 bonus to both users.</li>
<li>One-time use only.</li>
<li>No self-referral allowed.</li>
<li>Instant wallet credit.</li>
<li>Fraud may lead to ban.</li>
</ul>
</div>

</div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
getFirestore, doc, getDoc,
collection, query, where, getDocs,
addDoc, serverTimestamp,
runTransaction
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
authDomain:"supernft-5b952.firebaseapp.com",
projectId:"supernft-5b952"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

let currentUser=null;

onAuthStateChanged(auth,(user)=>{
if(!user){
window.location.href="login.html";
return;
}
currentUser=user;
});

window.applyReferral = async function(){

const status=document.getElementById("status");
status.innerText="Processing...";

if(!currentUser){
status.innerText="Please wait for authentication...";
return;
}

const code=document.getElementById("refCode").value.trim();

if(!code){
status.innerText="Enter referral code";
return;
}

const myRef=doc(db,"users",currentUser.uid);
const mySnap=await getDoc(myRef);

if(!mySnap.exists()){
status.innerText="User not found";
return;
}

const myData=mySnap.data();

if(myData.referralUsed){
status.innerText="Referral already used";
return;
}

/* 🔍 FIND REFERRER */
const q=query(
collection(db,"users"),
where("referralCode","==",code)
);

const querySnap=await getDocs(q);

if(querySnap.empty){
status.innerText="Invalid referral code";
return;
}

const refDoc=querySnap.docs[0];
const refUserId=refDoc.id;

console.log("Referral saving...");
console.log("Referrer UID:", refUserId);
console.log("Saving to path:", "users/"+refUserId+"/referrals");

if(refUserId===currentUser.uid){
status.innerText="You cannot use your own code";
return;
}

const bonus=5;
const refRef=doc(db,"users",refUserId);

/* 🔥 TRANSACTION SAFE UPDATE */
try{

await runTransaction(db, async (transaction)=>{

const refSnap=await transaction.get(refRef);
const mySnapTx=await transaction.get(myRef);

if(!refSnap.exists()) throw "Referrer not found";

const refData=refSnap.data();
const myDataTx=mySnapTx.data();

if(myDataTx.referralUsed) throw "Already used";

transaction.update(refRef,{
walletBalance:(refData.walletBalance||0)+bonus,
referralEarnings:(refData.referralEarnings||0)+bonus,
referralCount:(refData.referralCount||0)+1
});

transaction.update(myRef,{
walletBalance:(myDataTx.walletBalance||0)+bonus,
referralUsed:true
});

});

/* ✅ SAVE HISTORY */
await addDoc(
collection(db,"users",refUserId,"referrals"),
{
email: myData.email || "User",
reward: bonus,
joinedAt: serverTimestamp()
}
);

status.innerText="🎉 Success! $5 Added To Both Accounts!";
setTimeout(()=>{
window.location.href="dashboard.html";
},1500);

}catch(error){
console.error(error);
status.innerText="Transaction failed. Try again.";
}

};

</script>

</body>
</html>
