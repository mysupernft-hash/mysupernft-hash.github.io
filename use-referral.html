<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Use Referral - SuperNFT</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0f0f0f;
color:#FFD700;
text-align:center;
}
.container{
padding:30px;
}
input{
width:250px;
padding:10px;
border-radius:6px;
border:none;
margin-top:15px;
}
button{
margin-top:15px;
padding:10px 20px;
border:none;
border-radius:6px;
background:#FFD700;
color:#000;
font-weight:bold;
cursor:pointer;
}
.card{
background:#1a1a1a;
padding:20px;
border-radius:12px;
display:inline-block;
margin-top:40px;
}
</style>
</head>
<body>

<div class="container">

<h2>🎁 Use Referral Code</h2>

<div class="card">
<input type="text" id="refCode" placeholder="Enter Referral Code">
<br>
<button onclick="applyReferral()">Apply Referral</button>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, updateDoc, collection, query, where, getDocs }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
authDomain:"supernft-5b952.firebaseapp.com",
projectId:"supernft-5b952"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

let currentUser=null;

/* ===============================
   AUTH READY
=================================*/

onAuthStateChanged(auth,(user)=>{

if(!user){
alert("Login required");
window.location.href="login.html";
return;
}

currentUser=user;

});

/* ===============================
   APPLY REFERRAL
=================================*/

window.applyReferral = async function(){

if(!currentUser){
alert("Please wait...");
return;
}

const code=document.getElementById("refCode").value.trim();

if(code===""){
alert("Enter referral code");
return;
}

const myRef=doc(db,"users",currentUser.uid);
const mySnap=await getDoc(myRef);

if(!mySnap.exists()){
alert("User not found");
return;
}

const myData=mySnap.data();

if(myData.referralUsed){
alert("Referral already used");
return;
}

/* 🔍 Find referrer by referralCode */

const q=query(
collection(db,"users"),
where("referralCode","==",code)
);

const querySnap=await getDocs(q);

if(querySnap.empty){
alert("Invalid referral code");
return;
}

const refDoc=querySnap.docs[0];
const refUserId=refDoc.id;

/* 🚫 Cannot use own code */
if(refUserId===currentUser.uid){
alert("You cannot use your own referral code");
return;
}

/* 💰 Update referrer earnings */
const refRef=doc(db,"users",refUserId);

const refData=refDoc.data();

await updateDoc(refRef,{
referralEarnings:(refData.referralEarnings||0)+10
});

/* ✅ Mark referral used */
await updateDoc(myRef,{
referralUsed:true
});

alert("🎉 Referral Applied Successfully!");

window.location.href="dashboard.html";

};

</script>

</body>
</html>
