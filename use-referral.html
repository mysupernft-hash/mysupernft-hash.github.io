<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Use Referral Code</title>

<style>
body{
  background:#0d0d0d;
  color:#FFD700;
  font-family:Arial;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box{
  background:#111;
  padding:25px;
  border-radius:12px;
  width:320px;
  text-align:center;
}
input,button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:6px;
  border:none;
}
button{
  background:#FFD700;
  font-weight:bold;
  cursor:pointer;
}
#msg{margin-top:15px;font-weight:bold}
</style>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>

<body>

<div class="box">
  <h3>🎁 Use Referral Code</h3>
  <input id="code" placeholder="Enter referral code">
  <button onclick="applyCode()">Apply Code</button>
  <div id="msg"></div>
</div>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain: "supernft-5b952.firebaseapp.com",
  projectId: "supernft-5b952"
});

const auth = firebase.auth();
const db = firebase.firestore();

let user;

auth.onAuthStateChanged(u=>{
  if(!u) location.href="login.html";
  user = u;
});

async function applyCode(){
  const msgBox = document.getElementById("msg");
  msgBox.innerText = "";

  try{
    const code = document.getElementById("code").value.trim().toUpperCase();
    if(!code) return;

    const userRef = db.collection("users").doc(user.uid);
    const userSnap = await userRef.get();

    if(!userSnap.exists) throw "User doc missing";

    if(userSnap.data().referralUsed === true){
      msgBox.innerText = "⚠️ Referral already used";
      return;
    }

    const refSnap = await db.collection("users")
      .where("referralCode","==",code).limit(1).get();

    if(refSnap.empty){
      msgBox.innerText = "❌ Invalid referral code";
      return;
    }

    const refDoc = refSnap.docs[0];
    if(refDoc.id === user.uid){
      msgBox.innerText = "❌ You cannot use your own code";
      return;
    }

    await db.runTransaction(async t=>{
      const refOwnerRef = db.collection("users").doc(refDoc.id);

      const u = await t.get(userRef);
      const r = await t.get(refOwnerRef);

      t.update(userRef,{
        walletBalance:(u.data().walletBalance||0)+5,
        referralUsed:true
      });

      t.update(refOwnerRef,{
        walletBalance:(r.data().walletBalance||0)+5,
        referralEarnings:(r.data().referralEarnings||0)+5
      });

      t.set(
        refOwnerRef.collection("referrals").doc(user.uid),
        {
          email:user.email,
          reward:5,
          joinedAt:firebase.firestore.FieldValue.serverTimestamp()
        }
      );
    });

    msgBox.innerText =
      "🎉 Congratulations!\n💰 $5 added to your wallet\n🚀 Enjoy SuperNFT";

  }catch(err){
    console.error(err);
    document.getElementById("msg").innerText =
      "⚠️ Something went wrong. Try again.";
  }
}
</script>

</body>
</html>
