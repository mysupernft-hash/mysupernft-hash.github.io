<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Use Referral Code | SuperNFT</title>

<style>
body{
  background:#0d0d0d;
  color:#FFD700;
  font-family:Arial;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box{
  background:#111;
  padding:25px;
  border-radius:12px;
  width:320px;
  text-align:center;
}
input,button{
  width:100%;
  padding:10px;
  margin-top:10px;
  border-radius:6px;
  border:none;
}
button{
  background:#FFD700;
  font-weight:bold;
  cursor:pointer;
}
.msg{
  margin-top:15px;
  font-size:14px;
  font-weight:bold;
}
.success{ color:#00ff99; }
.error{ color:#ff4d4d; }
</style>
</head>

<body>

<div class="box">
  <h3>🎁 Use Referral Code</h3>
  <input id="code" placeholder="Enter referral code">
  <button onclick="applyCode()">Apply Code</button>
  <div id="msg" class="msg"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, doc, getDoc, runTransaction,
  collection, query, where, getDocs, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* 🔥 Firebase */
const app = initializeApp({
  apiKey: "AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain: "supernft-5b952.firebaseapp.com",
  projectId: "supernft-5b952"
});

const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;

onAuthStateChanged(auth, u=>{
  if(!u){
    location.href = "login.html";
    return;
  }
  currentUser = u;
});

/* ✅ APPLY REFERRAL */
window.applyCode = async function(){
  const code = document.getElementById("code").value.trim().toUpperCase();
  const msg  = document.getElementById("msg");

  msg.innerHTML = "";
  msg.className = "msg";

  if(!code){
    msg.innerText = "Enter referral code";
    msg.classList.add("error");
    return;
  }

  try{
    /* 🔍 Find referral owner */
    const q = query(
      collection(db,"users"),
      where("referralCode","==",code)
    );
    const snap = await getDocs(q);

    if(snap.empty){
      msg.innerText = "❌ Invalid referral code";
      msg.classList.add("error");
      return;
    }

    const refOwnerDoc = snap.docs[0];

    if(refOwnerDoc.id === currentUser.uid){
      msg.innerText = "❌ You cannot use your own code";
      msg.classList.add("error");
      return;
    }

    await runTransaction(db, async(t)=>{
      const userRef = doc(db,"users",currentUser.uid);
      const ownerRef = doc(db,"users",refOwnerDoc.id);

      const userSnap = await t.get(userRef);
      const ownerSnap = await t.get(ownerRef);

      if(!userSnap.exists()) throw "User missing";

      if(userSnap.data().referralUsed === true){
        throw "USED";
      }

      /* 💰 User B */
      t.update(userRef,{
        walletBalance:(userSnap.data().walletBalance || 0) + 5,
        referralUsed:true,
        referredByCode:code
      });

      /* 💰 User A */
      t.update(ownerRef,{
        walletBalance:(ownerSnap.data().walletBalance || 0) + 5,
        referralEarnings:(ownerSnap.data().referralEarnings || 0) + 5
      });

      /* 📜 History for My Referrals */
      t.set(
        doc(db,"users",refOwnerDoc.id,"referrals",currentUser.uid),
        {
          email: currentUser.email,
          reward: 5,
          joinedAt: serverTimestamp()
        }
      );
    });

    msg.innerHTML = `
      🎉 <b>Congratulations!</b><br>
      💰 $5 added to your wallet<br>
      🚀 Enjoy SuperNFT rewards
    `;
    msg.classList.add("success");

  }catch(e){
    msg.innerText = "⚠️ Referral already used";
    msg.classList.add("error");
  }
};
</script>

</body>
</html>
