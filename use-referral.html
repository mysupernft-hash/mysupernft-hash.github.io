<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Referral</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{background:#0d0d0d;color:#FFD700;font-family:Arial;display:flex;justify-content:center;align-items:center;height:100vh}
.box{background:#111;padding:25px;border-radius:12px;width:320px;text-align:center}
input,button{width:100%;padding:12px;margin-top:12px;border-radius:6px;border:none}
button{background:#FFD700;font-weight:bold;cursor:pointer}
#msg{margin-top:15px}
</style>
</head>
<body>

<div class="box">
<h3>Use Referral Code</h3>
<input id="code" placeholder="Enter referral code">
<button id="applyBtn">Apply</button>
<div id="msg"></div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth,onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore,doc,getDoc,collection,addDoc,serverTimestamp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
 authDomain:"supernft-5b952.firebaseapp.com",
 projectId:"supernft-5b952"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

let user=null;

onAuthStateChanged(auth,u=>{
 if(!u) location.href="login.html";
 user=u;
});

document.getElementById("applyBtn").onclick=async()=>{

const msg=document.getElementById("msg");
msg.innerText="";

const code=document.getElementById("code").value.trim().toUpperCase();
if(!code) return msg.innerText="Enter code";

try{

const myRef=doc(db,"users",user.uid);
const mySnap=await getDoc(myRef);

if(!mySnap.exists())
 return msg.innerText="Profile not found";

if(mySnap.data().referralUsed)
 return msg.innerText="Already used referral";

/* send request instead of wallet edit */
await addDoc(collection(db,"referralRequests"),{
 uid:user.uid,
 code:code,
 time:serverTimestamp()
});

msg.innerText="Referral submitted for approval";

}catch(e){
msg.innerText=e.message;
}

};

</script>
</body>
</html>
