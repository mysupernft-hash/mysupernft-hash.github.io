<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Use Referral - SuperNFT</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0f0f0f;
color:#FFD700;
text-align:center;
}
.container{
padding:40px 20px;
}
.card{
background:#1a1a1a;
padding:25px;
border-radius:12px;
display:inline-block;
max-width:400px;
width:100%;
box-shadow:0 0 15px rgba(255,215,0,0.3);
}
.notice{
background:#111;
border:1px solid #FFD700;
border-radius:10px;
padding:15px;
margin-top:25px;
font-size:14px;
text-align:left;
}
input{
width:90%;
padding:10px;
border-radius:6px;
border:none;
margin-top:10px;
}
button{
margin-top:15px;
padding:10px 20px;
border:none;
border-radius:6px;
background:#FFD700;
color:#000;
font-weight:bold;
cursor:pointer;
}
button:hover{
background:#e6c200;
}
ul{
padding-left:18px;
}
</style>
</head>
<body>

<div class="container">

<h2>🎁 Use Referral Code</h2>

<div class="card">

<input type="text" id="refCode" placeholder="Enter Referral Code">
<br>
<button onclick="applyReferral()">Apply Referral</button>

<div class="notice">
<strong>⚠️ Important Notice:</strong>
<ul>
<li>Each referral gives <strong>$5 bonus</strong> to both users.</li>
<li>Referral code can be used <strong>only once per account</strong>.</li>
<li>You <strong>cannot use your own referral code</strong>.</li>
<li>Bonus is instantly added to wallet balance.</li>
<li>Fraud or abuse may result in account suspension.</li>
</ul>
</div>

</div>
</div>

<script type="module">

import { initializeApp } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import { getAuth, onAuthStateChanged } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import { 
getFirestore,
doc, getDoc, updateDoc,
collection, query, where,
getDocs, addDoc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* 🔹 Firebase Config */
const firebaseConfig={
apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
authDomain:"supernft-5b952.firebaseapp.com",
projectId:"supernft-5b952"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

let currentUser=null;

/* 🔹 Auth Check */
onAuthStateChanged(auth,(user)=>{
if(!user){
window.location.href="login.html";
return;
}
currentUser=user;
});

/* 🔥 APPLY REFERRAL FUNCTION */
window.applyReferral = async function(){

if(!currentUser){
alert("Please wait...");
return;
}

const code=document.getElementById("refCode").value.trim();

if(!code){
alert("Enter referral code");
return;
}

const myRef=doc(db,"users",currentUser.uid);
const mySnap=await getDoc(myRef);

if(!mySnap.exists()){
alert("User not found");
return;
}

const myData=mySnap.data();

if(myData.referralUsed){
alert("Referral already used");
return;
}

// 🔎 Find referral owner
const q=query(
collection(db,"users"),
where("referralCode","==",code)
);

const querySnap=await getDocs(q);

if(querySnap.empty){
alert("Invalid referral code");
return;
}

const refDoc=querySnap.docs[0];
const refUserId=refDoc.id;

if(refUserId===currentUser.uid){
alert("You cannot use your own referral code");
return;
}

const refRef=doc(db,"users",refUserId);
const refData=refDoc.data();

const bonus=5;

try{

// 🔥 Update Referrer
await updateDoc(refRef,{
walletBalance:(refData.walletBalance||0)+bonus,
referralEarnings:(refData.referralEarnings||0)+bonus,
referralCount:(refData.referralCount||0)+1
});

// 🔥 Update Current User
await updateDoc(myRef,{
walletBalance:(myData.walletBalance||0)+bonus,
referralUsed:true
});

// 🔥 Save Referral History
await addDoc(
collection(db,"users",refUserId,"referrals"),
{
email: myData.email || "User",
reward: bonus,
joinedAt: serverTimestamp()
}
);

alert("🎉 $5 Bonus Added To Both Accounts!");
window.location.href="dashboard.html";

}catch(error){
console.error("Referral error:",error);
alert("Something went wrong!");
}

};

</script>

</body>
</html>
