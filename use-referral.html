<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Use Referral | SuperNFT</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  background:#0d0d0d;
  color:#FFD700;
  font-family:Arial;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box{
  background:#111;
  padding:25px;
  border-radius:12px;
  width:320px;
  text-align:center;
}
input,button{
  width:100%;
  padding:12px;
  margin-top:12px;
  border-radius:6px;
  border:none;
}
button{
  background:#FFD700;
  font-weight:bold;
  cursor:pointer;
}
#msg{margin-top:15px;font-size:14px}
</style>
</head>

<body>
<div class="box">
  <h3>🎁 Use Referral Code</h3>
  <input id="code" placeholder="Enter referral code">
  <button id="applyBtn">Apply Code</button>
  <div id="msg"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, doc, getDoc, runTransaction,
  serverTimestamp, query, where, collection, getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain: "supernft-5b952.firebaseapp.com",
  projectId: "supernft-5b952"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser;

onAuthStateChanged(auth, user=>{
  if(!user){
    location.href="login.html";
    return;
  }
  currentUser = user;
});

document.getElementById("applyBtn").onclick = async () => {
  const code = document.getElementById("code").value.trim().toUpperCase();
  const msg = document.getElementById("msg");

  msg.innerText = "";

  if(!code){
    msg.innerText = "❌ Enter referral code";
    return;
  }

  try{
    const userRef = doc(db,"users",currentUser.uid);
    const userSnap = await getDoc(userRef);

    if(!userSnap.exists()){
      msg.innerText="❌ User record missing";
      return;
    }

    if(userSnap.data().referralUsed === true){
      msg.innerText="⚠️ You already used a referral code";
      return;
    }

    // find owner
    const q = query(
      collection(db,"users"),
      where("referralCode","==",code)
    );
    const snap = await getDocs(q);

    if(snap.empty){
      msg.innerText="❌ Invalid referral code";
      return;
    }

    const ownerDoc = snap.docs[0];
    if(ownerDoc.id === currentUser.uid){
      msg.innerText="❌ You cannot use your own code";
      return;
    }

    await runTransaction(db, async (t) => {
      const ownerRef = doc(db,"users",ownerDoc.id);

      const u = await t.get(userRef);
      const o = await t.get(ownerRef);

      t.update(userRef,{
        walletBalance:(u.data().walletBalance||0)+5,
        referralUsed:true,
        referredByCode:code
      });

      t.update(ownerRef,{
        walletBalance:(o.data().walletBalance||0)+5,
        referralEarnings:(o.data().referralEarnings||0)+5
      });

      t.set(
        doc(db,"users",ownerDoc.id,"referrals",currentUser.uid),
        {
          email: currentUser.email,
          reward: 5,
          joinedAt: serverTimestamp()
        }
      );
    });

    msg.innerHTML = `
      🎉 <b>Congratulations!</b><br>
      💰 $5 added to your wallet<br>
      🚀 Enjoy SuperNFT Rewards
    `;

  }catch(err){
    console.error(err);
    msg.innerText="⚠️ Something went wrong. Try again.";
  }
};
</script>
</body>
</html>
