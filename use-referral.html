<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Use Referral Code | SuperNFT</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  background:#0d0d0d;
  color:#FFD700;
  font-family:Arial, sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box{
  background:#111;
  padding:25px;
  border-radius:12px;
  width:320px;
  text-align:center;
  box-shadow:0 0 15px rgba(255,215,0,0.15);
}
input,button{
  width:100%;
  padding:12px;
  margin-top:12px;
  border-radius:6px;
  border:none;
  font-size:14px;
}
input{
  background:#1f1f1f;
  color:#FFD700;
}
button{
  background:#FFD700;
  color:#000;
  font-weight:bold;
  cursor:pointer;
}
button:hover{
  background:#e0c200;
}
#msg{
  margin-top:15px;
  font-size:14px;
}
.success{
  color:#00ff9c;
}
.error{
  color:#ff5c5c;
}
</style>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore,
  doc,
  getDoc,
  query,
  collection,
  where,
  getDocs,
  updateDoc,
  increment,
  serverTimestamp,
  setDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* 🔥 Firebase Config */
const firebaseConfig = {
  apiKey: "AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain: "supernft-5b952.firebaseapp.com",
  projectId: "supernft-5b952",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;

/* 🔐 Auth check */
onAuthStateChanged(auth, (user)=>{
  if(!user){
    window.location.href = "login.html";
    return;
  }
  currentUser = user;
});

/* 🎁 Apply Referral */
window.applyCode = async function(){
  const code = document.getElementById("code").value.trim().toUpperCase();
  const msgBox = document.getElementById("msg");
  msgBox.innerText = "";
  msgBox.className = "";

  if(!code){
    msgBox.innerText = "⚠️ Please enter referral code";
    msgBox.className = "error";
    return;
  }

  try{
    const userRef = doc(db, "users", currentUser.uid);
    const userSnap = await getDoc(userRef);

    if(!userSnap.exists()){
      throw new Error("User profile not found");
    }

    const userData = userSnap.data();

    if(userData.referralUsed === true){
      msgBox.innerText = "❌ Referral already used";
      msgBox.className = "error";
      return;
    }

    /* 🔍 Find referral owner */
    const q = query(
      collection(db,"users"),
      where("referralCode","==",code)
    );
    const snap = await getDocs(q);

    if(snap.empty){
      msgBox.innerText = "❌ Invalid referral code";
      msgBox.className = "error";
      return;
    }

    const refOwnerDoc = snap.docs[0];
    const refOwnerUid = refOwnerDoc.id;

    if(refOwnerUid === currentUser.uid){
      msgBox.innerText = "❌ You cannot use your own code";
      msgBox.className = "error";
      return;
    }

    /* 💰 Rewards */
    await updateDoc(userRef,{
      walletBalance: increment(5),
      referralUsed: true,
      referredByCode: code
    });

    await updateDoc(doc(db,"users",refOwnerUid),{
      walletBalance: increment(5),
      referralEarnings: increment(5)
    });

    /* 📌 SAVE IN MY REFERRALS */
    await setDoc(
      doc(db,"users",refOwnerUid,"referrals",currentUser.uid),
      {
        email: currentUser.email,
        joinedAt: serverTimestamp(),
        reward: 5
      }
    );

    msgBox.innerHTML = `
      🎉 <b>Congratulations!</b><br>
      💰 <b>$5 added to your wallet</b><br>
      🚀 Enjoy SuperNFT Rewards!
    `;
    msgBox.className = "success";

  }catch(err){
    console.error(err);
    msgBox.innerText = "⚠️ Something went wrong. Try again.";
    msgBox.className = "error";
  }
};
</script>
</head>

<body>

<div class="box">
  <h3>🎁 Use Referral Code</h3>
  <input id="code" placeholder="Enter referral code">
  <button onclick="applyCode()">Apply Code</button>
  <div id="msg"></div>
</div>

</body>
</html>
