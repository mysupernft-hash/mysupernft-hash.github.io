<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Use Referral | SuperNFT</title>

<style>
body{
  background:#0f0f0f;
  color:#FFD700;
  font-family:Arial,sans-serif;
}
.box{
  max-width:400px;
  margin:100px auto;
  background:#1a1a1a;
  padding:20px;
  border-radius:12px;
}
input,button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:6px;
  border:none;
}
input{
  background:#272727;
  color:#FFD700;
}
button{
  background:#FFD700;
  color:#000;
  font-weight:bold;
  cursor:pointer;
}
.msg{
  margin-top:15px;
  text-align:center;
  font-weight:bold;
}
.success{color:#00ff99;}
.error{color:#ff6666;}
</style>
</head>

<body>

<div class="box">
  <h2>Use Referral Code</h2>
  <input id="code" placeholder="Enter Referral Code">
  <button id="applyBtn">Apply Code</button>
  <div id="msg" class="msg"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore,
  collection,
  query,
  where,
  getDocs,
  doc,
  getDoc,
  updateDoc,
  setDoc,
  increment,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* 🔥 Firebase */
const firebaseConfig = {
  apiKey: "AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain: "supernft-5b952.firebaseapp.com",
  projectId: "supernft-5b952"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;

/* 🔐 Auth check */
onAuthStateChanged(auth, user => {
  if(!user){
    location.href = "login.html";
    return;
  }
  currentUser = user;
});

/* 🎯 Apply Referral */
document.getElementById("applyBtn").onclick = async () => {
  const code = document.getElementById("code").value.trim().toUpperCase();
  const msg = document.getElementById("msg");
  msg.innerText = "";

  if(!code){
    msg.innerText = "Enter referral code";
    msg.className = "msg error";
    return;
  }

  try{
    /* 🔹 Current user */
    const userRef = doc(db,"users",currentUser.uid);
    const userSnap = await getDoc(userRef);

    if(!userSnap.exists()) throw "NO_USER";

    if(userSnap.data().referralUsed === true){
      msg.innerText = "❌ You already used a referral code";
      msg.className = "msg error";
      return;
    }

    /* 🔹 Find referral owner (User A) */
    const q = query(
      collection(db,"users"),
      where("referralCode","==",code)
    );

    const qsnap = await getDocs(q);
    if(qsnap.empty) throw "INVALID";

    const ownerDoc = qsnap.docs[0];
    const ownerUid = ownerDoc.id;

    if(ownerUid === currentUser.uid) throw "SELF";

    /* 💰 Give $5 to NEW USER (B) */
    await updateDoc(userRef,{
      walletBalance: increment(5),
      referralUsed: true,
      referredByCode: code
    });

    /* 💰 Give $5 to OWNER (A) */
    await updateDoc(doc(db,"users",ownerUid),{
      walletBalance: increment(5),
      referralEarnings: increment(5)
    });

    /* 📜 Save referral history */
    await setDoc(
      doc(db,"users",ownerUid,"referrals",currentUser.uid),
      {
        email: currentUser.email,
        reward: 5,
        joinedAt: serverTimestamp()
      }
    );

    msg.innerText =
      "🎉 Congratulations!\n💰 $5 added to your wallet\n🚀 Enjoy SuperNFT Rewards!";
    msg.className = "msg success";

  }catch(e){
    console.error(e);
    msg.innerText = "⚠️ Something went wrong. Try again.";
    msg.className = "msg error";
  }
};
</script>

</body>
</html>
