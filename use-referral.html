<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Use Referral Code | SuperNFT</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  background:#0d0d0d;
  color:#FFD700;
  font-family:Arial, sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  margin:0;
}
.box{
  background:#111;
  padding:30px;
  border-radius:14px;
  width:320px;
  text-align:center;
  box-shadow:0 0 25px rgba(255,215,0,0.15);
}
h3{
  margin-bottom:15px;
}
input{
  width:100%;
  padding:12px;
  border-radius:8px;
  border:none;
  background:#222;
  color:#FFD700;
  font-size:15px;
}
button{
  width:100%;
  padding:12px;
  margin-top:15px;
  border-radius:8px;
  border:none;
  background:#FFD700;
  color:#000;
  font-weight:bold;
  cursor:pointer;
}
button:hover{
  background:#e6c200;
}
#msg{
  margin-top:15px;
  font-size:14px;
  min-height:22px;
}
.success{
  color:#00ff99;
}
.error{
  color:#ff4d4d;
}
</style>

<!-- Firebase compat (stable with your project) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>

<body>

<div class="box">
  <h3>🎁 Use Referral Code</h3>
  <input id="code" placeholder="Enter referral code">
  <button onclick="applyCode()">Apply Code</button>
  <p id="msg"></p>
</div>

<script>
/* 🔥 Firebase config */
firebase.initializeApp({
  apiKey: "AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain: "supernft-5b952.firebaseapp.com",
  projectId: "supernft-5b952"
});

const auth = firebase.auth();
const db = firebase.firestore();

let currentUser = null;

/* 🔐 Auth check */
auth.onAuthStateChanged(user=>{
  if(!user){
    showMsg("⚠️ Please login first", "error");
    setTimeout(()=>location.href="login.html",1500);
  }else{
    currentUser = user;
  }
});

/* 💬 message helper */
function showMsg(text,type){
  const el = document.getElementById("msg");
  el.className = type;
  el.innerText = text;
}

/* 🚀 Apply referral */
async function applyCode(){
  const code = document.getElementById("code").value.trim().toUpperCase();

  if(!code){
    showMsg("❌ Please enter a referral code", "error");
    return;
  }

  showMsg("⏳ Checking referral code...", "");

  try{
    const userRef = db.collection("users").doc(currentUser.uid);
    const userSnap = await userRef.get();

    if(userSnap.exists && userSnap.data().referralUsed){
      showMsg("❌ You already used a referral code", "error");
      return;
    }

    const refSnap = await db.collection("users")
      .where("referralCode","==",code).get();

    if(refSnap.empty){
      showMsg("❌ Invalid referral code", "error");
      return;
    }

    const refDoc = refSnap.docs[0];
    if(refDoc.id === currentUser.uid){
      showMsg("❌ You can’t use your own code", "error");
      return;
    }

    /* 💰 reward */
    await db.runTransaction(async(t)=>{
      const rRef = db.collection("users").doc(refDoc.id);
      const u = await t.get(userRef);
      const r = await t.get(rRef);

      t.update(userRef,{
        walletBalance:(u.data().walletBalance||0)+5,
        referralUsed:true,
        referredBy:refDoc.id
      });

      t.update(rRef,{
        walletBalance:(r.data().walletBalance||0)+5,
        referralEarnings:(r.data().referralEarnings||0)+5
      });
    });

    showMsg("🎉 Congratulations!\n💰 $5 added to your wallet", "success");

  }catch(e){
    console.error(e);
    showMsg("⚠️ Something went wrong. Try again.", "error");
  }
}
</script>

</body>
</html>
