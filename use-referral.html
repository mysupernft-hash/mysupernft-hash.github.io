<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Use Referral</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{background:#0d0d0d;color:#FFD700;font-family:Arial;
display:flex;justify-content:center;align-items:center;height:100vh}
.box{background:#111;padding:25px;border-radius:12px;width:320px;text-align:center}
input,button{width:100%;padding:12px;margin-top:12px;border-radius:6px;border:none}
button{background:#FFD700;font-weight:bold;cursor:pointer}
#msg{margin-top:15px;line-height:1.5}
</style>
</head>
<body>

<div class="box">
  <h3>🎁 Use Referral Code</h3>
  <input id="code" placeholder="Enter referral code">
  <button onclick="applyCode()">Apply Code</button>
  <div id="msg"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc, updateDoc,
  collection, query, where, getDocs, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain: "supernft-5b952.firebaseapp.com",
  projectId: "supernft-5b952"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let user=null;

onAuthStateChanged(auth,(u)=>{
  if(!u){
    location.href="login.html";
    return;
  }
  user=u;
});

window.applyCode = async ()=>{

  const msg = document.getElementById("msg");
  const code = document.getElementById("code").value.trim().toUpperCase();
  msg.innerText="";

  if(!user){
    msg.innerText="⏳ Loading user...";
    return;
  }

  if(!code){
    msg.innerText="❌ Enter code";
    return;
  }

  try{

    const userRef = doc(db,"users",user.uid);
    const userSnap = await getDoc(userRef);

    if(!userSnap.exists()){
      msg.innerText="❌ User data not found";
      return;
    }

    const userData=userSnap.data();

    if(userData.referralUsed){
      msg.innerText="⚠️ Referral already used";
      return;
    }

    // find referral owner
    const q = query(collection(db,"users"), where("referralCode","==",code));
    const qSnap = await getDocs(q);

    if(qSnap.empty){
      msg.innerText="❌ Invalid referral code";
      return;
    }

    const ownerDoc=qSnap.docs[0];

    if(ownerDoc.id===user.uid){
      msg.innerText="❌ Cannot use your own code";
      return;
    }

    const ownerRef=doc(db,"users",ownerDoc.id);
    const ownerData=ownerDoc.data();

    // update user (who applied code)
    await updateDoc(userRef,{
      walletBalance:(userData.walletBalance||0)+5,
      referralUsed:true,
      referredByCode:code
    });

    // update owner (referrer)
    await updateDoc(ownerRef,{
      walletBalance:(ownerData.walletBalance||0)+5,
      referralEarnings:(ownerData.referralEarnings||0)+5
    });

    // save referral history
    await setDoc(
      doc(db,"users",ownerDoc.id,"referrals",user.uid),
      {
        email:user.email || "",
        reward:5,
        joinedAt:serverTimestamp()
      }
    );

    msg.innerHTML=
    "🎉 <b>Success!</b><br>$5 added to both wallets";

  }catch(err){
    console.error("REFERRAL ERROR:",err);
    msg.innerText="⚠️ Error: "+err.message;
  }

};
</script>
</body>
</html>
