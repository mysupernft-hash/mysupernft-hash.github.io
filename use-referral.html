<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Use Referral | SuperNFT</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#0f0f0f;
  color:#FFD700;
}
.container{
  max-width:420px;
  margin:80px auto;
  background:#1a1a1a;
  padding:20px;
  border-radius:12px;
}
h2{text-align:center;margin-bottom:15px;}
input{
  width:100%;
  padding:12px;
  margin:10px 0;
  border:none;
  border-radius:6px;
  background:#272727;
  color:#FFD700;
}
button{
  width:100%;
  padding:12px;
  background:#FFD700;
  color:#000;
  border:none;
  border-radius:8px;
  font-weight:bold;
  font-size:16px;
  cursor:pointer;
}
button:hover{background:#e0c200;}
.msg{
  margin-top:15px;
  text-align:center;
  font-weight:bold;
}
.success{color:#00ff99;}
.error{color:#ff4d4d;}
</style>
</head>

<body>

<div class="container">
  <h2>Use Referral Code</h2>

  <input type="text" id="refCode" placeholder="Enter Referral Code (SNFTxxxxxx)">
  <button id="applyBtn">Apply Code</button>

  <div id="message" class="msg"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore,
  doc,
  getDoc,
  updateDoc,
  setDoc,
  serverTimestamp,
  increment
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* 🔥 Firebase Config */
const firebaseConfig = {
  apiKey: "AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain: "supernft-5b952.firebaseapp.com",
  projectId: "supernft-5b952",
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const msg = document.getElementById("message");
const btn = document.getElementById("applyBtn");

let currentUser = null;

onAuthStateChanged(auth, user=>{
  if(!user){
    window.location.href="login.html";
    return;
  }
  currentUser = user;
});

/* 🚀 APPLY REFERRAL */
btn.addEventListener("click", async ()=>{
  msg.innerHTML="";
  msg.className="msg";

  const code = document.getElementById("refCode").value.trim().toUpperCase();
  if(!code){
    msg.innerHTML="⚠️ Enter referral code";
    msg.classList.add("error");
    return;
  }

  try{
    const userRef = doc(db,"users",currentUser.uid);
    const userSnap = await getDoc(userRef);
    if(!userSnap.exists()) throw "User not found";

    const userData = userSnap.data();

    /* ❌ already used */
    if(userData.referralUsed === true){
      msg.innerHTML="⚠️ Referral already used";
      msg.classList.add("error");
      return;
    }

    /* 🔎 check code */
    const refSnap = await getDoc(doc(db,"referrals",code));
    if(!refSnap.exists()){
      msg.innerHTML="❌ Invalid referral code";
      msg.classList.add("error");
      return;
    }

    const ownerUid = refSnap.data().ownerUid;

    /* ❌ self referral */
    if(ownerUid === currentUser.uid){
      msg.innerHTML="❌ You cannot use your own code";
      msg.classList.add("error");
      return;
    }

    /* 💰 CREDIT USER B */
    await updateDoc(userRef,{
      walletBalance: increment(5),
      referralUsed: true,
      referredByCode: code
    });

    /* 💰 CREDIT USER A */
    await updateDoc(doc(db,"users",ownerUid),{
      walletBalance: increment(5)
    });

    /* 📜 SAVE HISTORY (My Referrals) */
    await setDoc(
      doc(db,"users",ownerUid,"referrals",currentUser.uid),
      {
        email: currentUser.email,
        reward: 5,
        joinedAt: serverTimestamp()
      }
    );

    msg.innerHTML = `
      🎉 Congratulations!<br>
      💰 $5 added to your wallet<br>
      🚀 Enjoy SuperNFT Rewards!
    `;
    msg.classList.add("success");

  }catch(err){
    console.error(err);
    msg.innerHTML="⚠️ Something went wrong. Try again.";
    msg.classList.add("error");
  }
});
</script>

</body>
</html>
