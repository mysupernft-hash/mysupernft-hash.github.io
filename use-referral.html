<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Use Referral Code | SuperNFT</title>

<style>
body{
  background:#0d0d0d;
  color:#FFD700;
  font-family:Arial;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.box{
  background:#111;
  padding:25px;
  border-radius:12px;
  width:320px;
  text-align:center;
  box-shadow:0 0 20px #000;
}

h3{margin-bottom:10px}

input{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:6px;
  border:none;
  background:#272727;
  color:#FFD700;
}

button{
  width:100%;
  padding:12px;
  margin-top:12px;
  border-radius:6px;
  border:none;
  background:#FFD700;
  color:#000;
  font-weight:bold;
  cursor:pointer;
}

button:hover{background:#e0c200}

#msg{
  margin-top:15px;
  padding:12px;
  border-radius:10px;
  display:none;
  font-weight:bold;
  line-height:1.4;
}
</style>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>

<body>

<div class="box">
  <h3>🎁 Use Referral Code</h3>
  <input id="code" placeholder="Enter referral code">
  <button onclick="applyCode()">Apply Code</button>
  <div id="msg"></div>
</div>

<script>
/* 🔥 Firebase Config */
firebase.initializeApp({
  apiKey: "AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain: "supernft-5b952.firebaseapp.com",
  projectId: "supernft-5b952"
});

const auth = firebase.auth();
const db = firebase.firestore();
let currentUser;

/* 🔐 Auth check */
auth.onAuthStateChanged(user=>{
  if(!user){
    location.href="login.html";
    return;
  }
  currentUser = user;
});

/* 💬 Message UI */
function showMessage(text, type="success"){
  const el = document.getElementById("msg");
  el.style.display = "block";
  el.innerHTML = text;

  if(type === "success"){
    el.style.background = "#00ff99";
    el.style.color = "#000";
    el.style.boxShadow = "0 0 15px #00ff99";
  }else{
    el.style.background = "#ff4444";
    el.style.color = "#fff";
    el.style.boxShadow = "0 0 15px #ff4444";
  }
}

/* 🎯 Apply Referral */
async function applyCode(){
  const code = document.getElementById("code").value.trim().toUpperCase();
  if(!code){
    showMessage("⚠️ Please enter a referral code", "error");
    return;
  }

  const userRef = db.collection("users").doc(currentUser.uid);
  const userDoc = await userRef.get();

  if(userDoc.data().referralUsed){
    showMessage("⚠️ Referral already used. You can use only once.", "error");
    return;
  }

  // 🔍 Find referrer
  const snap = await db.collection("users")
    .where("referralCode","==",code)
    .get();

  if(snap.empty){
    showMessage("❌ Invalid referral code. Try again.", "error");
    return;
  }

  const referrerDoc = snap.docs[0];
  if(referrerDoc.id === currentUser.uid){
    showMessage("❌ You cannot use your own referral code.", "error");
    return;
  }

  // 💰 Transaction
  await db.runTransaction(async t=>{
    const referrerRef = db.collection("users").doc(referrerDoc.id);

    const u = await t.get(userRef);
    const r = await t.get(referrerRef);

    t.update(userRef,{
      walletBalance:(u.data().walletBalance||0) + 5,
      referralUsed:true,
      referredBy:referrerDoc.id
    });

    t.update(referrerRef,{
      walletBalance:(r.data().walletBalance||0) + 5,
      referralEarnings:(r.data().referralEarnings||0) + 5
    });
  });

  showMessage(
    "🎉 <b>Congratulations!</b><br>" +
    "Referral code applied successfully 🚀<br>" +
    "<span style='font-size:15px'>💰 <b>$5 added to your wallet</b></span>",
    "success"
  );
}
</script>

</body>
</html>
