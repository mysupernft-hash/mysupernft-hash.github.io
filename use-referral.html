<!DOCTYPE html>
<html>
<head>
<title>Use Referral | SuperNFT</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{
  background:#0b0b0b;
  color:#FFD700;
  font-family:Arial;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.card{
  background:#121212;
  padding:28px;
  width:320px;
  border-radius:14px;
  text-align:center;
}
input{
  width:100%;
  padding:12px;
  background:#222;
  border:none;
  border-radius:8px;
  color:#FFD700;
}
button{
  width:100%;
  padding:12px;
  margin-top:14px;
  background:#FFD700;
  border:none;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}
#msg{margin-top:14px;font-size:14px;}
.success{color:#00ff99}
.error{color:#ff4d4d}
</style>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>

<body>

<div class="card">
<h3>🎁 Use Referral Code</h3>
<input id="code" placeholder="Enter referral code">
<button onclick="apply()">Apply Code</button>
<div id="msg"></div>
</div>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain: "supernft-5b952.firebaseapp.com",
  projectId: "supernft-5b952"
});

const auth=firebase.auth();
const db=firebase.firestore();
let me=null;

auth.onAuthStateChanged(u=>{
  if(!u) location.href="login.html";
  else me=u;
});

function show(t,c){
  const m=document.getElementById("msg");
  m.className=c;
  m.innerText=t;
}

async function apply(){
  const code=document.getElementById("code").value.trim().toUpperCase();
  if(!code) return show("❌ Enter referral code","error");

  try{
    const myRef=db.collection("users").doc(me.uid);
    const mySnap=await myRef.get();

    if(mySnap.data().referralUsed)
      return show("❌ Referral already used","error");

    const q=await db.collection("users")
      .where("referralCode","==",code).get();

    if(q.empty)
      return show("❌ Invalid referral code","error");

    const owner=q.docs[0];
    if(owner.id===me.uid)
      return show("❌ Can't use own code","error");

    await db.runTransaction(async(t)=>{
      const oRef=db.collection("users").doc(owner.id);
      const oSnap=await t.get(oRef);
      const mSnap=await t.get(myRef);

      t.update(myRef,{
        walletBalance:(mSnap.data().walletBalance||0)+5,
        referralUsed:true,
        referredBy:owner.id
      });

      t.update(oRef,{
        walletBalance:(oSnap.data().walletBalance||0)+5,
        referralEarnings:(oSnap.data().referralEarnings||0)+5
      });
    });

    show("🎉 Congratulations!\n💰 $5 added to wallet","success");

  }catch(e){
    console.error(e);
    show("⚠️ Firebase error — referral failed","error");
  }
}
</script>
</body>
</html>
