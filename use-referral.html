<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Use Referral | SuperNFT</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#0f0f0f;
  color:#FFD700;
}
.container{
  max-width:400px;
  margin:80px auto;
  background:#1a1a1a;
  padding:20px;
  border-radius:12px;
}
input,button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:8px;
}
input{
  background:#272727;
  color:#FFD700;
}
button{
  background:#FFD700;
  font-weight:bold;
  cursor:pointer;
}
.msg{
  margin-top:15px;
  text-align:center;
}
</style>
</head>

<body>

<div class="container">
  <h2>Use Referral Code</h2>
  <input id="code" placeholder="Enter referral code">
  <button id="applyBtn">Apply Code</button>
  <div class="msg" id="msg"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore,
  doc,
  getDoc,
  setDoc,
  updateDoc,
  serverTimestamp,
  increment
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* Firebase */
const firebaseConfig = {
  apiKey: "AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain: "supernft-5b952.firebaseapp.com",
  projectId: "supernft-5b952",
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const msg = document.getElementById("msg");

document.getElementById("applyBtn").onclick = async () => {
  const code = document.getElementById("code").value.trim().toUpperCase();
  if(!code) return;

  msg.innerText = "Checking code...";

  const user = auth.currentUser;
  if(!user){
    msg.innerText = "Login required";
    return;
  }

  try{
    /* 🔹 current user */
    const userRef = doc(db,"users",user.uid);
    const userSnap = await getDoc(userRef);

    if(!userSnap.exists()){
      msg.innerText = "User profile missing";
      return;
    }

    const userData = userSnap.data();

    if(userData.referralUsed === true){
      msg.innerText = "Referral already used";
      return;
    }

    /* 🔹 find owner */
    let ownerUid = null;
    const usersSnap = await getDoc(
      doc(db,"referralCodes",code)
    );

    if(!usersSnap.exists()){
      msg.innerText = "Invalid referral code";
      return;
    }

    ownerUid = usersSnap.data().uid;

    if(ownerUid === user.uid){
      msg.innerText = "You cannot use your own code";
      return;
    }

    /* 🔹 update current user */
    await updateDoc(userRef,{
      referralUsed: true,
      referredByCode: code,
      walletBalance: increment(5)
    });

    /* 🔹 reward owner */
    await updateDoc(doc(db,"users",ownerUid),{
      walletBalance: increment(5),
      referralEarnings: increment(5)
    });

    /* 🔹 save history */
    await setDoc(
      doc(db,"users",ownerUid,"referrals",user.uid),
      {
        email: userData.email,
        reward: 5,
        joinedAt: serverTimestamp()
      }
    );

    msg.innerHTML = `
      🎉 <b>Congratulations!</b><br>
      💰 $5 added to your wallet
    `;

  }catch(err){
    console.error(err);
    msg.innerText = "Firebase error — referral failed";
  }
};
</script>

</body>
</html>
