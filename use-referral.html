<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Use Referral</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  background:#0d0d0d;
  color:#FFD700;
  font-family:Arial;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box{
  background:#111;
  padding:25px;
  border-radius:12px;
  width:320px;
  text-align:center;
  box-shadow:0 0 15px #000;
}
input,button{
  width:100%;
  padding:12px;
  margin-top:12px;
  border-radius:6px;
  border:none;
  outline:none;
}
button{
  background:#FFD700;
  font-weight:bold;
  cursor:pointer;
}
button:hover{
  opacity:.9;
}
#msg{
  margin-top:15px;
  line-height:1.5;
  font-size:14px;
}
</style>
</head>
<body>

<div class="box">
<h3>🎁 Use Referral Code</h3>
<input id="code" placeholder="Enter referral code">
<button id="applyBtn">Apply Code</button>
<div id="msg"></div>
</div>

<script type="module">

/* FIREBASE IMPORTS */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth,onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
getFirestore,doc,getDoc,setDoc,updateDoc,increment,
collection,query,where,getDocs,serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* CONFIG */
const firebaseConfig={
 apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
 authDomain:"supernft-5b952.firebaseapp.com",
 projectId:"supernft-5b952"
};

/* INIT */
const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

let currentUser=null;

/* LOGIN CHECK */
onAuthStateChanged(auth,user=>{
 if(!user){
  location.href="login.html";
  return;
 }
 currentUser=user;
});

/* APPLY REFERRAL */
document.getElementById("applyBtn").onclick=async()=>{

const msg=document.getElementById("msg");
msg.innerText="";

const code=document.getElementById("code").value.trim().toUpperCase();

if(!code){
 msg.innerText="❌ Enter referral code";
 return;
}

try{

/* GET MY PROFILE */
const myRef=doc(db,"users",currentUser.uid);
const mySnap=await getDoc(myRef);

if(!mySnap.exists()){
 msg.innerText="⚠️ Profile not found";
 return;
}

const myData=mySnap.data();

/* CHECK ALREADY USED */
if(myData.referralUsed){
 msg.innerText="⚠️ You already used referral";
 return;
}

/* FIND OWNER */
const q=query(collection(db,"users"),where("referralCode","==",code));
const qSnap=await getDocs(q);

if(qSnap.empty){
 msg.innerText="❌ Invalid referral code";
 return;
}

const ownerDoc=qSnap.docs[0];

/* SELF REFERRAL BLOCK */
if(ownerDoc.id===currentUser.uid){
 msg.innerText="❌ Cannot use your own code";
 return;
}

const ownerRef=doc(db,"users",ownerDoc.id);

/* REWARD AMOUNT */
const reward=5;

/* UPDATE USER WALLET */
await updateDoc(myRef,{
 walletBalance:increment(reward),
 referralUsed:true,
 referredByCode:code
});

/* UPDATE REFERRER WALLET */
await updateDoc(ownerRef,{
 walletBalance:increment(reward),
 referralEarnings:increment(reward)
});

/* SAVE HISTORY */
await setDoc(
 doc(db,"users",ownerDoc.id,"referrals",currentUser.uid),
 {
  email:currentUser.email,
  reward:reward,
  joinedAt:serverTimestamp()
 }
);

/* SUCCESS MESSAGE */
msg.innerHTML=
`🎉 SUCCESS<br>
💰 $${reward} added to wallet<br>
🤝 Referrer rewarded`;

}catch(e){
 console.error(e);
 msg.innerText="⚠️ "+e.message;
}

};

</script>
</body>
</html>
