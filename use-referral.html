<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Use Referral Code</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0f0f0f;
  color:#FFD700;
}
.container{
  max-width:420px;
  margin:80px auto;
  padding:25px;
  background:#1a1a1a;
  border-radius:14px;
  box-shadow:0 0 20px rgba(255,215,0,.15);
}
h2{
  text-align:center;
  margin-bottom:20px;
}
input{
  width:100%;
  padding:12px;
  margin:10px 0;
  border-radius:8px;
  border:none;
  background:#272727;
  color:#FFD700;
  font-size:15px;
}
button{
  width:100%;
  padding:14px;
  margin-top:15px;
  background:#FFD700;
  color:#000;
  border:none;
  font-weight:bold;
  border-radius:8px;
  cursor:pointer;
  font-size:16px;
}
button:hover{
  background:#e0c200;
}
#message{
  margin-top:18px;
  text-align:center;
  font-size:15px;
}
.success{color:#00ff99;}
.error{color:#ff6666;}
</style>
</head>

<body>

<div class="container">
  <h2>🎁 Use Referral Code</h2>

  <input type="text" id="refCode" placeholder="Enter Referral Code">

  <button id="applyBtn">Apply Code</button>

  <div id="message"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, collection, query, where,
  getDocs, doc, getDoc, updateDoc, increment
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* 🔥 Firebase Config */
const firebaseConfig = {
  apiKey: "AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain: "supernft-5b952.firebaseapp.com",
  projectId: "supernft-5b952"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const applyBtn = document.getElementById("applyBtn");
const msg = document.getElementById("message");

applyBtn.addEventListener("click", () => {
  const code = document.getElementById("refCode").value.trim().toUpperCase();
  msg.innerHTML = "";

  if (!code) {
    msg.innerHTML = "<span class='error'>❌ Please enter referral code</span>";
    return;
  }

  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      msg.innerHTML = "<span class='error'>❌ Please login first</span>";
      return;
    }

    try {
      const userRef = doc(db, "users", user.uid);
      const userSnap = await getDoc(userRef);

      if (!userSnap.exists()) {
        msg.innerHTML = "<span class='error'>❌ User record not found</span>";
        return;
      }

      const userData = userSnap.data();

      if (userData.referralUsed === true) {
        msg.innerHTML = "<span class='error'>❌ Referral already used</span>";
        return;
      }

      /* 🔍 Find referrer */
      const q = query(
        collection(db, "users"),
        where("referralCode", "==", code)
      );
      const snap = await getDocs(q);

      if (snap.empty) {
        msg.innerHTML = "<span class='error'>❌ Invalid referral code</span>";
        return;
      }

      const referrerDoc = snap.docs[0];
      const referrerId = referrerDoc.id;

      if (referrerId === user.uid) {
        msg.innerHTML = "<span class='error'>❌ You cannot use your own code</span>";
        return;
      }

      /* 🔥 Update current user */
      await updateDoc(userRef, {
        referralUsed: true,
        referredByCode: code,
        walletBalance: increment(5)
      });

      /* 🔥 Update referrer */
      await updateDoc(doc(db, "users", referrerId), {
        walletBalance: increment(5),
        referralEarnings: increment(5)
      });

      msg.innerHTML = `
        <div class="success">
          🎉 <b>Congratulations!</b><br>
          $5 added to your wallet 💰
        </div>
      `;

      applyBtn.disabled = true;

    } catch (err) {
      console.error(err);
      msg.innerHTML = "<span class='error'>⚠️ Something went wrong. Try again.</span>";
    }
  });
});
</script>

</body>
</html>
