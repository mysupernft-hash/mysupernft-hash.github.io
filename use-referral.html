<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Use Referral Code | SuperNFT</title>

<style>
body{
  background:#0d0d0d;
  color:#FFD700;
  font-family:Arial;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  margin:0;
}
.box{
  background:#111;
  padding:25px;
  border-radius:12px;
  width:320px;
  text-align:center;
}
input,button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:6px;
  border:none;
}
input{
  background:#222;
  color:#FFD700;
}
button{
  background:#FFD700;
  color:#000;
  font-weight:bold;
  cursor:pointer;
}
.msg{
  margin-top:15px;
  font-size:14px;
  font-weight:bold;
}
.success{color:#00ff99;}
.error{color:#ff4d4d;}
</style>
</head>

<body>

<div class="box">
  <h3>🎁 Use Referral Code</h3>
  <input id="code" placeholder="Enter referral code">
  <button id="applyBtn">Apply Code</button>
  <div id="msg" class="msg"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore,
  collection,
  query,
  where,
  getDocs,
  doc,
  runTransaction,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* 🔥 Firebase Config */
const firebaseConfig = {
  apiKey: "AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain: "supernft-5b952.firebaseapp.com",
  projectId: "supernft-5b952"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser;

/* 🔐 Auth check */
onAuthStateChanged(auth,(u)=>{
  if(!u){
    location.href="login.html";
    return;
  }
  currentUser = u;
});

/* 🎯 Apply Referral */
document.getElementById("applyBtn").addEventListener("click", applyCode);

async function applyCode(){
  const msg = document.getElementById("msg");
  const code = document.getElementById("code").value.trim().toUpperCase();
  msg.innerHTML = "";

  if(!code){
    showError("Please enter referral code");
    return;
  }

  try{

    /* 🔍 Find referrer from USERS collection */
    const q = query(
      collection(db,"users"),
      where("referralCode","==",code)
    );
    const snap = await getDocs(q);

    if(snap.empty){
      showError("❌ Invalid referral code");
      return;
    }

    const referrerDoc = snap.docs[0];
    const refOwnerUid = referrerDoc.id;

    if(refOwnerUid === currentUser.uid){
      showError("❌ You cannot use your own referral code");
      return;
    }

    /* 🔄 Transaction */
    await runTransaction(db, async (t)=>{

      const userRef = doc(db,"users",currentUser.uid);
      const refRef  = doc(db,"users",refOwnerUid);

      const uSnap = await t.get(userRef);
      const rSnap = await t.get(refRef);

      if(uSnap.data().referralUsed){
        throw "Referral already used";
      }

      /* User B reward */
      t.update(userRef,{
        walletBalance: (uSnap.data().walletBalance||0) + 5,
        referralUsed: true,
        referredByCode: code
      });

      /* User A reward */
      t.update(refRef,{
        walletBalance: (rSnap.data().walletBalance||0) + 5,
        referralEarnings: (rSnap.data().referralEarnings||0) + 5
      });

      /* 🔥 Save history for My-Referrals */
      t.set(
        doc(db,"users",refOwnerUid,"referrals",currentUser.uid),
        {
          email: currentUser.email,
          reward: 5,
          joinedAt: serverTimestamp()
        }
      );
    });

    showSuccess(`🎉 Congratulations!<br>
    💰 $5 added to your wallet<br>
    🚀 Enjoy SuperNFT Rewards`);

  }catch(err){
    console.error(err);
    showError("⚠️ Something went wrong. Try again.");
  }
}

function showSuccess(text){
  const msg = document.getElementById("msg");
  msg.innerHTML = text;
  msg.className = "msg success";
}

function showError(text){
  const msg = document.getElementById("msg");
  msg.innerHTML = text;
  msg.className = "msg error";
}
</script>

</body>
</html>
