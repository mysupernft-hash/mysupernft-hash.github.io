<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Use Referral Code | SuperNFT</title>

<style>
body{
  margin:0;
  background:#0b0b0b;
  color:#FFD700;
  font-family:Arial, sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.box{
  background:#121212;
  padding:25px;
  width:320px;
  border-radius:12px;
  text-align:center;
  box-shadow:0 0 20px rgba(255,215,0,0.15);
}

h2{
  margin-bottom:15px;
}

input{
  width:100%;
  padding:12px;
  border:none;
  border-radius:6px;
  margin-top:10px;
  background:#1f1f1f;
  color:#FFD700;
  text-align:center;
  font-size:16px;
}

button{
  width:100%;
  padding:12px;
  margin-top:15px;
  border:none;
  border-radius:6px;
  background:#FFD700;
  color:#000;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#e6c200;
}

#msg{
  margin-top:15px;
  font-size:14px;
}

.success{
  color:#00ff99;
}

.error{
  color:#ff4d4d;
}
</style>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>

<body>

<div class="box">
  <h2>🎁 Use Referral Code</h2>
  <input id="code" placeholder="Enter Referral Code">
  <button id="applyBtn">Apply Code</button>
  <div id="msg"></div>
</div>

<script>
/* 🔥 Firebase Config */
firebase.initializeApp({
  apiKey: "AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain: "supernft-5b952.firebaseapp.com",
  projectId: "supernft-5b952"
});

const auth = firebase.auth();
const db = firebase.firestore();

const msg = document.getElementById("msg");
const applyBtn = document.getElementById("applyBtn");

/* 🔹 Apply Referral */
applyBtn.addEventListener("click", async () => {
  const user = auth.currentUser;
  const code = document.getElementById("code").value.trim().toUpperCase();

  if (!user) {
    msg.innerHTML = "<div class='error'>❌ Please login first</div>";
    return;
  }

  if (!code) {
    msg.innerHTML = "<div class='error'>❌ Enter a referral code</div>";
    return;
  }

  try {
    const userRef = db.collection("users").doc(user.uid);
    const userSnap = await userRef.get();

    if (!userSnap.exists) {
      msg.innerHTML = "<div class='error'>User record not found</div>";
      return;
    }

    const userData = userSnap.data();

    if (userData.referralUsed === true) {
      msg.innerHTML = "<div class='error'>❌ Referral already used</div>";
      return;
    }

    if (userData.referralCode === code) {
      msg.innerHTML = "<div class='error'>❌ You cannot use your own code</div>";
      return;
    }

    // 🔍 Find referrer
    const refSnap = await db.collection("users")
      .where("referralCode", "==", code)
      .limit(1)
      .get();

    if (refSnap.empty) {
      msg.innerHTML = "<div class='error'>❌ Invalid referral code</div>";
      return;
    }

    const refDoc = refSnap.docs[0];
    const refRef = db.collection("users").doc(refDoc.id);

    // 💰 Transaction
    await db.runTransaction(async (t) => {
      const u = await t.get(userRef);
      const r = await t.get(refRef);

      t.update(userRef, {
        walletBalance: (u.data().walletBalance || 0) + 5,
        referralUsed: true,
        referredByCode: code
      });

      t.update(refRef, {
        walletBalance: (r.data().walletBalance || 0) + 5,
        referralEarnings: (r.data().referralEarnings || 0) + 5
      });
    });

    msg.innerHTML = `
      <div class="success">
        🎉 Congratulations! <br>
        💰 $5 has been added to your wallet <br>
        🚀 Enjoy SuperNFT Rewards!
      </div>
    `;

  } catch (e) {
    console.error(e);
    msg.innerHTML = "<div class='error'>⚠️ Something went wrong. Try again.</div>";
  }
});
</script>

</body>
</html>
