<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Use Referral | SuperNFT</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  background:#0d0d0d;
  color:#FFD700;
  font-family:Arial;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box{
  background:#111;
  padding:25px;
  border-radius:12px;
  width:320px;
  text-align:center;
}
input,button{
  width:100%;
  padding:12px;
  margin-top:12px;
  border-radius:6px;
  border:none;
}
button{
  background:#FFD700;
  font-weight:bold;
  cursor:pointer;
}
#msg{
  margin-top:15px;
  font-size:14px;
  line-height:1.5;
}
</style>
</head>

<body>

<div class="box">
  <h3>🎁 Use Referral Code</h3>
  <input id="code" placeholder="Enter referral code">
  <button id="applyBtn" disabled>Apply Code</button>
  <div id="msg">⏳ Loading user...</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, doc, getDoc, updateDoc, setDoc,
  serverTimestamp, query, where, collection, getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* Firebase */
const firebaseConfig = {
  apiKey: "AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain: "supernft-5b952.firebaseapp.com",
  projectId: "supernft-5b952"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
const btn = document.getElementById("applyBtn");
const msg = document.getElementById("msg");

/* AUTH READY */
onAuthStateChanged(auth, user=>{
  if(!user){
    location.href="login.html";
    return;
  }
  currentUser = user;
  btn.disabled = false;
  msg.innerText = "";
});

/* APPLY CODE */
btn.onclick = async () => {
  const code = document.getElementById("code").value.trim().toUpperCase();
  msg.innerText = "";

  if(!code){
    msg.innerText = "❌ Enter referral code";
    return;
  }

  try{
    const userRef = doc(db,"users",currentUser.uid);
    const userSnap = await getDoc(userRef);

    if(!userSnap.exists()){
      msg.innerText="❌ User data missing";
      return;
    }

    const userData = userSnap.data();

    if(userData.referralUsed === true){
      msg.innerText="⚠️ Referral already used";
      return;
    }

    /* FIND OWNER */
    const q = query(
      collection(db,"users"),
      where("referralCode","==",code)
    );
    const snap = await getDocs(q);

    if(snap.empty){
      msg.innerText="❌ Invalid referral code";
      return;
    }

    const ownerDoc = snap.docs[0];

    if(ownerDoc.id === currentUser.uid){
      msg.innerText="❌ You cannot use your own code";
      return;
    }

    const ownerRef = doc(db,"users",ownerDoc.id);
    const ownerSnap = await getDoc(ownerRef);
    const ownerData = ownerSnap.data() || {};

    /* UPDATE USER B */
    await updateDoc(userRef,{
      walletBalance: (userData.walletBalance || 0) + 5,
      referralUsed: true,
      referredByCode: code
    });

    /* UPDATE USER A (SAFE DEFAULTS) */
    await updateDoc(ownerRef,{
      walletBalance: (ownerData.walletBalance || 0) + 5,
      referralEarnings: (ownerData.referralEarnings || 0) + 5
    });

    /* REFERRAL HISTORY */
    await setDoc(
      doc(db,"users",ownerDoc.id,"referrals",currentUser.uid),
      {
        email: currentUser.email,
        reward: 5,
        joinedAt: serverTimestamp()
      }
    );

    msg.innerHTML = `
      🎉 <b>Congratulations!</b><br>
      💰 $5 added to your wallet<br>
      🤝 Referral successful
    `;
    btn.disabled = true;

  }catch(err){
    console.error(err);
    msg.innerText="⚠️ Something went wrong. Try again.";
  }
};
</script>

</body>
</html>
