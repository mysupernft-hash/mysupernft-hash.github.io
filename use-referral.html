<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Use Referral</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
 background:#0d0d0d;
 color:#FFD700;
 font-family:Arial;
 display:flex;
 justify-content:center;
 align-items:center;
 height:100vh;
}
.box{
 background:#111;
 padding:25px;
 border-radius:12px;
 width:320px;
 text-align:center;
 box-shadow:0 0 15px #000;
}
input,button{
 width:100%;
 padding:12px;
 margin-top:12px;
 border-radius:6px;
 border:none;
}
button{
 background:#FFD700;
 font-weight:bold;
 cursor:pointer;
}
#msg{
 margin-top:15px;
 font-size:14px;
}
</style>
</head>
<body>

<div class="box">
<h3>🎁 Use Referral Code</h3>
<input id="code" placeholder="Enter referral code">
<button id="applyBtn">Apply Code</button>
<div id="msg"></div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth,onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
getFirestore,doc,getDoc,setDoc,updateDoc,increment,
collection,query,where,getDocs,runTransaction,serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
 authDomain:"supernft-5b952.firebaseapp.com",
 projectId:"supernft-5b952"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

let currentUser=null;

/* LOGIN CHECK + AUTO PROFILE CREATE */
onAuthStateChanged(auth,async user=>{
 if(!user){
   location.href="login.html";
   return;
 }

 currentUser=user;

 const ref=doc(db,"users",user.uid);
 const snap=await getDoc(ref);

 if(!snap.exists()){
   await setDoc(ref,{
     name:user.displayName || "",
     email:user.email,
     walletBalance:0,
     referralUsed:false,
     referralEarnings:0,
     referralCode:user.uid.slice(0,8).toUpperCase(),
     isAdmin:false,
     createdAt:serverTimestamp()
   });
 }
});

/* APPLY REFERRAL */
document.getElementById("applyBtn").onclick=async()=>{

const msg=document.getElementById("msg");
msg.innerText="";

const code=document.getElementById("code").value.trim().toUpperCase();

if(!code){
 msg.innerText="❌ Enter code";
 return;
}

try{

await runTransaction(db, async (transaction)=>{

const myRef=doc(db,"users",currentUser.uid);
const mySnap=await transaction.get(myRef);

if(!mySnap.exists()) throw "Profile missing";

if(mySnap.data().referralUsed)
 throw "Already used referral";

const q=query(collection(db,"users"),where("referralCode","==",code));
const qs=await getDocs(q);

if(qs.empty) throw "Invalid code";

const ownerDoc=qs.docs[0];

if(ownerDoc.id===currentUser.uid)
 throw "Cannot use own code";

const ownerRef=doc(db,"users",ownerDoc.id);

const reward=5;

/* UPDATE USER */
transaction.update(myRef,{
 walletBalance:increment(reward),
 referralUsed:true,
 referredByCode:code
});

/* UPDATE OWNER */
transaction.update(ownerRef,{
 walletBalance:increment(reward),
 referralEarnings:increment(reward)
});

/* SAVE HISTORY */
transaction.set(
 doc(db,"users",ownerDoc.id,"referrals",currentUser.uid),
 {
  email:currentUser.email,
  reward,
  joinedAt:new Date()
 }
);

});

msg.innerHTML="✅ Referral Applied Successfully";

}catch(e){
msg.innerText="⚠️ "+e;
}

};

</script>
</body>
</html>
