<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Use Referral</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#0f172a;
    color:#fff;
}

.container{
    max-width:500px;
    margin:40px auto;
    padding:20px;
    background:#111827;
    border-radius:12px;
    box-shadow:0 0 15px rgba(0,0,0,0.5);
}

h1{
    text-align:center;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    margin-bottom:15px;
    font-size:16px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#22c55e;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#16a34a;
}

.rules{
    margin-top:25px;
    background:#020617;
    padding:15px;
    border-radius:10px;
    font-size:14px;
    line-height:1.6;
}

.success{
    color:#4ade80;
    text-align:center;
    margin-top:15px;
}
</style>
</head>
<body>

<div class="container">
<h1>Use Referral Code</h1>

<input type="text" id="refInput" placeholder="Enter Referral Code">

<button onclick="applyReferral()">Apply Code</button>

<div id="msg"></div>

<div class="rules">
<b>Referral Rules:</b><br><br>

• Signup ke baad referral code apply karna zaroori hai.<br>
• Referral apply hone par bonus activate hoga.<br>
• Deposit karne par hi referral commission milega.<br>
• Fake accounts banane par account block ho sakta hai.<br>
• Ek user sirf ek referral use kar sakta hai.
</div>

</div>

<script>
function applyReferral(){
    let code = document.getElementById("refInput").value.trim();
    let msg = document.getElementById("msg");

    if(code === ""){
        msg.innerHTML = "<p style='color:red;text-align:center;'>Please enter referral code</p>";
        return;
    }

    // Save locally (temporary demo logic)
    localStorage.setItem("referralCode", code);

    msg.innerHTML = "<p class='success'>Referral applied successfully ✔</p>";
}
</script>

</body>
</html>
