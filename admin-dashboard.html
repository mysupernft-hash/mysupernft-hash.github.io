<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SuperNFT Admin Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0d0d0d;
  color:#FFD700;
  padding:15px;
}

h2{
  text-align:center;
  margin-bottom:10px;
}

.card{
  background:#111;
  padding:15px;
  border-radius:10px;
  margin-bottom:15px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.stat{
  background:#1a1a1a;
  padding:10px;
  border-radius:8px;
  text-align:center;
  font-size:14px;
}

input,select{
  width:100%;
  padding:5px;
  font-size:12px;
}

button{
  padding:6px 10px;
  background:#FFD700;
  border:none;
  cursor:pointer;
  font-weight:bold;
  font-size:12px;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
  font-size:12px;
}

th,td{
  border:1px solid #333;
  padding:6px;
  text-align:center;
}

.logout{
  float:right;
  background:red;
  color:white;
}
</style>
</head>

<body>

<h2>🔥 SuperNFT Admin Panel</h2>
<button class="logout" onclick="logout()">Logout</button>

<!-- PLATFORM STATS -->
<div class="card grid">
  <div class="stat">Users<br><b id="totalUsers">0</b></div>
  <div class="stat">Total Deposit<br><b id="totalDeposit">0</b></div>
  <div class="stat">Total Withdraw<br><b id="totalWithdraw">0</b></div>
  <div class="stat">Total Earnings<br><b id="totalEarnings">0</b></div>
</div>

<!-- SEARCH -->
<div class="card">
  <input type="text" id="searchInput" placeholder="🔎 Search by Email or UID">
</div>

<!-- USERS TABLE -->
<div class="card">
  <table>
    <thead>
      <tr>
        <th>Email</th>
        <th>Wallet</th>
        <th>Daily</th>
        <th>Referral</th>
        <th>Level</th>
        <th>Banned</th>
        <th>Save</th>
      </tr>
    </thead>
    <tbody id="userTable"></tbody>
  </table>
</div>

<!-- WITHDRAW REQUESTS -->
<div class="card">
  <h3>💸 Withdraw Requests</h3>
  <table>
    <thead>
      <tr>
        <th>Email</th>
        <th>Amount</th>
        <th>Status</th>
        <th>Approve</th>
      </tr>
    </thead>
    <tbody id="withdrawTable"></tbody>
  </table>
</div>

<script>

firebase.initializeApp({
  apiKey: "AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain: "supernft-5b952.firebaseapp.com",
  projectId: "supernft-5b952"
});

const auth = firebase.auth();
const db   = firebase.firestore();

let allUsers=[];

/* AUTH CHECK */
auth.onAuthStateChanged(user=>{
  if(!user){
    location.href="admin-login.html";
    return;
  }

  loadStats();
  loadUsers();
  loadWithdraws();
});

/* LOAD PLATFORM STATS */
function loadStats(){
  db.collection("users").get().then(snap=>{
    let deposit=0, withdraw=0, earnings=0;

    snap.forEach(doc=>{
      const u=doc.data();
      deposit += u.totalDeposit||0;
      withdraw += u.totalWithdraw||0;
      earnings += u.referralEarnings||0;
    });

    document.getElementById("totalUsers").innerText=snap.size;
    document.getElementById("totalDeposit").innerText=deposit;
    document.getElementById("totalWithdraw").innerText=withdraw;
    document.getElementById("totalEarnings").innerText=earnings;
  });
}

/* LOAD USERS */
function loadUsers(){
  db.collection("users").get().then(snap=>{
    allUsers=[];
    snap.forEach(doc=>{
      allUsers.push({id:doc.id,...doc.data()});
    });
    renderUsers(allUsers);
  });
}

/* RENDER USERS */
function renderUsers(users){
  let html="";
  users.forEach(u=>{
    html+=`
    <tr>
      <td>${u.email||""}</td>
      <td><input id="w_${u.id}" value="${u.walletBalance||0}"></td>
      <td><input id="d_${u.id}" value="${u.dailyIncome||0}"></td>
      <td><input id="r_${u.id}" value="${u.referralEarnings||0}"></td>
      <td><input id="l_${u.id}" value="${u.level||0}"></td>
      <td>
        <select id="ban_${u.id}">
          <option value="false" ${u.banned?"":"selected"}>No</option>
          <option value="true" ${u.banned?"selected":""}>Yes</option>
        </select>
      </td>
      <td><button onclick="saveUser('${u.id}')">Save</button></td>
    </tr>`;
  });

  document.getElementById("userTable").innerHTML=html;
}

/* SAVE USER */
function saveUser(uid){
  db.collection("users").doc(uid).update({
    walletBalance:Number(document.getElementById("w_"+uid).value),
    dailyIncome:Number(document.getElementById("d_"+uid).value),
    referralEarnings:Number(document.getElementById("r_"+uid).value),
    level:Number(document.getElementById("l_"+uid).value),
    banned:document.getElementById("ban_"+uid).value==="true"
  }).then(()=>alert("User Updated"));
}

/* SEARCH */
document.getElementById("searchInput").addEventListener("input",function(){
  const val=this.value.toLowerCase();
  const filtered=allUsers.filter(u=>
    (u.email||"").toLowerCase().includes(val) ||
    u.id.toLowerCase().includes(val)
  );
  renderUsers(filtered);
});

/* WITHDRAW REQUESTS */
function loadWithdraws(){
  db.collection("withdrawRequests").get().then(snap=>{
    let html="";
    snap.forEach(doc=>{
      const w=doc.data();
      html+=`
      <tr>
        <td>${w.email||""}</td>
        <td>${w.amount||0}</td>
        <td>${w.status||"pending"}</td>
        <td><button onclick="approve('${doc.id}')">Approve</button></td>
      </tr>`;
    });
    document.getElementById("withdrawTable").innerHTML=html;
  });
}

function approve(id){
  db.collection("withdrawRequests").doc(id).update({
    status:"approved"
  }).then(()=>alert("Withdraw Approved"));
}

/* LOGOUT */
function logout(){
  auth.signOut().then(()=>location.href="admin-login.html");
}

</script>
</body>
</html>
