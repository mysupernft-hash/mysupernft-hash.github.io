<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SuperNFT Admin Dashboard</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
body { background:#0d0d0d; color:#ffd700; font-family:Arial }
table { width:100%; border-collapse:collapse; margin-top:20px }
th,td { border:1px solid #333; padding:8px; text-align:center }
th { background:#111 }
input, select { width:90px; padding:4px; }
button { padding:6px 12px; background:#ffd700; border:none; cursor:pointer }
</style>
</head>

<body>

<h2 id="status">Checking admin access...</h2>

<div id="panel" style="display:none">
  <h2>Admin Dashboard</h2>

  <table>
    <thead>
      <tr>
        <th>Email</th>
        <th>Balance</th>
        <th>Daily Income</th>
        <th>Referral</th>
        <th>Level</th>
        <th>Banned</th>
        <th>Save</th>
      </tr>
    </thead>
    <tbody id="users"></tbody>
  </table>
</div>

<script>
// 🔧 FIREBASE CONFIG
firebase.initializeApp({
  apiKey: "AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain: "supernft-5b952.firebaseapp.com",
  projectId: "supernft-5b952"
});

const auth = firebase.auth();
const db   = firebase.firestore();

// 🔐 ADMIN AUTH CHECK
auth.onAuthStateChanged(user => {
  if (!user) {
    document.getElementById("status").innerText = "Not logged in";
    return;
  }

  // ❗ double admin check
  db.collection("admin").doc(user.uid).get().then(adminDoc => {

    if (adminDoc.exists && adminDoc.data().isAdmin === true) {
      allowAdmin();
      return;
    }

    db.collection("users").doc(user.uid).get().then(userDoc => {
      if (userDoc.exists && userDoc.data().isAdmin === true) {
        allowAdmin();
        return;
      }

      document.getElementById("status").innerText =
        "Access denied (not admin)";
    });

  }).catch(err => {
    console.error(err);
    document.getElementById("status").innerText = "Admin check error";
  });
});

// ✅ SHOW DASHBOARD
function allowAdmin() {
  document.getElementById("status").style.display = "none";
  document.getElementById("panel").style.display  = "block";
  loadUsers();
}

// 👥 LOAD ALL USERS
function loadUsers(){
  db.collection("users").get().then(snap => {
    let html = "";
    snap.forEach(doc => {
      const u = doc.data();
      const uid = doc.id;

      html += `
      <tr>
        <td>${u.email || ""}</td>
        <td><input id="bal_${uid}" value="${u.balance||0}"></td>
        <td><input id="day_${uid}" value="${u.dailyIncome||0}"></td>
        <td><input id="ref_${uid}" value="${u.referralEarnings||0}"></td>
        <td><input id="lvl_${uid}" value="${u.level||1}"></td>
        <td>
          <select id="ban_${uid}">
            <option value="false" ${u.banned?"":"selected"}>No</option>
            <option value="true"  ${u.banned?"selected":""}>Yes</option>
          </select>
        </td>
        <td>
          <button onclick="saveUser('${uid}')">Save</button>
        </td>
      </tr>`;
    });
    document.getElementById("users").innerHTML = html;
  });
}

// 💾 SAVE USER DATA
function saveUser(uid){
  db.collection("users").doc(uid).update({
    balance: Number(document.getElementById("bal_"+uid).value),
    dailyIncome: Number(document.getElementById("day_"+uid).value),
    referralEarnings: Number(document.getElementById("ref_"+uid).value),
    level: Number(document.getElementById("lvl_"+uid).value),
    banned: document.getElementById("ban_"+uid).value === "true"
  }).then(() => {
    alert("User updated");
  }).catch(err => {
    console.error(err);
  });
}
</script>

</body>
</html>
