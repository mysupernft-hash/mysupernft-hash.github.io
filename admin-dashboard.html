<!DOCTYPE html>
<html>
<head>
<title>Admin Login | SuperNFT</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{background:#0d0d0d;color:#FFD700;font-family:Arial;
display:flex;justify-content:center;align-items:center;height:100vh}
.box{background:#111;padding:25px;width:300px;border-radius:10px}
input,button{width:100%;padding:10px;margin:8px 0}
button{background:#FFD700;border:none;font-weight:bold}
</style>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>

<body>
<div class="box">
<h2>Admin Login</h2>
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<p id="msg"></p>
</div>

<script>
const firebaseConfig={
 apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
 authDomain:"supernft-5b952.firebaseapp.com",
 projectId:"supernft-5b952"
};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
const db=firebase.firestore();

function login(){
 msg.innerText="Checking...";
 auth.signInWithEmailAndPassword(email.value,password.value)
 .then(res=>db.collection("users").doc(res.user.uid).get())
 .then(doc=>{
   if(!doc.exists || doc.data().isAdmin!==true){
     auth.signOut();
     msg.innerText="Access denied";
     return;
   }
   location.href="admin-dashboard.html";
 })
 .catch(e=>msg.innerText=e.message);
}
</script>
</body>
</html>
