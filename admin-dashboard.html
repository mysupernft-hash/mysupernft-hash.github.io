<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SuperNFT Admin Panel</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0d0d0d;
  color:#FFD700;
}

header{
  background:#111;
  padding:15px;
  text-align:center;
  font-size:20px;
}

.container{
  padding:15px;
}

.card{
  background:#1a1a1a;
  margin-bottom:12px;
  padding:12px;
  border-radius:8px;
}

input,select{
  padding:6px;
  margin:4px 0;
  border:none;
  border-radius:4px;
  width:100%;
}

button{
  padding:8px;
  border:none;
  border-radius:5px;
  background:#FFD700;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#e6c200;
}
</style>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

</head>
<body>

<header>SuperNFT Admin Control Panel</header>

<div class="container">
<h3>All Users</h3>
<div id="usersList">Loading...</div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain: "supernft-5b952.firebaseapp.com",
  projectId: "supernft-5b952"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

auth.onAuthStateChanged(user=>{
  if(!user){
    location.href="login.html";
    return;
  }

  db.collection("users").doc(user.uid).get().then(doc=>{
    if(!doc.exists || !doc.data().isAdmin){
      alert("Access denied");
      location.href="dashboard.html";
    } else {
      loadUsers();
    }
  });
});

function loadUsers(){
  const container = document.getElementById("usersList");
  container.innerHTML = "";

  db.collection("users").get().then(snapshot=>{
    snapshot.forEach(doc=>{
      const u = doc.data();
      const uid = doc.id;

      const div = document.createElement("div");
      div.className="card";

      div.innerHTML = `
        <b>User ID:</b> ${uid}<br>

        Name:
        <input id="name_${uid}" value="${u.name || ""}">

        Email:
        <input id="email_${uid}" value="${u.email || ""}">

        Balance:
        <input type="number" id="bal_${uid}" value="${u.balance || 0}">

        Role:
        <select id="role_${uid}">
          <option value="false" ${!u.isAdmin?"selected":""}>User</option>
          <option value="true" ${u.isAdmin?"selected":""}>Admin</option>
        </select>

        Account Status:
        <select id="ban_${uid}">
          <option value="false" ${!u.banned?"selected":""}>Active</option>
          <option value="true" ${u.banned?"selected":""}>Banned</option>
        </select>

        <button onclick="saveUser('${uid}')">
          Save Changes
        </button>
      `;

      container.appendChild(div);
    });
  });
}

function saveUser(uid){
  const name =
    document.getElementById("name_"+uid).value;

  const email =
    document.getElementById("email_"+uid).value;

  const balance =
    parseFloat(document.getElementById("bal_"+uid).value) || 0;

  const isAdmin =
    document.getElementById("role_"+uid).value === "true";

  const banned =
    document.getElementById("ban_"+uid).value === "true";

  db.collection("users").doc(uid).update({
    name,
    email,
    balance,
    isAdmin,
    banned
  })
  .then(()=> alert("User updated"))
  .catch(err=>{
    console.error(err);
    alert("Update failed");
  });
}
</script>

</body>
</html>
