<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SuperNFT Ultimate Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0d0d0d;
  color:#FFD700;
  padding:10px;
}

h2{
  text-align:center;
  margin-bottom:10px;
}

.card{
  background:#111;
  padding:12px;
  border-radius:10px;
  margin-bottom:15px;
}

input,select{
  width:100%;
  padding:4px;
  font-size:12px;
}

button{
  padding:5px 8px;
  background:#FFD700;
  border:none;
  font-weight:bold;
  cursor:pointer;
  font-size:11px;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:11px;
}

th,td{
  border:1px solid #333;
  padding:4px;
  text-align:center;
}

th{
  background:#1a1a1a;
}

.search{
  width:100%;
  padding:8px;
  margin-bottom:10px;
}
</style>
</head>

<body>

<h2>🔥 SuperNFT Admin Dashboard</h2>

<div class="card">
<input class="search" type="text" id="searchInput" placeholder="Search by Email or UID">
</div>

<div class="card">
<table>
<thead>
<tr>
<th>Email</th>
<th>UID</th>
<th>Wallet</th>
<th>Daily</th>
<th>Referral</th>
<th>Team</th>
<th>VIP</th>
<th>Deposit</th>
<th>Withdraw</th>
<th>Total</th>
<th>Live</th>
<th>Role</th>
<th>Joined</th>
<th>Banned</th>
<th>Save</th>
</tr>
</thead>
<tbody id="userTable"></tbody>
</table>
</div>

<script>

firebase.initializeApp({
  apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain:"supernft-5b952.firebaseapp.com",
  projectId:"supernft-5b952"
});

const auth = firebase.auth();
const db   = firebase.firestore();

let allUsers=[];

/* AUTH CHECK */
auth.onAuthStateChanged(user=>{
  if(!user){
    location.href="admin-login.html";
    return;
  }
  loadUsers();
});

/* LOAD USERS */
function loadUsers(){
  db.collection("users").get().then(snapshot=>{
    allUsers=[];
    snapshot.forEach(doc=>{
      allUsers.push({id:doc.id,...doc.data()});
    });
    renderUsers(allUsers);
  });
}

/* RENDER TABLE */
function renderUsers(users){
  let html="";

  users.forEach(u=>{

    html+=`
    <tr>

      <td>${u.email||""}</td>

      <td style="font-size:9px">${u.id}</td>

      <td><input id="w_${u.id}" value="${u.walletBalance||0}"></td>

      <td><input id="d_${u.id}" value="${u.dailyIncome||0}"></td>

      <td><input id="r_${u.id}" value="${u.referralEarnings||0}"></td>

      <td><input id="t_${u.id}" value="${u.teamCommission||0}"></td>

      <td><input id="v_${u.id}" value="${u.level||0}"></td>

      <td><input id="td_${u.id}" value="${u.totalDeposit||0}"></td>

      <td><input id="tw_${u.id}" value="${u.totalWithdraw||0}"></td>

      <td><input id="ti_${u.id}" value="${u.totalIncome||0}"></td>

      <td><input id="le_${u.id}" value="${u.liveEarnings||0}"></td>

      <td>${u.role||"user"}</td>

      <td style="font-size:9px">
        ${u.createdAt ? u.createdAt.toDate().toLocaleDateString() : ""}
      </td>

      <td>
        <select id="ban_${u.id}">
          <option value="false" ${u.banned?"":"selected"}>No</option>
          <option value="true" ${u.banned?"selected":""}>Yes</option>
        </select>
      </td>

      <td>
        <button onclick="saveUser('${u.id}')">Save</button>
      </td>

    </tr>
    `;
  });

  document.getElementById("userTable").innerHTML=html;
}

/* SAVE USER */
function saveUser(uid){

  db.collection("users").doc(uid).update({

    walletBalance:Number(document.getElementById("w_"+uid).value),

    dailyIncome:Number(document.getElementById("d_"+uid).value),

    referralEarnings:Number(document.getElementById("r_"+uid).value),

    teamCommission:Number(document.getElementById("t_"+uid).value),

    level:Number(document.getElementById("v_"+uid).value),

    totalDeposit:Number(document.getElementById("td_"+uid).value),

    totalWithdraw:Number(document.getElementById("tw_"+uid).value),

    totalIncome:Number(document.getElementById("ti_"+uid).value),

    liveEarnings:Number(document.getElementById("le_"+uid).value),

    banned:document.getElementById("ban_"+uid).value==="true"

  }).then(()=>{
    alert("✅ User Updated");
  });

}

/* SEARCH */
document.getElementById("searchInput").addEventListener("input",function(){
  const val=this.value.toLowerCase();

  const filtered=allUsers.filter(u=>
    (u.email||"").toLowerCase().includes(val) ||
    u.id.toLowerCase().includes(val)
  );

  renderUsers(filtered);
});

</script>

</body>
</html>
