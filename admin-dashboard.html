<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SuperNFT Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  background:#0d0d0d;
  color:#FFD700;
  font-family:Arial;
  margin:0;
  padding:20px;
}
h2{text-align:center}
table{
  width:100%;
  border-collapse:collapse;
  font-size:13px;
}
th,td{
  border:1px solid #333;
  padding:6px;
  text-align:center;
}
th{background:#111}
input{
  width:80px;
  background:#000;
  color:#FFD700;
  border:1px solid #555;
}
button{
  background:#FFD700;
  border:none;
  padding:5px 8px;
  cursor:pointer;
}
button:hover{background:#e6c200}
.ban{background:red;color:#fff}
.unban{background:green;color:#fff}
</style>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>

<body>

<h2>👑 SuperNFT Admin Panel</h2>
<p id="status">Checking admin access...</p>

<table id="table" style="display:none">
<thead>
<tr>
  <th>Email</th>
  <th>Balance</th>
  <th>Daily</th>
  <th>Referral</th>
  <th>Team</th>
  <th>Level</th>
  <th>Status</th>
  <th>Save</th>
</tr>
</thead>
<tbody id="users"></tbody>
</table>

<script>
// ---------------- FIREBASE CONFIG ----------------
firebase.initializeApp({
  apiKey: "AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain: "supernft-5b952.firebaseapp.com",
  projectId: "supernft-5b952"
});

const auth = firebase.auth();
const db = firebase.firestore();

// ---------------- ADMIN CHECK ----------------
auth.onAuthStateChanged(async user=>{
  if(!user){
    document.getElementById("status").innerText="Login required";
    return;
  }

  const doc = await db.collection("users").doc(user.uid).get();

  if(!doc.exists || doc.data().isAdmin !== true){
    document.getElementById("status").innerText="Access denied";
    return;
  }

  document.getElementById("status").innerText="Admin access granted";
  document.getElementById("table").style.display="table";
  loadUsers();
});

// ---------------- LOAD USERS ----------------
function loadUsers(){
  const tbody = document.getElementById("users");

  db.collection("users").get().then(snapshot=>{
    tbody.innerHTML="";
    snapshot.forEach(d=>{
      const u=d.data(), id=d.id;
      tbody.innerHTML+=`
      <tr>
        <td>${u.email||""}</td>
        <td><input id="bal_${id}" value="${u.balance||0}"></td>
        <td><input id="daily_${id}" value="${u.dailyIncome||0}"></td>
        <td><input id="ref_${id}" value="${u.referralEarnings||0}"></td>
        <td><input id="team_${id}" value="${u.myTeam||0}"></td>
        <td><input id="lvl_${id}" value="${u.level||1}"></td>
        <td>
          ${u.banned
            ? `<button class="unban" onclick="ban('${id}',false)">Unban</button>`
            : `<button class="ban" onclick="ban('${id}',true)">Ban</button>`
          }
        </td>
        <td><button onclick="save('${id}')">Save</button></td>
      </tr>`;
    });
  });
}

// ---------------- SAVE ----------------
function save(id){
  db.collection("users").doc(id).update({
    balance:+bal(id),
    dailyIncome:+daily(id),
    referralEarnings:+ref(id),
    myTeam:+team(id),
    level:+lvl(id)
  });
}

function ban(id,val){
  db.collection("users").doc(id).update({banned:val});
}

const bal=id=>document.getElementById("bal_"+id).value;
const daily=id=>document.getElementById("daily_"+id).value;
const ref=id=>document.getElementById("ref_"+id).value;
const team=id=>document.getElementById("team_"+id).value;
const lvl=id=>document.getElementById("lvl_"+id).value;
</script>

</body>
</html>
