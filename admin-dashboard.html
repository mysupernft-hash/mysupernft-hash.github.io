<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Dashboard - SuperNFT</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#111;
  color:#FFD700;
}

header{
  background:#000;
  padding:15px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
}

.container{
  padding:15px;
}

.user{
  background:#1c1c1c;
  margin-bottom:10px;
  padding:12px;
  border-radius:8px;
}

input{
  padding:6px;
  border:none;
  border-radius:4px;
}

button{
  padding:6px 10px;
  border:none;
  border-radius:4px;
  background:#FFD700;
  cursor:pointer;
  font-weight:bold;
}

button:hover{
  background:#e6c200;
}
</style>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

</head>
<body>

<header>SuperNFT Admin Panel</header>

<div class="container">
<h3>Users List</h3>
<div id="usersList">Loading users...</div>
</div>

<script>
const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "YOUR_DOMAIN",
  projectId: "YOUR_PROJECT_ID"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

let currentUser;

// Admin protection
auth.onAuthStateChanged(user=>{
  if(!user){
    location.href="login.html";
    return;
  }

  db.collection("users").doc(user.uid).get()
  .then(doc=>{
    if(!doc.exists || !doc.data().isAdmin){
      alert("Access denied");
      location.href="dashboard.html";
    } else {
      currentUser = user;
      loadUsers();
    }
  });
});

// Load users
function loadUsers(){
  const container = document.getElementById("usersList");
  container.innerHTML = "Loading...";

  db.collection("users").get().then(snapshot=>{
    container.innerHTML = "";

    snapshot.forEach(doc=>{
      const user = doc.data();
      const uid = doc.id;

      const div = document.createElement("div");
      div.className = "user";

      div.innerHTML = `
        <b>Email:</b> ${user.email || "N/A"} <br>
        <b>User ID:</b> ${uid}<br>
        Balance: $
        <input type="number" id="bal_${uid}"
               value="${user.balance || 0}">
        <button onclick="updateBalance('${uid}')">
          Update
        </button>
      `;

      container.appendChild(div);
    });
  });
}

// Update balance
function updateBalance(uid){
  const value =
    parseFloat(document.getElementById("bal_"+uid).value);

  db.collection("users").doc(uid).update({
    balance: value
  }).then(()=>{
    alert("Balance updated");
  }).catch(err=>{
    console.error(err);
    alert("Update failed");
  });
}
</script>

</body>
</html>
