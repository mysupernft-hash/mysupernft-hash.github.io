<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SuperNFT Admin Dashboard</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0d0d0d;
  color:#FFD700;
}

header{
  background:#111;
  padding:15px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
}

.container{
  padding:15px;
  overflow-x:auto;
}

table{
  border-collapse:collapse;
  width:100%;
  background:#1a1a1a;
}

th, td{
  border:1px solid #333;
  padding:6px;
  text-align:center;
}

input, select{
  width:100%;
  padding:5px;
  background:#222;
  color:#FFD700;
  border:none;
}

button{
  background:#FFD700;
  border:none;
  padding:6px 10px;
  cursor:pointer;
  font-weight:bold;
}

button:hover{
  background:#e6c200;
}
</style>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

</head>

<body>

<header>SuperNFT Admin Panel</header>

<div class="container">

<h2>Users Management</h2>

<table id="usersTable">
<thead>
<tr>
<th>UID</th>
<th>Name</th>
<th>Email</th>
<th>Daily Income</th>
<th>Live Earnings</th>
<th>Deposit</th>
<th>Withdraw</th>
<th>Wallet Balance</th>
<th>NFT Count</th>
<th>Status</th>
<th>Save</th>
</tr>
</thead>

<tbody></tbody>
</table>

</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain: "supernft-5b952.firebaseapp.com",
  projectId: "supernft-5b952"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

/* Protect admin page */
auth.onAuthStateChanged(user=>{
  if(!user){
    window.location.href="signup.html";
  } else {
    loadUsers();
  }
});

/* Load users */
function loadUsers(){
const tbody = document.querySelector("#usersTable tbody");
tbody.innerHTML="Loading...";

db.collection("users").get().then(snapshot=>{
tbody.innerHTML="";

snapshot.forEach(doc=>{
const u = doc.data();
const uid = doc.id;

const row = document.createElement("tr");

row.innerHTML = `
<td>${uid}</td>

<td><input value="${u.name||''}" id="name_${uid}"></td>

<td>${u.email||''}</td>

<td><input type="number" value="${u.dailyIncome||0}" id="daily_${uid}"></td>

<td><input type="number" value="${u.liveEarnings||0}" id="live_${uid}"></td>

<td><input type="number" value="${u.deposit||0}" id="dep_${uid}"></td>

<td><input type="number" value="${u.withdraw||0}" id="with_${uid}"></td>

<td><input type="number" value="${u.balance||0}" id="bal_${uid}"></td>

<td><input type="number" value="${u.nfts||0}" id="nft_${uid}"></td>

<td>
<select id="ban_${uid}">
<option value="false" ${!u.banned?"selected":""}>Active</option>
<option value="true" ${u.banned?"selected":""}>Banned</option>
</select>
</td>

<td>
<button onclick="saveUser('${uid}')">Save</button>
</td>
`;

tbody.appendChild(row);
});
});
}

/* Save changes */
function saveUser(uid){
db.collection("users").doc(uid).update({
name: document.getElementById(`name_${uid}`).value,
dailyIncome: Number(document.getElementById(`daily_${uid}`).value),
liveEarnings: Number(document.getElementById(`live_${uid}`).value),
deposit: Number(document.getElementById(`dep_${uid}`).value),
withdraw: Number(document.getElementById(`with_${uid}`).value),
balance: Number(document.getElementById(`bal_${uid}`).value),
nfts: Number(document.getElementById(`nft_${uid}`).value),
banned: document.getElementById(`ban_${uid}`).value==="true"
}).then(()=>{
alert("User updated successfully");
});
}
</script>

</body>
</html>
