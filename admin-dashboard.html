<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Panel | SuperNFT</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0d0d0d;
  color:#FFD700;
}
h2{margin:10px 0}
#loader{
  padding:40px;
  text-align:center;
}
table{
  width:100%;
  border-collapse:collapse;
  font-size:13px;
}
th,td{
  border:1px solid #333;
  padding:6px;
  text-align:center;
}
th{
  background:#111;
}
input{
  width:80px;
  padding:4px;
  background:#000;
  color:#FFD700;
  border:1px solid #555;
}
button{
  padding:5px 8px;
  background:#FFD700;
  border:none;
  cursor:pointer;
  font-weight:bold;
}
button:hover{background:#e6c200}
.ban{background:red;color:#fff}
.unban{background:green;color:#fff}
</style>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>

<body>

<h1 style="text-align:center">👑 SuperNFT Admin Panel</h1>

<div id="loader">Checking admin access...</div>

<div id="admin" style="display:none;padding:15px;">
<table>
<thead>
<tr>
  <th>Email</th>
  <th>Balance</th>
  <th>Daily</th>
  <th>Live</th>
  <th>Deposit</th>
  <th>Withdraw</th>
  <th>Referral</th>
  <th>Team</th>
  <th>Level</th>
  <th>Status</th>
  <th>Save</th>
</tr>
</thead>
<tbody id="users"></tbody>
</table>
</div>

<script>
// 🔹 FIREBASE CONFIG (YOUR PROJECT)
const firebaseConfig = {
  apiKey: "AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain: "supernft-5b952.firebaseapp.com",
  projectId: "supernft-5b952",
  storageBucket: "supernft-5b952.appspot.com",
  messagingSenderId: "278097730700",
  appId: "1:278097730700:web:014d5ab680859db4512fa9"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

/* ======================
   ADMIN AUTH CHECK
====================== */
auth.onAuthStateChanged(async user=>{
  if(!user){
    alert("Login required");
    window.location.href="login.html";
    return;
  }

  const adminRef = db.collection("users").doc(user.uid);
  const snap = await adminRef.get();

  if(!snap.exists || snap.data().isAdmin !== true){
    alert("Access denied");
    auth.signOut();
    window.location.href="login.html";
    return;
  }

  document.getElementById("loader").style.display="none";
  document.getElementById("admin").style.display="block";
  loadUsers();
});

/* ======================
   LOAD ALL USERS
====================== */
function loadUsers(){
  const tbody = document.getElementById("users");

  db.collection("users").onSnapshot(snapshot=>{
    tbody.innerHTML="";
    snapshot.forEach(doc=>{
      const u = doc.data();
      const uid = doc.id;

      tbody.innerHTML += `
      <tr>
        <td>${u.email || ""}</td>

        <td><input id="bal_${uid}" value="${u.balance||0}"></td>
        <td><input id="daily_${uid}" value="${u.dailyIncome||0}"></td>
        <td><input id="live_${uid}" value="${u.liveEarnings||0}"></td>
        <td><input id="dep_${uid}" value="${u.deposit||0}"></td>
        <td><input id="with_${uid}" value="${u.withdraw||0}"></td>
        <td><input id="ref_${uid}" value="${u.referralEarnings||0}"></td>
        <td><input id="team_${uid}" value="${u.myTeam||0}"></td>
        <td><input id="level_${uid}" value="${u.level||1}"></td>

        <td>
          ${u.banned
            ? `<button class="unban" onclick="banUser('${uid}',false)">Unban</button>`
            : `<button class="ban" onclick="banUser('${uid}',true)">Ban</button>`
          }
        </td>

        <td>
          <button onclick="saveUser('${uid}')">Save</button>
        </td>
      </tr>`;
    });
  });
}

/* ======================
   SAVE USER DATA
====================== */
function saveUser(uid){
  db.collection("users").doc(uid).update({
    balance:Number(document.getElementById("bal_"+uid).value),
    dailyIncome:Number(document.getElementById("daily_"+uid).value),
    liveEarnings:Number(document.getElementById("live_"+uid).value),
    deposit:Number(document.getElementById("dep_"+uid).value),
    withdraw:Number(document.getElementById("with_"+uid).value),
    referralEarnings:Number(document.getElementById("ref_"+uid).value),
    myTeam:Number(document.getElementById("team_"+uid).value),
    level:Number(document.getElementById("level_"+uid).value)
  }).then(()=>{
    alert("Saved");
  });
}

/* ======================
   BAN / UNBAN
====================== */
function banUser(uid,state){
  db.collection("users").doc(uid).update({
    banned:state
  });
}
</script>

</body>
</html>
