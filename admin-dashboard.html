<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard | SuperNFT</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{margin:0;font-family:Arial;background:#0d0d0d;color:#FFD700;}
header{background:#1a1a1a;padding:15px;text-align:center;font-size:24px;}
nav{display:flex;background:#1a1a1a;}
nav a{flex:1;padding:12px;text-decoration:none;color:#FFD700;text-align:center;}
nav a:hover{background:#333;}
.main{padding:20px;}
button.logout{padding:10px 15px;background:#FFD700;color:#000;border:none;border-radius:5px;cursor:pointer;}
</style>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
</head>
<body>

<header>SuperNFT Admin Dashboard</header>

<nav>
<a href="admin-dashboard.html">Dashboard</a>
<a href="admin-users.html">Users</a>
<a href="admin-nfts.html">NFTs</a>
<a href="admin-deposits.html">Deposits</a>
<a href="admin-withdraw.html">Withdraw</a>
<a href="#" class="logout" onclick="logout()">Logout</a>
</nav>

<div class="main">
<h2>Welcome Admin</h2>
<p>Use the menu above to navigate.</p>
</div>

<script>
/* Firebase Config */
firebase.initializeApp({
  apiKey: "AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain: "supernft-5b952.firebaseapp.com",
  projectId: "supernft-5b952"
});

const ADMIN_EMAIL = "mysupernft@gmail.com";

/* 🔒 Protect Admin Pages */
firebase.auth().onAuthStateChanged(user=>{
  if(!user || user.email.toLowerCase() !== ADMIN_EMAIL){
    window.location.replace("admin-login.html");
  }
});

/* 🔐 Logout */
function logout(){
  firebase.auth().signOut().then(()=>{
    window.location.replace("admin-login.html");
  });
}
</script>

</body>
</html>
