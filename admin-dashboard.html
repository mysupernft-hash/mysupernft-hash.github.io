<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SuperNFT Admin Dashboard</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
body{background:#0d0d0d;color:#FFD700;font-family:Arial;padding:20px}
table{width:100%;border-collapse:collapse;margin-top:20px}
th,td{border:1px solid #333;padding:8px;text-align:center}
th{background:#111}
input,select{width:80px}
button{padding:6px 10px;background:#FFD700;border:none;cursor:pointer}
</style>
</head>

<body>

<h2 id="status">Checking admin access...</h2>

<div id="panel" style="display:none">
<h2>🔥 SuperNFT Admin Panel</h2>
<button onclick="logout()">Logout</button>

<table>
<thead>
<tr>
<th>Email</th>
<th>Wallet</th>
<th>Daily</th>
<th>Referral</th>
<th>Level</th>
<th>Banned</th>
<th>Save</th>
</tr>
</thead>
<tbody id="users"></tbody>
</table>
</div>

<script>

firebase.initializeApp({
  apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain:"supernft-5b952.firebaseapp.com",
  projectId:"supernft-5b952"
});

const auth = firebase.auth();
const db = firebase.firestore();

auth.onAuthStateChanged(async user => {

  if(!user){
    window.location.href="admin-login.html";
    return;
  }

  try {

    const adminDoc = await db.collection("users").doc(user.uid).get();

    if(!adminDoc.exists){
      document.getElementById("status").innerText="❌ Admin document not found";
      return;
    }

    const data = adminDoc.data();

    if(data.role === "superadmin" || data.isAdmin === true){

      document.getElementById("status").style.display="none";
      document.getElementById("panel").style.display="block";
      loadUsers();

    } else {
      document.getElementById("status").innerText="❌ Access denied (not admin)";
    }

  } catch(error){
    document.getElementById("status").innerText="❌ Permission error";
    console.log(error);
  }

});

async function loadUsers(){

  const snap = await db.collection("users").get();

  let html="";

  snap.forEach(doc=>{

    const u = doc.data();

    html+=`
    <tr>
      <td>${u.email||""}</td>
      <td><input id="w_${doc.id}" value="${u.walletBalance||0}"></td>
      <td><input id="d_${doc.id}" value="${u.dailyIncome||0}"></td>
      <td><input id="r_${doc.id}" value="${u.referralEarnings||0}"></td>
      <td><input id="l_${doc.id}" value="${u.level||0}"></td>
      <td>
        <select id="ban_${doc.id}">
          <option value="false" ${u.banned?"":"selected"}>No</option>
          <option value="true" ${u.banned?"selected":""}>Yes</option>
        </select>
      </td>
      <td><button onclick="saveUser('${doc.id}')">Save</button></td>
    </tr>
    `;

  });

  document.getElementById("users").innerHTML=html;
}

function saveUser(uid){

  db.collection("users").doc(uid).update({

    walletBalance:Number(document.getElementById("w_"+uid).value),
    dailyIncome:Number(document.getElementById("d_"+uid).value),
    referralEarnings:Number(document.getElementById("r_"+uid).value),
    level:Number(document.getElementById("l_"+uid).value),
    banned:document.getElementById("ban_"+uid).value==="true"

  }).then(()=>alert("✅ Saved"));
}

function logout(){
  auth.signOut().then(()=>{
    window.location.href="admin-login.html";
  });
}

</script>

</body>
</html>
