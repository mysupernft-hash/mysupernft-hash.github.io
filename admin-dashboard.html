<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard | SuperNFT</title>
<style>
body {
  font-family: Arial;
  background: #0d0d0d;
  color: #FFD700;
  margin: 0;
  padding: 0;
}
header {
  background: #111;
  color: #FFD700;
  text-align: center;
  padding: 12px;
  font-size: 22px;
  font-weight: bold;
}
section {
  padding: 15px;
}
.card {
  background: #1a1a1a;
  padding: 15px;
  margin-bottom: 12px;
  border-radius: 8px;
}
.card h4 {
  margin: 0 0 8px;
  font-size: 18px;
}
input, button {
  padding: 8px;
  margin: 5px 0;
  border-radius: 5px;
  border: none;
  outline: none;
}
button {
  background: #FFD700;
  color: #000;
  font-weight: bold;
  cursor: pointer;
}
button:hover {
  background: #e6c200;
}
</style>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

</head>
<body>

<header>SuperNFT Admin Dashboard</header>

<section id="usersSection">
  <h3>Users</h3>
  <div id="usersList">Loading users...</div>
</section>

<section id="depositsSection">
  <h3>Pending Deposits</h3>
  <div id="depositList">Loading deposits...</div>
</section>

<section id="withdrawSection">
  <h3>Pending Withdrawals</h3>
  <div id="withdrawList">Loading withdrawals...</div>
</section>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain: "supernft-5b952.firebaseapp.com",
  projectId: "supernft-5b952",
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

auth.onAuthStateChanged(user => {
  if(!user) {
    window.location.href = "login.html";
    return;
  }
  db.collection("users").doc(user.uid).get().then(doc => {
    if(!doc.exists || !doc.data().isAdmin) {
      alert("Access Denied");
      window.location.href = "dashboard.html";
    } else {
      loadUsers();
      loadDeposits();
      loadWithdrawals();
    }
  });
});


function loadUsers(){
  const container = document.getElementById("usersList");
  container.innerHTML = "Loading users...";
  db.collection("users").get().then(snapshot => {
    container.innerHTML = "";
    snapshot.forEach(doc => {
      const data = doc.data();
      const uid = doc.id;

      const div = document.createElement("div");
      div.className = "card";
      div.innerHTML = `
        <h4>${data.email || "No Email"}</h4>
        Balance: $<input type="number" id="bal_${uid}" value="${data.balance || 0}">
        <button onclick="updateBalance('${uid}')">Update Balance</button>
      `;
      container.appendChild(div);
    });
  });
}

function updateBalance(uid){
  const value = parseFloat(document.getElementById("bal_"+uid).value);
  db.collection("users").doc(uid).update({ balance: value })
    .then(() => alert("Balance Updated"))
    .catch(err => { console.error(err); alert("Error updating"); });
}


function loadDeposits(){
  const container = document.getElementById("depositList");
  container.innerHTML = "Loading...";
  db.collection("depositRequests").where("status", "==", "pending")
    .get().then(snapshot => {
      container.innerHTML = "";
      snapshot.forEach(doc => {
        const d = doc.data();
        const id = doc.id;

        const div = document.createElement("div");
        div.className = "card";
        div.innerHTML = `
          <h4>${d.email} wants to deposit $${d.amount}</h4>
          TXID: ${d.txid}<br>
          <button onclick="approveDeposit('${id}','${d.userId}',${d.amount})">Approve</button>
          <button onclick="rejectDeposit('${id}')">Reject</button>
        `;
        container.appendChild(div);
      });
    });
}

function approveDeposit(id, userId, amount){
  const userRef = db.collection("users").doc(userId);
  const reqRef = db.collection("depositRequests").doc(id);

  db.runTransaction(async t => {
    const userDoc = await t.get(userRef);
    const newBal = (userDoc.data().balance||0) + amount;
    t.update(userRef, { balance: newBal });
    t.update(reqRef, { status: "approved" });
  }).then(()=>{
    alert("Deposit Approved");
    loadUsers();
    loadDeposits();
  });
}

function rejectDeposit(id){
  db.collection("depositRequests").doc(id)
    .update({ status: "rejected" })
    .then(()=> { alert("Rejected"); loadDeposits(); });
}


function loadWithdrawals(){
  const container = document.getElementById("withdrawList");
  container.innerHTML = "Loading...";
  db.collection("withdrawRequests").where("status","==","pending")
    .get().then(snapshot => {
      container.innerHTML = "";
      snapshot.forEach(doc => {
        const d = doc.data();
        const id = doc.id;

        const div = document.createElement("div");
        div.className = "card";
        div.innerHTML = `
          <h4>${d.email} wants to withdraw $${d.amount}</h4>
          Wallet: ${d.wallet}<br>
          <button onclick="approveWithdraw('${id}','${d.userId}',${d.amount})">Approve</button>
          <button onclick="rejectWithdraw('${id}')">Reject</button>
        `;
        container.appendChild(div);
      });
    });
}

function approveWithdraw(id,userId,amount){
  db.collection("withdrawRequests").doc(id)
    .update({ status: "approved" })
    .then(()=> { alert("Withdraw Approved"); loadWithdrawals(); });
}

function rejectWithdraw(id){
  db.collection("withdrawRequests").doc(id)
    .update({ status: "rejected" })
    .then(()=> { alert("Withdraw Rejected"); loadWithdrawals(); });
}

</script>

</body>
</html>
