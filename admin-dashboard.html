<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SuperNFT Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0d0d0d;
  color:#FFD700;
  padding:15px;
}
h2{text-align:center;}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}
th,td{
  border:1px solid #333;
  padding:8px;
  text-align:center;
}
th{background:#111;}

a{
  color:#00ffcc;
  cursor:pointer;
  text-decoration:none;
}

button{
  background:#FFD700;
  border:none;
  padding:5px 8px;
  cursor:pointer;
}
</style>
</head>
<body>

<h2>🔥 SuperNFT Admin Panel</h2>

<table>
<thead>
<tr>
<th>Email</th>
<th>Wallet</th>
<th>Level</th>
<th>Status</th>
<th>Save</th>
</tr>
</thead>
<tbody id="userTable"></tbody>
</table>

<script>

firebase.initializeApp({
  apiKey:"AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain:"supernft-5b952.firebaseapp.com",
  projectId:"supernft-5b952"
});

const auth=firebase.auth();
const db=firebase.firestore();

auth.onAuthStateChanged(user=>{
  if(!user){
    location.href="admin-login.html";
    return;
  }
  loadUsers();
});

function loadUsers(){
  db.collection("users").get().then(snap=>{
    let html="";
    snap.forEach(doc=>{
      const u=doc.data();
      html+=`
      <tr>
        <td>
          <a href="admin-user.html?uid=${doc.id}">
            ${u.email||""}
          </a>
        </td>
        <td><input id="w_${doc.id}" value="${u.walletBalance||0}"></td>
        <td><input id="l_${doc.id}" value="${u.level||0}"></td>
        <td>${u.banned?"❌ Banned":"✅ Active"}</td>
        <td><button onclick="saveUser('${doc.id}')">Save</button></td>
      </tr>
      `;
    });
    document.getElementById("userTable").innerHTML=html;
  });
}

function saveUser(uid){
  db.collection("users").doc(uid).update({
    walletBalance:Number(document.getElementById("w_"+uid).value),
    level:Number(document.getElementById("l_"+uid).value)
  }).then(()=>alert("Updated"));
}

</script>
</body>
</html>
