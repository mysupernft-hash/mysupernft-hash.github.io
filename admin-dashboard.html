<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>SuperNFT Admin Panel</title>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    body { background:#0d0d0d; color:#FFD700; font-family:Arial; }
    table { width:100%; border-collapse:collapse; }
    th,td { border:1px solid #333; padding:6px; }
    input { width:100%; background:#222; color:#FFD700; border:none; }
    button { background:#FFD700; color:#000; font-weight:bold; }
  </style>
</head>

<body>
<h2>SuperNFT Admin Panel</h2>

<table id="users">
  <thead>
    <tr>
      <th>Email</th>
      <th>Balance</th>
      <th>Daily</th>
      <th>Save</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain: "supernft-5b952.firebaseapp.com",
  projectId: "supernft-5b952"
});

const auth = firebase.auth();
const db = firebase.firestore();

auth.onAuthStateChanged(async user => {
  console.log("AUTH USER:", user?.uid);

  if (!user) {
    alert("Login required");
    return;
  }

  const doc = await db.collection("users").doc(user.uid).get();
  console.log("ADMIN DOC:", doc.data());

  if (!doc.exists || doc.data().isAdmin !== true) {
    alert("Access denied");
    return;
  }

  loadUsers();
});

function loadUsers() {
  const tbody = document.querySelector("#users tbody");
  tbody.innerHTML = "";

  db.collection("users").get().then(snap => {
    snap.forEach(d => {
      const u = d.data();
      tbody.innerHTML += `
        <tr>
          <td>${u.email}</td>
          <td><input id="b_${d.id}" value="${u.balance||0}"></td>
          <td><input id="d_${d.id}" value="${u.dailyIncome||0}"></td>
          <td><button onclick="save('${d.id}')">Save</button></td>
        </tr>`;
    });
  });
}

function save(id){
  db.collection("users").doc(id).update({
    balance: Number(document.getElementById("b_"+id).value),
    dailyIncome: Number(document.getElementById("d_"+id).value)
  });
}
</script>
</body>
</html>
