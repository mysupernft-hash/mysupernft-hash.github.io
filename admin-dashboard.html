<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SuperNFT Admin Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Firebase v9 compat -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
body{
  background:#0d0d0d;
  color:#ffd700;
  font-family:Arial;
  padding:20px;
}
h2{margin-bottom:10px}
table{
  width:100%;
  border-collapse:collapse;
  margin-top:20px;
}
th,td{
  border:1px solid #333;
  padding:8px;
  text-align:center;
}
th{
  background:#111;
}
input,select{
  width:90px;
  background:#111;
  color:#ffd700;
  border:1px solid #333;
  padding:5px;
}
button{
  background:#ffd700;
  color:#000;
  border:none;
  padding:6px 12px;
  cursor:pointer;
  font-weight:bold;
}
#panel{display:none}
</style>
</head>

<body>

<h2 id="status">Checking admin access...</h2>

<div id="panel">
  <h2>🛠 SuperNFT Admin Dashboard</h2>

  <table>
    <thead>
      <tr>
        <th>Email</th>
        <th>Wallet</th>
        <th>Daily</th>
        <th>Referral</th>
        <th>Level</th>
        <th>Banned</th>
        <th>Save</th>
      </tr>
    </thead>
    <tbody id="users"></tbody>
  </table>
</div>

<script>
// 🔥 FIREBASE INIT
firebase.initializeApp({
  apiKey: "AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain: "supernft-5b952.firebaseapp.com",
  projectId: "supernft-5b952"
});

const auth = firebase.auth();
const db   = firebase.firestore();

// 🔐 ADMIN CHECK (USERS.isAdmin)
auth.onAuthStateChanged(async user=>{
  if(!user){
    location.href="admin-login.html";
    return;
  }

  try{
    const snap = await db.collection("users").doc(user.uid).get();

    if(!snap.exists || snap.data().isAdmin !== true){
      document.getElementById("status").innerText =
        "❌ Access denied (Not Admin)";
      return;
    }

    // ✅ ADMIN OK
    document.getElementById("status").style.display="none";
    document.getElementById("panel").style.display="block";
    loadUsers();

  }catch(e){
    document.getElementById("status").innerText =
      "❌ Error checking admin";
  }
});

// 👥 LOAD ALL USERS
function loadUsers(){
  db.collection("users").get().then(qs=>{
    let html="";
    qs.forEach(doc=>{
      const u = doc.data();
      html += `
      <tr>
        <td>${u.email || ""}</td>
        <td><input id="w_${doc.id}" value="${u.walletBalance || 0}"></td>
        <td><input id="d_${doc.id}" value="${u.dailyIncome || 0}"></td>
        <td><input id="r_${doc.id}" value="${u.referralEarnings || 0}"></td>
        <td><input id="l_${doc.id}" value="${u.level || 1}"></td>
        <td>
          <select id="b_${doc.id}">
            <option value="false" ${u.banned ? "" : "selected"}>No</option>
            <option value="true" ${u.banned ? "selected" : ""}>Yes</option>
          </select>
        </td>
        <td>
          <button onclick="saveUser('${doc.id}')">Save</button>
        </td>
      </tr>`;
    });
    document.getElementById("users").innerHTML = html;
  });
}

// 💾 SAVE USER DATA
function saveUser(uid){
  db.collection("users").doc(uid).update({
    walletBalance: Number(document.getElementById("w_"+uid).value),
    dailyIncome: Number(document.getElementById("d_"+uid).value),
    referralEarnings: Number(document.getElementById("r_"+uid).value),
    level: Number(document.getElementById("l_"+uid).value),
    banned: document.getElementById("b_"+uid).value === "true"
  }).then(()=>{
    alert("✅ User updated");
  });
}
</script>

</body>
</html>
