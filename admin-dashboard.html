<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard | SuperNFT</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0d0d0d;
  color:#FFD700;
  display:flex;
  flex-direction:column;
  min-height:100vh;
}

header{
  background:#111;
  padding:15px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
}

.main{
  flex:1;
  padding:20px;
}

.card{
  background:#1a1a1a;
  padding:15px;
  border-radius:8px;
  margin-bottom:15px;
}

footer{
  display:flex;
  justify-content:space-around;
  background:#1a1a1a;
  padding:12px 0;
  flex-wrap:wrap;
}

footer div{
  cursor:pointer;
}

footer div:hover{
  color:#fff;
}
</style>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

</head>
<body>

<header>SuperNFT Dashboard</header>

<div class="main">

<div class="card">
<h3>Welcome</h3>
<p id="userEmail">Loading...</p>
</div>

<div class="card">
<h3>Your Balance</h3>
<h2>$<span id="balance">0</span></h2>
</div>

<div class="card">
<h3>Your Investments</h3>
<p>Active NFTs: <span id="nfts">0</span></p>
</div>

</div>

<footer>
  <div onclick="location.href='dashboard.html'">📁 Investments</div>
  <div onclick="location.href='deposit.html'">💰 Deposit</div>
  <div onclick="location.href='withdraw.html'">💸 Withdraw</div>
  <div onclick="location.href='live-earnings.html'">💹 Earnings</div>
  <div onclick="location.href='my-account.html'">👤 Account</div>
</footer>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain: "supernft-5b952.firebaseapp.com",
  projectId: "supernft-5b952",
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

auth.onAuthStateChanged(user=>{
  if(!user){
    location.href="signup.html";
    return;
  }

  document.getElementById("userEmail").innerText = user.email;

  db.collection("users").doc(user.uid).get()
  .then(doc=>{
    if(doc.exists){
      const data = doc.data();
      document.getElementById("balance").innerText =
        data.balance || 0;

      document.getElementById("nfts").innerText =
        data.nfts || 0;
    }
  });
});
</script>

</body>
</html>
