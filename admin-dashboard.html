<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Dashboard | SuperNFT</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#0d0d0d;
  color:#fff;
}
h2{margin:15px}
#loader{
  padding:40px;
  text-align:center;
  font-size:20px;
}
table{
  width:100%;
  border-collapse:collapse;
}
th,td{
  border:1px solid #333;
  padding:8px;
  text-align:center;
}
th{
  background:#1a1a1a;
}
input{
  width:90px;
  padding:5px;
  background:#111;
  color:#fff;
  border:1px solid #444;
}
button{
  padding:6px 10px;
  background:#FFD700;
  border:none;
  cursor:pointer;
  font-weight:bold;
}
button:hover{background:#e6c200}
.logout{
  position:fixed;
  top:10px;
  right:10px;
}
</style>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>

<body>

<button class="logout" onclick="logout()">Logout</button>

<h2>Admin Dashboard</h2>

<div id="loader">Checking admin access...</div>

<div id="adminContent" style="display:none">
  <table>
    <thead>
      <tr>
        <th>Email</th>
        <th>Balance</th>
        <th>Daily</th>
        <th>Referral</th>
        <th>Deposit</th>
        <th>Withdraw</th>
        <th>Ban</th>
        <th>Save</th>
      </tr>
    </thead>
    <tbody id="usersTable"></tbody>
  </table>
</div>

<script>
/* 🔥 FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyB4SGtNZL0N4TIoJ1bGbkiAeRWJcQgrF-4",
  authDomain: "supernft-5b952.firebaseapp.com",
  projectId: "supernft-5b952",
  storageBucket: "supernft-5b952.appspot.com",
  messagingSenderId: "278097730700",
  appId: "1:278097730700:web:014d5ab680859db4512fa9"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

/* 🔐 ADMIN CHECK */
auth.onAuthStateChanged(user=>{
  if(!user){
    window.location.href="admin-login.html";
    return;
  }

  db.collection("users").doc(user.uid).get().then(doc=>{
    if(!doc.exists || doc.data().isAdmin !== true){
      alert("Access denied (not admin)");
      auth.signOut();
      return;
    }

    document.getElementById("loader").style.display="none";
    document.getElementById("adminContent").style.display="block";
    loadUsers();
  });
});

/* 📥 LOAD USERS */
function loadUsers(){
  db.collection("users").get().then(snapshot=>{
    const tbody = document.getElementById("usersTable");
    tbody.innerHTML = "";

    snapshot.forEach(doc=>{
      const u = doc.data();
      const tr = document.createElement("tr");

      tr.innerHTML = `
        <td>${u.email || ""}</td>
        <td><input id="bal_${doc.id}" value="${u.balance||0}"></td>
        <td><input id="daily_${doc.id}" value="${u.dailyIncome||0}"></td>
        <td><input id="ref_${doc.id}" value="${u.referralEarnings||0}"></td>
        <td><input id="dep_${doc.id}" value="${u.deposit||0}"></td>
        <td><input id="with_${doc.id}" value="${u.withdraw||0}"></td>
        <td>
          <input type="checkbox" id="ban_${doc.id}" ${u.banned?"checked":""}>
        </td>
        <td>
          <button onclick="saveUser('${doc.id}')">Save</button>
        </td>
      `;
      tbody.appendChild(tr);
    });
  });
}

/* 💾 SAVE USER */
function saveUser(uid){
  db.collection("users").doc(uid).update({
    balance: Number(document.getElementById("bal_"+uid).value),
    dailyIncome: Number(document.getElementById("daily_"+uid).value),
    referralEarnings: Number(document.getElementById("ref_"+uid).value),
    deposit: Number(document.getElementById("dep_"+uid).value),
    withdraw: Number(document.getElementById("with_"+uid).value),
    banned: document.getElementById("ban_"+uid).checked
  }).then(()=>{
    alert("User updated");
  });
}

/* 🚪 LOGOUT */
function logout(){
  auth.signOut().then(()=>{
    window.location.href="admin-login.html";
  });
}
</script>

</body>
</html>
